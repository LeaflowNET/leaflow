openapi: 3.2.1
info:
  title: Leaflow IAM API
  version: 1.0.0
  description: |-
    What happens inside a project: members, roles, invitations and the SSH keys the project shares.

    Every request carries a scoped token; see the `bearerAuth` security scheme. No path carries a
    `projectId`, and the current project is the one the token states. Tokens are obtained from the
    account API.

    `GET /api/v1/membership` returns the roles and permissions the caller holds in the current
    project. It does not state whether a given operation is allowed; each service declares which permission its own operations require.
servers:
  - url: https://iam.leaflow.cloud
    description: Members, roles, invitations and SSH keys within a project
security:
  - bearerAuth: []
paths:
  /api/v1/permissions:
    get:
      summary: List every permission the platform can grant
      description: Each service registers the permissions it enforces with IAM at start-up, so this is the platform-wide list rather than the permissions of IAM alone. **IAM does not decide anything with it** — each service decides using the caller's grant together with the permissions compiled into its own binary, and this list only serves to render the choices. A service that has never started does not appear here.
      operationId: list-permissions
      tags:
        - Permission
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/project:
    get:
      summary: Get a project
      description: Visible to any member; no further permission is required.
      operationId: get-project
      tags:
        - Project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update the name and description of a project
      description: The slug is not affected; it is set through `PUT /api/v1/project/slug`.
      operationId: update-project
      tags:
        - Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a project
      description: Only the owner can do this, and it cannot be undone. The project enters DELETING and each service begins removing the resources under it. The project itself remains readable afterwards, answering that it is gone rather than 404.
      operationId: delete-project
      tags:
        - Project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/project/slug:
    put:
      summary: Set the custom slug of a project
      description: |-
        Replaces the default slug, which is the project's `id`, with a custom one. Only the owner can do this, and only once: a custom slug cannot be changed or removed afterwards. The address under the `id` keeps working.

        Setting the slug the project already holds succeeds without change. Fails with:

        - 400 `PROJECT_SLUG_INVALID` when the slug does not follow the format described on `slug`;
        - 422 `PROJECT_SLUG_RESERVED` when the name is reserved;
        - 409 `PROJECT_SLUG_TAKEN` when another project, including a deleted one, holds it;
        - 412 `PROJECT_SLUG_ALREADY_SET` when the project already holds a different custom slug;
        - 403 `PROJECT_PERMISSION_DENIED` when the caller is not the owner;
        - 429 `PROJECT_SLUG_CLAIM_RATE_LIMITED` when the caller has attempted to set custom slugs too often. Attempts count whether or not they succeed, and `meta.retry_after_seconds` on the error states how many seconds to wait before retrying.
      operationId: set-project-slug
      tags:
        - Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetProjectSlugRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAccessResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/membership:
    get:
      summary: Get the caller's standing in this project
      description: Facts rather than a conclusion. There is no `allowed` field here, because each service holds the permissions its operations need and decides on its own.
      operationId: get-project-membership
      tags:
        - Project
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/quotas:
    get:
      summary: List this project's quotas
      description: |-
        How much of something this project may have in each service, such as instances or VPCs, with the limit in effect for it. A request that would exceed a limit is refused by the service concerned. Each service shows what the project currently has.
      operationId: list-quotas
      tags:
        - Quota
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/invitations:
    get:
      summary: List the invitations this project is still waiting on
      description: Visible to any member, on the same rule as the member list. Who has been invited is part of who is in the project.
      operationId: list-invitations
      tags:
        - Invitation
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageInvitationResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Send an invitation
      description: An invitation stands for 14 days. The roles it carries are validated against the project as it stood when the invitation was sent, so it expires rather than outliving the arrangement it rests on.
      operationId: issue-invitation
      tags:
        - Invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInvitationRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitationResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/invitations/{invitationId}:
    delete:
      summary: Withdraw an invitation that has not been redeemed
      operationId: revoke-invitation
      tags:
        - Invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members:batchGet:
    post:
      summary: Resolve members by id, including those who have left
      description: |-
        Resolves a set of account ids to the people behind them, scoped to the current project and **including members who have since left it**.

        This is what turns the ids held elsewhere in the product — who created a machine, who performed a logged operation — into names. The current member list cannot answer for somebody who has left, and those rows are exactly the ones a reader most often needs explained.

        Only ids that have belonged to the current project resolve; anything else is omitted, as are ids that do not resolve at all. Match the response against the request by id; the order is not significant.
      operationId: batch-get-members
      tags:
        - Member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchGetMembersRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchGetMembersResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members:
    get:
      summary: List the members of a project
      operationId: list-members
      tags:
        - Member
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
        - name: keyword
          in: query
          description: Matches against user id, email address or name
          explode: false
          schema:
            description: Matches against user id, email address or name
            type: string
            maxLength: 255
        - name: service_account
          in: query
          description: When true, returns only service accounts; when false, excludes service accounts; omitted returns all members
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageMemberResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members/{userId}:
    delete:
      summary: Remove a member, or leave the project
      description: Removing someone else requires `iam:members.manage`; leaving requires only membership of the project. The owner can do neither, and has to transfer ownership first.
      operationId: remove-member
      tags:
        - Member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members/{userId}/roles:
    put:
      summary: Set the roles a member holds
      description: The list is replaced in full rather than added to or removed from. The `OWNER` role of the owner is unaffected.
      operationId: set-member-roles
      tags:
        - Member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMemberRolesRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members/{userId}/permissions:
    get:
      summary: List the permissions granted directly to a member
      description: |-
        Every row states one permission this person holds apart from their roles: project-wide when `resource_type` and `resource_id` are null, otherwise only on that resource. What a role grants is not listed here; the member's grant carries the roles and their compiled rules.

        Visible to any member, on the same rule as the member list.
      operationId: list-member-permissions
      tags:
        - Member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPermissionListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Grant a permission to a member
      description: |-
        Creates one permission row. The same row twice answers 409; changing a grant means revoking the row and creating another, so that each row records when it was granted.

        `OWNER` and `ADMIN` cannot be granted here, being facts on the membership. A permission that carries no resource dimension cannot be scoped: IAM refuses the row at grant time rather than storing a scope that would never hold.

        Requires `iam:members.manage`.
      operationId: create-member-permission
      tags:
        - Member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberPermissionRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPermissionResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/members/{userId}/permissions/{permissionId}:
    delete:
      summary: Revoke a permission granted directly to a member
      description: Removes that one row. Requires `iam:members.manage`.
      operationId: delete-member-permission
      tags:
        - Member
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            maxLength: 255
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/project:transferOwnership:
    post:
      summary: Transfer ownership of a project
      description: The only way `OWNER` moves, and only the owner can initiate it.
      operationId: transfer-project-ownership
      tags:
        - Member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferOwnershipRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipTransferResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/roles:
    get:
      summary: List the roles in this project
      operationId: list-roles
      tags:
        - Role
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a role
      operationId: create-role
      tags:
        - Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/roles/{code}:
    get:
      summary: Get a role
      operationId: get-role
      tags:
        - Role
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a role
      description: The name, the description and the permissions are replaced in full. Every member holding the role is recompiled in the same transaction, so the change takes effect on the next request.
      operationId: update-role
      tags:
        - Role
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a role
      description: Refused while anyone still holds it. Cascading the removal would quietly demote every holder.
      operationId: delete-role
      tags:
        - Role
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ssh-keys:
    get:
      summary: List the SSH keys of this project
      description: The keys the project shares. The keys of members are their own and belong to their accounts (`/account/v1/me/ssh-keys` on the account API), so they are not listed here.
      operationId: list-ssh-keys
      tags:
        - SSHKey
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
        - name: status
          in: query
          description: Both kinds are returned while this is absent
          explode: false
          schema:
            description: Both kinds are returned while this is absent
            type: string
            enum:
              - ACTIVE
              - REVOKED
        - name: purpose
          in: query
          description: Lists only the keys carrying this purpose. The key the platform generates carries `platform`
          explode: false
          schema:
            description: Lists only the keys carrying this purpose. The key the platform generates carries `platform`
            type: string
            maxLength: 64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageSSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add an SSH key to this project
      description: |-
        Adds a key the project shares, such as one used by CI or a bastion. It belongs to the project rather than to the member adding it; a member adds a key of their own to their account (`POST /account/v1/me/ssh-keys` on the account API).

        Requires `iam:ssh_keys.manage`.
      operationId: create-ssh-key
      tags:
        - SSHKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSSHKeyRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ssh-keys/{keyId}:
    get:
      summary: Get an SSH key
      operationId: get-ssh-key
      tags:
        - SSHKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename an SSH key
      description: Only the name can change. The key, its type and its fingerprint are three statements about one thing, and changing one of them would leave the row describing a key that does not exist. Requires `iam:ssh_keys.manage`.
      operationId: rename-ssh-key
      tags:
        - SSHKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSSHKeyRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Revoke an SSH key
      description: The row remains and its status becomes `REVOKED`, so it stays answerable afterwards which key was trusted at the time. Requires `iam:ssh_keys.manage`.
      operationId: revoke-ssh-key
      tags:
        - SSHKey
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications:
    get:
      summary: List the applications of this project
      description: |-
        Disabled applications are listed. Archived applications are omitted unless
        `include_archived` is true. An application that is still being created is not listed.
      operationId: list-applications
      tags:
        - Application
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
        - name: include_archived
          in: query
          description: Include applications that have been deleted
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageApplicationResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an application
      description: |-
        Creates an OIDC client for an application of this project. Applications authenticate
        against `https://auth.leaflow.net/realms/user`.

        The `secret` is present only for a confidential application, and only in this response.
        It is not stored and cannot be read again; use `:rotateSecret` to obtain a new one.

        Any account of this platform may sign in to the application and is always asked for
        consent. `profile` and `email` are granted at every sign-in; any other scope selected here
        is granted only when the authorization request names it explicitly.

        To call the Leaflow API on behalf of a user, the application requests `iam`, and the user
        must then authorize the application for each project in which it is to act, as described
        in the Account API. Within an authorized project, the application holds exactly the
        permissions of the user and none beyond them. Members of this project must authorize the
        application in the same way as any other user.
      operationId: create-application
      tags:
        - Application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicationRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateApplicationResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications/{applicationId}:
    get:
      summary: Get an application
      description: An application that has been deleted is still returned, with `status` `ARCHIVED`.
      operationId: get-application
      tags:
        - Application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update an application
      description: |-
        Only the name and the redirect URIs can change. The type and `client_id` never change.

        An application that is disabled or deleted cannot be updated.
      operationId: update-application
      tags:
        - Application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicationRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete an application
      description: |-
        The application is removed from the identity provider and its row is retained with
        `status` `ARCHIVED`. Repeating the call returns the same resource.
      operationId: delete-application
      tags:
        - Application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/applications/{applicationId}:rotateSecret:
    post:
      summary: Rotate the secret of an application
      description: |-
        Returns a new secret and invalidates the previous one immediately. Only an active
        confidential application has a secret; any other state answers 412.
      operationId: rotate-application-secret
      tags:
        - Application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateApplicationSecretResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts:
    get:
      summary: List the service accounts of this project
      description: |-
        Suspended service accounts are included. Deleted service accounts are omitted unless `include_deleted` is true. Visible to any project member.
      operationId: list-service-accounts
      tags:
        - ServiceAccount
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
        - name: keyword
          in: query
          description: Matches against service account id, name or description
          schema:
            type: string
            maxLength: 255
        - name: include_deleted
          in: query
          description: Include service accounts that have been deleted
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a service account
      description: |-
        Creates a project-owned service account and joins it to the current project as a member. Its `id` is also its member `user_id`; manage roles and direct permissions through `/api/v1/members/{userId}/roles` and `/api/v1/members/{userId}/permissions`.

        Requires `iam:service_accounts.manage`. When initial `roles` are supplied, `iam:members.manage` is also required, and granting `ADMIN` requires the caller to be a project owner or administrator.
      operationId: create-service-account
      tags:
        - ServiceAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}:
    get:
      summary: Get a service account
      description: A deleted service account remains readable with `status` `DELETED`. Visible to any project member.
      operationId: get-service-account
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a service account
      description: Updates the display name or description of an active or suspended service account. Requires `iam:service_accounts.manage`.
      operationId: update-service-account
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceAccountRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a service account
      description: |-
        Immediately retires the service account's membership, revokes all signing keys and SSH keys, clears its profile fields and records its deletion timestamp. Deleted service accounts cannot be restored, and their names may be reused.

        Requires `iam:service_accounts.manage`. Repeating the call on an already deleted service account returns it unchanged.
      operationId: delete-service-account
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}:disable:
    post:
      summary: Disable a service account
      description: Suspends the service account, preventing token exchanges and project writes while preserving its identity and resources for later reuse. Requires `iam:service_accounts.manage`.
      operationId: disable-service-account
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}:enable:
    post:
      summary: Enable a service account
      description: Returns a suspended service account to `ACTIVE`. Requires `iam:service_accounts.manage`.
      operationId: enable-service-account
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}/keys:
    get:
      summary: List the signing keys of a service account
      description: Never returns private keys. Revoked keys are omitted unless `include_revoked` is true. Visible to any project member.
      operationId: list-service-account-keys
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
        - name: include_revoked
          in: query
          description: Include revoked keys
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageServiceAccountKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create or upload a signing key for a service account
      description: |-
        Adds an Ed25519 signing key for RFC 7523 token exchange. A service account may hold at most 5 active unexpired keys at a time.

        With `origin` `GENERATED`, the platform generates an Ed25519 key pair, stores only the public key, and returns the private key once inside `credentials`. With `origin` `UPLOADED`, `public_key` carries a PKIX PEM Ed25519 public key and `credentials` is omitted.

        Requires `iam:service_accounts.manage`.
      operationId: create-service-account-key
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountKeyRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateServiceAccountKeyResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}/keys/{keyId}:
    delete:
      summary: Revoke a signing key of a service account
      description: Marks the key `REVOKED` and retains the row for audit. Repeating the call returns the revoked key. Requires `iam:service_accounts.manage`.
      operationId: revoke-service-account-key
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}/ssh-keys:
    get:
      summary: List the SSH keys of a service account
      description: Most recent first. Visible to any project member.
      operationId: list-service-account-ssh-keys
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Limit
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Offset
        - name: status
          in: query
          description: Both kinds are returned while this is absent
          explode: false
          schema:
            description: Both kinds are returned while this is absent
            type: string
            enum:
              - ACTIVE
              - REVOKED
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageServiceAccountSSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add an SSH key to a service account
      description: Registers an OpenSSH public key on the service account. Requires `iam:service_accounts.manage`.
      operationId: create-service-account-ssh-key
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountSSHKeyRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountSSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/service-accounts/{serviceAccountId}/ssh-keys/{keyId}:
    delete:
      summary: Revoke an SSH key of a service account
      description: Marks the key `REVOKED` and retains the row for audit. Requires `iam:service_accounts.manage`.
      operationId: revoke-service-account-ssh-key
      tags:
        - ServiceAccount
      parameters:
        - name: serviceAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: keyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountSSHKeyResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    PermissionResource:
      type: object
      properties:
        name:
          description: The code of the permission, such as compute:instance.delete. **There is no display name here** — what a permission reads as is localised, and translation belongs to the layer rendering it. Until a translation catches up, the code itself is what is shown
          type: string
        owner_only:
          description: Reserved for the project owner. Attaching it to a custom role has no effect
          type: boolean
        resource_type:
          description: The kind of resource this permission is decided against; empty means it is decided at project level. **It need not be the object being operated on** — a compute route carries no project_id and is isolated through its parent network, so compute:route.create is decided against compute:private_network. A non-empty value also means the permission can be scoped to particular instances; create and list are always empty
          type: string
      required:
        - name
        - owner_only
        - resource_type
      additionalProperties: false
    PermissionListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/PermissionResource"
      required:
        - items
      additionalProperties: false
    ResourceRefResource:
      type: object
      properties:
        id:
          description: A string rather than a UUID; a DNS zone is named by its domain, which IAM does not hold. Matching is glob, so `*.example.com` covers a set of subdomains, while a value carrying no glob metacharacter matches exactly
          type: string
        type:
          description: Of the form compute:instance or dns:zone, in the same namespace as permission names
          type: string
      required:
        - type
        - id
      additionalProperties: false
    RuleResource:
      type: object
      properties:
        effect:
          type: string
          enum:
            - allow
            - deny
        permissions:
          description: A permission name, with a trailing wildcard supported (compute:instance.*). A wildcard must carry the service prefix; a bare wildcard would also grant the operations of services that go live later
          type:
            - array
            - "null"
          items:
            type: string
        resources:
          description: Empty means the rule holds across the whole project. A non-empty value means it holds only on those resources, and therefore answers no project-level question
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/ResourceRefResource"
      required:
        - effect
        - permissions
        - resources
      additionalProperties: false
    GrantResource:
      type: object
      properties:
        admin:
          type: boolean
        owner:
          type: boolean
        roles:
          description: The role codes held, for display only
          type:
            - array
            - "null"
          items:
            type: string
        rules:
          description: "**The rules compiled from the roles and grants that apply. Do not walk them to reach a decision.** They are here to render what a user may do; each request is decided by the service handling it"
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/RuleResource"
      required:
        - owner
        - admin
        - rules
        - roles
      additionalProperties: false
    ProjectTraitResource:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
          enum:
            - NoWrite
            - NoAccess
        reason:
          type: string
      required:
        - key
        - value
        - effect
        - reason
      additionalProperties: false
    ProjectResource:
      type: object
      properties:
        traits:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTraitResource"
        deletion_requested_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        deleted_at:
          description: When the project was deleted
          type:
            - string
            - "null"
          format: date-time
        description:
          type: string
        id:
          type: string
          format: uuid
        slug:
          description: The label naming the project in its address. It equals `id` until a custom slug is chosen. A custom slug does not change once set, and stays with the project after deletion
          type: string
          minLength: 1
          maxLength: 36
        status:
          description: "`active` until deletion is requested; `deleting` while the resources under the project are being removed, when `deletion_requested_at` is set; `deleted` once removal has finished, when `deleted_at` is set"
          type: string
          enum:
            - active
            - deleting
            - deleted
        name:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
        - traits
        - deletion_requested_at
        - id
        - slug
        - status
        - name
        - description
        - deleted_at
        - created_by
        - created_at
        - updated_at
      additionalProperties: false
    ProjectAccessResource:
      type: object
      properties:
        grant:
          $ref: "#/components/schemas/GrantResource"
        project:
          $ref: "#/components/schemas/ProjectResource"
      required:
        - project
        - grant
      additionalProperties: false
    UpdateProjectRequestBody:
      type: object
      properties:
        description:
          type: string
          maxLength: 2000
        name:
          type: string
          maxLength: 128
      additionalProperties: false
    SetProjectSlugRequestBody:
      type: object
      properties:
        slug:
          description: 6 to 32 characters made of lower-case letters, digits and single hyphens, beginning with a letter and ending with a letter or digit
          type: string
          minLength: 6
          maxLength: 32
      required:
        - slug
      additionalProperties: false
    QuotaResource:
      type: object
      properties:
        service:
          description: The service enforcing the quota.
          type: string
        name:
          type: string
        description:
          type: string
        limit:
          description: The most this project may have.
          type: integer
          format: int64
      required:
        - service
        - name
        - description
        - limit
      additionalProperties: false
    QuotaListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotaResource"
      required:
        - items
      additionalProperties: false
    MembershipResource:
      type: object
      properties:
        traits:
          type: array
          items:
            $ref: "#/components/schemas/ProjectTraitResource"
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
        deletion_requested_at:
          type:
            - string
            - "null"
          format: date-time
        grant:
          $ref: "#/components/schemas/GrantResource"
        member:
          type: boolean
        user_status:
          type: string
      required:
        - traits
        - deleted_at
        - deletion_requested_at
        - member
        - grant
        - user_status
      additionalProperties: false
    InvitationResource:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        email:
          type: string
        expires_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        invited_by:
          type: string
        project_id:
          type: string
          format: uuid
        roles:
          description: The role codes granted on redemption
          type:
            - array
            - "null"
          items:
            type: string
      required:
        - id
        - project_id
        - email
        - roles
        - invited_by
        - expires_at
        - created_at
      additionalProperties: false
    LengthAwarePageInvitationResource:
      type: object
      properties:
        items:
          description: The items in this page
          type: array
          items:
            $ref: "#/components/schemas/InvitationResource"
        limit:
          description: Maximum number of items in this page, echoing the request
          type: integer
          format: int64
        offset:
          description: Number of items skipped, echoing the request
          type: integer
          format: int64
        total:
          description: Total number of matches, not only this page
          type: integer
          format: int64
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    IssueInvitationRequestBody:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        roles:
          description: The role codes granted on redemption. Each must already be defined in this project, and `OWNER` is not accepted
          type:
            - array
            - "null"
          minItems: 1
          items:
            type: string
      required:
        - email
        - roles
      additionalProperties: false
    IssuedInvitationResponseBody:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/InvitationResource"
        token:
          description: The token that redeems the invitation, **returned in this response only**. If it is lost, withdraw the invitation and send another
          type: string
      required:
        - invitation
        - token
      additionalProperties: false
    BatchGetMembersRequestBody:
      type: object
      properties:
        ids:
          description: The account ids to resolve. Blank entries are ignored.
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 255
      required:
        - ids
      additionalProperties: false
    BatchGetMembersResponseBody:
      type: object
      properties:
        items:
          description: The people that resolved. Ids that never belonged to this project are absent, as are ids that do not resolve at all.
          type: array
          items:
            $ref: "#/components/schemas/ResolvedMemberResource"
      required:
        - items
      additionalProperties: false
    ResolvedMemberResource:
      description: A person referred to by an id held elsewhere in the project. Carries who they are, not what they may do — a member who has left holds nothing, and this shape has no grant to say so.
      type: object
      properties:
        avatar_hash:
          description: MD5 hash of the lowercased, trimmed email address, for use with Gravatar-compatible avatar services. Empty if the account has no email address.
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        left:
          description: True when this person is no longer a member of the project.
          type: boolean
        service_account:
          description: True when this member is a project-owned service account rather than a personal account.
          type: boolean
        user_id:
          type: string
      required:
        - user_id
        - email
        - first_name
        - last_name
        - avatar_hash
        - left
        - service_account
      additionalProperties: false
    MemberResource:
      type: object
      properties:
        avatar_hash:
          description: MD5 hash of the lowercased, trimmed email address, for use with Gravatar-compatible avatar services. Empty if the account has no email address.
          type: string
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        email:
          type: string
        first_name:
          type: string
        grant:
          $ref: "#/components/schemas/GrantResource"
        last_name:
          type: string
        permissions:
          description: The permissions granted to this person directly, apart from their roles
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MemberPermissionResource"
        service_account:
          description: True when this member is a project-owned service account
          type: boolean
        user_id:
          type: string
      required:
        - user_id
        - email
        - first_name
        - last_name
        - avatar_hash
        - grant
        - permissions
        - service_account
        - created_by
        - created_at
      additionalProperties: false
    LengthAwarePageMemberResource:
      type: object
      properties:
        items:
          description: The items in this page
          type: array
          items:
            $ref: "#/components/schemas/MemberResource"
        limit:
          description: Maximum number of items in this page, echoing the request
          type: integer
          format: int64
        offset:
          description: Number of items skipped, echoing the request
          type: integer
          format: int64
        total:
          description: Total number of matches, not only this page
          type: integer
          format: int64
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    SetMemberRolesRequestBody:
      type: object
      properties:
        roles:
          description: "**Every** role code this person is to hold. `OWNER` cannot appear here"
          type:
            - array
            - "null"
          items:
            type: string
      required:
        - roles
      additionalProperties: false
    MemberPermissionResource:
      type: object
      properties:
        id:
          description: The id of this grant, used to revoke it
          type: string
          format: uuid
        permission:
          description: The code of the permission, such as compute:instance.delete
          type: string
          maxLength: 128
        effect:
          type: string
          enum:
            - allow
            - deny
        resource_type:
          description: The kind of resource this grant holds on, such as fleet:machine. Null with `resource_id` means it holds project-wide
          type:
            - string
            - "null"
          maxLength: 128
