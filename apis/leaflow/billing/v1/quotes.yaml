paths:
  /api/v1/quotes:
    query:
      summary: Get a quote
      description: |-
        Calculates exactly one target for a billing account you own: proposed items, an existing order, renewals, a
        cancellation or an order refund. Nothing is saved, reserved or redeemed.

        Existing orders use their recorded account and terms; renewals and cancellations use the account currently
        paying for each subscription. Every target must belong to the requested account; a project token does not
        authorize a quote. An existing order's total is the expected_amount for paying its invoice. Usage estimates
        are not checkout amounts.
      operationId: get-quote
      tags:
      - quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              order_checkout:
                summary: Preview a promotion code without applying it.
                value:
                  billing_account_id: 1
                  order_id: 019c0000-0000-7000-8000-000000000001
                  promotion_code: WELCOME
              account_discount:
                summary: Preview the account discount selected for this order.
                value:
                  billing_account_id: 1
                  order_id: 019c0000-0000-7000-8000-000000000001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    QuoteRenewal:
      description: |-
        Price renewing a licensed subscription. Give `price_id`, or `interval` with
        `interval_count`, to renew for another term at the price currently sold for it. Naming
        the current term, or giving neither, renews at the agreed amount. A term sold at several
        prices that differ in termination policy is refused with 409
        `BILLING_RENEWAL_OPTION_AMBIGUOUS` unless `termination_policy` or `price_id` is given.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        termination_policy:
          description: With `interval` and `interval_count`, chooses among prices of that term that differ in termination policy.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        periods:
          description: How many consecutive periods to renew for.
          type: integer
          default: 1
          minimum: 1
          maximum: 100
      required:
      - subscription_id
      additionalProperties: false
    QuoteRenewalResult:
      description: What renewing would charge. Renewing the same subscription for the same term and periods charges exactly `total` unless prices or the account's discounts change first.
      type: object
      properties:
        index:
          description: Which renewal of the request this answers.
          type: integer
        subscription_id:
          type: string
          format: uuid
        price_id:
          description: The price the renewal is charged under.
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - day
          - month
          - year
        interval_count:
          type: integer
        periods:
          type: integer
        amount:
          description: The price of the periods before the account's discounts, with any discount the subscription carries already reflected; includes tax only where the price does.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: The reduction from a discount the account holds.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          description: Tax on the discounted amount.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_included_amount:
          description: The part of `tax_amount` already contained in `amount`.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        total:
          description: |-
            What renewing would charge: `amount` less `discount_amount`, plus `tax_amount`, less
            `tax_included_amount`.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - index
      - subscription_id
      - price_id
      - interval
      - interval_count
      - periods
      - amount
      - discount_amount
      - tax_amount
      - tax_included_amount
      - total
    QuoteItem:
      description: |-
        One fully calculated purchase, estimated metered usage or recorded order item. Amounts use the
        billing-account currency. An item with no immediate charge has zero checkout amounts.
      type: object
      properties:
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Tax on the discounted amount, including any tax already contained in that amount.
        tax_included_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: The part of tax_amount already contained in amount minus discount_amount.
        index:
          description: The zero-based request line index, or the recorded order item's position for an order quote.
          type: integer
          minimum: 0
        order_item_id:
          description: Present for an existing order quote; identifies the recorded item being priced.
          type: string
          format: uuid
        price_id:
          description: The selected price, also when the request identified it indirectly.
          type: string
          format: uuid
        plan_name:
          type: string
        unit_amount:
          description: Unit price before discounts. Null when no single unit price applies, such as tiered or multiple-rate pricing.
          oneOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        quantity:
          description: The quantity priced; with duration_seconds, quantity times the duration.
          type: string
        amount:
          description: Amount before discounts and including any setup charge. For requested future usage this is an estimate, not a collectible checkout amount.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total reduction on this line, including any continuing renewal discount.
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: amount minus discount_amount plus tax_amount minus tax_included_amount.
        currency:
          type: string
      required:
      - index
      - price_id
      - plan_name
      - quantity
      - amount
      - currency
      - discount_amount
      - tax_amount
      - tax_included_amount
      - total
      - unit_amount
    Quote:
      description: A complete calculation in the billing account's currency; nothing is saved or reserved. The request fails if any item cannot be priced. Usage estimates are included in totals but are not collected at checkout; only an existing-order quote gives that order's checkout amount.
      type: object
      properties:
        funds:
          description: Account funds for an existing-order checkout quote. Absent for usage estimates, refunds and cancellations.
          allOf:
          - $ref: ../type/v1/funds.yaml#/components/schemas/Funds
        subtotal:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Sum before discounts, excluding tax already included in the item amounts. Zero for a cancellation-only quote.
        discount_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total item discounts. Zero for a cancellation-only quote.
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total tax on the discounted amounts. Zero for a cancellation-only quote.
        discount:
          description: The discount a purchase or order would get, not yet applied. Null when there is none, and for renewals and cancellations. A confirmed order reports its recorded discount.
          oneOf:
          - $ref: '#/components/schemas/QuotedDiscount'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        renewals:
          type: array
          items:
            $ref: '#/components/schemas/QuoteRenewalResult'
        cancellation:
          description: What the cancellation requested would return. Present only when one was requested.
          allOf:
          - $ref: '#/components/schemas/CancellationRefundPreview'
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: subtotal minus discount_amount plus tax_amount, before credit grants and balance. For an existing order, pass it as expected_amount when paying its invoice. Renewal entries are separate orders; use each entry's total. Usage estimates are not checkout amounts. Cancellation and refund targets have a zero total and report the returned value separately.
        currency:
          type: string
        refund:
          description: Present when an order refund was requested.
          allOf:
          - $ref: '#/components/schemas/OrderRefundQuote'
      required:
      - subtotal
      - discount_amount
      - tax_amount
      - total
      - discount
      - currency
      - items
      - renewals
    QuotedDiscount:
      description: The discount selected for this calculation, not applied and not reserved. Amounts are on the quote and its lines.
      type: object
      properties:
        type:
          type: string
          enum:
          - promotion_code
          - account_discount
        name:
          type: string
        promotion_code:
          description: Code text for a promotion_code discount; null for an account_discount.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
      required:
      - type
      - name
      - promotion_code
      additionalProperties: false
    QuoteCancellation:
      description: 'A cancellation to quote: what ending these subscriptions together would return, for one mode; quote `immediate` and `period_end` separately to compare. Refused with 409 `BILLING_SUBSCRIPTION_OPERATION_PENDING` when a subscription is already being canceled (`meta.cancellation_id`), is being reclaimed (`meta.reason` `reclaim_requested`) or has a paid change waiting to switch (`meta.order_id`).'
      type: object
      properties:
        subscription_ids:
          description: The subscriptions to end together, all of one service, including every subscription released with a resource.
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        mode:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
      required:
      - subscription_ids
      - mode
      additionalProperties: false
    CancellationRefundPreview:
      description: |-
        What the cancellation would return, per subscription and in total, as of now. Give `proration_date` and
        `refundable_amount` when creating the cancellation.

        - `unused_amount`: before tax, the amount paid for the current periods minus the value of the time used,
          valued as refund policy `prorated` describes, whatever the refund terms say.
        - `refundable_amount`: what is returned the way it was paid, tax included; `refund_amount` plus
          `credit_amount`.
        - `refund_amount`: the part returned to the balance or the payment method.
        - `credit_amount`: the part restored to the credit grants that paid.
        - `tax_amount`: the tax included in `refundable_amount`.
        - `forfeited_amount`: before tax, the part of `unused_amount` the refund terms do not return.

        Metered and one-time subscriptions show zero; their usage until release is charged as usual.
      type: object
      properties:
        mode:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        scheduled_at:
          description: For `period_end`, when release begins, the end of the paid terms.
          type: string
          format: date-time
        proration_date:
          description: For `immediate`, the second the refund is computed as of. Give it when creating the cancellation.
          type: string
          format: date-time
        currency:
          type: string
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        items:
          type: array
          items:
            $ref: '#/components/schemas/CancellationRefundPreviewItem'
      required:
      - mode
      - currency
      - unused_amount
      - refundable_amount
      - refund_amount
      - credit_amount
      - tax_amount
      - forfeited_amount
      - items
    CancellationRefundPreviewItem:
      description: One subscription of the quoted cancellation.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        project:
          description: The project and its current name. Absent for an account-level purchase or when the project cannot be read.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          $ref: ./prices.yaml#/components/schemas/UsageType
        auto_renew:
          description: Whether automatic renewal is on now. Creating the cancellation turns it off; withdrawing it turns it back on for a metered subscription but not for a licensed one.
          type: boolean
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - subscription_id
      - plan_id
      - plan_name
      - type
      - usage_type
      - auto_renew
      - unused_amount
      - refundable_amount
      - refund_amount
      - credit_amount
      - tax_amount
      - forfeited_amount
    QuoteItemInput:
      description: Identify a price, or select one for a plan; give each resource's ID or lookup key, never both, and product_id with lookup keys. For a metered price, a meter or duration_seconds requests a usage estimate, which cannot be combined with a promotion code and is not a checkout amount. Without one, a metered item includes only any setup charge.
      type: object
      properties:
        price_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        plan_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        plan_id:
          type: string
          format: uuid
        price_type:
          description: Narrows the selection when a plan offers more than one price type.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          description: Narrows the selection when a plan offers more than one usage type.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/UsageType
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        termination_policy:
          description: Selects among licensed prices with otherwise identical billing terms. Ambiguous terms are refused instead of choosing a price arbitrarily.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        quantity:
          type: string
          pattern: ^(?:(?:[1-9][0-9]{0,27}|0(?:[1-9][0-9]{0,26}|0(?:[1-9][0-9]{0,25}|0(?:[1-9][0-9]{0,24}|0(?:[1-9][0-9]{0,23}|0(?:[1-9][0-9]{0,22}|0(?:[1-9][0-9]{0,21}|0(?:[1-9][0-9]{0,20}|0(?:[1-9][0-9]{0,19}|0(?:[1-9][0-9]{0,18}|0(?:[1-9][0-9]{0,17}|0(?:[1-9][0-9]{0,16}|0(?:[1-9][0-9]{0,15}|0(?:[1-9][0-9]{0,14}|0(?:[1-9][0-9]{0,13}|0(?:[1-9][0-9]{0,12}|0(?:[1-9][0-9]{0,11}|0(?:[1-9][0-9]{0,10}|0(?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9])))))))))))))))))))))))))))([.][0-9]{1,10})?|0{1,28}[.](?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))$
        meter_id:
          type: string
          format: uuid
        meter_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        dimensions:
          description: 'The dimension values the rate depends on, such as region, instance type or token kind: those of the usage for a metered estimate, and those of what is bought for a licensed price on a rate card. Required whenever the price uses a rate card; prices with their own amounts ignore them. Every key the meter declares must be given. A combination no rate covers is refused rather than priced at zero.'
          type: object
          additionalProperties:
            type: string
        duration_seconds:
          description: For a metered estimate, how long to price for, in seconds; the priced quantity is `quantity` times this duration.
          type: integer
          format: int64
      required:
      - quantity
      additionalProperties: false
    OrderRefundQuoteInput:
      description: An estimate of the refundable value of an order or selected items; nothing is canceled or refunded.
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        order_item_ids:
          description: Estimate only these items. Omit to estimate the whole order. Every item must belong to the order.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      required:
      - order_id
      additionalProperties: false
    OrderRefundQuote:
      description: An estimated refund to the original payment sources. Before acceptance, cancellation returns the collected amount. For delivered service, only value paid by this order is included; renewals are evaluated with their own orders under the agreed termination terms. Nothing is refunded by the quote; the amount is fixed when cancellation or termination is confirmed.
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: refund_amount plus credit_amount.
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Amount returned to the balance or original payment method.
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Amount restored to the credit grants that paid.
        currency:
          type: string
      required:
      - order_id
      - refundable_amount
      - refund_amount
      - credit_amount
      - currency
      additionalProperties: false
    QuoteRequest:
      description: 'Quote exactly one target for the billing account: proposed items, an existing order, renewals, a cancellation or an order refund. Promotion codes apply only to proposed items or an existing order. An invalid combination fails with `BILLING_PURCHASE_INVALID` and the field.'
      type: object
      properties:
        billing_account_id:
          description: The billing account to price for; it must be yours. Existing orders must have been placed with it, and renewals and cancellations must currently be paid by it.
          type: integer
          format: int64
          minimum: 1
        items:
          description: A proposed purchase priced in the account's currency. Metered items may include usage estimates, which are not checkout amounts.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteItemInput'
        order_id:
          description: Preview paying this order. Its recorded terms supply every line, and an order whose terms are fixed returns its recorded amounts. The order does not change.
          type: string
          format: uuid
        renewals:
          description: Preview renewing these subscriptions, each at most once; each entry is a separate renewal order. To preview a promotion code, create a renewal order and quote it by order_id.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteRenewal'
        cancellation:
          $ref: '#/components/schemas/QuoteCancellation'
        promotion_code:
          type: string
          minLength: 1
          maxLength: 64
        refund:
          $ref: '#/components/schemas/OrderRefundQuoteInput'
      required:
      - billing_account_id
      additionalProperties: false
