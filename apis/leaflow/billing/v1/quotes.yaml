paths:
  /api/v1/quotes:
    query:
      summary: Get a quote
      description: |-
        Calculates what a proposed purchase, a change of your subscriptions or their renewal would invoice now, and
        what each purchased or changed line renews at, or what ending subscriptions would return. Nothing is saved,
        reserved, redeemed or canceled.

        With `billing_account_id`, the quote is for that billing account: its currency, account discounts,
        tax and funds apply, changes and renewals use the account currently paying for each subscription, and an
        access token is required. The account must be yours or currently pay for a project you are a member of.
        Without it, proposed items are priced in `currency` for anyone, signed in or not: no account discount or funds
        apply, and tax that would be added is included only for the customer's `address`.

        A change is priced as the service that owns the subscription would order it: pass the returned `total` as the
        expected amount and, for an immediate change, `proration_date` to that service when making the change.

        A promotion code is evaluated without being applied. It is applied only when a Checkout Session is completed
        with it; conditions that depend on the account, such as a first purchase, are checked only with an account
        and otherwise reported as `unverified`. Future usage of metered prices is estimated with `estimate-usage`.
      operationId: get-quote
      security:
      - {}
      - accessTokenAuth: []
      tags:
      - quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              promotion_code:
                summary: Check whether a promotion code applies to a proposed purchase, without applying it.
                value:
                  billing_account_id: 1
                  items:
                  - price_id: 019c0000-0000-7000-8000-000000000002
                    quantity: '1'
                  promotion_code: WELCOME
              without_account:
                summary: Price a proposed purchase for a visitor who is not signed in.
                value:
                  currency: USD
                  items:
                  - price_id: 019c0000-0000-7000-8000-000000000002
                    quantity: '1'
                  promotion_code: WELCOME
              with_address:
                summary: Price a proposed purchase for a visitor who is not signed in, with the tax added where they are.
                value:
                  currency: EUR
                  items:
                  - price_id: 019c0000-0000-7000-8000-000000000002
                    quantity: '1'
                  address:
                    country: DE
              change:
                summary: Price changing a subscription to another plan at once, keeping its billing terms.
                value:
                  billing_account_id: 1
                  changes:
                  - subscription_id: 019c0000-0000-7000-8000-000000000003
                    plan_id: 019c0000-0000-7000-8000-000000000004
                    quantity: '1'
                  change_effective: immediate
              cancellation:
                summary: Preview what canceling a server with its disks at once would return.
                value:
                  billing_account_id: 1
                  cancellation:
                    subscription_ids:
                    - 019c0000-0000-7000-8000-000000000003
                    - 019c0000-0000-7000-8000-000000000005
                    mode: immediate
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    QuoteRenewal:
      description: |-
        Price renewing a licensed subscription. Give `price_id`, or `interval` with
        `interval_count`, to renew for another term at the price currently sold for it. Naming
        the current term, or giving neither, renews at the agreed amount. A term sold at several
        prices that differ in cancellation policy is refused with 409
        `BILLING_RENEWAL_OPTION_AMBIGUOUS` unless `cancellation_policy` or `price_id` is given.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        cancellation_policy:
          description: With `interval` and `interval_count`, chooses among prices of that term that differ in cancellation policy.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/CancellationPolicy
        periods:
          description: How many consecutive periods to renew for.
          type: integer
          default: 1
          minimum: 1
          maximum: 100
      required:
      - subscription_id
      additionalProperties: false
    QuoteRenewalResult:
      description: What renewing would charge. Renewing the same subscription for the same term and periods charges exactly `total` unless prices or the account's discounts change first.
      type: object
      properties:
        index:
          description: Which renewal of the request this answers.
          type: integer
        subscription_id:
          type: string
          format: uuid
        price_id:
          description: The price the renewal is charged under.
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - day
          - month
          - year
        interval_count:
          type: integer
        periods:
          type: integer
        amount:
          description: The price of the periods before the account's discounts, with any discount the subscription carries already reflected; includes tax only where the price does.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: The reduction from a discount the account holds.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          description: Tax on the discounted amount.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_included_amount:
          description: The part of `tax_amount` already contained in `amount`.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        total:
          description: |-
            What renewing would charge: `amount` less `discount_amount`, plus `tax_amount`, less
            `tax_included_amount`.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - index
      - subscription_id
      - price_id
      - interval
      - interval_count
      - periods
      - amount
      - discount_amount
      - tax_amount
      - tax_included_amount
      - total
    QuoteItem:
      description: |-
        One fully calculated purchase line. An item with no immediate charge, such as a metered purchase, has zero checkout amounts.
      type: object
      properties:
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Tax on the discounted amount, including any tax already contained in that amount.
        tax_included_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: The part of tax_amount already contained in amount minus discount_amount.
        index:
          description: The zero-based index of the item or change in the request, or the item's position for a Checkout
            Session quote.
          type: integer
          minimum: 0
        subscription_id:
          description: The subscription changed; null for a new purchase.
          type:
          - string
          - 'null'
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        plan_id:
          type: string
          format: uuid
        price_id:
          description: The selected price, also when the request identified it indirectly.
          type: string
          format: uuid
        plan_name:
          type: string
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          $ref: ./prices.yaml#/components/schemas/UsageType
        interval:
          description: The billing period of a recurring licensed line; `none` otherwise.
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          description: Periods per billing cycle of a recurring licensed line; null otherwise.
          type:
          - integer
          - 'null'
          minimum: 1
        dimensions:
          description: The dimension values the line is priced at.
          type: object
          additionalProperties:
            type: string
        setup_amount:
          description: The setup charge already included in `amount`; null when none applies.
          oneOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        recurring_amount:
          description: Recurring licensed lines only; null otherwise. What each later period renews at, before discounts
            and tax, which differs from `amount` when the first period is priced differently. `discount` says whether
            its discount continues on renewals.
          oneOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        unit_amount:
          description: Unit price before discounts. Null when no single unit price applies, such as tiered or multiple-rate pricing.
          oneOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        quantity:
          description: The quantity priced.
          type: string
        amount:
          description: Amount before discounts and including any setup charge.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total reduction on this line, including any continuing renewal discount.
        remaining_amount:
          description: Immediate changes only; null otherwise. Before tax, the new terms for the time from
            `proration_date` to the end of the paid period. An upgrade invoices `remaining_amount` minus `unused_amount`.
          oneOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        unused_amount:
          description: Immediate changes only; null otherwise. Before tax, for an upgrade or an unchanged period price,
            the amount paid for that time, up to the new terms' value for the same time; for a downgrade, the remaining
            value of what was paid, under the refund terms of each paid period.
          oneOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        downgrade_refund:
          description: Immediate downgrades only, when `unused_amount` exceeds `remaining_amount`; null otherwise.
          oneOf:
          - $ref: '#/components/schemas/QuoteDowngradeRefund'
          - type: 'null'
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: amount minus discount_amount plus tax_amount minus tax_included_amount.
        currency:
          type: string
      required:
      - index
      - subscription_id
      - product_id
      - plan_id
      - price_id
      - plan_name
      - type
      - usage_type
      - interval
      - interval_count
      - dimensions
      - setup_amount
      - recurring_amount
      - quantity
      - amount
      - currency
      - discount_amount
      - tax_amount
      - tax_included_amount
      - total
      - unit_amount
      - remaining_amount
      - unused_amount
      - downgrade_refund
    QuoteDowngradeRefund:
      description: What an immediate downgrade would refund, estimated as of `proration_date`. The refund itself is
        determined when the change takes effect.
      type: object
      properties:
        refundable_amount:
          description: Returned to the original payment sources, tax paid on it included.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          description: Before tax, the part of the excess that the subscription's refund terms do not return.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - refundable_amount
      - forfeited_amount
      additionalProperties: false
    Quote:
      description: A complete calculation in `currency`; nothing is saved or reserved. The request fails if any item cannot be priced. A Checkout Session quote gives what completing the session would invoice.
      type: object
      properties:
        funds:
          description: Account funds for the quoted purchase. Null without an account, and for a cancellation.
          oneOf:
          - $ref: ../type/v1/funds.yaml#/components/schemas/Funds
          - type: 'null'
        subtotal:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Sum before discounts, excluding tax already included in the item amounts.
        discount_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total item discounts.
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Total tax on the discounted amounts.
        discount:
          description: The discount a purchase would get, not yet applied. Null when there is none, and for renewals and a cancellation.
          oneOf:
          - $ref: '#/components/schemas/QuotedDiscount'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        renewals:
          type: array
          items:
            $ref: '#/components/schemas/QuoteRenewalResult'
        cancellation:
          description: What the cancellation would return. Null unless the request quotes a cancellation.
          oneOf:
          - $ref: '#/components/schemas/QuoteCancellationResult'
          - type: 'null'
        total:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: subtotal minus discount_amount plus tax_amount, before credit grants and balance. For a Checkout Session quote, pass it as expected_amount when confirming the session. Renewal entries are separate orders; use each entry's total. Zero for a cancellation, which invoices nothing.
        currency:
          type: string
        proration_date:
          description: Immediate changes and immediate cancellations only; null otherwise. The instant the change or the
            refund is priced from; pass it when confirming the Checkout Session or creating the cancellation so it is
            priced from the same instant.
          type:
          - string
          - 'null'
          format: date-time
        tax_status:
          description: '`complete`: tax is calculated for the billing account''s invoice contact, or for `address` without
            an account. `requires_location_inputs`: a quote without an account or `address`, which leaves out tax that
            would be added; tax already contained in a price is included.'
          type: string
          enum:
          - complete
          - requires_location_inputs
      required:
      - funds
      - tax_status
      - subtotal
      - discount_amount
      - tax_amount
      - total
      - discount
      - currency
      - items
      - renewals
      - cancellation
      - proration_date
    QuoteCancellation:
      description: |-
        Preview ending these subscriptions together in one mode; quote `immediate` and `period_end` separately to
        compare. Each must currently be paid by `billing_account_id` and be yours to read, as the owner of that account
        or a member of the subscriptions' project. Refused as creating the cancellation would be, including 409
        `BILLING_SUBSCRIPTION_OPERATION_PENDING` when a subscription is already being canceled (`meta.cancellation_id`),
        is being reclaimed (`meta.reason` `reclaim_requested`) or has a paid change waiting to switch (`meta.order_id`).
      type: object
      properties:
        subscription_ids:
          description: The subscriptions to end together, all of one service, including every subscription released with a resource.
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
      required:
      - subscription_ids
      - mode
      additionalProperties: false
    QuoteCancellationResult:
      description: |-
        What the cancellation would return, per subscription and in total, as of the quote's `proration_date` for
        `immediate`. Give that `proration_date` and `refundable_amount` when creating the cancellation.

        - `unused_amount`: before tax, the amount paid for the current periods in proportion to the time remaining.
        - `short_rate_surcharge_amount`: before tax, the part of `forfeited_amount` due to the short rate of the
          refund policy.
        - `refundable_amount`: what is returned the way it was paid, tax included; `refund_amount` plus
          `credit_amount`.
        - `refund_amount`: the part returned to the balance or the payment method.
        - `credit_amount`: the part restored to the credit grants that paid.
        - `tax_amount`: the tax included in `refundable_amount`.
        - `forfeited_amount`: before tax, the part of `unused_amount` the refund terms do not return.

        Metered and one-time subscriptions show zero; their usage until release is charged as usual.
      type: object
      properties:
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
        scheduled_at:
          description: For `period_end`, when release begins, the end of the paid terms.
          type: string
          format: date-time
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        short_rate_surcharge_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteCancellationItem'
      required:
      - mode
      - unused_amount
      - short_rate_surcharge_amount
      - refundable_amount
      - refund_amount
      - credit_amount
      - tax_amount
      - forfeited_amount
      - items
    QuoteCancellationItem:
      description: One subscription of the quoted cancellation.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        project:
          description: The project and its current name. Absent for an account-level purchase or when the project cannot be read.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          $ref: ./prices.yaml#/components/schemas/UsageType
        auto_renew:
          description: Whether automatic renewal is on now. Creating the cancellation turns it off; withdrawing it turns it back on for a metered subscription but not for a licensed one.
          type: boolean
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        short_rate_surcharge_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - subscription_id
      - plan_id
      - plan_name
      - type
      - usage_type
      - auto_renew
      - unused_amount
      - short_rate_surcharge_amount
      - refundable_amount
      - refund_amount
      - credit_amount
      - tax_amount
      - forfeited_amount
    QuotedDiscount:
      description: The discount selected for this calculation, not applied and not reserved. Amounts are on the quote and its lines.
      type: object
      properties:
        type:
          type: string
          enum:
          - promotion_code
          - account_discount
        name:
          type: string
        promotion_code:
          description: Code text for a promotion_code discount; null for an account_discount.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
        frequency:
          description: 'Whether the discount continues on renewals of what is bought: `once` applies only to this
            purchase, `recurring` for `frequency_duration` periods including the first, `forever` on every renewal.'
          type: string
          enum:
          - once
          - recurring
          - forever
        frequency_duration:
          description: For `recurring`, the periods the discount lasts; null otherwise.
          type:
          - integer
          - 'null'
          minimum: 1
        eligibility:
          description: '`confirmed`: every condition of the discount holds for the billing account. `unverified`: a quote
            without an account, where conditions that depend on the account, such as a first purchase or a per-account
            limit, are checked only when a Checkout Session is completed.'
          type: string
          enum:
          - confirmed
          - unverified
      required:
      - type
      - name
      - promotion_code
      - frequency
      - frequency_duration
      - eligibility
      additionalProperties: false
    QuoteItemInput:
      description: Identify a price, or select one for a plan; give each resource's ID or lookup key, never both, and product_id with lookup keys. A metered item includes only any setup charge; its usage is estimated with `estimate-usage`.
      type: object
      properties:
        price_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        plan_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        plan_id:
          type: string
          format: uuid
        price_type:
          description: Narrows the selection when a plan offers more than one price type.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          description: Narrows the selection when a plan offers more than one usage type.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/UsageType
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        cancellation_policy:
          description: Selects among licensed prices with otherwise identical billing terms. Ambiguous terms are refused instead of choosing a price arbitrarily.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/CancellationPolicy
        quantity:
          type: string
          pattern: ^(?:(?:[1-9][0-9]{0,27}|0(?:[1-9][0-9]{0,26}|0(?:[1-9][0-9]{0,25}|0(?:[1-9][0-9]{0,24}|0(?:[1-9][0-9]{0,23}|0(?:[1-9][0-9]{0,22}|0(?:[1-9][0-9]{0,21}|0(?:[1-9][0-9]{0,20}|0(?:[1-9][0-9]{0,19}|0(?:[1-9][0-9]{0,18}|0(?:[1-9][0-9]{0,17}|0(?:[1-9][0-9]{0,16}|0(?:[1-9][0-9]{0,15}|0(?:[1-9][0-9]{0,14}|0(?:[1-9][0-9]{0,13}|0(?:[1-9][0-9]{0,12}|0(?:[1-9][0-9]{0,11}|0(?:[1-9][0-9]{0,10}|0(?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9])))))))))))))))))))))))))))([.][0-9]{1,10})?|0{1,28}[.](?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))$
        dimensions:
          description: The dimension values of what is bought, such as region and instance type. Required whenever the price uses a rate card; prices with their own amounts ignore them. Every key the meter declares must be given. A combination no rate covers is refused with `BILLING_PRICE_UNAVAILABLE` rather than priced at zero. Prices are set per currency, and a currency may not offer some combinations at all, for example in a region it does not sell to.
          type: object
          additionalProperties:
            type: string
      required:
      - quantity
      additionalProperties: false
    QuoteRequest:
      description: 'Quote proposed items, changes, renewals or a cancellation: exactly one of them. Give exactly one of
        `billing_account_id` and `currency`; changes, renewals and a cancellation need the account. Promotion codes apply to proposed items and changes. An
        invalid combination fails with `BILLING_PURCHASE_INVALID` and the field.'
      type: object
      properties:
        billing_account_id:
          description: The billing account to price for; it must be yours or currently pay for a project you are a member of, and an access token is required. Renewals and a cancellation must currently be paid by it.
          type: integer
          format: int64
          minimum: 1
        currency:
          description: The ISO 4217 currency to price in without an account.
          type: string
          minLength: 3
          maxLength: 3
        items:
          description: A proposed purchase.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteItemInput'
        renewals:
          description: Preview renewing these subscriptions, each at most once; each entry is a separate renewal order. Each must currently be paid by `billing_account_id` and be yours to read, as the owner of that account or a member of the subscription's project. To apply a promotion code, create a renewal Checkout Session and quote it.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteRenewal'
        changes:
          description: Preview changing these subscriptions in one order, each at most once. Each must currently be paid
            by `billing_account_id` and be yours to read, as the owner of that account or a member of the subscription's
            project; all must belong to the same project, or all to no project.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteChangeInput'
        cancellation:
          $ref: '#/components/schemas/QuoteCancellation'
        change_effective:
          description: When the changes take effect; defaults to `immediate`. `immediate` prices the rest of the paid
            period from `proration_date`, charging an upgrade the difference and showing what a downgrade refunds.
            `period_end` prices the first period at the new terms, which replaces the renewal when the paid period ends.
          type: string
          enum:
          - immediate
          - period_end
        address:
          description: Only with `currency`. Where the customer is, to include the tax that would be added there for a
            customer who is not tax exempt; `tax_status` is then `complete`. Refused with `billing_account_id`, whose
            invoice contact decides tax.
          allOf:
          - $ref: '#/components/schemas/QuoteAddress'
        promotion_code:
          type: string
          minLength: 1
          maxLength: 64
      additionalProperties: false
    QuoteChangeInput:
      description: The new terms of one subscription. Identify the price, or the plan to select one from, as for a
        proposed item. Without a price or billing terms, the plan's price with the subscription's price type, usage type,
        interval, interval count and cancellation policy is selected. Omitted dimensions keep the subscription's.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        price_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        plan_lookup_key:
          type: string
          minLength: 1
          maxLength: 128
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        plan_id:
          type: string
          format: uuid
        price_type:
          description: Selects the price type instead of keeping the subscription's.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          description: Selects the usage type instead of keeping the subscription's.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/UsageType
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        cancellation_policy:
          description: Selects among licensed prices with otherwise identical billing terms.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/CancellationPolicy
        quantity:
          description: The quantity after the change.
          type: string
          pattern: ^(?:(?:[1-9][0-9]{0,27}|0(?:[1-9][0-9]{0,26}|0(?:[1-9][0-9]{0,25}|0(?:[1-9][0-9]{0,24}|0(?:[1-9][0-9]{0,23}|0(?:[1-9][0-9]{0,22}|0(?:[1-9][0-9]{0,21}|0(?:[1-9][0-9]{0,20}|0(?:[1-9][0-9]{0,19}|0(?:[1-9][0-9]{0,18}|0(?:[1-9][0-9]{0,17}|0(?:[1-9][0-9]{0,16}|0(?:[1-9][0-9]{0,15}|0(?:[1-9][0-9]{0,14}|0(?:[1-9][0-9]{0,13}|0(?:[1-9][0-9]{0,12}|0(?:[1-9][0-9]{0,11}|0(?:[1-9][0-9]{0,10}|0(?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9])))))))))))))))))))))))))))([.][0-9]{1,10})?|0{1,28}[.](?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))$
        dimensions:
          description: The dimension values after the change, given in full; omit to keep the subscription's.
          type: object
          additionalProperties:
            type: string
      required:
      - subscription_id
      - quantity
      additionalProperties: false
    QuoteAddress:
      type: object
      properties:
        country:
          description: ISO 3166-1 alpha-2, two uppercase letters.
          type: string
          pattern: ^[A-Z]{2}$
        state:
          description: The state or province, as the tax rates name it.
          type: string
          minLength: 1
          maxLength: 128
      required:
      - country
      additionalProperties: false
