paths:
  /api/v1/subscriptions/{subscriptionId}/renewal-orders:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    post:
      summary: Create renewal order
      description: |-
        Places a renewal order with a draft invoice, without applying a new discount or charging anything.
        Quote and confirm its checkout before collecting payment to renew. Existing subscription
        discount commitments are retained. The periods and price are chosen as for renewing. The order
        can be paid until the current paid period ends, and never after the end of the first period it renews; unpaid by
        then, it is canceled. While auto-renew is on, the renewal due at the end of the period pays
        this order instead of placing another, confirming checkout with an applicable account discount
        first if it has not already been confirmed.

        Save `order_id` before submitting and read the order after an unknown outcome; creating it a
        second time conflicts.
      operationId: create-renewal-order
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./subscriptions.yaml#/components/schemas/RenewalOrderRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order already exists or the subscription has a conflicting renewal, change or cancellation.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders:
    get:
      summary: List orders
      description: |-
        Lists acceptance status and associated invoice amounts. pending_checkout awaits confirmation;
        pending has confirmed checkout and may be unpaid or paid. active means accepted, not delivered.
        pending_checkout and pending orders can expire at expires_at.
      operationId: list-orders
      tags:
      - orders
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - $ref: ./openapi.yaml#/components/parameters/From
      - $ref: ./openapi.yaml#/components/parameters/To
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    get:
      summary: Get order
      operationId: get-order
      tags:
      - orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/checkout:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    post:
      summary: Confirm order checkout
      description: |-
        Confirms the purchase's final amount and discount. Supply the same promotion_code used for the
        preview, or omit it to select an applicable account discount. At most one new coupon is applied
        to an order; existing subscription discount commitments are not stacked with a new coupon on
        the same line. Promotion codes are evaluated against the order, not client-supplied line amounts.

        Rechecks eligibility and redemption availability. A different total fails with
        BILLING_AMOUNT_CHANGED. An invalid or inapplicable code fails rather than collecting full price.
        A failed confirmation leaves the invoice draft and reserves no discount redemption.

        A successful confirmation records the discount, including any recurring discount terms,
        reserves its redemption, moves pending_checkout to pending and finalizes the invoice when one
        is required. The reservation counts toward the code's limits and is consumed when the invoice
        is paid, or at confirmation when nothing is due. Use pay-invoice to collect
        its outstanding amount from account funds or a payment gateway. No payment attempt or checkout
        session is created by this operation. An order whose total is zero completes checkout at
        placement in either mode and does not need this operation; an order with an amount due, even
        when credits would cover it, still does. Checkout alone does not confirm resource delivery.

        Retrying with the same code and expected amount returns the existing order without another
        redemption. Omitting the code on a confirmed checkout retains its recorded discount. Changing
        that code is refused with BILLING_ORDER_CHECKOUT_CONFLICT. Payment retries reuse the confirmed
        terms. Cancellation, expiry or complete fulfillment failure releases the reservation or returns
        the consumed redemption; a refund alone does not.

        The order must belong to one of your billing accounts. A canceled, failed or expired order
        cannot be checked out. A period-end change cannot be checked out before its renewal invoice is
        available. Orders retain their billing account and currency after a project is linked elsewhere;
        discounts from another account cannot be used for them.
      operationId: checkout-order
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutOrderRequest'
            example:
              promotion_code: WELCOME
              expected_amount: '90.00'
      responses:
        '200':
          description: The order with confirmed checkout terms and its invoice, when applicable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order no longer permits checkout or another discount has already been confirmed.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/cancel:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    post:
      summary: Cancel order
      description: |-
        Cancels the selected, still-undelivered items of an unaccepted order without recording a
        delivery failure. Omit order_item_ids to select every still-pending item, or name one or
        more items. Successful items remain delivered and are not refunded. Whole-order and partial
        cancellation both require confirmed non-delivery and necessary cleanup. The order keeps
        its existing pending phase while any item is still pending; its final outcome follows all
        item outcomes. Previously failed items keep their failure outcome.

        Payment may be absent, partial or complete. Confirmed checkout keeps the selected items'
        agreed amounts and discounts; credit notes reduce issued invoices, and collected amounts
        are returned to their original payment sources. When checkout has not been confirmed, the
        remaining items are quoted again. External payment-method refunds can finish asynchronously.
        The order and financial history are retained; the same cancellation does not refund twice.

        Once the order is accepted, its owning service coordinates cancellation and confirms
        non-delivery and cleanup through the cancellation RPC. Delivered items are ended through
        subscription cancellation. Unknown delivery or payment outcomes are not refund evidence;
        in-flight or unknown payments must be reconciled first. Scheduled changes continue to be
        canceled through the owning service. Refund quotations use CreateQuote.refund.
      operationId: cancel-order
      tags:
      - orders
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancel'
      responses:
        '200':
          description: The order after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order is accepted, its payment outcome is unresolved, or the scheduled change requires its owning service.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/items:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    get:
      summary: List order items
      description: One entry per item bought, with the price charged and the period it covers.
      operationId: list-order-items
      tags:
      - orders
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    CheckoutOrderRequest:
      type: object
      properties:
        promotion_code:
          description: |-
            The code to apply, evaluated again at confirmation. Omit to select an applicable account
            discount. On an already confirmed checkout, omission retains the recorded discount.
          type: string
          minLength: 1
          maxLength: 64
        expected_amount:
          description: |-
            Quote.total in the order's currency, after discounts and tax but before applying credit
            grants or balance. Omit to skip the amount comparison; an explicit zero is compared.
            A different total fails with BILLING_AMOUNT_CHANGED. Must be a non-negative decimal
            string; empty strings, null, JSON numbers, signs and exponent notation are rejected.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: string
            pattern: ^[0-9]{1,15}([.][0-9]{1,10})?$
      additionalProperties: false
    OrderStatus:
      description: |-
        pending_checkout has recorded purchase terms but no confirmed checkout; only a deferred order
        with an amount due reaches it, since a zero-total order completes checkout at placement.
        Confirmation moves it to pending. Both pending_checkout
        and pending can expire or be canceled; neither establishes service delivery.

        Follows the items. `pending` has confirmed checkout, is not yet accepted and may be paid or unpaid. `active` is
        accepted with items still being set up. `completed` means every item was set up.
        `partially_completed` means some items were set up and the others failed or were canceled and were
        refunded to their original payment sources. `failed` means no item was delivered and at least one failed; collected amounts for the
        undelivered items are refunded. `canceled` means every item was withdrawn without delivery; collected amounts are
        returned to their original payment sources.
      type: string
      enum:
      - pending_checkout
      - pending
      - active
      - completed
      - partially_completed
      - failed
      - canceled
    OrderItemStatus:
      description: |-
        `pending` is waiting to be set up. `completed` was confirmed by the service.
        `failed` was not set up and its amount was refunded to the original payment sources.
        `canceled` was confirmed withdrawn without delivery; any collected amount is returned. A completed item is ended by canceling
        its subscription.
      type: string
      enum:
      - pending
      - completed
      - failed
      - canceled
    Order:
      description: |-
        A recorded purchase. pending_checkout requires explicit Billing confirmation before collection
        or acceptance, even without an invoice. Coupon fields describe a discount confirmed at checkout and are absent
        before confirmation; a quote never populates them. A draft invoice contains base purchase
        amounts awaiting checkout. Payment and acceptance remain separate from resource delivery.
      type: object
      properties:
        coupon_id:
          type: string
          format: uuid
        coupon:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        promotion_code_id:
          type: string
          format: uuid
        promotion_code:
          description: Code text frozen when checkout applied the coupon. Absent for an account discount.
          type: string
        invoice:
          $ref: ./invoices.yaml#/components/schemas/InvoiceSummary
        paid_with:
          description: How the order was paid. Absent until it is paid.
          allOf:
          - $ref: '#/components/schemas/PaidWith'
        account:
          $ref: ./accounts.yaml#/components/schemas/AccountIdentity
        change_effective_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        project_id:
          description: |-
            Which project it was bought for. Absent for a purchase made at account level, such
            as a membership.
          type:
          - string
          - 'null'
          format: uuid
        project:
          description: |-
            The project and its current name, for display. Absent for a purchase at account level,
            and when the project no longer exists or its details cannot be read at the moment;
            `project_id` still identifies it then.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        billing_account_id:
          description: |-
            The billing account the order was placed with. It does not change when the project is later
            linked to another billing account. While this account is suspended or closed the order cannot
            be accepted, and a change scheduled for the end of a period is not invoiced and is called off
            when the current period ends; such requests fail with BILLING_ACCOUNT_UNAVAILABLE.
          type: integer
          format: int64
        currency:
          type: string
        type:
          description: |-
            `adopt` brings a resource that already existed under billing. It charges nothing at
            the time and starts billing from the moment agreed.
          type: string
          enum:
          - purchase
          - renew
          - change
          - adopt
        status:
          $ref: '#/components/schemas/OrderStatus'
        change_effective:
          description: |-
            When a plan change takes effect. `none` on anything that is not a change.

            `period_end` orders stay pending until the first period at the new price is paid. That period
            is invoiced shortly before the current paid period ends and starts when it ends; if the
            invoice is still unpaid by then, the order is canceled and the subscription renews or ends as
            usual. Renewing in the meantime moves all of this along with it.
          type: string
          enum:
          - none
          - immediate
          - period_end
        expires_at:
          description: Acceptance deadline. pending_checkout and pending orders can expire automatically.
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        items:
          description: |-
            What was bought. Present on a single order and on every order in a list, so a list
            can be rendered without a further request per row.
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - currency
      - type
      - status
      - items
      - created_at
    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    PaidWith:
      description: |-
        How it was paid, as recorded at the time. It is kept as it was: removing the card afterwards
        does not change it, and `payment_method_id` may then name a card that no longer exists.
      type: object
      properties:
        method_type:
          description: |-
            `balance` when the account's balance and credits covered it in full. Otherwise the method used
            with the gateway, such as `card`.
          type: string
        payment_gateway:
          description: The gateway that collected it. Absent when `method_type` is `balance`.
          type: string
        payment_method_id:
          description: The saved payment method that was charged, when one was.
          type: string
          format: uuid
        brand:
          type: string
        last4:
          type: string
      required:
      - method_type
    PurchaseOperation:
      description: |-
        Which purchase this applies to. `upgrade` and `downgrade` are told apart by money: a change
        that costs more for the remainder of the period is an upgrade, one that returns money
        is a downgrade. A change that costs neither more nor less is neither.

        `purchase` means a new purchase as opposed to a renewal or a change. It does not mean the
        account's first purchase.
      type: string
      enum:
      - purchase
      - renew
      - upgrade
      - downgrade
    OrderItem:
      description: |-
        Frozen purchase terms. Monetary fields come from related invoice-line snapshots and are absent
        when there is no immediate invoice. Later catalog changes do not reprice this line. A new service
        purchase creates its pending subscription when this item is recorded, not when payment succeeds.
      type: object
      properties:
        position:
          type: integer
          minimum: 0
        configuration:
          type: object
          additionalProperties: true
        subscription_id:
          description: |-
            Stable Billing subscription ID. A new prepaid or postpaid service purchase returns the
            pending subscription here; renewals and changes reference the existing subscription, which
            keeps its ID. Absent for delivery without a subscription. This is not a business resource ID.
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        termination_policy:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        refund_policy:
          $ref: ./prices.yaml#/components/schemas/RefundPolicy
        refund_monthly_amount:
          description: |-
            Prepaid items only: the plan's one-month prepaid price for this item's quantity before tax, frozen
            at purchase, used to value time used under a prorated refund or a downgrade. Null when the plan has
            no prepaid period shorter than the one bought.
          type:
          - string
          - 'null'
        refund_hourly_amount:
          description: |-
            Prepaid items only: the plan's postpaid hourly price for this item's quantity before tax, frozen at
            purchase, used for time used short of a full month. Null when the plan has no postpaid price.
          type:
          - string
          - 'null'
        completes_on_payment:
          type: boolean
        recurring_amount:
          type: string
        setup_amount:
          type: string
        billing_type:
          description: The payment timing of the selected price.
          type: string
          enum:
          - postpaid
          - prepaid
          - one_time
        tax_amount:
          description: Total tax after discounts, including any tax already included in the price.
          type: string
        tax_included_amount:
          description: The part of tax_amount already included in gross_amount; it is not charged again.
          type: string
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
          description: Which service this line belongs to.
        product:
          $ref: ./products.yaml#/components/schemas/Product
        plan_id:
          description: Which plan was bought.
          type: string
          format: uuid
        plan_name:
          description: |-
            What it was called when bought. It does not follow later catalogue renames and is
            not translated.
          type: string
        quantity:
          type: string
        unit_amount:
          description: |-
            The unit amount of the price this line is charged under. Absent for a tiered price, which has no
            single unit amount, and for a change that takes effect at once, which is charged as `gross_amount`
            describes.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        gross_amount:
          description: |-
            Before discounts: the price applied to the quantity, which for a per-unit price is `unit_amount`
            times `quantity`; a minimum charge can make it higher. For an upgrade that takes effect at once it is
            the new price minus the old price for the time left in the paid period, both at the subscription's
            own period price, and the period end does not move; a downgrade charges nothing and may refund the
            difference instead. A change between equal period prices charges and refunds nothing. The setup fee is not part of it; see `setup_amount`.

            Under an inclusive tax rate it includes tax, as the price does, and the included part is
            `tax_included_amount`. A renewal at the agreed terms is the exception: the agreed amount excludes
            tax, and tax is added to it.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: |-
            The reduction on this line: from the coupon the order uses and, for a renewal at the agreed terms,
            from the discount the subscription carries.

            A carried discount is part of the agreed amount. It is listed here, and `gross_amount` is then
            `unit_amount` times `quantity`, except in two cases where `gross_amount` is the agreed amount and
            the carried discount is already reflected in it: the renewal order also uses a coupon the account
            holds, or the account's tax rate is inclusive.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount:
          description: '`gross_amount` less `discount_amount`.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        period_start:
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/OrderItemStatus'
      required:
      - id
      - price_id
      - quantity
      - currency
      - plan_id
      - plan_name
      - billing_type
      - interval
      - completes_on_payment
      - status
    OrderItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    OrderCancel:
      type: object
      properties:
        order_item_ids:
          description: Omit to select all still-pending items. Explicit selections name one or more items of this order; successful items cannot be reversed here.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
