paths:
  /api/v1/subscriptions/{subscriptionId}/renewal-orders:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    post:
      summary: Create renewal order
      description: 'Places a renewal order with a draft invoice, without applying a new discount or charging anything.

        Pay its invoice to renew; a promotion code can be applied when paying. Existing subscription

        discount commitments are retained. The periods and price are chosen as for renewing. The order

        can be paid until the current paid period ends, and never after the end of the first period it renews; unpaid by

        then, it is canceled. While auto-renew is on, the renewal due at the end of the period pays

        this order instead of placing another, applying an applicable account discount first if the

        order''s terms are not fixed yet.


        Save `order_id` before submitting and read the order after an unknown outcome; creating it a

        second time conflicts.'
      operationId: create-renewal-order
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./subscriptions.yaml#/components/schemas/RenewalOrderRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: 'The order already exists, or the subscription has an operation in progress, refused with

            `BILLING_SUBSCRIPTION_OPERATION_PENDING`: a pending renewal, a change that is pending or paid and waiting

            to switch, an open cancellation or a committed reclaim.'
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders:
    get:
      summary: List orders
      description: 'Lists acceptance status and associated invoice amounts. A pending order is not yet accepted;

        its invoice shows whether it still needs payment. accepted means accepted, not delivered.

        Pending orders can expire at expires_at.'
      operationId: list-orders
      tags:
      - orders
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - $ref: ./openapi.yaml#/components/parameters/From
      - $ref: ./openapi.yaml#/components/parameters/To
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    get:
      summary: Get order
      description: Returns an order charged to an owned billing account with its commercial state and invoice reference. An
        unknown order returns 404; an order on another user account is forbidden.
      operationId: get-order
      tags:
      - orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/cancel:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    post:
      summary: Cancel order
      description: 'Cancels the selected, still-undelivered items of an unaccepted order without recording a

        delivery failure. Omit order_item_ids to select every still-pending item, or name one or

        more items. Successful items remain delivered and are not refunded. Whole-order and partial

        cancellation both require confirmed non-delivery and necessary cleanup. The order keeps

        its existing pending phase while any item is still pending; its final outcome follows all

        item outcomes. Previously failed items keep their failure outcome.


        Payment may be absent, partial or complete. Once the order''s terms are fixed, the selected items

        keep their agreed amounts and discounts; credit notes reduce issued invoices, and collected amounts

        are returned to their original payment sources. While the terms of a deferred order are not fixed,

        the remaining items are priced again. External payment-method refunds can finish asynchronously.
        An online payment still waiting for the payer is canceled with the order; one the gateway is
        already processing is refused with `BILLING_PAYMENT_PENDING` and `meta.transaction_id`.

        The order and financial history are retained; the same cancellation does not refund twice.


        Once the order is accepted, its owning service coordinates cancellation and confirms

        non-delivery and cleanup through the cancellation RPC. Delivered items are ended through

        subscription cancellation. Unknown delivery or payment outcomes are not refund evidence;

        in-flight or unknown payments must be reconciled first. Scheduled changes continue to be

        canceled through the owning service. Refund quotations use CreateQuote.refund.'
      operationId: cancel-order
      tags:
      - orders
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancel'
      responses:
        '200':
          description: The order after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order is accepted, its payment outcome is unresolved, or the scheduled change requires its owning
            service.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/items:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    get:
      summary: List order items
      description: One entry per item bought, with the price charged and the period it covers.
      operationId: list-order-items
      tags:
      - orders
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    OrderStatus:
      description: 'Follows the items. `pending` is not yet accepted and may be unpaid or paid; its invoice shows

        whether payment is still needed, and it can expire or be canceled. `accepted` is accepted with items still

        being set up. `completed` means every item was set up. `partially_completed` means some items were set up

        and the others failed or were canceled and were refunded to their original payment sources. `failed` means

        no item was delivered and at least one failed; collected amounts for the undelivered items are refunded.

        `canceled` means every item was withdrawn without delivery; collected amounts are returned to their original

        payment sources. No status establishes service delivery by itself.'
      type: string
      enum:
      - pending
      - accepted
      - completed
      - partially_completed
      - failed
      - canceled
    OrderItemStatus:
      description: '`pending` is waiting to be set up. `completed` was confirmed by the service.

        `failed` was not set up and its amount was refunded to the original payment sources.

        `canceled` was confirmed withdrawn without delivery; any collected amount is returned. A completed item is ended by
        canceling

        its subscription.'
      type: string
      enum:
      - pending
      - completed
      - failed
      - canceled
    Order:
      description: 'A recorded purchase with its invoice from placement; a zero-total invoice, such as for postpaid

        admission, is issued and paid at placement whatever the checkout mode. Until checkout_confirmed_at is set, the

        invoice is a draft at base prices: paying it fixes the discount and amount, issues it and collects it, and the

        order cannot be accepted before then. Coupon fields describe the discount fixed at that point and are absent

        before it; a quote never populates them. Payment and acceptance remain separate from resource delivery.'
      type: object
      properties:
        coupon_id:
          type: string
          format: uuid
        coupon:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        promotion_code_id:
          type: string
          format: uuid
        promotion_code:
          description: Code text frozen when the coupon was applied. Absent for an account discount.
          type: string
        invoice_id:
          description: The order's invoice, the same as invoice.id.
          type: string
          format: uuid
        invoice:
          $ref: ./invoices.yaml#/components/schemas/InvoiceSummary
        paid_with:
          description: How the order was paid. Absent until it is paid.
          allOf:
          - $ref: '#/components/schemas/PaidWith'
        account:
          $ref: ./accounts.yaml#/components/schemas/AccountIdentity
        change_effective_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        project_id:
          description: 'Which project it was bought for. Absent for a purchase made at account level, such

            as a membership.'
          type:
          - string
          - 'null'
          format: uuid
        project:
          description: 'The project and its current name, for display. Absent for a purchase at account level,

            and when the project no longer exists or its details cannot be read at the moment;

            `project_id` still identifies it then.'
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        billing_account_id:
          description: 'The billing account the order was placed with. It does not change when the project is later

            linked to another billing account. While this account is suspended or closed the order cannot

            be accepted, and the invoice of a change scheduled for the end of a period is not issued and the change is called off

            when the current period ends; such requests fail with BILLING_ACCOUNT_UNAVAILABLE.'
          type: integer
          format: int64
        currency:
          type: string
        type:
          description: '`new` buys, `renew` extends a prepaid subscription, `modify` changes a subscription''s
            configuration or billing terms.'
          type: string
          enum:
          - new
          - renew
          - modify
        status:
          $ref: '#/components/schemas/OrderStatus'
        change_effective:
          description: 'When a plan change takes effect. `none` on anything that is not a change.


            `period_end` orders stay pending until the first period at the new price is paid. That period

            is invoiced shortly before the current paid period ends and starts when it ends; if the

            invoice is still unpaid by then, the order is canceled and the subscription renews or ends as

            usual. Renewing in the meantime moves all of this along with it.'
          type: string
          enum:
          - none
          - immediate
          - period_end
        expires_at:
          description: Acceptance deadline. Pending orders can expire automatically.
          type:
          - string
          - 'null'
          format: date-time
        checkout_confirmed_at:
          description: 'When the discount and amount were fixed: at placement for automatic checkout and for a

            zero total, otherwise when the invoice was first paid. Null while a deferred order awaits payment.'
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        items:
          description: 'What was bought. Present on a single order and on every order in a list, so a list

            can be rendered without a further request per row.'
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - invoice_id
      - invoice
      - currency
      - type
      - status
      - items
      - created_at
    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    PaidWith:
      description: 'How it was paid. Removing the payment method afterwards does not change it; `payment_method_id`

        then names a removed payment method.'
      type: object
      properties:
        method_type:
          description: '`balance` when the account''s balance and credits covered it in full. Otherwise the method used

            with the gateway, such as `card`.'
          type: string
        payment_gateway:
          description: The gateway that collected it. Absent when `method_type` is `balance`.
          type: string
        payment_method_id:
          description: The saved payment method that was charged, when one was.
          type: string
          format: uuid
        brand:
          type: string
        last4:
          type: string
      required:
      - method_type
    PurchaseOperation:
      description: 'Which purchase operation this applies to. `new` covers every new purchase, including

        zero-charge purchases. It does not mean the account''s first purchase; use

        `first_purchase_only` for that restriction. `renew` covers renewals. `modify` covers

        configuration or billing-term changes, including changes that increase or decrease

        the amount due and changes with no additional charge or refund.'
      type: string
      enum:
      - new
      - renew
      - modify
    OrderItem:
      description: 'Frozen purchase terms. Monetary fields come from related invoice-line snapshots and are zero

        for a line with no immediate charge, such as postpaid admission. Later catalog changes do not reprice this line. A new service

        purchase creates its pending subscription when this item is recorded, not when payment succeeds.'
      type: object
      properties:
        invoice_item_ids:
          description: Financial lines produced by this purchase item, including setup charges.
          type: array
          items:
            type: string
            format: uuid
        position:
          type: integer
          minimum: 0
        configuration:
          type: object
          additionalProperties: true
        subscription_id:
          description: 'Stable Billing subscription ID. A new prepaid or postpaid service purchase returns the

            pending subscription here; renewals and changes reference the existing subscription, which

            keeps its ID. Absent for delivery without a subscription. This is not a business resource ID.'
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        termination_policy:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        refund_policy:
          $ref: ./prices.yaml#/components/schemas/RefundPolicy
        refund_monthly_amount:
          description: 'Prepaid items only: the plan''s one-month prepaid price for this item''s quantity before tax, frozen

            at purchase, used to value time used under a prorated refund or a downgrade. Null when the plan has

            no prepaid period shorter than the one bought.'
          type:
          - string
          - 'null'
        refund_hourly_amount:
          description: 'Prepaid items only: the plan''s postpaid hourly price for this item''s quantity before tax, frozen
            at

            purchase, used for time used short of a full month. Null when the plan has no postpaid price.'
          type:
          - string
          - 'null'
        recurring_amount:
          type: string
        setup_amount:
          type: string
        charge_type:
          description: The payment timing of the selected price.
          type: string
          enum:
          - postpaid
          - prepaid
          - one_time
        tax_amount:
          description: Total tax after discounts, including any tax already included in the price.
          type: string
        tax_included_amount:
          description: The part of tax_amount already included in gross_amount; it is not charged again.
          type: string
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
          description: Which service this line belongs to.
        product:
          $ref: ./products.yaml#/components/schemas/Product
        plan_id:
          description: Which plan was bought.
          type: string
          format: uuid
        plan_name:
          description: 'What it was called when bought. It does not follow later catalogue renames and is

            not translated.'
          type: string
        quantity:
          type: string
        unit_amount:
          description: 'The unit amount of the price this line is charged under. Absent for a tiered price, which has no

            single unit amount, and for a change that takes effect at once, which is charged as `gross_amount`

            describes.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        gross_amount:
          description: 'Before discounts: the price applied to the quantity, which for a per-unit price is `unit_amount`

            times `quantity`; a minimum charge can make it higher. For an upgrade that takes effect at once it is

            the new price minus the old price for the time left in the paid period, both at the subscription''s

            own period price, and the period end does not move; a downgrade charges nothing and may refund the

            difference instead. A change between equal period prices charges and refunds nothing. The setup fee is not part
            of it; see `setup_amount`.


            Under an inclusive tax rate it includes tax, as the price does, and the included part is

            `tax_included_amount`. A renewal at the agreed terms is the exception: the agreed amount excludes

            tax, and tax is added to it.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: 'The reduction on this line: from the coupon the order uses and, for a renewal at the agreed terms,

            from the discount the subscription carries.


            A carried discount is part of the agreed amount. It is listed here, and `gross_amount` is then

            `unit_amount` times `quantity`, except in two cases where `gross_amount` is the agreed amount and

            the carried discount is already reflected in it: the renewal order also uses a coupon the account

            holds, or the account''s tax rate is inclusive.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount:
          description: '`gross_amount` less `discount_amount`.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        period_start:
          description: The start of the service period this line paid for. Frozen at placement for renewals and
            period-end changes; for a prepaid line of a new purchase, fixed from the second its invoice is paid and kept
            when delivery is confirmed. Absent for postpaid and one-time lines.
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          description: The end of that service period, exclusive.
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/OrderItemStatus'
      required:
      - id
      - price_id
      - quantity
      - currency
      - plan_id
      - plan_name
      - charge_type
      - interval
      - status
    OrderItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    OrderCancel:
      type: object
      properties:
        order_item_ids:
          description: Omit to select all still-pending items. Explicit selections name one or more items of this order; successful
            items cannot be reversed here.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
