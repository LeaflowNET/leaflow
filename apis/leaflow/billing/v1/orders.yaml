paths:
  /api/v1/subscriptions/{subscriptionId}/renewal-orders:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    post:
      summary: Create renewal order
      description: |-
        Places a renewal order with a draft invoice, without applying a new discount or charging anything. Pay its
        invoice to renew; a promotion code can be applied when paying. Existing subscription discounts are kept.
        Periods and price are chosen as for renewing. The order can be paid until the current paid period ends, and
        never after the end of the first period it renews; unpaid by then, it is canceled. While auto-renew is on, the
        renewal due at the end of the period pays this order instead of placing another, applying an applicable
        account discount first if its terms are not fixed yet.

        Keep `order_id` and read the order after an unknown outcome; creating it again conflicts.
      operationId: create-renewal-order
      tags:
      - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./subscriptions.yaml#/components/schemas/RenewalOrderRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: 'The order already exists, or the subscription has an operation in progress, refused with `BILLING_SUBSCRIPTION_OPERATION_PENDING`: a pending renewal, a pending or paid change waiting to switch, an open cancellation or a committed reclaim.'
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders:
    get:
      summary: List orders
      description: Orders with their status and invoice amounts. A pending order is not yet accepted and can expire at expires_at; its invoice shows whether payment is needed. Accepted does not mean delivered.
      operationId: list-orders
      tags:
      - orders
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - $ref: ./openapi.yaml#/components/parameters/From
      - $ref: ./openapi.yaml#/components/parameters/To
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    get:
      summary: Get order
      description: An order of your billing account with its status and invoice. An unknown order returns 404; another user's order returns 403.
      operationId: get-order
      tags:
      - orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/cancel:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    post:
      summary: Cancel order
      description: |-
        Cancels the selected undelivered items of an order that has not been accepted, without recording a delivery
        failure. Omit order_item_ids to select every pending item. Delivered items stay delivered and are not
        refunded; failed items keep their outcome. The order stays pending while any item is pending, and its final
        status follows its items.

        Once the order's terms are fixed, the canceled items keep their agreed amounts and discounts: credit notes
        reduce the issued invoice, and collected amounts return to their original payment sources, possibly
        asynchronously. While a deferred order's terms are not fixed, the remaining items are priced again. An online
        payment waiting for the payer is canceled with the order; one the gateway is processing is refused with
        `BILLING_PAYMENT_PENDING` and `meta.transaction_id`. Repeating the cancellation does not refund twice.

        An accepted order is canceled by its owning service, and delivered items through subscription cancellation.
        Refunds are quoted with the quote operation's `refund` target.
      operationId: cancel-order
      tags:
      - orders
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancel'
      responses:
        '200':
          description: The order after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '409':
          description: The order is accepted, its payment outcome is unresolved, or the scheduled change must be called off by its owning service.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/orders/{orderId}/items:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/OrderId
    get:
      summary: List order items
      description: One entry per item bought, with the price charged and the period it covers.
      operationId: list-order-items
      tags:
      - orders
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    OrderStatus:
      description: 'Follows the items. `pending`: not yet accepted, paid or unpaid; its invoice shows whether payment is needed, and it can expire or be canceled. `accepted`: items are being set up. `completed`: every item was set up. `partially_completed`: some items were set up and the others failed or were canceled and refunded to their original payment sources. `failed`: no item was delivered and at least one failed; amounts collected for undelivered items are refunded. `canceled`: every item was withdrawn without delivery; collected amounts are returned to their original payment sources. No status by itself means the service was delivered.'
      type: string
      enum:
      - pending
      - accepted
      - completed
      - partially_completed
      - failed
      - canceled
    OrderItemStatus:
      description: '`pending`: waiting to be set up. `completed`: set up, as confirmed by the service. `failed`: not set up; its amount was refunded to the original payment sources. `canceled`: withdrawn without delivery; any collected amount is returned. A completed item ends when its subscription is canceled.'
      type: string
      enum:
      - pending
      - completed
      - failed
      - canceled
    Order:
      description: 'A recorded purchase with its invoice from placement; a zero-total invoice, such as for a metered purchase, is issued and paid at placement in either checkout mode. Until checkout_confirmed_at is set, the invoice is a draft at base prices: paying it fixes the discount and amount, issues it and collects it, and the order cannot be accepted before then. Coupon fields describe the discount fixed then and are absent before. Payment and acceptance do not mean the resources were delivered.'
      type: object
      properties:
        coupon_id:
          type: string
          format: uuid
        coupon:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        promotion_code_id:
          type: string
          format: uuid
        promotion_code:
          description: The promotion code applied. Absent for an account discount.
          type: string
        invoice_id:
          description: The order's invoice, the same as invoice.id.
          type: string
          format: uuid
        invoice:
          $ref: ./invoices.yaml#/components/schemas/InvoiceSummary
        paid_with:
          description: How the order was paid. Absent until it is paid.
          allOf:
          - $ref: '#/components/schemas/PaidWith'
        account:
          $ref: ./accounts.yaml#/components/schemas/AccountIdentity
        change_effective_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        project_id:
          description: The project it was bought for. Absent for an account-level purchase, such as a membership.
          type:
          - string
          - 'null'
          format: uuid
        project:
          description: The project and its current name. Absent for an account-level purchase or when the project cannot be read; `project_id` still identifies it.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        billing_account_id:
          description: The billing account the order was placed with, unchanged when the project is later linked to another account. While it is suspended or closed, the order cannot be accepted, and a period-end change's invoice is not issued and the change is called off when the current period ends; such requests fail with `BILLING_ACCOUNT_UNAVAILABLE`.
          type: integer
          format: int64
        currency:
          type: string
        type:
          description: '`new` buys, `renew` extends a licensed subscription, `modify` changes a subscription''s configuration or billing terms.'
          type: string
          enum:
          - new
          - renew
          - modify
        status:
          $ref: '#/components/schemas/OrderStatus'
        change_effective:
          description: When a plan change takes effect; `none` for anything that is not a change. A `period_end` order stays pending until the first period at the new price is paid. That period is invoiced shortly before the current paid period ends and starts when it ends; if the invoice is unpaid by then, the order is canceled and the subscription renews or ends as usual. A renewal in the meantime moves the change to the end of the renewed period.
          type: string
          enum:
          - none
          - immediate
          - period_end
        expires_at:
          description: Acceptance deadline; a pending order expires after it.
          type:
          - string
          - 'null'
          format: date-time
        checkout_confirmed_at:
          description: 'When the discount and amount were fixed: at placement for automatic checkout or a zero total, otherwise when the invoice was first paid. Null while a deferred order awaits payment.'
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        items:
          description: What was bought.
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - invoice_id
      - invoice
      - currency
      - type
      - status
      - items
      - created_at
    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    PaidWith:
      description: How it was paid. `payment_method_id` still names the payment method after it is removed.
      type: object
      properties:
        method_type:
          description: |-
            `balance` when the account's balance and credits covered it in full. Otherwise the method used
            with the gateway, such as `card`.
          type: string
        payment_gateway:
          description: The gateway that collected it. Absent when `method_type` is `balance`.
          type: string
        payment_method_id:
          description: The saved payment method that was charged, when one was.
          type: string
          format: uuid
        brand:
          type: string
        last4:
          type: string
      required:
      - method_type
    PurchaseOperation:
      description: 'The purchase operation covered. `new`: every new purchase, including zero-charge ones; it does not mean the account''s first purchase, which `first_purchase_only` restricts. `renew`: renewals. `modify`: configuration or billing-term changes, whether they charge, refund or neither.'
      type: string
      enum:
      - new
      - renew
      - modify
    OrderItem:
      description: The purchase terms frozen at placement. Monetary fields come from the order's invoice lines and are zero without an immediate charge, such as for a metered purchase. Later catalog changes do not reprice the line. A new service purchase has its pending subscription from placement.
      type: object
      properties:
        renewal_discounts_enabled:
          description: Whether new account discounts may apply to future renewals. A fixed operator renewal agreement disables automatic discounts; catalog repricing or a newly selected purchase agreement enables them.
          type: boolean
        invoice_item_ids:
          description: Financial lines produced by this purchase item, including setup charges.
          type: array
          items:
            type: string
            format: uuid
        position:
          type: integer
          minimum: 0
        configuration:
          type: object
          additionalProperties: true
        subscription_id:
          description: 'The Billing subscription: the new pending subscription of a recurring purchase, or the existing one renewed or changed, which keeps its ID. Absent for a purchase without a subscription.'
          type: string
          format: uuid
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        termination_policy:
          $ref: ./prices.yaml#/components/schemas/TerminationPolicy
        refund_policy:
          $ref: ./prices.yaml#/components/schemas/RefundPolicy
        refund_monthly_amount:
          description: 'Recurring licensed items only: the plan''s one-month licensed price for this item''s quantity, before tax and frozen at purchase, used to value time under a prorated refund or a downgrade. Null when the plan has no licensed period shorter than the one bought.'
          type:
          - string
          - 'null'
        refund_hourly_amount:
          description: Recurring licensed items only, the plan's metered hourly price for this item's quantity before tax, frozen at purchase, used for time used short of a full month. Null when the licensed price has no meter.
          type:
          - string
          - 'null'
        recurring_amount:
          type: string
        setup_amount:
          type: string
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          $ref: ./prices.yaml#/components/schemas/UsageType
        dimensions:
          description: The dimension values the line was bought with, such as region and instance type. Empty when the purchase gave none.
          type: object
          additionalProperties:
            type: string
        tax_amount:
          description: Total tax after discounts, including any tax already included in the price.
          type: string
        tax_included_amount:
          description: The part of tax_amount already included in gross_amount; it is not charged again.
          type: string
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
          description: Which service this line belongs to.
        product:
          $ref: ./products.yaml#/components/schemas/Product
        plan_id:
          description: Which plan was bought.
          type: string
          format: uuid
        plan_name:
          description: The name when bought.
          type: string
        quantity:
          type: string
        unit_amount:
          description: The unit amount of the price the line is charged under. Absent for a tiered price, and for an immediate change, which is charged as `gross_amount` describes.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        gross_amount:
          description: |-
            Before discounts and setup fees: the price applied to the quantity, `unit_amount` times `quantity` for a per-
            unit price, raised by any minimum charge. For an immediate upgrade it is the new price for the rest of the
            paid period minus the amount paid for that time; a downgrade, or a change between equal period prices, charges
            nothing.

            Under an inclusive tax rate it includes tax, shown in `tax_included_amount`, except for a renewal at agreed
            terms, whose amount excludes tax.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: 'The reduction on this line, from the order''s coupon and, for a renewal at agreed terms, from the subscription''s carried discount. With a carried discount, `gross_amount` is `unit_amount` times `quantity`, except when the renewal order also uses an account coupon or the tax rate is inclusive: then `gross_amount` is the agreed amount, which already reflects the carried discount.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount:
          description: '`gross_amount` less `discount_amount`.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        period_start:
          description: The start of the service period this line paid for. Fixed at placement for renewals and period-end changes, and for a licensed line of a new purchase when its invoice is paid. Absent for metered and one-time lines.
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          description: The end of that service period, exclusive.
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/OrderItemStatus'
      required:
      - id
      - price_id
      - quantity
      - currency
      - plan_id
      - plan_name
      - type
      - usage_type
      - dimensions
      - interval
      - status
    OrderItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    OrderCancel:
      type: object
      properties:
        order_item_ids:
          description: Omit to select all still-pending items. Explicit selections name one or more items of this order; successful items cannot be reversed here.
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
