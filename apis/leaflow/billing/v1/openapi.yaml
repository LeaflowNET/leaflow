  parameters:
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive.
      schema:
        type: string
        format: date-time
    AccountIdQuery:
      name: billing_account_id
      in: query
      required: false
      description: Restrict to one of your accounts. All of them when omitted.
      schema:
        type: integer
        format: int64
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CreditNoteId:
      name: creditNoteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CancellationId:
      name: cancellationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentMethodId:
      name: paymentMethodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 'The `ETag` from an earlier reply. When the catalogue has not changed since, the

        answer is `304` with no body.


        Send it on every catalogue read. An unchanged catalogue is answered without a body.'
      schema:
        type: string
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RateCardId:
      name: rateCardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromRequired:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ToRequired:
      name: to
      in: query
      required: true
      description: Exclusive. One month is `[2026-09-01, 2026-10-01)`.
      schema:
        type: string
        format: date-time
    ProjectIdsQuery:
      name: project_ids
      in: query
      required: false
      description: Restrict the account-authorized results to these projects. Omit for all projects and account-level records.
        This filter does not grant access to another billing account.
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          type: string
          format: uuid
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotModified:
      description: Unchanged since the `ETag` that was sent. No body.
      headers:
        ETag:
          description: The same entity tag that was sent.
          schema:
            type: string
