openapi: 3.1.0
info:
  title: Leaflow Billing API
  version: 2.0.0
  description: |-
    Billing for tenants: the public catalogue, the caller's own account, and what a project
    has spent.
security:
  - accountAuth: []

tags:
  - name: catalog
    description: What the platform sells and what it costs. No sign-in required.
  - name: accounts
    description: Billing accounts, balances, and which projects they pay for.
  - name: payments
    description: Adding funds, payment methods, and settling what is owed.
  - name: billing-history
    description: Invoices, transactions and where each amount went.
  - name: subscriptions
    description: What has been bought and when it renews.
  - name: entitlements
    description: Which capabilities are currently available.
  - name: allowances
    description: Included and purchased quantities, and what is left of them.
  - name: promotions
    description: Redeeming codes.
  - name: projects
    description: What one project has spent, and who pays for it.

paths:
  /catalog/v1/products:
    get:
      tags: [catalog]
      operationId: list-catalog-products
      summary: The services the platform sells
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogProductList' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Error' }

  /catalog/v1/products/{productId}/plans:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [catalog]
      operationId: list-catalog-plans
      summary: What can be bought under one service
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPlanList' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Error' }

  /catalog/v1/plans/{planId}/prices:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [catalog]
      operationId: list-catalog-prices
      summary: The ways one plan can be bought
      description: |-
        Public list prices only. An account holding a negotiated agreement may be charged less;
        it is never charged more.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: currency
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogPriceList' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Error' }

  /catalog/v1/rate-cards/{rateCardId}/rules:
    parameters:
      - $ref: '#/components/parameters/RateCardId'
    get:
      tags: [catalog]
      operationId: list-catalog-rates
      summary: The rates on a published price list
      description: |-
        Only public price lists are readable here. A list written for a single agreement is not,
        and its identifier cannot be used to reach it.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: meter_key
          in: query
          required: false
          schema: { type: string }
        - name: at
          in: query
          required: false
          description: Return the rates in effect at this moment. Defaults to now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogRateList' }
        '304': { $ref: '#/components/responses/NotModified' }
        default: { $ref: '#/components/responses/Error' }

  /catalog/v1/estimates:
    post:
      tags: [catalog]
      operationId: create-estimate
      summary: Estimate a purchase without signing in
      description: |-
        Uses public list prices. Nothing is reserved and nothing is recorded, so this may be
        called as often as required.

        `POST` is used because the set of items to price does not fit in a query string. There is
        no corresponding `GET`, and no estimate is stored to retrieve.

        An account holding a negotiated agreement may be charged less than this. Tax and
        discounts are not included.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/billing-accounts:
    get:
      tags: [accounts]
      operationId: list-billing-accounts
      summary: The billing accounts you own
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingAccountList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [accounts]
      operationId: create-billing-account
      summary: Open a billing account
      description: |-
        The currency is chosen here and cannot be changed afterwards. Everything charged to the
        account — prices, orders, invoices, balance — is denominated in it.

        One person may hold several accounts, for example a personal one and one for a team.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingAccountCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingAccount' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/billing-accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      operationId: get-billing-account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingAccount' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [accounts]
      operationId: update-billing-account
      summary: Change the account's details
      description: |-
        The legal name, address and tax identifier are copied onto each invoice when it is
        issued. Changing them here affects invoices issued afterwards, not those already sent.

        The currency cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingAccountUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingAccount' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/billing-accounts/{accountId}/balance:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [accounts]
      operationId: get-account-balance
      summary: What the account holds and what it can still spend
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountBalance' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/projects:
    get:
      tags: [accounts]
      operationId: list-paid-projects
      summary: The projects your accounts pay for
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: billing_account_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBindingList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/projects/{projectId}/billing-account:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [accounts]
      operationId: find-project-payer
      summary: Which account pays for a project
      description: Returns 404 when no account pays for it. No resources can be created until one does.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBinding' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [accounts]
      operationId: set-project-payer
      summary: Choose which account pays for a project
      description: |-
        Charges already recorded remain with the account that was paying when they occurred, and
        are still invoiced to it. Metered resources are settled up to the moment of the change.

        Periods already paid for are unaffected; renewals are charged to the new account.

        The request is refused while the current account has an unpaid invoice, and — once the
        project holds subscriptions — while the new account uses a different currency.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPayerSet' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectBinding' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [accounts]
      operationId: unbind-project-payer
      summary: Stop paying for a project
      description: |-
        Permitted only when the project has nothing left to charge: no resources accruing
        charges, no subscriptions still running, no usage awaiting invoicing, and no unpaid
        invoice on the account.

        Usage that has not yet been invoiced is settled by calling
        `POST /account/v1/projects/{projectId}/billing-account/settle` first.

        After this the project cannot create resources until an account is chosen again.
      responses:
        '204': { description: Unbound }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/projects/{projectId}/billing-account/settle:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [accounts]
      operationId: settle-project-usage
      summary: Invoice a project's outstanding usage now
      description: |-
        Metered usage is normally invoiced at the end of the month. This issues an invoice for
        everything charged to the project so far, to the account currently paying for it.

        Use it before unbinding a project, or to obtain a settled figure part-way through a
        month. Calling it again when nothing is outstanding has no effect.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettleResult' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/top-ups:
    get:
      tags: [payments]
      operationId: list-top-ups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUpList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [payments]
      operationId: create-top-up
      summary: Add funds to an account
      description: |-
        Returns a checkout address. The balance increases when the payment provider confirms the
        payment, which may be after this call returns.

        The amount is in the account's currency. A checkout page may present a local currency;
        the amount credited to the account is the one requested here.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopUpCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUp' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/top-ups/{topUpId}:
    parameters:
      - name: topUpId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [payments]
      operationId: get-top-up
      summary: Whether a payment has completed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUp' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/payment-methods:
    get:
      tags: [payments]
      operationId: list-payment-methods
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethodList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/payment-methods/setup:
    post:
      tags: [payments]
      operationId: create-payment-method-setup
      summary: Begin adding a payment method
      description: |-
        Returns what is needed to hand the browser over to the payment provider's own card
        form. Nothing is charged, and the method appears in the list once the provider
        confirms it.

        Card numbers are never sent to or stored by this service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentMethodSetup' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethodSetupResult' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/payment-methods/{paymentMethodId}/default:
    parameters:
      - $ref: '#/components/parameters/PaymentMethodId'
    put:
      tags: [payments]
      operationId: set-default-payment-method
      summary: Choose which method is used automatically
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentMethod' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/payment-methods/{paymentMethodId}:
    parameters:
      - $ref: '#/components/parameters/PaymentMethodId'
    delete:
      tags: [payments]
      operationId: delete-payment-method
      summary: Remove a payment method
      description: |-
        Refused when it is the only method on an account that has resources billed by the hour,
        as there would be nothing left to charge when the balance runs out.
      responses:
        '204': { description: Removed }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/invoices/{invoiceId}/pay:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [payments]
      operationId: pay-invoice
      summary: Pay an outstanding invoice
      description: |-
        Applies the account balance first, then charges the remainder to a payment method. Give
        `payment_method_id` to choose one, or omit it to use the default.

        Returns a checkout address when the provider requires the cardholder to confirm the
        payment; the invoice is marked paid once the provider confirms it.

        Calling this on an invoice that is already paid returns the invoice unchanged.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/payments:
    post:
      tags: [payments]
      operationId: pay-together
      summary: Pay several outstanding invoices and orders at once
      description: |-
        All of them or none. Nothing is settled unless everything named here can be, so a
        partial result is not a state this can leave behind.

        The balance is not split across the two cases: either it covers the whole total and
        everything is settled from it, or it is left untouched and the full total is collected
        through the provider. It is never partly spent against an unpaid remainder.

        When the provider is needed, this returns a checkout address and settles nothing.
        Call it again once the payment has landed — the balance then covers the total and the
        same call settles everything.

        Anything already paid is skipped rather than refused, so a repeated call after a
        partial success is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayTogetherRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/orders/{orderId}/pay:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [payments]
      operationId: pay-order
      summary: Complete payment for an order
      description: |-
        Use this to resume an order whose checkout was interrupted.

        An order reserves both funds and stock for a limited time. Once that reservation expires
        the order can no longer be paid and must be placed again; `reservation_expires_at` on the
        order states when.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/invoices:
    get:
      tags: [billing-history]
      operationId: list-invoices
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/invoices/{invoiceId}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [billing-history]
      operationId: get-invoice
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/invoices/{invoiceId}/items:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [billing-history]
      operationId: list-invoice-items
      summary: What an invoice is made up of
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceItemList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/invoices/{invoiceId}/refund-quote:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [billing-history]
      operationId: get-invoice-refund-quote
      summary: What refunding this invoice would give back
      description: |-
        Show this before asking for a refund. Nothing is recorded and nothing is reserved; the
        answer follows from what has been paid and what has already been returned, so it may
        be read as often as required.

        `refundable_amount` is `"0"` once nothing is left, which is also the answer for an
        invoice already refunded in full.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundQuote' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/transactions:
    get:
      tags: [billing-history]
      operationId: list-transactions
      summary: Every movement of funds on the account
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/credit-grants:
    get:
      tags: [billing-history]
      operationId: list-credit-grants
      summary: Credit and vouchers held on the account
      description: |-
        Each grant shows what remains and what it may be used for. Credit is spent before cash
        and cannot be withdrawn.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, depleted, expired, voided] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditGrantList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/allocations:
    get:
      tags: [billing-history]
      operationId: list-allocations
      summary: Where each amount went
      description: |-
        Give `source_id` to follow one top-up or grant through to everything it paid for. Give
        `target_id` to see which sources paid for one line of an invoice.

        Give `source_type` on its own to separate what cash paid for from what granted credit
        paid for.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: source_type
          in: query
          required: false
          description: |-
            `transaction` is money paid in, `credit_grant` is granted credit or a voucher.
          schema: { type: string, enum: [transaction, credit_grant] }
        - name: source_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: target_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/refunds:
    post:
      tags: [account]
      operationId: request-refund
      summary: Ask for a refund
      description: |-
        Refunding ends the subscription and reclaims whatever it provisioned. That is the
        difference from letting a period lapse: a lapsed period keeps the machine around
        for a while so that topping up brings it back, whereas a refund returns the money
        and therefore cannot leave the thing running.

        What can be refunded, for how long, and how much, is decided here rather than by
        the caller. A request outside those bounds is refused with the reason.

        The money goes back the way it came: card charges to the card, balance to the
        balance, credit to credit. A grant never turns into cash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundRequest' }
      responses:
        '201':
          description: Accepted for processing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [billing-history]
      operationId: list-refunds
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/usage-charges:
    get:
      tags: [billing-history]
      operationId: list-usage-charges
      summary: Metered charges, line by line
      description: |-
        Includes charges that have not been invoiced yet, which is how the current month's
        spending is seen before the invoice is issued.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: project_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: product_key
          in: query
          required: false
          description: 'Restrict to one service, such as `compute`.'
          schema: { type: string }
        - name: resource_id
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageChargeList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/subscriptions:
    get:
      tags: [subscriptions]
      operationId: list-subscriptions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: project_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/subscription-items:
    get:
      tags: [subscriptions]
      operationId: list-subscription-items
      summary: What has been bought, and when each renews
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: project_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: expiring_before
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionItemList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/subscription-items/{itemId}/renew:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [subscriptions]
      operationId: renew-subscription-item
      summary: Renew now rather than waiting for the renewal date
      description: |-
        Extends the paid period from its current end, not from today, so renewing early does not
        shorten what has already been paid for.

        The price charged is the one in effect at the moment of renewal, which may differ from
        what was paid for the current period.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenewRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResult' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/subscription-items/{itemId}/auto-renew:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    put:
      tags: [subscriptions]
      operationId: set-auto-renew
      summary: Turn automatic renewal on or off
      description: |-
        When on, the account balance is charged at the renewal date. Turning it off lets the
        current period run to its end and stops the resource afterwards.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoRenewSet' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionItem' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/codes/preview:
    post:
      tags: [promotions]
      operationId: preview-code
      summary: Check what a code would give you
      description: |-
        Nothing is recorded and the code is not consumed. Use it to show the customer the effect
        before they commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodePreview' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/codes/redeem:
    post:
      tags: [promotions]
      operationId: redeem-code
      summary: Redeem a code
      description: |-
        A voucher code adds credit to the account. A discount code records the entitlement, which
        is then applied to the next qualifying purchase.

        A code that has already been redeemed by this account is refused rather than redeemed a
        second time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeRedeem' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeRedeemResult' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/billing-account:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: get-project-billing-account
      summary: Who pays for this project, and how much is left
      description: |-
        A deliberately narrow view: the payer's identity, its currency, and how much can still
        be spent. Cards, invoices and transaction history are not included; they belong to the
        account owner and are reached through `/account/v1/`.

        Returns 404 when no account pays for this project. Resources cannot be created in that
        state.
      security:
        - projectAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPayer' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/spend:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-spend
      summary: What this project spent, grouped
      description: |-
        Covers a closed time range. Both bounds are required: a total without a stated period
        cannot be reconciled against an invoice.

        Includes usage that has not been invoiced yet.
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: group_by
          in: query
          required: false
          schema: { type: string, enum: [product, plan, resource], default: product }
          description: |-
            `resource` groups by the resource each charge names. Items billed under their own
            identifier — a disk, a public address — appear as their own rows rather than under
            the machine they are attached to, since the relationship between them is known to
            the owning service and not here.
        - name: product_key
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpendRowList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/usage-charges:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-usage-charges
      summary: Metered charges for this project, line by line
      description: |-
        The individual charges behind the figures in `/spend`. Amounts here sum to the totals
        reported there over the same period.
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: resource_id
          in: query
          required: false
          schema: { type: string }
        - name: product_key
          in: query
          required: false
          description: |-
            Restrict to one service, such as `compute`. Give it alongside `meter_key`: a meter
            name is unique only within its own service, and more than one service may measure
            `traffic_bytes`, so `meter_key` on its own can return charges from several.
          schema: { type: string }
        - name: meter_key
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageChargeList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/subscriptions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-subscriptions
      summary: Which services this project has enabled
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/subscription-items:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-subscription-items
      summary: What this project has bought, and when each renews
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: expiring_before
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionItemList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/subscription-items/{itemId}/auto-renew:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ItemId'
    put:
      tags: [projects]
      operationId: set-project-auto-renew
      summary: Turn automatic renewal on or off
      description: |-
        Automatic renewal draws on the paying account's balance, which a project member may
        commit. Paying by card requires the account owner and is done from the billing centre.
      security:
        - projectAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutoRenewSet' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionItem' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/orders:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-orders
      summary: Purchases made for this project
      description: |-
        An order awaiting payment shows what is outstanding. Paying it is done from the billing
        centre by the account owner.
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderState' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [projects]
      operationId: get-project-order
      security:
        - projectAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/active-resources:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-active-resources
      summary: What is accruing charges right now
      description: |-
        A resource that is running but does not appear here is not being charged for.
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: resource_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActiveResourceList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/quotes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: create-project-quote
      summary: Price a purchase before making it
      description: |-
        Priced in the paying account's currency, and at any rate negotiated for that account.
        Nothing is reserved and nothing is recorded, so this may be called as often as required.

        Prices may change between quoting and ordering. An order is charged at the price in
        effect when it is placed, so a quote should be refreshed before a final confirmation is
        shown.

        Returns 404 when no account pays for this project.
      security:
        - projectAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/allowances:
    get:
      tags: [allowances]
      operationId: list-allowances
      summary: Included and purchased quantities, and what is left
      description: |-
        A quantity rather than an amount of money: bytes, seconds or tokens that are used before
        anything is charged for.

        Usage draws on these first and is only charged once they are exhausted. Where several
        apply, they are drawn on in a fixed order: lower `priority` first, then whichever
        expires soonest, then whichever was granted first. Included quantities therefore go
        before purchased packs, and a pack that is about to expire goes before one that is not.

        An unused quantity is lost when it expires; it is not refunded and does not carry over.

        Quantities belong to the account and are shared by every project it pays for.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: meter_key
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, depleted, expired, voided] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowanceList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/allowances/{allowanceId}/consumptions:
    parameters:
      - name: allowanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [allowances]
      operationId: list-allowance-consumptions
      summary: What has been used from one quantity
      description: |-
        Each entry names the charge it covered, so the granted amount, what has been used and
        what remains all reconcile.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowanceConsumptionList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/orders:
    get:
      tags: [billing-history]
      operationId: list-orders
      summary: Purchases made against your accounts
      description: |-
        An order in `pending` still owes money; `amount_due` states how much and
        `reservation_expires_at` states how long it can still be paid.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: project_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: state
          in: query
          required: false
          schema: { $ref: '#/components/schemas/OrderState' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [billing-history]
      operationId: get-order
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [orders]
      operationId: cancel-scheduled-change
      summary: Call off a plan change that has not taken effect yet
      description: |-
        Only for a change scheduled for the end of the period, and only while it is still
        pending. An immediate change has already happened by the time it is placed, and there is
        nothing to call off.

        Nothing was charged or returned when it was scheduled, so nothing moves here either. The
        subscription keeps running on what it is on now, and the item is free to be changed again.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/orders/{orderId}/items:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [billing-history]
      operationId: list-order-items
      summary: What an order is made up of
      description: |-
        One entry per item bought, with the price charged and the period it covers.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderItemList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/orders/{orderId}/refund-quote:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [billing-history]
      operationId: get-order-refund-quote
      summary: What refunding this order would give back
      description: |-
        Show this before asking for a refund. Nothing is recorded and nothing is reserved; the
        answer follows from what has been paid and what has already been returned, so it may
        be read as often as required.

        `refundable_amount` is `"0"` once nothing is left, which is also the answer for an
        order already refunded in full.

        Refunding an order also ends what it bought and reclaims whatever it provisioned. That
        is not reflected in the amounts here.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundQuote' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/orders/{orderId}/items:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [projects]
      operationId: list-project-order-items
      summary: What an order is made up of
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderItemList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/allowances:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-allowances
      summary: Quantities this project can draw on
      description: |-
        These belong to the paying account and are shared with every other project it pays for,
        so what is left here may be consumed elsewhere.
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: meter_key
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllowanceList' }
        default: { $ref: '#/components/responses/Error' }

  /account/v1/entitlements:
    get:
      tags: [entitlements]
      operationId: list-entitlements
      summary: What your accounts can currently use
      description: |-
        Capabilities that come with what has been bought. A capability that is not held simply
        does not appear, so that "this does not exist" and "this has not been bought" cannot be
        confused.

        Derived from live subscriptions rather than stored, so this always agrees with what is
        being paid for. It stops being listed as soon as the subscription providing it ends.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/AccountIdQuery'
        - name: project_id
          in: query
          required: false
          description: |-
            Restrict to one project. Anything bought at account level, such as a membership,
            appears regardless.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/projects/{projectId}/entitlements:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: list-project-entitlements
      summary: What this project can currently use
      description: |-
        Includes capabilities bought for this project and those the paying account holds at
        account level.

        Where a capability counts uses, `remaining_quantity` states how much is left. Whether
        exceeding it refuses the request or simply continues to be charged for is decided by
        the service that owns the capability.
      security:
        - projectAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: product_key
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntitlementList' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    accountAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/AccessToken
    projectAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |-
        The `ETag` from an earlier reply. When the catalogue has not changed since, the
        answer is `304` with no body.

        Worth sending on every catalogue read: the listings are public, unauthenticated and
        cached at the edge, so a repeat read costs one round trip and no transfer.
      schema: { type: string }
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number; the first page when omitted.
      schema: { type: integer, format: int32, minimum: 1 }
    PageSize:
      name: page_size
      in: query
      required: false
      description: How many per page, 100 at most.
      schema: { type: integer, format: int32, minimum: 1, maximum: 100 }
    From:
      name: from
      in: query
      required: false
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      description: Exclusive.
      schema: { type: string, format: date-time }
    AccountIdQuery:
      name: billing_account_id
      in: query
      required: false
      description: Restrict to one of your accounts. All of them when omitted.
      schema: { type: integer, format: int64 }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      name: planId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RateCardId:
      name: rateCardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentMethodId:
      name: paymentMethodId
      in: path
      required: true
      schema: { type: string, format: uuid }

    FromRequired:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
    ToRequired:
      name: to
      in: query
      required: true
      description: Exclusive. One month is `[2026-09-01, 2026-10-01)`.
      schema: { type: string, format: date-time }
  responses:
    NotModified:
      description: |-
        Unchanged since the `ETag` that was sent. No body.
      headers:
        ETag:
          description: The same entity tag that was sent.
          schema: { type: string }
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error

    Translations:
      type: object
      additionalProperties: { type: string }
      description: |-
        Names in other languages, keyed by BCP 47 language tag. Where your locale is absent, use
        the plain `name`; there is no fallback between related tags.

    Money:
      type: string
      description: A decimal string, in the currency stated alongside it.
      example: "10.2500000000"

    CatalogProduct:
      type: object
      required: [id, lookup_key, name]
      properties:
        id: { type: string, format: uuid }
        lookup_key: { type: string }
        name: { type: string }
        name_translations: { $ref: '#/components/schemas/Translations' }
        description: { type: string }
        description_translations: { $ref: '#/components/schemas/Translations' }

    CatalogProductList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogProduct' }
        total_count: { type: integer, format: int64 }

    CatalogPlan:
      type: object
      required: [id, product_id, lookup_key, name]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        lookup_key: { type: string }
        name: { type: string }
        name_translations: { $ref: '#/components/schemas/Translations' }
        description: { type: string }
        description_translations: { $ref: '#/components/schemas/Translations' }

    CatalogPlanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogPlan' }
        total_count: { type: integer, format: int64 }

    CatalogPrice:
      type: object
      required: [id, plan_id, currency, type, billing_scheme]
      properties:
        id: { type: string, format: uuid }
        plan_id: { type: string, format: uuid }
        currency: { type: string }
        type:
          type: string
          enum: [metered, prepaid, one_time]
          description: |-
            `metered` charges for what is used, `prepaid` buys a period in advance, `one_time`
            charges once.
        billing_scheme:
          type: string
          enum: [per_unit, tiered, rated]
          description: |-
            How the amount is arrived at. `rated` means the rate depends on attributes such as
            region or machine type, and is looked up on a price list.
        unit_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Present for `per_unit`.
        tiers_mode:
          type: string
          enum: [none, graduated, volume]
          description: |-
            `none` for a price that is not tiered, which is most of them.

            Otherwise `graduated` charges each band at its own rate, and `volume` charges
            everything at the rate of the band the total falls in.
        tiers:
          type: array
          description: Present for `tiered`, in ascending order.
          items: { $ref: '#/components/schemas/Tier' }
        rate_card_id:
          type: string
          format: uuid
          description: For `rated` prices, the price list the rates are read from.
        allowances:
          type: array
          description: |-
            Quantities included when this price is bought — the traffic or requests that are
            used before anything is charged for.
          items: { $ref: '#/components/schemas/IncludedAllowance' }
        features:
          type: array
          description: Capabilities that buying this price makes available.
          items: { $ref: '#/components/schemas/IncludedFeature' }
        term: { type: integer, description: For prepaid prices, how many periods one purchase covers. }
        period: { type: string, enum: [none, day, month, year] }
        setup_fee: { $ref: '#/components/schemas/Money' }

    CatalogPriceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogPrice' }
        total_count: { type: integer, format: int64 }

    CatalogRate:
      type: object
      required: [meter_key, dimensions, pricing_model, currency, effective_from]
      properties:
        meter_key: { type: string, description: What is being measured. }
        unit: { type: string, description: 'The unit readings arrive in, such as `core-second`.' }
        dimensions:
          type: object
          additionalProperties: { type: string }
          description: The attributes this rate applies to, such as region and machine type.
        pricing_model:
          type: string
          enum: [per_unit, graduated, volume]
        unit_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Present for `per_unit`. Tiered rates carry their amounts on the tiers.
        tiers:
          type: array
          description: Present for `graduated` and `volume`, in ascending order.
          items: { $ref: '#/components/schemas/Tier' }
        unit_quantity:
          type: string
          description: |-
            How many measured units one amount covers. An hourly rate on a per-second meter is
            `"3600"`.
        currency: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }

    CatalogRateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogRate' }
        total_count: { type: integer, format: int64 }

    QuoteLine:
      type: object
      required: [quantity]
      description: |-
        Identify what to price either by `price_id`, or by `product_key` together with
        `service_product_id`. Supplying both, or neither, is refused.
      properties:
        price_id: { type: string, format: uuid }
        product_key: { type: string, description: 'The service, such as `compute`.' }
        service_product_id:
          type: string
          description: How the owning service identifies the item, such as a machine type.
        meter_key:
          type: string
          description: |-
            Required for a metered price whose price list covers more than one meter, so that
            the intended one is unambiguous.
        dimensions:
          type: object
          additionalProperties: { type: string }
          description: |-
            The attributes the price depends on — region, instance type, token class.

            Required when the price draws its rates from a price list, which is how anything
            sold by region or by machine type is priced. A price that carries a single unit
            amount, or a ladder, has no attributes to give and takes none.

            Every attribute the meter declares must be present. A combination with no rate
            covering it is refused rather than priced at zero.
        price_type:
          type: string
          enum: [metered, prepaid, one_time]
          description: |-
            Which way of buying. Required when the item is sold in more than one way — the
            same item may be offered metered, prepaid and as a one-off pack, and the pair
            `product_key` + `service_product_id` names only the item, not the way.

            Omit it when the item is sold one way only. If what is given matches no price, or
            still leaves more than one candidate, the request is refused rather than resolved
            by guessing.
        billing_period:
          type: string
          description: |-
            For prepaid items, such as `1_month` or `1_year`. Required when the item is offered
            for more than one period.
        quantity: { type: string }
        duration_seconds:
          type: integer
          format: int64
          description: |-
            For metered items, how long to price for. This allows an estimate such as "about
            this much per month" to be shown before anything exists.

    QuoteChange:
      type: object
      description: |-
        Price a change to something already running, rather than a new purchase.

        The result states what is still owed for the period already paid for, what the new
        configuration costs for the remainder, and the difference in either direction.
      required: [subscription_item_id]
      properties:
        subscription_item_id:
          type: string
          format: uuid
          description: What is being changed.
        price_id:
          type: string
          format: uuid
          description: |-
            The price to move to. Identify it here, or by `service_product_id` below. Supplying
            both, or neither, is refused.
        service_product_id: { type: string }
        quantity:
          type: string
          description: The new quantity. The current one is kept when omitted.
        effective_at:
          type: string
          format: date-time
          description: |-
            When the change would take effect. Defaults to now. Charging is split at this
            moment: before it at the old configuration, after it at the new one.

    QuoteRequest:
      type: object
      additionalProperties: false
      description: |-
        Give `lines` to price new purchases, or `changes` to price alterations to what is
        already running. Both may appear in one request; the total covers everything.
      properties:
        lines:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/QuoteLine' }
        changes:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/QuoteChange' }

    EstimateRequest:
      type: object
      additionalProperties: false
      required: [currency, lines]
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: Must be one the catalogue publishes.
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/QuoteLine' }

    QuoteLineResult:
      type: object
      required: [index, priced, currency]
      properties:
        index: { type: integer, description: Which line of the request this answers. }
        priced:
          type: boolean
          description: |-
            Whether a price was found for this line. Read this before anything else.

            A single item with no price no longer fails the whole request. A catalogue
            almost always has something not yet priced, and refusing the request would
            leave no way to render a list in which a few entries are simply not on sale.

            When false, `price_id`, `unit_amount` and `amount` are absent and
            `unpriced_reason` states what is missing.
        unpriced_reason:
          type: string
          enum: [none, no_price, no_rate_card, no_meter, no_dimensions, no_effective_rule]
          description: |-
            Why no price was found; `none` while `priced` is true.

            The last four are told apart because their remedies differ: the price points
            at no price list, the list holds no rate for that meter, that exact combination
            of attributes is not configured, or it is configured but nothing is in effect
            at the moment asked about.
        price_id:
          type: string
          format: uuid
          description: |-
            The price selected. Returned whenever `priced` is true, including when the
            request identified the item indirectly, so that the choice can be confirmed.
        plan_name: { type: string }
        unit_amount: { $ref: '#/components/schemas/Money' }
        quantity: { type: string }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Not rounded. Round only for display.
        currency: { type: string }

    QuoteChangeResult:
      type: object
      required: [index, subscription_item_id, price_id, payable_now, refundable_amount, currency]
      properties:
        index: { type: integer }
        subscription_item_id: { type: string, format: uuid }
        price_id:
          type: string
          format: uuid
          description: The price that would apply. Always returned.
        plan_name: { type: string }
        unused_credit:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What remains unused of the period already paid for, valued at the price it was
            bought at rather than at today's price.
        new_charge:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What the new configuration costs for the rest of that period.
        payable_now:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What would be owed. Zero when the change reduces the price; the difference then
            appears in `refundable_amount`.
        refundable_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What would be returned. It goes back to the sources that originally paid rather
            than being offset against `payable_now`, so that a purchase made with credit is
            refunded as credit.
        period_end:
          type: string
          format: date-time
          description: |-
            When the current period ends. A change does not move it; the next renewal is
            charged at the new price.
        currency: { type: string }

    Quote:
      type: object
      required: [currency]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/QuoteLineResult' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/QuoteChangeResult' }
        total:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
          description: |-
            What would be owed in total. Amounts to be returned are not netted off it.

            Null when any line could not be priced. What would be owed is not knowable then, and a
            total that silently left the unpriced lines out would read as a smaller bill rather than
            an incomplete one — the per-line `priced` flag is easy to skip, a missing total is not.
        total_refundable:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What would be returned in total.
        currency: { type: string }

    BillingAccount:
      type: object
      required: [id, currency, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: What you call this account. }
        legal_name:
          type: string
          description: |-
            The name invoices are made out to. Copied onto each invoice when it is issued.
        email: { type: string, description: Where invoices are sent. }
        address_line1: { type: string }
        address_line2: { type: string }
        address_city: { type: string }
        address_state: { type: string }
        address_postal_code: { type: string }
        address_country: { type: string, description: Two-letter code. }
        tax_id: { type: string }
        currency: { type: string, description: Fixed when the account was opened. }
        status: { type: string, enum: [active, suspended, closed] }
        grace_amount:
          type: string
          description: |-
            How far past the suspension threshold this account may go before its resources are
            suspended. "0" means none: the account is suspended as soon as it crosses the threshold.
        grace_period_seconds:
          type: integer
          format: int64
          description: |-
            How long this account has to top up after crossing the suspension threshold.
            0 means none. Whichever runs out first — this or grace_amount — ends the grace.
        created_at: { type: string, format: date-time }

    BillingAccountCreate:
      type: object
      additionalProperties: false
      required: [currency]
      properties:
        currency: { type: string, minLength: 3, maxLength: 3 }
        name: { type: string, maxLength: 255 }
        legal_name: { type: string, maxLength: 255 }
        email: { type: string, maxLength: 255 }

    BillingAccountUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 255 }
        legal_name: { type: string, maxLength: 255 }
        email: { type: string, maxLength: 255 }
        address_line1: { type: string, maxLength: 255 }
        address_line2: { type: string, maxLength: 255 }
        address_city: { type: string, maxLength: 128 }
        address_state: { type: string, maxLength: 128 }
        address_postal_code: { type: string, maxLength: 32 }
        address_country: { type: string, minLength: 2, maxLength: 2 }
        tax_id: { type: string, maxLength: 64 }

    BillingAccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BillingAccount' }
        total_count: { type: integer, format: int64 }

    AccountBalance:
      type: object
      required: [billing_account_id, currency, cash, held, accrued, credit, voucher, spendable]
      properties:
        billing_account_id: { type: integer, format: int64 }
        currency: { type: string }
        cash:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Funds paid in and not yet spent. This is the part that can be refunded.
        held:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Reserved by orders that have not completed.
        accrued:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            Metered usage priced this month but not yet invoiced. It is already committed even
            though no invoice exists for it yet.
        credit:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Granted credit. Spendable, but not withdrawable.
        voucher:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Voucher balance, spendable within each voucher's own scope.
        spendable:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            `cash` less `accrued` and `held` — what is actually available at checkout. It goes
            negative when usage has exceeded the balance. Credit and vouchers are shown
            separately because each can only pay for what it covers.

    ProjectBinding:
      type: object
      required: [project_id, billing_account_id, currency, effective_from]
      properties:
        project_id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        account_name: { type: string }
        currency: { type: string }
        effective_from: { type: string, format: date-time }
        effective_to: { type: string, format: date-time, nullable: true }

    ProjectBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProjectBinding' }
        total_count: { type: integer, format: int64 }

    ProjectPayerSet:
      type: object
      additionalProperties: false
      required: [billing_account_id]
      properties:
        billing_account_id: { type: integer, format: int64 }

    ProjectPayer:
      type: object
      required: [billing_account_id, name, currency, spendable_amount, status]
      description: |-
        A narrow view of the paying account, restricted to what a project member needs in order
        to know whether the project's resources will keep running.
      properties:
        billing_account_id:
          type: integer
          format: int64
          description: Identifies the payer. Use it to link into the billing centre.
        name: { type: string }
        currency:
          type: string
          description: |-
            Everything this project is charged is in this currency, and it cannot change while
            the account exists.
        spendable_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What remains to be spent. It already accounts for this month's uninvoiced usage, so
            it is what will be available at checkout rather than the cash figure shown in the
            billing centre. It goes negative when usage has exceeded the balance.
        status:
          type: string
          enum: [active, past_due, suspended]
          description: |-
            `active` — nothing is owed. `past_due` — the account owes money and resources are
            still running. `suspended` — resources have been stopped for non-payment.
        suspends_at:
          type: string
          format: date-time
          nullable: true
          description: |-
            When this project's resources will be stopped unless the account is topped up.
            Absent while `status` is `active`.

    SettleResult:
      type: object
      required: [invoiced_amount, currency]
      properties:
        invoice_id: { type: string, format: uuid, nullable: true }
        invoiced_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Zero when there was nothing outstanding, in which case no invoice is created.
        currency: { type: string }

    TopUp:
      type: object
      required: [id, billing_account_id, amount, currency, status, created_at]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What is credited to the account, in the account's own currency.
        currency: { type: string }
        remaining_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            How much of this top-up has not been spent yet. This is the part that can still be
            returned to where it was paid from.
        status:
          type: string
          enum: [pending, succeeded, failed]
          description: |-
            `pending` until the payment provider confirms. The balance increases on `succeeded`.

            A checkout the payer abandoned ends up `failed` too, with `failure_reason` saying
            so. Nothing was charged in that case.
        provider: { type: string, description: Which payment provider collected it. }
        presentment_currency:
          type: string
          description: |-
            The currency the payer was actually charged in, when the checkout page collected a
            local one. Absent when it was the same as the account's.
        presentment_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What was charged, in `presentment_currency`. It will not equal `amount`, and it is
            the figure that appears on the payer's card or wallet statement.
        failure_reason:
          type: string
          description: Why it did not go through. Present with `failed`.
        checkout_url:
          type: string
          description: Where the payer completes the payment. Absent once it has completed.
        created_at: { type: string, format: date-time }
        settled_at:
          type: string
          format: date-time
          nullable: true
          description: |-
            When the funds arrived. Later than `created_at` — by days for a bank transfer — so
            reconciling against a statement uses this rather than the moment it was started.
            Absent until the payment completes.

    TopUpCreate:
      type: object
      additionalProperties: false
      required: [billing_account_id, amount, idempotency_key]
      properties:
        billing_account_id: { type: integer, format: int64 }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            In the account's currency, and no finer than that currency's smallest unit:
            two decimals for most, none for the yen. A finer amount is refused here rather
            than at the checkout page, where the payer would see the provider's own wording
            instead of an explanation.

            There is a minimum, which differs by currency. Below it the provider's fee
            exceeds the top-up itself, so such a payment costs more to accept than it brings.
            The minimum in force is returned with the rejection.
        payment_method_id:
          type: string
          format: uuid
          description: Charge a saved method instead of opening a checkout page.
        return_url: { type: string, description: Where to send the payer after checkout. }
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
          description: |-
            Retrying with the same key returns the original top-up rather than starting a
            second one.

    TopUpList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TopUp' }
        total_count: { type: integer, format: int64 }

    PaymentMethod:
      type: object
      required: [id, billing_account_id, provider, is_default, status]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        provider: { type: string }
        brand: { type: string }
        last4: { type: string }
        exp_month: { type: integer, nullable: true }
        exp_year: { type: integer, nullable: true }
        is_default: { type: boolean }
        status: { type: string, enum: [active, expired, removed] }

    PaymentMethodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PaymentMethod' }
        total_count: { type: integer, format: int64 }

    PaymentMethodSetup:
      type: object
      additionalProperties: false
      required: [billing_account_id]
      properties:
        billing_account_id: { type: integer, format: int64 }
        return_url: { type: string }

    PaymentMethodSetupResult:
      type: object
      required: [setup_id, client_secret, publishable_key]
      description: |-
        What the payment provider's browser library needs in order to collect a card. There is
        no address to redirect to: the form is rendered in the page, and the card goes straight
        from the browser to the provider.
      properties:
        setup_id:
          type: string
          description: |-
            The provider's identifier for this attempt. Use it to tell a reloaded page apart
            from a second attempt.
        client_secret:
          type: string
          description: |-
            Authorises this one attempt with the provider, and nothing else. Pass it to the
            provider's library; it is not an API credential and grants no access here.
        publishable_key:
          type: string
          description: |-
            The provider's public key to initialise its library with. It differs between test
            and live, so read it from here rather than compiling it in.
        expires_at: { type: string, format: date-time }

    PayRequest:
      type: object
      additionalProperties: false
      description: |-
        Safe to call again. While an attempt is still with the payment provider, calling this
        returns that attempt rather than starting a second one, so a customer who reloads the
        page is not charged twice.

        A new attempt is started only once the previous one has failed.
      properties:
        payment_method_id:
          type: string
          format: uuid
          description: Which method to charge the remainder to. The default is used when omitted.
        use_balance:
          type: boolean
          default: true
          description: |-
            Whether to apply the account balance first. Set it to `false` to charge the full
            amount to a payment method.
        return_url: { type: string }

    PayTogetherRequest:
      type: object
      additionalProperties: false
      description: |-
        Name at least one invoice or order. They must all belong to the same account and share
        its currency; anything else is refused rather than partly paid.
      properties:
        invoice_ids:
          type: array
          items: { type: string, format: uuid }
          maxItems: 100
        order_ids:
          type: array
          items: { type: string, format: uuid }
          maxItems: 100
        return_url: { type: string }
        idempotency_key:
          type: string
          maxLength: 255
          description: |-
            Required when the provider is involved, because that is where the money moves. The
            same key returns the same checkout address instead of opening a second one.

    PaymentStatus:
      type: string
      enum: [succeeded, processing, requires_action, failed]
      description: |-
        Where the payment has got to.

        `succeeded` — collected in full. Nothing further is owed.

        `processing` — submitted to the payment provider and awaiting its answer. **Do not
        submit it again**; poll the invoice or order, or wait to be notified. Some methods take
        minutes and a few take days.

        `requires_action` — the payer has to finish it at `checkout_url`, typically by
        confirming with their bank. It becomes `processing` once they do.

        `failed` — this attempt did not go through. `failure_reason` says why, and paying again
        starts a fresh attempt.

        The provider's own answer is what decides: an attempt is only `succeeded` once the
        provider says so, never because this call returned.

    PaymentResult:
      type: object
      required: [payment_attempt_id, status, amount_paid, amount_due, currency]
      properties:
        payment_attempt_id:
          type: string
          format: uuid
          description: |-
            This attempt. The same identifier comes back while it is still in flight, which is
            how a repeated call is told apart from a genuine second payment.
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount_paid: { $ref: '#/components/schemas/Money' }
        amount_due:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What is still outstanding. Zero once the payment succeeds. Unchanged while
            `processing`: nothing is collected until the provider confirms it.
        currency: { type: string }
        balance_applied:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            How much came from the account balance. Applied immediately, and released again if
            the rest of the payment fails, so a failed card does not leave part of the balance
            consumed against an unpaid invoice.
        checkout_url:
          type: string
          description: Present with `requires_action`.
        retriable:
          type: boolean
          description: |-
            Whether paying again is worth attempting. False for a refusal that will keep
            happening — a closed account, an amount over a limit — so that a client does not
            retry in a loop.
        retry_after:
          type: string
          format: date-time
          nullable: true
          description: |-
            The earliest sensible moment to try again. Present when the provider asked for a
            wait.
        invoice_id: { type: string, format: uuid, nullable: true }
        order_id: { type: string, format: uuid, nullable: true }
        failure_reason: { type: string }

    InvoiceStatus:
      type: string
      enum: [draft, open, paid, void, uncollectible]

    Invoice:
      type: object
      required: [id, billing_account_id, number, currency, status, total, period_start, period_end]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        number:
          type: string
          description: Numbered per account and per month.
        type:
          type: string
          enum: [usage, order, adjustment]
          description: What produced it — metered usage for a period, a purchase, or a correction.
        currency: { type: string }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        subtotal: { $ref: '#/components/schemas/Money' }
        discount_amount: { $ref: '#/components/schemas/Money' }
        tax_amount: { $ref: '#/components/schemas/Money' }
        credit_applied:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Paid from credit or a voucher.
        total:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Subtotal less discount, plus tax, less credit applied.
        amount_paid: { $ref: '#/components/schemas/Money' }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time, description: Exclusive. }
        customer_name:
          type: string
          description: |-
            Who this was billed to, as recorded when the invoice was issued. Later changes to
            the account do not alter it.
        customer_email: { type: string }
        customer_tax_id: { type: string }
        customer_address_line1: { type: string }
        customer_address_line2: { type: string }
        customer_address_city: { type: string }
        customer_address_state: { type: string }
        customer_address_postal_code: { type: string }
        customer_address_country: { type: string }
        paid_at: { type: string, format: date-time, nullable: true }

    InvoiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        total_count: { type: integer, format: int64 }

    InvoiceItem:
      type: object
      required: [id, description, amount, currency]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [usage, subscription, one_time, adjustment, credit] }
        project_id: { type: string, format: uuid, nullable: true }
        resource_id: { type: string }
        description:
          type: string
          description: |-
            The wording as recorded when the invoice was issued. It is not re-translated
            afterwards, so that an invoice continues to read as it did when it was sent.
        unit: { type: string }
        quantity: { type: string }
        deducted_quantity:
          type: string
          description: The part covered by an included allowance, and therefore not charged.
        unit_amount: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        period_start: { type: string, format: date-time, nullable: true }
        period_end: { type: string, format: date-time, nullable: true }

    InvoiceItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceItem' }
        total_count: { type: integer, format: int64 }

    TransactionType:
      type: string
      enum: [topup, refund, payout, adjustment]
      description: |-
        What moved the money. These are the events that change the account's cash balance.

        Charges for usage and amounts reserved by orders are not here: usage appears among the
        charges and on invoices, and a reservation appears as an allocation.

    Transaction:
      type: object
      required: [id, type, amount, currency, status, created_at]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/TransactionType' }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Signed. Positive increases the balance, negative reduces it.
        currency: { type: string }
        reason: { type: string, description: Why, for manual adjustments. }
        invoice_id: { type: string, format: uuid, nullable: true }
        order_id: { type: string, format: uuid, nullable: true }
        status:
          type: string
          enum: [pending, succeeded, failed]
          description: |-
            `pending` is a payment still with the provider. Only one may be pending against any
            one invoice or order.

            `failed` covers a payment the provider refused and one the payer walked away from
            alike; `failure_reason` says which. There is no separate cancelled state, because
            what to do next is the same either way — start a new one.
        created_at: { type: string, format: date-time }

    TransactionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Transaction' }
        total_count: { type: integer, format: int64 }

    CreditGrant:
      type: object
      required: [id, name, amount, remaining_amount, currency, status, valid_from]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        source_type:
          type: string
          enum: [promotion, voucher, manual, membership]
          description: |-
            Where it came from. `voucher` was redeemed from a code and carries its own
            restrictions; `manual` was issued directly, typically to put something right.
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        remaining_amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        applies_to:
          allOf: [{ $ref: '#/components/schemas/Applicability' }]
          description: What this credit may pay for. No restrictions means anything on the account.
        applies_to_summary:
          type: string
          description: The restrictions in one sentence, ready to display.
        status: { type: string, enum: [active, depleted, expired, voided] }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time, nullable: true }

    CreditGrantList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CreditGrant' }
        total_count: { type: integer, format: int64 }

    Allocation:
      type: object
      required: [id, source_type, source_id, target_type, target_id, amount, currency, allocated_at]
      properties:
        id: { type: string, format: uuid }
        source_type: { type: string, enum: [transaction, credit_grant] }
        source_id: { type: string, format: uuid }
        target_type: { type: string, enum: [hold, order_item, invoice_item] }
        target_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        allocated_at: { type: string, format: date-time }
        reversed_at: { type: string, format: date-time, nullable: true }

    AllocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Allocation' }
        total_count: { type: integer, format: int64 }

    RefundRequest:
      type: object
      additionalProperties: false
      required: [reason, idempotency_key]
      description: |-
        Name exactly one of the three targets. Naming none leaves the amount undecided;
        naming two leaves it ambiguous, and both would have to be resolved by guessing.
      properties:
        invoice_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        subscription_period_id:
          type: string
          format: uuid
          description: |-
            The period to end early. Use this to give back a prepaid term that still has
            time left on it.
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            How much to give back. Absent asks for everything still refundable on the target.

            More than what remains is refused rather than reduced to the remainder: a caller
            asking for more than it can have has miscounted, and quietly giving it less
            hides that.
        reason: { type: string, minLength: 8, maxLength: 1024 }
        idempotency_key: { type: string, minLength: 8, maxLength: 255 }

    Refund:
      type: object
      required: [id, currency, status, created_at, requested_amount]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        invoice_id: { type: string, format: uuid, nullable: true }
        order_id: { type: string, format: uuid, nullable: true }
        requested_amount: { $ref: '#/components/schemas/Money' }
        settled_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What has actually been returned.
        fee_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            Withheld from what reaches the payer. It applies only to cash returned to a payment
            method, so it is zero when `destination` is `balance`, and it is never taken out of
            credit or a voucher.

            `settled_amount` is the amount put back against what was paid; the payer receives
            that less this.
        currency: { type: string }
        destination:
          type: string
          enum: [balance, provider]
          description: Where the cash went.
        status:
          type: string
          enum: [pending, processing, succeeded, failed]
          description: |-
            `pending` — accepted, not yet sent to the payment provider. `processing` — with the
            provider and awaiting its answer, which takes days for some methods. Neither is
            final, and neither means the money has moved.
        reason: { type: string }
        created_at: { type: string, format: date-time }

    RefundList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        total_count: { type: integer, format: int64 }

    RefundSource:
      type: object
      required: [type, amount]
      properties:
        type:
          type: string
          enum: [cash, credit, voucher]
          description: |-
            Where this part of the money came from, and therefore where it goes back to.
            Only `cash` can reach a card or a spendable balance; credit and vouchers return
            to themselves and never become cash.
        amount: { $ref: '#/components/schemas/Money' }

    RefundQuote:
      type: object
      required: [refundable_amount, fee_amount, net_amount, currency, destination, sources]
      description: |-
        What a full refund would return, and where each part of it would go.
      properties:
        refundable_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: The most that can still be returned, before any fee.
        fee_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            Withheld from the cash part. Zero when `destination` is `balance`, and never taken
            out of credit or a voucher.
        net_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: '`refundable_amount` less `fee_amount`.'
        currency: { type: string }
        destination:
          type: string
          enum: [balance, provider]
          description: |-
            Where the cash part would go. `provider` returns it to the method it was paid
            with; `balance` credits the account instead, which is the answer whenever the cash
            came from more than one place or never went through a provider at all.
        sources:
          type: array
          description: |-
            How `refundable_amount` splits by where the money came from. The amounts sum to it.

            Show this rather than a single figure. A part returned as credit or as a voucher
            does not appear on a card statement, so a customer told only the net amount will
            ask why less than that arrived.
          items: { $ref: '#/components/schemas/RefundSource' }
        self_service_until:
          type: string
          format: date-time
          nullable: true
          description: |-
            The last moment a refund can be asked for here. Measured from when the purchase was
            paid for, not from today. Absent when this cannot be refunded without support at
            all — metered usage, for one, which is never self-service.

    UsageCharge:
      type: object
      required: [id, product_key, meter_key, window_start, window_end, quantity, currency]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        product_key: { type: string }
        resource_id:
          type: string
          description: Which resource this was charged for. Empty for charges not tied to one.
        meter_key: { type: string, description: 'What was measured, such as `instance_seconds`.' }
        unit: { type: string }
        dimensions:
          type: object
          additionalProperties: { type: string }
          description: The attributes the rate was chosen by, such as region and machine type.
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time, description: Exclusive. }
        gross_quantity:
          type: string
          description: How much was used, before any included allowance.
        deducted_quantity:
          type: string
          description: How much of that was covered by an allowance.
        quantity:
          type: string
          description: What was charged for — the gross quantity less the part covered.
        unit_amount: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        invoice_id:
          type: string
          format: uuid
          nullable: true
          description: Absent until the period is invoiced.

    UsageChargeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UsageCharge' }
        total_count: { type: integer, format: int64 }

    SpendRow:
      type: object
      required: [amount, currency]
      properties:
        product_key: { type: string }
        plan_id: { type: string, format: uuid }
        plan_name: { type: string }
        resource_id: { type: string, description: Present only when grouped by resource. }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }

    SpendRowList:
      type: object
      required: [items, total, currency]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SpendRow' }
        total:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: The sum over the whole period, not only the page returned.
        currency: { type: string }
        total_count: { type: integer, format: int64 }

    Subscription:
      type: object
      required: [id, product_id, status]
      properties:
        id: { type: string, format: uuid }
        project_id:
          type: string
          format: uuid
          nullable: true
          description: |-
            Which project this is for. Absent when it was bought at account level, such as a
            membership, which belongs to no single project.
        billing_account_id: { type: integer, format: int64 }
        product_id: { type: string, format: uuid }
        product_key: { type: string }
        status:
          type: string
          enum: [pending, active, suspended, canceled, terminated]
          description: |-
            `pending` is a subscription created by an order that has not completed, so it
            appears in the list before anything under it is running.
        item_count: { type: integer, format: int64 }

    SubscriptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Subscription' }
        total_count: { type: integer, format: int64 }

    SubscriptionItem:
      type: object
      required: [id, plan_id, price_id, quantity, status]
      properties:
        id: { type: string, format: uuid }
        subscription_id: { type: string, format: uuid }
        project_id:
          type: string
          format: uuid
          nullable: true
          description: |-
            Which project this is for. Absent when it was bought at account level, such as a
            membership, which belongs to no single project.
        product_key: { type: string }
        plan_id: { type: string, format: uuid }
        plan_name: { type: string }
        price_id: { type: string, format: uuid }
        resource_id: { type: string }
        quantity: { type: string }
        paid_until:
          type: string
          format: date-time
          nullable: true
          description: Present for prepaid items. Absent for metered ones, which have no end date.
        auto_renew: { type: boolean }
        status: { type: string, enum: [pending, active, suspended, canceled, terminated] }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }

    SubscriptionItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionItem' }
        total_count: { type: integer, format: int64 }

    RenewRequest:
      type: object
      additionalProperties: false
      required: [idempotency_key]
      properties:
        periods:
          type: integer
          minimum: 1
          default: 1
          description: How many further periods to buy.
        payment_method_id: { type: string, format: uuid }
        use_balance: { type: boolean, default: true }
        return_url: { type: string }
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }

    AutoRenewSet:
      type: object
      additionalProperties: false
      required: [auto_renew]
      properties:
        auto_renew: { type: boolean }

    ActiveResource:
      type: object
      required: [resource_id, product_key, meter_key, quantity, status, started_at]
      description: |-
        A resource currently accruing charges by the second.
      properties:
        resource_id: { type: string }
        product_key: { type: string }
        resource_type: { type: string, description: What it is, as its service names it. }
        meter_key: { type: string }
        unit: { type: string }
        quantity:
          type: string
          description: How much is held — cores, MiB, cards. Not how much has been used.
        dimensions:
          type: object
          additionalProperties: { type: string }
        status: { type: string, enum: [active, suspended] }
        started_at: { type: string, format: date-time }
        last_billed_until:
          type: string
          format: date-time
          description: Charges are settled up to this moment.

    ActiveResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActiveResource' }
        total_count: { type: integer, format: int64 }

    OrderState:
      type: string
      enum: [pending, paid, fulfilled, failed, canceled]

    Order:
      type: object
      required: [id, currency, type, state, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id:
          type: string
          format: uuid
          nullable: true
          description: |-
            Which project it was bought for. Absent for a purchase made at account level, such
            as a membership.
        billing_account_id: { type: integer, format: int64 }
        currency: { type: string }
        type: { type: string, enum: [purchase, renew, change] }
        state: { $ref: '#/components/schemas/OrderState' }
        gross_amount: { $ref: '#/components/schemas/Money' }
        discount_amount: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        amount_due:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What is still outstanding. Zero once paid.
        refunded_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            How much of `refundable_amount` has already gone back.
        change_effective:
          type: string
          enum: [none, immediate, period_end]
          description: |-
            When a plan change takes effect. `none` on anything that is not a change.

            `period_end` orders stay pending until the current paid period runs out. Renewing in
            the meantime moves that moment along with it.
        refundable_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What a downgrade gives back. It is returned to the sources that originally paid
            rather than deducted from `amount`, so paying with granted credit gives back credit.

            Always "0" on a `period_end` change: nothing is left of the period at its end.
        reservation_expires_at:
          type: string
          format: date-time
          nullable: true
          description: |-
            When the funds and any stock held for this order are released. After this it can no
            longer be paid and has to be placed again. Absent once the order is settled.
        created_at: { type: string, format: date-time }

    OrderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        total_count: { type: integer, format: int64 }

    CodeRequest:
      type: object
      additionalProperties: false
      required: [billing_account_id, code]
      description: |-
        Give a purchase — `lines`, `changes` or `renewal_of` — to find out whether the code
        applies to it and what it would take off. Without one the reply describes the code's
        own terms but cannot say whether it applies, because most codes are restricted to
        certain items or purchase actions.

        The purchase action is worked out from what is given rather than taken on trust: a
        change is an upgrade or a downgrade according to what it costs for the remainder of
        the period.
      properties:
        billing_account_id: { type: integer, format: int64 }
        code: { type: string, minLength: 1, maxLength: 64 }
        project_id:
          type: string
          format: uuid
          description: The project the purchase would be for.
        lines:
          type: array
          maxItems: 100
          description: New purchases to test against, in the same shape as a quote.
          items: { $ref: '#/components/schemas/QuoteLine' }
        changes:
          type: array
          maxItems: 100
          description: |-
            Changes to existing subscriptions to test against, in the same shape as a quote.

            Give these rather than declaring an operation: whether a change counts as an
            upgrade or a downgrade follows from what it costs, which cannot be determined
            without the subscription item and the moment it takes effect.
          items: { $ref: '#/components/schemas/QuoteChange' }
        renewal_of:
          type: array
          maxItems: 100
          description: |-
            Subscription items being renewed, when testing a renewal.
          items: { type: string, format: uuid }

    CodePreview:
      type: object
      required: [valid, type]
      properties:
        valid:
          type: boolean
          description: |-
            Whether the code itself is usable — it exists, has not expired, has not been used
            up, and matches the account's currency. It says nothing about a particular
            purchase; `applicable` does.
        reason:
          $ref: '#/components/schemas/CodeRejection'
        type: { type: string, enum: [voucher, discount] }
        name: { type: string }
        amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: For a voucher, the amount it adds.
        percent_off: { type: string, description: For a percentage discount. }
        max_discount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        applies_to:
          allOf: [{ $ref: '#/components/schemas/Applicability' }]
          description: |-
            What it may be used for. Present whether or not a purchase was given, so that the
            terms can be shown before anything is chosen.
        summary:
          type: string
          description: |-
            The terms in one sentence, ready to display — for example "Compute, new purchases
            only, from 100.00" or "No restriction on product or purchase type".
        valid_until: { type: string, format: date-time, nullable: true }
        applicable:
          type: boolean
          description: |-
            Whether it applies to the purchase given in `lines`. Absent when no purchase was
            given.
        applicable_reason:
          $ref: '#/components/schemas/CodeRejection'
        qualifying_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            The total of the lines that match the restrictions. This is what the threshold is
            measured against, not the order total.
        shortfall:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            How much more of a qualifying purchase is needed to reach the threshold. `"0"` once
            it is met.
        estimated_discount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: |-
            What it would take off this purchase. An estimate: the amount is settled at the
            moment the order is placed.

    CodeRejection:
      type: string
      enum:
        - none
        - not_found
        - expired
        - not_yet_valid
        - exhausted
        - already_redeemed
        - currency_mismatch
        - product_not_covered
        - plan_not_covered
        - price_type_not_covered
        - operation_not_covered
        - not_first_purchase
        - below_minimum
      description: |-
        Why a code cannot be used. `none` when it can.

        `operation_not_covered` means the code is limited to certain purchase actions — a
        first-purchase code presented for a renewal, for example.

        `below_minimum` is accompanied by `shortfall`.

    PurchaseOperation:
      type: string
      enum: [purchase, renew, upgrade, downgrade]
      description: |-
        Which purchase this applies to. `upgrade` and `downgrade` are told apart by money: a change
        that costs more for the remainder of the period is an upgrade, one that returns money
        is a downgrade. A change that costs neither more nor less is neither.

        `new` means a new purchase as opposed to a renewal or a change. It does not mean the
        account's first purchase.

    Applicability:
      type: object
      description: |-
        What something may be used for. A field that is absent places no restriction on that
        dimension; all of them absent means no restriction at all.

        A line qualifies when it satisfies every field that is set. `min_amount` is then
        measured against **the qualifying lines only**, not the order total.
      properties:
        product_keys: { type: array, items: { type: string } }
        plan_keys: { type: array, items: { type: string } }
        price_types: { type: array, items: { type: string } }
        operations:
          type: array
          items: { $ref: '#/components/schemas/PurchaseOperation' }
        first_purchase_only:
          type: boolean
          description: Restricted to your first purchase of a covered product.
        min_amount: { $ref: '#/components/schemas/Money' }

    CodeRedeem:
      type: object
      additionalProperties: false
      required: [billing_account_id, code, idempotency_key]
      properties:
        billing_account_id: { type: integer, format: int64 }
        code: { type: string, minLength: 1, maxLength: 64 }
        idempotency_key: { type: string, minLength: 1, maxLength: 255 }

    CodeRedeemResult:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [voucher, discount] }
        credit_grant_id:
          type: string
          format: uuid
          nullable: true
          description: For a voucher, the credit that was added.
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        message:
          type: string
          description: |-
            For a discount, what will happen — it is applied to the next qualifying purchase
            rather than added to the balance.

    Tier:
      type: object
      required: [unit_amount]
      properties:
        up_to:
          type: string
          nullable: true
          description: The upper bound of this band. Null on the last band, which has no bound.
        unit_amount: { $ref: '#/components/schemas/Money' }
        flat_amount:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Charged once when this band is reached, in addition to the per-unit amount.

    OrderItem:
      type: object
      required: [id, price_id, quantity, amount, currency]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        price_id: { type: string, format: uuid }
        plan_name:
          type: string
          description: |-
            What it was called when bought. It does not follow later catalogue renames and is
            not translated.
        resource_id: { type: string }
        quantity: { type: string }
        unit_amount: { $ref: '#/components/schemas/Money' }
        gross_amount: { $ref: '#/components/schemas/Money' }
        discount_amount: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { type: string }
        service_period_start: { type: string, format: date-time, nullable: true }
        service_period_end: { type: string, format: date-time, nullable: true }

    OrderItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        total_count: { type: integer, format: int64 }

    Allowance:
      type: object
      required: [id, product_key, meter_key, source_type, name, quantity, remaining_quantity, status, valid_from]
      properties:
        id: { type: string, format: uuid }
        billing_account_id: { type: integer, format: int64 }
        product_key:
          type: string
          description: |-
            Which service it covers, such as `compute`. Read it alongside `meter_key`: a meter
            name is unique only within its own service, so two allowances for `egress_bytes`
            may belong to different services and cover different traffic.
        meter_key: { type: string, description: 'What it covers, such as `egress_bytes`.' }
        unit: { type: string, description: 'The unit it is counted in, such as `MiB`.' }
        source_type:
          type: string
          enum: [included, package, promotional]
          description: |-
            `included` came with a recurring purchase, `package` was bought on its own such as a
            traffic pack, `promotional` was granted.
        name: { type: string }
        quantity: { type: string, description: How much was granted. }
        remaining_quantity: { type: string, description: How much is left. }
        priority:
          type: integer
          description: Lower is drawn on first. Included quantities sit ahead of purchased packs.
        status: { type: string, enum: [active, depleted, expired, voided] }
        valid_from: { type: string, format: date-time }
        valid_until:
          type: string
          format: date-time
          nullable: true
          description: |-
            When it lapses. Anything unused at that point is lost; it is not refunded and does
            not carry over. Absent when it does not expire on its own.

    AllowanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Allowance' }
        total_count: { type: integer, format: int64 }

    AllowanceConsumption:
      type: object
      required: [id, quantity, consumed_at]
      properties:
        id: { type: string, format: uuid }
        usage_charge_id: { type: string, format: uuid }
        meter_key: { type: string }
        quantity: { type: string }
        consumed_at: { type: string, format: date-time }
        reversed_at: { type: string, format: date-time, nullable: true }

    AllowanceConsumptionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AllowanceConsumption' }
        total_count: { type: integer, format: int64 }

    IncludedAllowance:
      type: object
      required: [meter_key, quantity, expiry]
      properties:
        meter_key: { type: string }
        unit: { type: string }
        quantity: { type: string, description: How much is included. }
        expiry:
          type: string
          enum: [period_end, days, never]
          description: |-
            `period_end` lasts as long as the period it came with. `days` lasts a fixed number
            of days from purchase. `never` does not lapse.
        valid_days: { type: integer, description: Only meaningful when `expiry` is `days`. }

    IncludedFeature:
      type: object
      required: [feature_key, name, unlimited]
      properties:
        feature_key: { type: string }
        name: { type: string }
        name_translations: { $ref: '#/components/schemas/Translations' }
        description: { type: string }
        unlimited:
          type: boolean
          description: |-
            Whether this price grants the capability without a cap.

            **This is what says whether it is capped, not the presence of an included
            quantity.** A capped capability whose quantity has run out would otherwise be
            indistinguishable from one that was never capped.

            `true` for a capability that is simply available or not, with nothing to count.
        included_quantity:
          type: string
          description: |-
            How much is included, as a decimal string. Present when `unlimited` is false.
        unit:
          type: string
          description: 'The unit that quantity is counted in, such as `request`.'

    Entitlement:
      type: object
      required: [product_key, feature_key, enabled, metered]
      properties:
        product_key:
          type: string
          description: |-
            Which service. Read it alongside `feature_key`, which is unique only within its
            service.
        feature_key:
          type: string
          description: What calling code tests against.
        name: { type: string }
        enabled: { type: boolean }
        metered:
          type: boolean
          description: |-
            Whether its use is counted. **`false` means no limit** — the plan providing it
            grants it without a cap — and `remaining_quantity` should not be read in that case.

            A capped capability whose quantity has run out keeps `metered` true with
            `remaining_quantity` of `"0"`. Exhausted and uncapped are therefore always
            distinguishable.
        remaining_quantity:
          type: string
          description: |-
            How much is left, as a decimal string. Meaningful only when `metered` is true.
            `"0"` once exhausted, never negative.

            This is the figure at the moment of the reply, and quantities are drawn down at
            settlement rather than on each call. It is suitable for display and for a soft
            warning, but it cannot enforce a strict limit: concurrent requests all see the same
            figure. A hard limit has to be counted by the service that owns the capability, in
            the same transaction as the operation it is limiting.
        unit: { type: string }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |-
            When the subscription providing it ends. Absent for a metered subscription, which
            has no end date.

    EntitlementList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Entitlement' }
        total_count: { type: integer, format: int64 }
