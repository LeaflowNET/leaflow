openapi: 3.2.1
info:
  title: Leaflow Billing API
  version: v1
  description: Products, prices, orders, subscriptions and account billing. Financial operations require an account access
    token and billing-account authorization. Public catalogue operations declare no security requirement.
servers:
- url: https://billing.leaflow.cloud
  description: Billing API
security:
- accessTokenAuth: []
