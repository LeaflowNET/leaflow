        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        project_id:
          description: |-
            Which project this is for. Absent when it was bought at account level, such as a
            membership, which belongs to no single project.
          type:
          - string
          - 'null'
          format: uuid
        product:
          $ref: '#/components/schemas/ObjectIdentity'
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        price_id:
          type: string
          format: uuid
        resource_id:
          type: string
        quantity:
          type: string
        paid_until:
