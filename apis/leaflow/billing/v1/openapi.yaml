          format: uuid
        project_id:
          description: |-
            Which project it was bought for. Absent for a purchase made at account level, such
            as a membership.
          type:
          - string
          - 'null'
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        currency:
          type: string
        type:
          description: |-
            `adopt` brings a resource that already existed under billing. It charges nothing at
            the time and starts billing from the moment agreed.
          type: string
          enum:
          - purchase
          - renew
          - change
          - adopt
        state:
          $ref: '#/components/schemas/OrderState'
        gross_amount:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        amount_due:
          description: What is still outstanding. Zero once paid.
          allOf:
          - $ref: '#/components/schemas/Money'
        refunded_amount:
          description: How much of `refundable_amount` has already gone back.
          allOf:
          - $ref: '#/components/schemas/Money'
        change_effective:
          description: |-
            When a plan change takes effect. `none` on anything that is not a change.

            `period_end` orders stay pending until the current paid period runs out. Renewing in
            the meantime moves that moment along with it.
          type: string
          enum:
          - none
          - immediate
          - period_end
        refundable_amount:
          description: |-
            What a downgrade gives back. It is returned to the sources that originally paid
            rather than deducted from `amount`, so paying with granted credit gives back credit.

            Always "0" on a `period_end` change: nothing is left of the period at its end.
          allOf:
          - $ref: '#/components/schemas/Money'
        reservation_expires_at:
          description: |-
            When the funds and any stock held for this order are released. After this it can no
            longer be paid and has to be placed again. Absent once the order is settled.
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        items:
          description: |-
            What was bought. Present on a single order and on every order in a list, so a list
            can be rendered without a further request per row.
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
      required:
      - id
      - currency
      - type
      - state
      - amount
      - created_at
    OrderList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        total_count:
          type: integer
          format: int64
      required:
      - items
    CodeRequest:
      description: |-
        Give a purchase — `lines`, `changes` or `renewal_of` — to find out whether the code
        applies to it and what it would take off. Without one the reply describes the code's
        own terms but cannot say whether it applies, because most codes are restricted to
        certain items or purchase actions.

        The purchase action is worked out from what is given rather than taken on trust: a
        change is an upgrade or a downgrade according to what it costs for the remainder of
        the period.
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
        code:
          type: string
          minLength: 1
          maxLength: 64
        project_id:
          description: The project the purchase would be for.
          type: string
          format: uuid
        lines:
          description: New purchases to test against, in the same shape as a
            quote.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteLine'
        changes:
          description: |-
            Changes to existing subscriptions to test against, in the same shape as a quote.

            Give these rather than declaring an operation: whether a change counts as an
            upgrade or a downgrade follows from what it costs, which cannot be determined
            without the subscription item and the moment it takes effect.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteChange'
        renewal_of:
          description: Subscription items being renewed, when testing a renewal.
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
      required:
      - billing_account_id
      - code
      additionalProperties: false
    CodePreview:
      type: object
      properties:
        valid:
          description: |-
            Whether the code itself is usable — it exists, has not expired, has not been used
            up, and matches the account's currency. It says nothing about a particular
            purchase; `applicable` does.
          type: boolean
        reason:
          $ref: '#/components/schemas/CodeRejection'
        type:
          type: string
          enum:
          - voucher
          - discount
        name:
          type: string
        amount:
          description: For a voucher, the amount it adds.
          allOf:
          - $ref: '#/components/schemas/Money'
        percent_off:
          description: For a percentage discount.
          type: string
        max_discount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        applies_to:
          description: |-
            What it may be used for. Present whether or not a purchase was given, so that the
            terms can be shown before anything is chosen.
          allOf:
          - $ref: '#/components/schemas/Applicability'
        summary:
          description: |-
            The terms in one sentence, ready to display — for example "Compute, new purchases
            only, from 100.00" or "No restriction on product or purchase type".
          type: string
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
        applicable:
          description: |-
            Whether it applies to the purchase given in `lines`. Absent when no purchase was
            given.
          type: boolean
        applicable_reason:
          $ref: '#/components/schemas/CodeRejection'
        qualifying_amount:
          description: |-
            The total of the lines that match the restrictions. This is what the threshold is
            measured against, not the order total.
          allOf:
          - $ref: '#/components/schemas/Money'
        shortfall:
          description: |-
            How much more of a qualifying purchase is needed to reach the threshold. `"0"` once
            it is met.
          allOf:
          - $ref: '#/components/schemas/Money'
        estimated_discount:
          description: |-
            What it would take off this purchase. An estimate: the amount is settled at the
            moment the order is placed.
          allOf:
          - $ref: '#/components/schemas/Money'
      required:
      - valid
      - type
    CodeRejection:
      description: |-
        Why a code cannot be used. `none` when it can.

        `operation_not_covered` means the code is limited to certain purchase actions — a
        first-purchase code presented for a renewal, for example.

        `below_minimum` is accompanied by `shortfall`.
      type: string
      enum:
      - none
      - not_found
      - expired
      - not_yet_valid
      - exhausted
      - already_redeemed
      - currency_mismatch
      - product_not_covered
      - plan_not_covered
      - price_type_not_covered
      - operation_not_covered
      - not_first_purchase
      - below_minimum
    PurchaseOperation:
      description: |-
        Which purchase this applies to. `upgrade` and `downgrade` are told apart by money: a change
        that costs more for the remainder of the period is an upgrade, one that returns money
        is a downgrade. A change that costs neither more nor less is neither.

        `new` means a new purchase as opposed to a renewal or a change. It does not mean the
        account's first purchase.
      type: string
      enum:
      - purchase
      - renew
      - upgrade
      - downgrade
    Applicability:
      description: |-
        What something may be used for. A field that is absent places no restriction on that
        dimension; all of them absent means no restriction at all.

        A line qualifies when it satisfies every field that is set. `min_amount` is then
        measured against **the qualifying lines only**, not the order total.
      type: object
      properties:
        product_ids:
          type: array
          items:
            type: string
            format: uuid
        plan_ids:
          type: array
          items:
            type: string
            format: uuid
        price_types:
          type: array
          items:
            type: string
        operations:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOperation'
        first_purchase_only:
          description: Restricted to your first purchase of a covered product.
          type: boolean
        min_amount:
          $ref: '#/components/schemas/Money'
    CodeRedeem:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
        code:
          type: string
          minLength: 1
          maxLength: 64
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - billing_account_id
      - code
      - idempotency_key
      additionalProperties: false
    CodeRedeemResult:
      type: object
      properties:
        type:
          type: string
          enum:
          - voucher
          - discount
        credit_grant_id:
          description: For a voucher, the credit that was added.
          type:
          - string
          - 'null'
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        message:
          description: |-
            For a discount, what will happen — it is applied to the next qualifying purchase
            rather than added to the balance.
          type: string
      required:
      - type
    Tier:
      type: object
      properties:
        up_to:
          description: The upper bound of this band. Null on the last band,
            which has no bound.
          type:
          - string
          - 'null'
        unit_amount:
          $ref: '#/components/schemas/Money'
        flat_amount:
          description: Charged once when this band is reached, in addition to
            the per-unit amount.
          allOf:
          - $ref: '#/components/schemas/Money'
      required:
      - unit_amount
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        product_id:
          description: Which service this line belongs to.
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/ObjectIdentity'
        plan_id:
          description: Which plan was bought.
          type: string
          format: uuid
        plan_name:
          description: |-
            What it was called when bought. It does not follow later catalogue renames and is
            not translated.
          type: string
        resource_id:
          type: string
        quantity:
          type: string
        unit_amount:
          $ref: '#/components/schemas/Money'
        gross_amount:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        service_period_start:
          type:
          - string
          - 'null'
          format: date-time
        service_period_end:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - price_id
      - quantity
      - amount
      - currency
    OrderItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_count:
          type: integer
          format: int64
      required:
      - items
    Allowance:
      type: object
      properties:
        dimension_values:
          description: |-
            Allowed values for selected meter dimensions, such as region or storage class.
            Every specified dimension must match one listed value. Omitted dimensions are
            unrestricted. An empty map covers all dimensions of this meter.
          type: object
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        product:
          $ref: '#/components/schemas/ObjectIdentity'
        meter:
          $ref: '#/components/schemas/ObjectIdentity'
        unit:
          description: The unit it is counted in, such as `MiB`.
          type: string
        source_type:
          description: |-
            `included` came with a recurring purchase, `package` was bought on its own such as a
            traffic pack, `promotional` was granted.
          type: string
          enum:
          - included
          - package
          - promotional
        name:
          type: string
        quantity:
          description: How much was granted.
          type: string
        remaining_quantity:
          description: How much is left.
          type: string
        priority:
          description: Lower is drawn on first. Included quantities sit ahead of
            purchased packs.
          type: integer
        status:
          type: string
          enum:
          - active
          - depleted
          - expired
          - voided
        valid_from:
          type: string
          format: date-time
        valid_until:
          description: |-
            When it lapses. Anything unused at that point is lost; it is not refunded and does
            not carry over. Absent when it does not expire on its own.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - product
      - meter
      - source_type
      - name
      - quantity
      - remaining_quantity
      - status
      - valid_from
    AllowanceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Allowance'
        total_count:
          type: integer
          format: int64
      required:
      - items
    AllowanceConsumption:
      type: object
      properties:
        id:
          type: string
          format: uuid
        usage_charge_id:
          type: string
          format: uuid
        meter:
          $ref: '#/components/schemas/ObjectIdentity'
        quantity:
          type: string
        consumed_at:
          type: string
          format: date-time
        reversed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - quantity
      - consumed_at
    AllowanceConsumptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AllowanceConsumption'
        total_count:
          type: integer
          format: int64
      required:
      - items
    IncludedAllowance:
      type: object
      properties:
        dimension_values:
          description: |-
            Allowed values for selected meter dimensions, such as region or storage class.
            Every specified dimension must match one listed value. Omitted dimensions are
            unrestricted. An empty map covers all dimensions of this meter.
          type: object
          additionalProperties:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: string
              minLength: 1
        meter:
          $ref: '#/components/schemas/ObjectIdentity'
        unit:
          type: string
        quantity:
          description: How much is included.
          type: string
        expiry:
          description: |-
            `period_end` lasts as long as the period it came with. `days` lasts a fixed number
            of days from purchase. `never` does not lapse.
          type: string
          enum:
          - period_end
          - days
          - never
        valid_days:
          description: Only meaningful when `expiry` is `days`.
          type: integer
      required:
      - meter
      - quantity
      - expiry
    IncludedFeature:
      type: object
      properties:
        feature:
          $ref: '#/components/schemas/ObjectIdentity'
        name:
          type: string
        name_translations:
          $ref: '#/components/schemas/Translations'
        description:
          type: string
        unlimited:
          description: |-
            Whether this price grants the capability without a cap.

            **This is what says whether it is capped, not the presence of an included
            quantity.** A capped capability whose quantity has run out would otherwise be
            indistinguishable from one that was never capped.

            `true` for a capability that is simply available or not, with nothing to count.
          type: boolean
        included_quantity:
          description: How much is included, as a decimal string. Present when
            `unlimited` is false.
          type: string
        unit:
          description: The unit that quantity is counted in, such as `request`.
          type: string
      required:
      - feature
      - name
      - unlimited
    Entitlement:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ObjectIdentity'
        feature:
          $ref: '#/components/schemas/ObjectIdentity'
        name:
          type: string
        enabled:
          type: boolean
        metered:
          description: |-
            Whether its use is counted. **`false` means no limit** — the plan providing it
            grants it without a cap — and `remaining_quantity` should not be read in that case.

            A capped capability whose quantity has run out keeps `metered` true with
            `remaining_quantity` of `"0"`. Exhausted and uncapped are therefore always
            distinguishable.
          type: boolean
        remaining_quantity:
          description: |-
            How much is left, as a decimal string. Meaningful only when `metered` is true.
            `"0"` once exhausted, never negative.

            This is the figure at the moment of the reply, and quantities are drawn down at
            settlement rather than on each call. It is suitable for display and for a soft
            warning, but it cannot enforce a strict limit: concurrent requests all see the same
            figure. A hard limit has to be counted by the service that owns the capability, in
            the same transaction as the operation it is limiting.
          type: string
        unit:
          type: string
        expires_at:
          description: |-
            When the subscription providing it ends. Absent for a metered subscription, which
            has no end date.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - product
      - feature
      - enabled
      - metered
    EntitlementList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        total_count:
          type: integer
          format: int64
      required:
      - items
    ObjectReference:
      description: Identify an object by ID or lookup key, exactly one. A lookup
        key requires the owning product.
      type: object
      properties:
        id:
          type: string
          format: uuid
        lookup_key:
          type: string
          minLength: 1
          maxLength: 128
      minProperties: 1
      maxProperties: 1
      additionalProperties: false
    ObjectIdentity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lookup_key:
          type: string
      required:
      - id
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |-
        The `ETag` from an earlier reply. When the catalogue has not changed since, the
        answer is `304` with no body.

        Worth sending on every catalogue read: the listings are public, unauthenticated and
        cached at the edge, so a repeat read costs one round trip and no transfer.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number; the first page when omitted.
      schema:
        type: integer
        format: int32
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: How many per page, 100 at most.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
    From:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: false
      description: Exclusive.
      schema:
        type: string
        format: date-time
    AccountIdQuery:
      name: billing_account_id
      in: query
      required: false
      description: Restrict to one of your accounts. All of them when omitted.
      schema:
        type: integer
        format: int64
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RateCardId:
      name: rateCardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentMethodId:
      name: paymentMethodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromRequired:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ToRequired:
      name: to
      in: query
      required: true
      description: Exclusive. One month is `[2026-09-01, 2026-10-01)`.
      schema:
        type: string
        format: date-time
  responses:
    NotModified:
      description: Unchanged since the `ETag` that was sent. No body.
      headers:
        ETag:
          description: The same entity tag that was sent.
          schema:
            type: string
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
