openapi: 3.1.0
info:
  title: Leaflow Billing API
  version: 2.0.0
  description: |-
    Billing for tenants: the public catalogue, the caller's own account, and what a project
    has spent.
security:
- accountAuth: []
tags:
- name: catalog
  description: What the platform sells and what it costs. No sign-in required.
- name: accounts
  description: Billing accounts, balances, and which projects they pay for.
- name: payments
  description: Adding funds, payment methods, and settling what is owed.
- name: billing-history
  description: Invoices, transactions and where each amount went.
- name: subscriptions
  description: What has been bought and when it renews.
- name: entitlements
  description: Which capabilities are currently available.
- name: allowances
  description: Included and purchased quantities, and what is left of them.
- name: promotions
  description: Redeeming codes.
- name: projects
  description: What one project has spent, and who pays for it.
paths:
  /catalog/v1/products:
    get:
      summary: List catalog products
      operationId: list-catalog-products
      tags:
      - catalog
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogProductList'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Error'
  /catalog/v1/products/{productId}/plans:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      summary: List catalog plans
      operationId: list-catalog-plans
      tags:
      - catalog
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPlanList'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Error'
  /catalog/v1/plans/{planId}/prices:
    parameters:
    - $ref: '#/components/parameters/PlanId'
    get:
      summary: List catalog prices
      description: |-
        Public list prices only. An account holding a negotiated agreement may be charged less;
        it is never charged more.
      operationId: list-catalog-prices
      tags:
      - catalog
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/IfNoneMatch'
      - name: currency
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPriceList'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Error'
  /catalog/v1/rate-cards/{rateCardId}/rules:
    parameters:
    - $ref: '#/components/parameters/RateCardId'
    get:
      summary: List catalog rates
      description: |-
        Only public price lists are readable here. A list written for a single agreement is not,
        and its identifier cannot be used to reach it.
      operationId: list-catalog-rates
      tags:
      - catalog
      security: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/IfNoneMatch'
      - name: meter
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
      - name: at
        in: query
        required: false
        description: Return the rates in effect at this moment. Defaults to now.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRateList'
        '304':
          $ref: '#/components/responses/NotModified'
        default:
          $ref: '#/components/responses/Error'
  /catalog/v1/estimates:
    post:
      summary: Estimate a basket
      description: |-
        Uses public list prices. Nothing is reserved and nothing is recorded, so this may be
        called as often as required.

        `POST` is used because the set of items to price does not fit in a query string. There is
        no corresponding `GET`, and no estimate is stored to retrieve.

        An account holding a negotiated agreement may be charged less than this. Tax and
        discounts are not included.
      operationId: create-estimate
      tags:
      - catalog
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/billing-accounts:
    get:
      summary: List billing accounts
      operationId: list-billing-accounts
      tags:
      - accounts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountList'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create billing account
      description: |-
        The currency is chosen here and cannot be changed afterwards. Everything charged to the
        account — prices, orders, invoices, balance — is denominated in it.

        One person may hold several accounts, for example a personal one and one for a team.
      operationId: create-billing-account
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAccountCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/billing-accounts/{accountId}:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      summary: Get billing account
      operationId: get-billing-account
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: '#/components/responses/Error'
    patch:
      summary: Update billing account
      description: |-
        The legal name, address and tax identifier are copied onto each invoice when it is
        issued. Changing them here affects invoices issued afterwards, not those already sent.

        The currency cannot be changed.
      operationId: update-billing-account
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAccountUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/billing-accounts/{accountId}/balance:
    parameters:
    - $ref: '#/components/parameters/AccountId'
    get:
      summary: Get account balance
      operationId: get-account-balance
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/projects:
    get:
      summary: List paid projects
      operationId: list-paid-projects
      tags:
      - accounts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: billing_account_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBindingList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/projects/{projectId}/billing-account:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Find project payer
      description: Returns 404 when no account pays for it. No resources can be
        created until one does.
      operationId: find-project-payer
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBinding'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Set project payer
      description: |-
        Charges already recorded remain with the account that was paying when they occurred, and
        are still invoiced to it. Metered resources are settled up to the moment of the change.

        Periods already paid for are unaffected; renewals are charged to the new account.

        The request is refused while the current account has an unpaid invoice, and — once the
        project holds subscriptions — while the new account uses a different currency.
      operationId: set-project-payer
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPayerSet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBinding'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Unbind project payer
      description: |-
        Permitted only when the project has nothing left to charge: no resources accruing
        charges, no subscriptions still running, no usage awaiting invoicing, and no unpaid
        invoice on the account.

        Usage that has not yet been invoiced is settled by calling
        `POST /account/v1/projects/{projectId}/billing-account/settle` first.

        After this the project cannot create resources until an account is chosen again.
      operationId: unbind-project-payer
      tags:
      - accounts
      responses:
        '204':
          description: Unbound
        default:
          $ref: '#/components/responses/Error'
  /account/v1/projects/{projectId}/billing-account/settle:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      summary: Settle project usage
      description: |-
        Metered usage is normally invoiced at the end of the month. This issues an invoice for
        everything charged to the project so far, to the account currently paying for it.

        Use it before unbinding a project, or to obtain a settled figure part-way through a
        month. Calling it again when nothing is outstanding has no effect.
      operationId: settle-project-usage
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettleResult'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/top-ups:
    get:
      summary: List top ups
      operationId: list-top-ups
      tags:
      - payments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpList'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create top up
      description: |-
        Returns a checkout address. The balance increases when the payment provider confirms the
        payment, which may be after this call returns.

        The amount is in the account's currency. A checkout page may present a local currency;
        the amount credited to the account is the one requested here.
      operationId: create-top-up
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/top-ups/{topUpId}:
    parameters:
    - name: topUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get top up
      operationId: get-top-up
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/payment-methods:
    get:
      summary: List payment methods
      operationId: list-payment-methods
      tags:
      - payments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/payment-methods/setup:
    post:
      summary: Create payment method setup
      description: |-
        Returns what is needed to hand the browser over to the payment provider's own card
        form. Nothing is charged, and the method appears in the list once the provider
        confirms it.

        Card numbers are never sent to or stored by this service.
      operationId: create-payment-method-setup
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodSetup'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSetupResult'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/payment-methods/{paymentMethodId}/default:
    parameters:
    - $ref: '#/components/parameters/PaymentMethodId'
    put:
      summary: Set default payment method
      operationId: set-default-payment-method
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/payment-methods/{paymentMethodId}:
    parameters:
    - $ref: '#/components/parameters/PaymentMethodId'
    delete:
      summary: Delete payment method
      description: |-
        Refused when it is the only method on an account that has resources billed by the hour,
        as there would be nothing left to charge when the balance runs out.
      operationId: delete-payment-method
      tags:
      - payments
      responses:
        '204':
          description: Removed
        default:
          $ref: '#/components/responses/Error'
  /account/v1/invoices/{invoiceId}/pay:
    parameters:
    - $ref: '#/components/parameters/InvoiceId'
    post:
      summary: Pay invoice
      description: |-
        Applies the account balance first, then charges the remainder to a payment method. Give
        `payment_method_id` to choose one, or omit it to use the default.

        Returns a checkout address when the provider requires the cardholder to confirm the
        payment; the invoice is marked paid once the provider confirms it.

        Calling this on an invoice that is already paid returns the invoice unchanged.
      operationId: pay-invoice
      tags:
      - payments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/payments:
    post:
      summary: Pay together
      description: |-
        All of them or none. Nothing is settled unless everything named here can be, so a
        partial result is not a state this can leave behind.

        The balance is not split across the two cases: either it covers the whole total and
        everything is settled from it, or it is left untouched and the full total is collected
        through the provider. It is never partly spent against an unpaid remainder.

        When the provider is needed, this returns a checkout address and settles nothing.
        Call it again once the payment has landed — the balance then covers the total and the
        same call settles everything.

        Anything already paid is skipped rather than refused, so a repeated call after a
        partial success is safe.
      operationId: pay-together
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayTogetherRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/orders/{orderId}/pay:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      summary: Pay order
      description: |-
        Use this to resume an order whose checkout was interrupted.

        An order reserves both funds and stock for a limited time. Once that reservation expires
        the order can no longer be paid and must be placed again; `reservation_expires_at` on the
        order states when.
      operationId: pay-order
      tags:
      - payments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/invoices:
    get:
      summary: List invoices
      operationId: list-invoices
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InvoiceStatus'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/invoices/{invoiceId}:
    parameters:
    - $ref: '#/components/parameters/InvoiceId'
    get:
      summary: Get invoice
      operationId: get-invoice
      tags:
      - billing-history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/invoices/{invoiceId}/items:
    parameters:
    - $ref: '#/components/parameters/InvoiceId'
    get:
      summary: List invoice items
      operationId: list-invoice-items
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceItemList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/invoices/{invoiceId}/refund-quote:
    parameters:
    - $ref: '#/components/parameters/InvoiceId'
    get:
      summary: Get invoice refund quote
      description: |-
        Show this before asking for a refund. Nothing is recorded and nothing is reserved; the
        answer follows from what has been paid and what has already been returned, so it may
        be read as often as required.

        `refundable_amount` is `"0"` once nothing is left, which is also the answer for an
        invoice already refunded in full.
      operationId: get-invoice-refund-quote
      tags:
      - billing-history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundQuote'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/transactions:
    get:
      summary: List transactions
      operationId: list-transactions
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/credit-grants:
    get:
      summary: List credit grants
      description: |-
        Each grant shows what remains and what it may be used for. Credit is spent before cash
        and cannot be withdrawn.
      operationId: list-credit-grants
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - depleted
          - expired
          - voided
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditGrantList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/allocations:
    get:
      summary: List allocations
      description: |-
        Give `source_id` to follow one top-up or grant through to everything it paid for. Give
        `target_id` to see which sources paid for one line of an invoice.

        Give `source_type` on its own to separate what cash paid for from what granted credit
        paid for.
      operationId: list-allocations
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: source_type
        in: query
        required: false
        description: '`transaction` is money paid in, `credit_grant` is granted credit
          or a voucher.'
        schema:
          type: string
          enum:
          - transaction
          - credit_grant
      - name: source_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: target_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/refunds:
    get:
      summary: List refunds
      operationId: list-refunds
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundList'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Request refund
      description: |-
        Refunding ends the subscription and reclaims whatever it provisioned. That is the
        difference from letting a period lapse: a lapsed period keeps the machine around
        for a while so that topping up brings it back, whereas a refund returns the money
        and therefore cannot leave the thing running.

        What can be refunded, for how long, and how much, is decided here rather than by
        the caller. A request outside those bounds is refused with the reason.

        The money goes back the way it came: card charges to the card, balance to the
        balance, credit to credit. A grant never turns into cash.
      operationId: request-refund
      tags:
      - account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201':
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/usage-charges:
    get:
      summary: List usage charges
      description: |-
        Includes charges that have not been invoiced yet, which is how the current month's
        spending is seen before the invoice is issued.
      operationId: list-usage-charges
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: product
        in: query
        required: false
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageChargeList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/subscriptions:
    get:
      summary: List subscriptions
      operationId: list-subscriptions
      tags:
      - subscriptions
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/subscription-items:
    get:
      summary: List subscription items
      operationId: list-subscription-items
      tags:
      - subscriptions
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: expiring_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/subscription-items/{itemId}/renew:
    parameters:
    - $ref: '#/components/parameters/ItemId'
    post:
      summary: Renew subscription item
      description: |-
        Extends the paid period from its current end, not from today, so renewing early does not
        shorten what has already been paid for.

        The price charged is the one in effect at the moment of renewal, which may differ from
        what was paid for the current period.
      operationId: renew-subscription-item
      tags:
      - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/subscription-items/{itemId}/auto-renew:
    parameters:
    - $ref: '#/components/parameters/ItemId'
    put:
      summary: Set auto renew
      description: |-
        When on, the account balance is charged at the renewal date. Turning it off lets the
        current period run to its end and stops the resource afterwards.
      operationId: set-auto-renew
      tags:
      - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRenewSet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItem'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/codes/preview:
    post:
      summary: Preview code
      description: |-
        Nothing is recorded and the code is not consumed. Use it to show the customer the effect
        before they commit.
      operationId: preview-code
      tags:
      - promotions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodePreview'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/codes/redeem:
    post:
      summary: Redeem code
      description: |-
        A voucher code adds credit to the account. A discount code records the entitlement, which
        is then applied to the next qualifying purchase.

        A code that has already been redeemed by this account is refused rather than redeemed a
        second time.
      operationId: redeem-code
      tags:
      - promotions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRedeem'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRedeemResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/billing-account:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: Get project billing account
      description: |-
        A deliberately narrow view: the payer's identity, its currency, and how much can still
        be spent. Cards, invoices and transaction history are not included; they belong to the
        account owner and are reached through `/account/v1/`.

        Returns 404 when no account pays for this project. Resources cannot be created in that
        state.
      operationId: get-project-billing-account
      tags:
      - projects
      security:
      - projectAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPayer'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/spend:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project spend
      description: |-
        Covers a closed time range. Both bounds are required: a total without a stated period
        cannot be reconciled against an invoice.

        Includes usage that has not been invoiced yet.
      operationId: list-project-spend
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/FromRequired'
      - $ref: '#/components/parameters/ToRequired'
      - name: group_by
        in: query
        required: false
        description: |-
          `resource` groups by the resource each charge names. Items billed under their own
          identifier — a disk, a public address — appear as their own rows rather than under
          the machine they are attached to, since the relationship between them is known to
          the owning service and not here.
        schema:
          type: string
          enum:
          - product
          - plan
          - resource
          default: product
      - name: product
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpendRowList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/usage-charges:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project usage charges
      description: |-
        The individual charges behind the figures in `/spend`. Amounts here sum to the totals
        reported there over the same period.
      operationId: list-project-usage-charges
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
      - name: product
        in: query
        required: false
        description: |-
          Filter by ID or lookup key. A lookup key is scoped to the product.
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
      - name: meter
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageChargeList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/subscriptions:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project subscriptions
      operationId: list-project-subscriptions
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/subscription-items:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project subscription items
      operationId: list-project-subscription-items
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: expiring_before
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/subscription-items/{itemId}/auto-renew:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/ItemId'
    put:
      summary: Set project auto renew
      description: |-
        Automatic renewal draws on the paying account's balance, which a project member may
        commit. Paying by card requires the account owner and is done from the billing centre.
      operationId: set-project-auto-renew
      tags:
      - projects
      security:
      - projectAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRenewSet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItem'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/orders:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project orders
      description: |-
        An order awaiting payment shows what is outstanding. Paying it is done from the billing
        centre by the account owner.
      operationId: list-project-orders
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderState'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/OrderId'
    get:
      summary: Get project order
      operationId: get-project-order
      tags:
      - projects
      security:
      - projectAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/active-resources:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project active resources
      description: A resource that is running but does not appear here is not
        being charged for.
      operationId: list-project-active-resources
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveResourceList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/quotes:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    post:
      summary: Quote for a project
      description: |-
        Priced in the paying account's currency, and at any rate negotiated for that account.
        Nothing is reserved and nothing is recorded, so this may be called as often as required.

        Prices may change between quoting and ordering. An order is charged at the price in
        effect when it is placed, so a quote should be refreshed before a final confirmation is
        shown.

        Returns 404 when no account pays for this project.
      operationId: create-project-quote
      tags:
      - projects
      security:
      - projectAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/allowances:
    get:
      summary: List allowances
      description: |-
        A quantity rather than an amount of money: bytes, seconds or tokens that are used before
        anything is charged for.

        Usage draws on these first and is only charged once they are exhausted. Where several
        apply, they are drawn on in a fixed order: lower `priority` first, then whichever
        expires soonest, then whichever was granted first. Included quantities therefore go
        before purchased packs, and a pack that is about to expire goes before one that is not.

        An unused quantity is lost when it expires; it is not refunded and does not carry over.

        Quantities belong to the account and are shared by every project it pays for.
      operationId: list-allowances
      tags:
      - allowances
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: meter
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - depleted
          - expired
          - voided
      - name: product
        in: query
        required: false
        description: |-
          Filter by ID or lookup key. A lookup key is scoped to the product.
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/allowances/{allowanceId}/consumptions:
    parameters:
    - name: allowanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: List allowance consumptions
      description: |-
        Each entry names the charge it covered, so the granted amount, what has been used and
        what remains all reconcile.
      operationId: list-allowance-consumptions
      tags:
      - allowances
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceConsumptionList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/orders:
    get:
      summary: List orders
      description: |-
        An order in `pending` still owes money; `amount_due` states how much and
        `reservation_expires_at` states how long it can still be paid.
      operationId: list-orders
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderState'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      summary: Get order
      operationId: get-order
      tags:
      - billing-history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/orders/{orderId}/cancel:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      summary: Cancel scheduled change
      description: |-
        Only for a change scheduled for the end of the period, and only while it is still
        pending. An immediate change has already happened by the time it is placed, and there is
        nothing to call off.

        Nothing was charged or returned when it was scheduled, so nothing moves here either. The
        subscription keeps running on what it is on now, and the item is free to be changed again.
      operationId: cancel-scheduled-change
      tags:
      - orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/orders/{orderId}/items:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      summary: List order items
      description: One entry per item bought, with the price charged and the
        period it covers.
      operationId: list-order-items
      tags:
      - billing-history
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/orders/{orderId}/refund-quote:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      summary: Get order refund quote
      description: |-
        Show this before asking for a refund. Nothing is recorded and nothing is reserved; the
        answer follows from what has been paid and what has already been returned, so it may
        be read as often as required.

        `refundable_amount` is `"0"` once nothing is left, which is also the answer for an
        order already refunded in full.

        Refunding an order also ends what it bought and reclaims whatever it provisioned. That
        is not reflected in the amounts here.
      operationId: get-order-refund-quote
      tags:
      - billing-history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundQuote'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/orders/{orderId}/items:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    - $ref: '#/components/parameters/OrderId'
    get:
      summary: List project order items
      operationId: list-project-order-items
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/allowances:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project allowances
      description: |-
        These belong to the paying account and are shared with every other project it pays for,
        so what is left here may be consumed elsewhere.
      operationId: list-project-allowances
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: meter
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
      - name: product
        in: query
        required: false
        description: |-
          Filter by ID or lookup key. A lookup key is scoped to the product.
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceList'
        default:
          $ref: '#/components/responses/Error'
  /account/v1/entitlements:
    get:
      summary: List entitlements
      description: |-
        Capabilities that come with what has been bought. A capability that is not held simply
        does not appear, so that "this does not exist" and "this has not been bought" cannot be
        confused.

        Derived from live subscriptions rather than stored, so this always agrees with what is
        being paid for. It stops being listed as soon as the subscription providing it ends.
      operationId: list-entitlements
      tags:
      - entitlements
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/AccountIdQuery'
      - name: project_id
        in: query
        required: false
        description: |-
          Restrict to one project. Anything bought at account level, such as a membership,
          appears regardless.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{projectId}/entitlements:
    parameters:
    - $ref: '#/components/parameters/ProjectId'
    get:
      summary: List project entitlements
      description: |-
        Includes capabilities bought for this project and those the paying account holds at
        account level.

        Where a capability counts uses, `remaining_quantity` states how much is left. Whether
        exceeding it refuses the request or simply continues to be charged for is decided by
        the service that owns the capability.
      operationId: list-project-entitlements
      tags:
      - projects
      security:
      - projectAuth: []
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: product
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ObjectReference'
        style: deepObject
        explode: true
        description: Filter by ID or lookup key. A lookup key is scoped to the
          product.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementList'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    accountAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/AccessToken
    projectAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    Translations:
      description: |-
        Names in other languages, keyed by BCP 47 language tag. Where your locale is absent, use
        the plain `name`; there is no fallback between related tags.
      type: object
      additionalProperties:
        type: string
    Money:
      description: A decimal string, in the currency stated alongside it.
      type: string
      example: '10.2500000000'
    CatalogProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lookup_key:
          type: string
        name:
          type: string
        name_translations:
          $ref: '#/components/schemas/Translations'
        description:
          type: string
        description_translations:
          $ref: '#/components/schemas/Translations'
      required:
      - id
      - lookup_key
      - name
    CatalogProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogProduct'
        total_count:
          type: integer
          format: int64
      required:
      - items
    CatalogPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        lookup_key:
          type: string
        name:
          type: string
        name_translations:
          $ref: '#/components/schemas/Translations'
        description:
          type: string
        description_translations:
          $ref: '#/components/schemas/Translations'
      required:
      - id
      - product_id
      - lookup_key
      - name
    CatalogPlanList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPlan'
        total_count:
          type: integer
          format: int64
      required:
      - items
    CatalogPrice:
      type: object
      properties:
        lookup_key:
          description: External lookup alias within the service. Existing
            references use the price ID.
          type: string
          minLength: 1
          maxLength: 128
        product_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        currency:
          type: string
        type:
          description: |-
            `metered` charges for what is used, `prepaid` buys a period in advance, `one_time`
            charges once.
          type: string
          enum:
          - metered
          - prepaid
          - one_time
        billing_scheme:
          description: |-
            How the amount is arrived at. `rated` means the rate depends on attributes such as
            region or machine type, and is looked up on a price list.
          type: string
          enum:
          - per_unit
          - tiered
          - rated
        unit_amount:
          description: Present for `per_unit`.
          allOf:
          - $ref: '#/components/schemas/Money'
        tiers_mode:
          description: |-
            `none` for a price that is not tiered, which is most of them.

            Otherwise `graduated` charges each band at its own rate, and `volume` charges
            everything at the rate of the band the total falls in.
          type: string
          enum:
          - none
          - graduated
          - volume
        tiers:
          description: Present for `tiered`, in ascending order.
          type: array
          items:
            $ref: '#/components/schemas/Tier'
        rate_card_id:
          description: For `rated` prices, the price list the rates are read
            from.
          type: string
          format: uuid
        min_quantity:
          description: |-
            The smallest quantity that can be bought. Absent means no lower bound.
          allOf:
          - $ref: '#/components/schemas/Money'
        max_quantity:
          description: |-
            The largest quantity that can be bought. Absent means no upper bound.

            An order beyond it is refused with its own code, apart from the codes for running
            out of stock and for exceeding what the infrastructure allows.
          allOf:
          - $ref: '#/components/schemas/Money'
        quantity_step:
          description: |-
            Quantities must be a multiple of this. Absent means any quantity within the bounds.
          allOf:
          - $ref: '#/components/schemas/Money'
        allowances:
          description: |-
            Quantities included when this price is bought — the traffic or requests that are
            used before anything is charged for.
          type: array
          items:
            $ref: '#/components/schemas/IncludedAllowance'
        features:
          description: Capabilities that buying this price makes available.
          type: array
          items:
            $ref: '#/components/schemas/IncludedFeature'
        term:
          description: For prepaid prices, how many periods one purchase covers.
          type: integer
        period:
          type: string
          enum:
          - none
          - day
          - month
          - year
        setup_fee:
          $ref: '#/components/schemas/Money'
      required:
      - id
      - plan_id
      - currency
      - type
      - billing_scheme
    CatalogPriceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPrice'
        total_count:
          type: integer
          format: int64
      required:
      - items
    CatalogRate:
      type: object
      properties:
        meter:
          $ref: '#/components/schemas/ObjectIdentity'
        unit:
          description: The unit readings arrive in, such as `core-second`.
          type: string
        dimensions:
          description: The attributes this rate applies to, such as region and
            machine type.
          type: object
          additionalProperties:
            type: string
        pricing_model:
          type: string
          enum:
          - per_unit
          - graduated
          - volume
        unit_amount:
          description: Present for `per_unit`. Tiered rates carry their amounts
            on the tiers.
          allOf:
          - $ref: '#/components/schemas/Money'
        tiers:
          description: Present for `graduated` and `volume`, in ascending order.
          type: array
          items:
            $ref: '#/components/schemas/Tier'
        unit_quantity:
          description: |-
            How many measured units one amount covers. An hourly rate on a per-second meter is
            `"3600"`.
          type: string
        currency:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - meter
      - dimensions
      - pricing_model
      - currency
      - effective_from
    CatalogRateList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRate'
        total_count:
          type: integer
          format: int64
      required:
      - items
    QuoteLine:
      description: |-
        Identify a price directly, or select a price for a plan. Lookup keys are scoped to the product. Account quotes apply applicable contract prices.
      type: object
      properties:
        price:
          $ref: '#/components/schemas/ObjectReference'
        product:
          $ref: '#/components/schemas/ObjectReference'
        plan:
          $ref: '#/components/schemas/ObjectReference'
        meter:
          $ref: '#/components/schemas/ObjectReference'
        dimensions:
          description: |-
            The attributes the price depends on — region, instance type, token class.

            Required when the price draws its rates from a price list, which is how anything
            sold by region or by machine type is priced. A price that carries a single unit
            amount, or a ladder, has no attributes to give and takes none.

            Every attribute the meter declares must be present. A combination with no rate
            covering it is refused rather than priced at zero.
          type: object
          additionalProperties:
            type: string
        price_type:
          description: |-
            Narrows the selection when a plan offers more than one billing type.
          type: string
          enum:
          - metered
          - prepaid
          - one_time
        billing_period:
          description: |-
            For prepaid items, such as `1_month` or `1_year`. Required when the item is offered
            for more than one period.
          type: string
        quantity:
          type: string
        duration_seconds:
          description: |-
            For metered items, how long to price for. This allows an estimate such as "about
            this much per month" to be shown before anything exists.
          type: integer
          format: int64
      required:
      - quantity
    QuoteChange:
      description: |-
        Estimate a change to a subscription item using a target plan or price.
      type: object
      properties:
        subscription_item_id:
          description: What is being changed.
          type: string
          format: uuid
        price:
          $ref: '#/components/schemas/ObjectReference'
        plan:
          $ref: '#/components/schemas/ObjectReference'
        quantity:
          description: The new quantity. The current one is kept when omitted.
          type: string
        effective_at:
          description: |-
            When the change would take effect. Defaults to now. Charging is split at this
            moment: before it at the old configuration, after it at the new one.
          type: string
          format: date-time
      required:
      - subscription_item_id
    QuoteRequest:
      description: |-
        Give `lines` to price new purchases, or `changes` to price alterations to what is
        already running. Both may appear in one request; the total covers everything.
      type: object
      properties:
        lines:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteLine'
        changes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteChange'
      additionalProperties: false
    EstimateRequest:
      type: object
      properties:
        currency:
          description: Must be one the catalogue publishes.
          type: string
          minLength: 3
          maxLength: 3
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/QuoteLine'
      required:
      - currency
      - lines
      additionalProperties: false
    QuoteLineResult:
      type: object
      properties:
        index:
          description: Which line of the request this answers.
          type: integer
        priced:
          description: |-
            Whether a price was found for this line. Read this before anything else.

            A single item with no price no longer fails the whole request. A catalogue
            almost always has something not yet priced, and refusing the request would
            leave no way to render a list in which a few entries are simply not on sale.

            When false, `price_id`, `unit_amount` and `amount` are absent and
            `unpriced_reason` states what is missing.
          type: boolean
        unpriced_reason:
          description: |-
            Why no price was found; `none` while `priced` is true.

            The last four are told apart because their remedies differ: the price points
            at no price list, the list holds no rate for that meter, that exact combination
            of attributes is not configured, or it is configured but nothing is in effect
            at the moment asked about.
          type: string
          enum:
          - none
          - no_price
          - no_rate_card
          - no_meter
          - no_dimensions
          - no_effective_rule
        price_id:
          description: |-
            The price selected. Returned whenever `priced` is true, including when the
            request identified the item indirectly, so that the choice can be confirmed.
          type: string
          format: uuid
        plan_name:
          type: string
        unit_amount:
          $ref: '#/components/schemas/Money'
        quantity:
          type: string
        amount:
          description: Not rounded. Round only for display.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
      required:
      - index
      - priced
      - currency
    QuoteChangeResult:
      type: object
      properties:
        index:
          type: integer
        subscription_item_id:
          type: string
          format: uuid
        price_id:
          description: The price that would apply. Always returned.
          type: string
          format: uuid
        plan_name:
          type: string
        unused_credit:
          description: |-
            What remains unused of the period already paid for, valued at the price it was
            bought at rather than at today's price.
          allOf:
          - $ref: '#/components/schemas/Money'
        new_charge:
          description: What the new configuration costs for the rest of that
            period.
          allOf:
          - $ref: '#/components/schemas/Money'
        payable_now:
          description: |-
            What would be owed. Zero when the change reduces the price; the difference then
            appears in `refundable_amount`.
          allOf:
          - $ref: '#/components/schemas/Money'
        refundable_amount:
          description: |-
            What would be returned. It goes back to the sources that originally paid rather
            than being offset against `payable_now`, so that a purchase made with credit is
            refunded as credit.
          allOf:
          - $ref: '#/components/schemas/Money'
        period_end:
          description: |-
            When the current period ends. A change does not move it; the next renewal is
            charged at the new price.
          type: string
          format: date-time
        currency:
          type: string
      required:
      - index
      - subscription_item_id
      - price_id
      - payable_now
      - refundable_amount
      - currency
    Quote:
      type: object
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLineResult'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteChangeResult'
        total:
          description: |-
            What would be owed in total. Amounts to be returned are not netted off it.

            Null when any line could not be priced. What would be owed is not knowable then, and a
            total that silently left the unpriced lines out would read as a smaller bill rather than
            an incomplete one — the per-line `priced` flag is easy to skip, a missing total is not.
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        total_refundable:
          description: What would be returned in total.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
      required:
      - currency
    BillingAccount:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          description: What you call this account.
          type: string
        legal_name:
          description: The name invoices are made out to. Copied onto each
            invoice when it is issued.
          type: string
        email:
          description: Where invoices are sent.
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
        address_city:
          type: string
        address_state:
          type: string
        address_postal_code:
          type: string
        address_country:
          description: Two-letter code.
          type: string
        tax_id:
          type: string
        currency:
          description: Fixed when the account was opened.
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - closed
        grace_amount:
          description: |-
            How far past the suspension threshold this account may go before its resources are
            suspended. "0" means none: the account is suspended as soon as it crosses the threshold.
          type: string
        grace_period_seconds:
          description: |-
            How long this account has to top up after crossing the suspension threshold.
            0 means none. Whichever runs out first — this or grace_amount — ends the grace.
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
      required:
      - id
      - currency
      - status
      - created_at
    BillingAccountCreate:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 255
      required:
      - currency
      additionalProperties: false
    BillingAccountUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        email:
          type: string
          maxLength: 255
        address_line1:
          type: string
          maxLength: 255
        address_line2:
          type: string
          maxLength: 255
        address_city:
          type: string
          maxLength: 128
        address_state:
          type: string
          maxLength: 128
        address_postal_code:
          type: string
          maxLength: 32
        address_country:
          type: string
          minLength: 2
          maxLength: 2
        tax_id:
          type: string
          maxLength: 64
      additionalProperties: false
    BillingAccountList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingAccount'
        total_count:
          type: integer
          format: int64
      required:
      - items
    AccountBalance:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
        currency:
          type: string
        cash:
          description: Funds paid in and not yet spent. This is the part that
            can be refunded.
          allOf:
          - $ref: '#/components/schemas/Money'
        held:
          description: Reserved by orders that have not completed.
          allOf:
          - $ref: '#/components/schemas/Money'
        accrued:
          description: |-
            Metered usage priced this month but not yet invoiced. It is already committed even
            though no invoice exists for it yet.
          allOf:
          - $ref: '#/components/schemas/Money'
        credit:
          description: Granted credit. Spendable, but not withdrawable.
          allOf:
          - $ref: '#/components/schemas/Money'
        voucher:
          description: Voucher balance, spendable within each voucher's own
            scope.
          allOf:
          - $ref: '#/components/schemas/Money'
        spendable:
          description: |-
            `cash` less `accrued` and `held` — what is actually available at checkout. It goes
            negative when usage has exceeded the balance. Credit and vouchers are shown
            separately because each can only pay for what it covers.
          allOf:
          - $ref: '#/components/schemas/Money'
      required:
      - billing_account_id
      - currency
      - cash
      - held
      - accrued
      - credit
      - voucher
      - spendable
    ProjectBinding:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        account_name:
          type: string
        currency:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - project_id
      - billing_account_id
      - currency
      - effective_from
    ProjectBindingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBinding'
        total_count:
          type: integer
          format: int64
      required:
      - items
    ProjectPayerSet:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
      required:
      - billing_account_id
      additionalProperties: false
    ProjectPayer:
      description: |-
        A narrow view of the paying account, restricted to what a project member needs in order
        to know whether the project's resources will keep running.
      type: object
      properties:
        billing_account_id:
          description: Identifies the payer. Use it to link into the billing
            centre.
          type: integer
          format: int64
        name:
          type: string
        currency:
          description: |-
            Everything this project is charged is in this currency, and it cannot change while
            the account exists.
          type: string
        spendable_amount:
          description: |-
            What remains to be spent. It already accounts for this month's uninvoiced usage, so
            it is what will be available at checkout rather than the cash figure shown in the
            billing centre. It goes negative when usage has exceeded the balance.
          allOf:
          - $ref: '#/components/schemas/Money'
        status:
          description: |-
            `active` — nothing is owed. `past_due` — the account owes money and resources are
            still running. `suspended` — resources have been stopped for non-payment.
          type: string
          enum:
          - active
          - past_due
          - suspended
        suspends_at:
          description: |-
            When this project's resources will be stopped unless the account is topped up.
            Absent while `status` is `active`.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - billing_account_id
      - name
      - currency
      - spendable_amount
      - status
    SettleResult:
      type: object
      properties:
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
        invoiced_amount:
          description: Zero when there was nothing outstanding, in which case no
            invoice is created.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
      required:
      - invoiced_amount
      - currency
    TopUp:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        amount:
          description: What is credited to the account, in the account's own
            currency.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
        remaining_amount:
          description: |-
            How much of this top-up has not been spent yet. This is the part that can still be
            returned to where it was paid from.
          allOf:
          - $ref: '#/components/schemas/Money'
        status:
          description: |-
            `pending` until the payment provider confirms. The balance increases on `succeeded`.

            A checkout the payer abandoned ends up `failed` too, with `failure_reason` saying
            so. Nothing was charged in that case.
          type: string
          enum:
          - pending
          - succeeded
          - failed
        provider:
          description: Which payment provider collected it.
          type: string
        presentment_currency:
          description: |-
            The currency the payer was actually charged in, when the checkout page collected a
            local one. Absent when it was the same as the account's.
          type: string
        presentment_amount:
          description: |-
            What was charged, in `presentment_currency`. It will not equal `amount`, and it is
            the figure that appears on the payer's card or wallet statement.
          allOf:
          - $ref: '#/components/schemas/Money'
        failure_reason:
          description: Why it did not go through. Present with `failed`.
          type: string
        checkout_url:
          description: Where the payer completes the payment. Absent once it has
            completed.
          type: string
        created_at:
          type: string
          format: date-time
        settled_at:
          description: |-
            When the funds arrived. Later than `created_at` — by days for a bank transfer — so
            reconciling against a statement uses this rather than the moment it was started.
            Absent until the payment completes.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - billing_account_id
      - amount
      - currency
      - status
      - created_at
    TopUpCreate:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
        amount:
          description: |-
            In the account's currency, and no finer than that currency's smallest unit:
            two decimals for most, none for the yen. A finer amount is refused here rather
            than at the checkout page, where the payer would see the provider's own wording
            instead of an explanation.

            There is a minimum, which differs by currency. Below it the provider's fee
            exceeds the top-up itself, so such a payment costs more to accept than it brings.
            The minimum in force is returned with the rejection.
          allOf:
          - $ref: '#/components/schemas/Money'
        payment_method_id:
          description: Charge a saved method instead of opening a checkout page.
          type: string
          format: uuid
        return_url:
          description: Where to send the payer after checkout.
          type: string
        idempotency_key:
          description: |-
            Retrying with the same key returns the original top-up rather than starting a
            second one.
          type: string
          minLength: 1
          maxLength: 255
      required:
      - billing_account_id
      - amount
      - idempotency_key
      additionalProperties: false
    TopUpList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopUp'
        total_count:
          type: integer
          format: int64
      required:
      - items
    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        provider:
          type: string
        brand:
          type: string
        last4:
          type: string
        exp_month:
          type:
          - integer
          - 'null'
        exp_year:
          type:
          - integer
          - 'null'
        is_default:
          type: boolean
        status:
          type: string
          enum:
          - active
          - expired
          - removed
      required:
      - id
      - billing_account_id
      - provider
      - is_default
      - status
    PaymentMethodList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        total_count:
          type: integer
          format: int64
      required:
      - items
    PaymentMethodSetup:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
        return_url:
          type: string
      required:
      - billing_account_id
      additionalProperties: false
    PaymentMethodSetupResult:
      description: |-
        What the payment provider's browser library needs in order to collect a card. There is
        no address to redirect to: the form is rendered in the page, and the card goes straight
        from the browser to the provider.
      type: object
      properties:
        setup_id:
          description: |-
            The provider's identifier for this attempt. Use it to tell a reloaded page apart
            from a second attempt.
          type: string
        client_secret:
          description: |-
            Authorises this one attempt with the provider, and nothing else. Pass it to the
            provider's library; it is not an API credential and grants no access here.
          type: string
        publishable_key:
          description: |-
            The provider's public key to initialise its library with. It differs between test
            and live, so read it from here rather than compiling it in.
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - setup_id
      - client_secret
      - publishable_key
    PayRequest:
      description: |-
        Safe to call again. While an attempt is still with the payment provider, calling this
        returns that attempt rather than starting a second one, so a customer who reloads the
        page is not charged twice.

        A new attempt is started only once the previous one has failed.
      type: object
      properties:
        payment_method_id:
          description: Which method to charge the remainder to. The default is
            used when omitted.
          type: string
          format: uuid
        use_balance:
          description: |-
            Whether to apply the account balance first. Set it to `false` to charge the full
            amount to a payment method.
          type: boolean
          default: true
        return_url:
          type: string
      additionalProperties: false
    PayTogetherRequest:
      description: |-
        Name at least one invoice or order. They must all belong to the same account and share
        its currency; anything else is refused rather than partly paid.
      type: object
      properties:
        invoice_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        order_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        return_url:
          type: string
        idempotency_key:
          description: |-
            Required when the provider is involved, because that is where the money moves. The
            same key returns the same checkout address instead of opening a second one.
          type: string
          maxLength: 255
      additionalProperties: false
    PaymentStatus:
      description: |-
        Where the payment has got to.

        `succeeded` — collected in full. Nothing further is owed.

        `processing` — submitted to the payment provider and awaiting its answer. **Do not
        submit it again**; poll the invoice or order, or wait to be notified. Some methods take
        minutes and a few take days.

        `requires_action` — the payer has to finish it at `checkout_url`, typically by
        confirming with their bank. It becomes `processing` once they do.

        `failed` — this attempt did not go through. `failure_reason` says why, and paying again
        starts a fresh attempt.

        The provider's own answer is what decides: an attempt is only `succeeded` once the
        provider says so, never because this call returned.
      type: string
      enum:
      - succeeded
      - processing
      - requires_action
      - failed
    PaymentResult:
      type: object
      properties:
        payment_attempt_id:
          description: |-
            This attempt. The same identifier comes back while it is still in flight, which is
            how a repeated call is told apart from a genuine second payment.
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount_paid:
          $ref: '#/components/schemas/Money'
        amount_due:
          description: |-
            What is still outstanding. Zero once the payment succeeds. Unchanged while
            `processing`: nothing is collected until the provider confirms it.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
        balance_applied:
          description: |-
            How much came from the account balance. Applied immediately, and released again if
            the rest of the payment fails, so a failed card does not leave part of the balance
            consumed against an unpaid invoice.
          allOf:
          - $ref: '#/components/schemas/Money'
        checkout_url:
          description: Present with `requires_action`.
          type: string
        retriable:
          description: |-
            Whether paying again is worth attempting. False for a refusal that will keep
            happening — a closed account, an amount over a limit — so that a client does not
            retry in a loop.
          type: boolean
        retry_after:
          description: |-
            The earliest sensible moment to try again. Present when the provider asked for a
            wait.
          type:
          - string
          - 'null'
          format: date-time
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        failure_reason:
          type: string
      required:
      - payment_attempt_id
      - status
      - amount_paid
      - amount_due
      - currency
    InvoiceStatus:
      type: string
      enum:
      - draft
      - open
      - paid
      - void
      - uncollectible
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        number:
          description: Numbered per account and per month.
          type: string
        type:
          description: What produced it — metered usage for a period, a
            purchase, or a correction.
          type: string
          enum:
          - usage
          - order
          - adjustment
        currency:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        subtotal:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        tax_amount:
          $ref: '#/components/schemas/Money'
        credit_applied:
          description: Paid from credit or a voucher.
          allOf:
          - $ref: '#/components/schemas/Money'
        total:
          description: Subtotal less discount, plus tax, less credit applied.
          allOf:
          - $ref: '#/components/schemas/Money'
        amount_paid:
          $ref: '#/components/schemas/Money'
        period_start:
          type: string
          format: date-time
        period_end:
          description: Exclusive.
          type: string
          format: date-time
        customer_name:
          description: |-
            Who this was billed to, as recorded when the invoice was issued. Later changes to
            the account do not alter it.
          type: string
        customer_email:
          type: string
        customer_tax_id:
          type: string
        customer_address_line1:
          type: string
        customer_address_line2:
          type: string
        customer_address_city:
          type: string
        customer_address_state:
          type: string
        customer_address_postal_code:
          type: string
        customer_address_country:
          type: string
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - billing_account_id
      - number
      - currency
      - status
      - total
      - period_start
      - period_end
    InvoiceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        total_count:
          type: integer
          format: int64
      required:
      - items
    InvoiceItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - usage
          - subscription
          - one_time
          - adjustment
          - credit
        project_id:
          type:
          - string
          - 'null'
          format: uuid
        resource_id:
          type: string
        description:
          description: |-
            The wording as recorded when the invoice was issued. It is not re-translated
            afterwards, so that an invoice continues to read as it did when it was sent.
          type: string
        unit:
          type: string
        quantity:
          type: string
        deducted_quantity:
          description: The part covered by an included allowance, and therefore
            not charged.
          type: string
        unit_amount:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        period_start:
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - description
      - amount
      - currency
    InvoiceItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        total_count:
          type: integer
          format: int64
      required:
      - items
    TransactionType:
      description: |-
        What moved the money. These are the events that change the account's cash balance.

        Charges for usage and amounts reserved by orders are not here: usage appears among the
        charges and on invoices, and a reservation appears as an allocation.
      type: string
      enum:
      - topup
      - refund
      - payout
      - adjustment
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          description: Signed. Positive increases the balance, negative reduces
            it.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
        reason:
          description: Why the money moved, on a manual adjustment.
          type: string
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        status:
          description: |-
            `pending` is a payment still with the provider. Only one may be pending against any
            one invoice or order.

            `failed` covers a payment the provider refused and one the payer walked away from
            alike; `failure_reason` says which. There is no separate cancelled state, because
            what to do next is the same either way — start a new one.
          type: string
          enum:
          - pending
          - succeeded
          - failed
        created_at:
          type: string
          format: date-time
      required:
      - id
      - type
      - amount
      - currency
      - status
      - created_at
    TransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        total_count:
          type: integer
          format: int64
      required:
      - items
    CreditGrant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        source_type:
          description: |-
            Where it came from. `voucher` was redeemed from a code and carries its own
            restrictions; `manual` was issued directly, typically to put something right.
          type: string
          enum:
          - promotion
          - voucher
          - manual
          - membership
        name:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        remaining_amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        applies_to:
          description: What this credit may pay for. No restrictions means
            anything on the account.
          allOf:
          - $ref: '#/components/schemas/Applicability'
        applies_to_summary:
          description: The restrictions in one sentence, ready to display.
          type: string
        status:
          type: string
          enum:
          - active
          - depleted
          - expired
          - voided
        valid_from:
          type: string
          format: date-time
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - amount
      - remaining_amount
      - currency
      - status
      - valid_from
    CreditGrantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditGrant'
        total_count:
          type: integer
          format: int64
      required:
      - items
    Allocation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source_type:
          type: string
          enum:
          - transaction
          - credit_grant
        source_id:
          type: string
          format: uuid
        target_type:
          type: string
          enum:
          - hold
          - order_item
          - invoice_item
        target_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        allocated_at:
          type: string
          format: date-time
        reversed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - source_type
      - source_id
      - target_type
      - target_id
      - amount
      - currency
      - allocated_at
    AllocationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Allocation'
        total_count:
          type: integer
          format: int64
      required:
      - items
    RefundRequest:
      description: |-
        Name exactly one of the three targets. Naming none leaves the amount undecided;
        naming two leaves it ambiguous, and both would have to be resolved by guessing.
      type: object
      properties:
        invoice_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        subscription_period_id:
          description: |-
            The period to end early. Use this to give back a prepaid term that still has
            time left on it.
          type: string
          format: uuid
        amount:
          description: |-
            How much to give back. Absent asks for everything still refundable on the target.

            More than what remains is refused rather than reduced to the remainder: a caller
            asking for more than it can have has miscounted, and quietly giving it less
            hides that.
          allOf:
          - $ref: '#/components/schemas/Money'
        reason:
          type: string
          minLength: 8
          maxLength: 1024
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 255
      required:
      - reason
      - idempotency_key
      additionalProperties: false
    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        requested_amount:
          $ref: '#/components/schemas/Money'
        settled_amount:
          description: What has actually been returned.
          allOf:
          - $ref: '#/components/schemas/Money'
        fee_amount:
          description: |-
            Withheld from what reaches the payer. It applies only to cash returned to a payment
            method, so it is zero when `destination` is `balance`, and it is never taken out of
            credit or a voucher.

            `settled_amount` is the amount put back against what was paid; the payer receives
            that less this.
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
        destination:
          description: Where the cash went.
          type: string
          enum:
          - balance
          - provider
        status:
          description: |-
            `pending` — accepted, not yet sent to the payment provider. `processing` — with the
            provider and awaiting its answer, which takes days for some methods. Neither is
            final, and neither means the money has moved.
          type: string
          enum:
          - pending
          - processing
          - succeeded
          - failed
        reason:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - currency
      - status
      - created_at
      - requested_amount
    RefundList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
        total_count:
          type: integer
          format: int64
      required:
      - items
    RefundSource:
      type: object
      properties:
        type:
          description: |-
            Where this part of the money came from, and therefore where it goes back to.
            Only `cash` can reach a card or a spendable balance; credit and vouchers return
            to themselves and never become cash.
          type: string
          enum:
          - cash
          - credit
          - voucher
        amount:
          $ref: '#/components/schemas/Money'
      required:
      - type
      - amount
    RefundQuote:
      description: What a full refund would return, and where each part of it
        would go.
      type: object
      properties:
        refundable_amount:
          description: The most that can still be returned, before any fee.
          allOf:
          - $ref: '#/components/schemas/Money'
        fee_amount:
          description: |-
            Withheld from the cash part. Zero when `destination` is `balance`, and never taken
            out of credit or a voucher.
          allOf:
          - $ref: '#/components/schemas/Money'
        net_amount:
          description: '`refundable_amount` less `fee_amount`.'
          allOf:
          - $ref: '#/components/schemas/Money'
        currency:
          type: string
        destination:
          description: |-
            Where the cash part would go. `provider` returns it to the method it was paid
            with; `balance` credits the account instead, which is the answer whenever the cash
            came from more than one place or never went through a provider at all.
          type: string
          enum:
          - balance
          - provider
        sources:
          description: |-
            How `refundable_amount` splits by where the money came from. The amounts sum to it.

            Show this rather than a single figure. A part returned as credit or as a voucher
            does not appear on a card statement, so a customer told only the net amount will
            ask why less than that arrived.
          type: array
          items:
            $ref: '#/components/schemas/RefundSource'
        self_service_until:
          description: |-
            The last moment a refund can be asked for here. Measured from when the purchase was
            paid for, not from today. Absent when this cannot be refunded without support at
            all — metered usage, for one, which is never self-service.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - refundable_amount
      - fee_amount
      - net_amount
      - currency
      - destination
      - sources
    UsageCharge:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/ObjectIdentity'
        resource_id:
          description: Which resource this was charged for. Empty for charges
            not tied to one.
          type: string
        meter:
