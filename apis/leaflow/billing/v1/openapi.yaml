openapi: 3.1.0
info:
  title: Leaflow Billing API
  version: 1.0.0
  description: |-
    The billing centre: where a person creates a billing account, sees what is left on it, and
    decides which project it pays for.

    ## Identity

    This face takes the **account token** — the one obtained by signing in at auth.leaflow.net, the
    same token `/account/v1/` on IAM accepts. A project token is not accepted, and that is why every
    path here sits under `/account/v1/` rather than `/api/v1/`: on this platform the prefix states
    which credential to present.

    A billing account belongs to a *person*, not to a project, so nothing weaker would do. Minting a
    project token requires a project that exists and that the caller already belongs to, and somebody
    who has just signed up has no project yet — they still have to be able to open this page and pay.

    **A valid token is not on its own enough.** Every request re-checks that the account behind it is
    still usable, so a token that verifies but belongs to an account that has been suspended, banned
    or is being deleted is refused with `403` and `IAM_USER_UNUSABLE`. Signing in again will not
    clear it.

    ## Concepts

    - **An account is addressed by its key, and the key states who owns it.** The key has the shape
      `u_<user_id>_<seq>`, so an account can only be read by the person who owns it; anyone else is
      refused. `seq` is what lets one person hold several accounts — a personal one and a team one,
      say.
    - **A project is paid for by at most one account; an account pays for any number of projects.**
      Binding is therefore a `PUT` on the account, and binding a project that already belongs to
      another account moves it.
    - **A project with no billing account cannot allocate anything.** Attaching one is not a
      formality to be completed later; until it is done, every other service refuses.
    - **This API is the only way in.** Balances, credit, invoices and ledger entries are reachable
      through it and nowhere else.
    - **No card data is held here, anywhere, ever.** Only a reference to the payment provider's own
      record of the customer.

    ## Hard constraints

    - **Amounts are decimal strings, never numbers.** `"10.25"`, not `10.25`. A JSON number is a
      double in most parsers, and a double cannot hold every value money takes. The loss is silent,
      and it is in the direction of charging the wrong amount.
    - **Rebinding a project only affects what follows.** What has already been billed stays on the
      account that was bound at the time, and so does the money: a balance does not follow a project.
      Making it follow would turn every rebinding into a transfer between accounts, which needs a
      full refund-and-reissue path and hands out an arbitrage opportunity.
    - **`USD` is the only currency.** The field is carried nonetheless, wherever an amount is,
      so that an amount is never ambiguous about what it is denominated in.
    - **Creating an account is idempotent in `(user, seq)`.** Sending the same request twice returns
      the same account rather than a second one, so a retry is safe.
security:
  - bearerAuth: []
paths:
  /account/v1/billing-accounts:
    get:
      summary: List my billing accounts
      description: |-
        Every billing account belonging to the caller, with the projects each one currently pays for.

        Not paginated: how many accounts one person holds is bounded by how many they bothered to
        create, and that is a small number.
      operationId: list-billing-accounts
      tags:
        - BillingAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a billing account
      description: |-
        Creates a billing account for the caller.

        **`seq` is supplied by the client, not assigned here.** Assigning it would mean reading the
        existing accounts and adding one, which is a read-modify-write race: two concurrent "create"
        clicks compute the same `seq`. Having the client name it turns that race into a plain
        idempotent repeat — the second request returns the first account instead of failing.

        The new account pays for nothing. Binding a project is a separate, deliberate act; doing it
        here would quietly turn "I want to add a card" into "I have changed who pays".
      operationId: create-billing-account
      tags:
        - BillingAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBillingAccountRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}:
    get:
      summary: Read one of my billing accounts
      description: |-
        One account, with the projects it currently pays for.

        The list returns the same objects, so this exists for the case the list cannot serve: a link
        straight to one account. Making the caller fetch every account and filter turns a bookmarked
        page into a request whose cost grows with how many accounts they hold.
      operationId: get-billing-account
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Rename a billing account
      description: |-
        Changes the display name. Nothing else about the account can be changed here.

        The key is not among the fields and never will be: ownership is stated by the key, and
        invoices already issued refer to it. The name is what tells two accounts apart in a list, so
        a mistake made while creating one is otherwise permanent.
      operationId: update-billing-account
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBillingAccountRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/credit-transactions:
    get:
      summary: How the balance got to where it is
      description: |-
        Every movement of credit on this account: what was added, what was spent, what expired, what
        was voided. Newest first.

        The balance on its own is a number with no account of itself. Asked why it is lower than
        expected, it cannot answer, and the holder is left to guess between "I was charged" and
        "something expired" — which lead to different next steps.
      operationId: list-credit-transactions
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransactionList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/balance:
    get:
      summary: Read an account's balance
      description: |-
        What is left on the account.

        The figure is the **live** balance: usage that has been reported but not yet settled is
        already subtracted. The settled figure is larger, and the difference is precisely what the
        holder has just spent — showing that instead would tell them they can afford something they
        cannot.

        An account that has never been topped up reports `"0"` — not an absent field, and not an
        empty string.
      operationId: read-billing-account-balance
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/projects/{projectId}:
    put:
      summary: Make this account pay for a project
      description: |-
        Binds a project to this account. A project bound to another account is moved.

        **Both the account and the project must belong to the caller.** Either one failing refuses the
        request. Requiring the project as well as the account is what stops somebody attaching a
        project that is not theirs — which sounds generous, since they would be paying for it, but it
        would also expose that project's usage to them, and let them detach it again at any moment,
        leaving the project with no account and therefore unable to allocate anything.

        Idempotent: binding a project already bound to this account changes nothing.

        Only subsequent usage is affected; see the hard constraint on rebinding.
      operationId: bind-project-to-billing-account
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: projectId
          in: path
          required: true
          description: The project this account should pay for
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBinding'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Stop paying for a project
      description: |-
        Unbinds the project from this account. Nothing pays for it afterwards, and **everything in it
        is refused admission** until some account takes it on — no new machines, no forwarded
        requests.

        That consequence is the reason this exists rather than an argument against it: a project
        bound to the wrong account has no other way out, and moving it to another of the caller's
        accounts is not a correction when the answer is that this account should not be paying for
        it at all.

        Charges already accrued stay where they are. They were incurred while this account held the
        project, and an invoice has to keep pointing at what it was based on.
      operationId: unbind-project-from-billing-account
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: projectId
          in: path
          required: true
          description: The project to stop paying for
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Unbound
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/orders:
    get:
      summary: My orders
      description: |-
        Every provisioning request made against the projects this account pays for, newest first.

        An order that never went through stays here on purpose. Removing it would leave nothing to
        look at in exactly the case someone wants to look: a resource was asked for, was not
        delivered, and the question is what happened.

        The list carries no lines. An order has only a handful, but shipping them on every page
        means carrying data no column shows.
      operationId: list-orders
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/orders/{orderId}:
    get:
      summary: One order, with its lines
      description: |-
        Each line names what was asked for and how much of it. This is the only route that carries
        them.
      operationId: get-order
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/top-ups:
    get:
      summary: My top-ups
      description: |-
        Every top-up this account has made, newest first.

        Reading one top-up requires already holding its identifier, and the only place that
        identifier appears is the redirect that started it — so without this list a top-up becomes
        unfindable the moment the browser tab is closed, which is exactly when somebody wants to
        check whether their money arrived.
      operationId: list-top-ups
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Start a top-up
      description: |-
        Begins adding money to this account. Returns a URL to send the browser to; the card is
        entered there, on the payment provider's own page.

        **No card data ever reaches this platform**, in any field, in any log. That is the entire
        reason this returns a redirect instead of accepting card details.

        **Credit is not added here.** It is added once the payment provider confirms the money
        arrived, which happens out of band and usually within seconds. The balance is unchanged when
        this call returns, and polling it immediately will show the old figure.

        That ordering is deliberate. Credit is spendable as soon as it exists, so anything added
        before the charge succeeds is money the holder can spend against a payment that then fails.

        Abandoning the page costs nothing; nothing is created on the account until the money arrives.
      operationId: start-top-up
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartTopUpRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/charges:
    get:
      summary: What this period has run up so far
      description: |-
        The itemised version of `unsettled`: what has been used this period and not yet billed.

        It has to come from charges rather than from invoices. An invoice only exists once a period has
        been billed, and the one for the period in progress is in a state that does not appear in the
        invoice list at all — reading invoices would show nothing and suggest the account has used
        nothing, while the spend keeps climbing.
      operationId: list-charges
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: page
          in: query
          required: false
          description: 1-based page number; the first page when omitted.
          schema:
            type: integer
            minimum: 1
        - name: page_size
          in: query
          required: false
          description: |-
            How many charges per page. Defaults to a full page.

            Charge count grows with resource count — an account running dozens of machines produces
            hundreds of lines in a period, and a screen shows a dozen. Fetching all of them on every
            visit carries data nothing displays.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/charges/{chargeId}/usage:
    get:
      summary: What produced this charge
      description: |-
        Splits one charge back into the projects that produced it, and lists the resources it could
        have come from.

        ## Why this is not a field on the charge

        A charge has no project, and that is not an omission: the billing subject is the **account**,
        and the project is a dimension on each usage event. When three of an account's projects use
        the same product, their usage aggregates into one charge — that charge genuinely spans three
        projects, and stamping any single project id on it would be wrong.

        A split is also more useful than a label would be: it gives proportions, and proportions are
        what decide which project's resources to switch off.

        ## The quantity here is what was reported, not what was billed

        Conversion (machine-seconds to machine-hours) happens on the pricing side, and the engine
        does not echo `unit_config` back on a charge. So this figure times the unit price does not
        equal the total — a step is missing in between, and that step only becomes visible on the
        invoice, where the whole pricing configuration is frozen onto each line.

        Reported quantity is still the right number for "which project is burning this", which is
        what the split is for.

        ## The resource list says which, not how much

        Usage events carry no resource id — it is not a grouping dimension, and making it one would
        mean one time series per machine per hour. So the engine cannot attribute a charge to a
        machine. What it can be attributed to is a product, and which resources of that product
        exist is something billing knows from its own records.

        Destroyed resources are listed too: this period's charge includes the part they ran for.
        Leaving them out is what makes the numbers fail to add up for someone who deleted a machine
        mid-month — which is exactly the case they are trying to explain.

        ## A flat fee answers with an empty split

        There is no meter behind it, so there is nothing to attribute. That is an answer, not an
        error.
      operationId: get-charge-usage
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: chargeId
          in: path
          required: true
          description: Which charge, from the charges list
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeUsage'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/invoices:
    get:
      summary: List this account's invoices
      description: |-
        Past periods, most recent first. The period in progress is not here — see the charges
        endpoint for that.
      operationId: list-invoices
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/invoices/{invoiceId}:
    get:
      summary: Read one invoice with its lines
      description: |-
        A total does not answer "why is it this much", and that is the question a bill provokes. Each
        line carries its service period, without which lines of the same name — hundreds of them on an
        hourly bill — cannot be told apart, and how much of it credit covered, which is the answer to
        "I have a balance, why am I being charged".
      operationId: get-invoice
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/projects/{projectId}/billing-account:
    get:
      summary: Which account pays for this project
      description: |-
        The account a project's resources are charged to, resolved from the project rather than
        guessed.

        ## Why a console needs this

        Everything in a console happens inside a project, while billing accounts belong to a person —
        and a person can have many. Showing "the first one" next to a sentence like *you are
        overdrawn, new resources will be refused* pairs one account's balance with another account's
        rule. Both directions are wrong and one of them is silent: the figures look healthy while
        creating anything is refused, and the refusal names a reason the page just contradicted.

        ## Being a member is enough to ask, but not to see the money

        The answer is the account's identity, not its balance. A project's members are not
        necessarily the people paying for it — a company account can pay for a project someone else
        works in — and their balance is not those members' business. Whoever owns the account reads
        the figures from the balance route as before; `owned_by_me` says which case this is, so a
        page can tell "you are overdrawn" apart from "ask whoever pays for this project".

        ## A project with no account is a normal state, and it answers 404

        A project nobody has bound yet cannot create resources at all — admission refuses it. That is
        worth saying plainly ("this project has no billing account, bind one") rather than falling
        back to some other account of theirs, which is how the wrong-account problem started.
      operationId: read-project-billing-account
      tags:
        - BillingAccount
      parameters:
        - name: projectId
          in: path
          required: true
          description: The project being worked in
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBillingAccount'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/projects/{projectId}/quote:
    post:
      summary: What a usage would cost in this project
      description: |-
        Prices a set of usages against whatever plan pays for this project, and returns **every
        intermediate step** rather than a single number.

        # Why by project rather than by billing account

        The page that needs this is the one where somebody is about to create a machine, and all it has
        is a project. Which account pays for that project is billing's own bookkeeping — asking the
        caller to resolve it first would put that mapping into a page that otherwise has no business
        knowing accounts exist.

        # Quantities are raw

        Seconds, token counts, GiB-seconds: the amount a service reports. Conversion happens here, which
        is why services keep no conversion tables of their own and why the caller must not do the
        arithmetic itself.

        Name each usage by `service` and `product_id` rather than by key: the key is a hash of a
        convention that has exactly one implementation on purpose.

        # It is an estimate

        The engine computes the real amount; this reproduces the same rules. Every step comes back for
        that reason — a single number that disagrees with the bill says nothing about which step was
        wrong.

        `404` means the project has no billing account, or its account is on no plan. Both are worth
        showing: nothing can be created in either case, because admission refuses it.
      operationId: quote-project-usage
      tags:
        - Billing
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/quote:
    post:
      summary: What a usage would cost on this account's plan
      description: |-
        Prices a set of usages against whatever plan this account is currently on, and returns **every
        intermediate step** rather than a single number.

        # What it is for

        Showing someone what a machine will cost before they create it. The console asks for the usage a
        machine of that shape produces in an hour, and gets back what that hour costs them — on their
        plan, with their discounts.

        # Quantities are raw

        Seconds, token counts, GiB-seconds: the amount a service reports. Conversion happens here, which
        is why services keep no conversion tables of their own and why the console must not do the
        arithmetic itself.

        # It is an estimate

        The engine computes the real amount; this reproduces the same rules. Every step comes back for
        that reason — a single number that disagrees with the bill says nothing about which step was
        wrong.

        `404` means this account is not on any plan, and there is therefore nothing to price against.
      operationId: quote-usage
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/subscription:
    get:
      summary: Which plan this account is on
      description: |-
        `404` means no plan, which is worth showing rather than hiding: an account without one is
        refused admission, so nothing can be allocated in it.

        A subscription that has been cancelled but has not reached the end of its period still counts
        as being on a plan — it is still serving, still billing, and the period has already been paid
        for.
      operationId: read-subscription
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/subscription/cancel:
    post:
      summary: Come off the paid plan
      description: |-
        Moves the account off whatever plan it is on.

        Where a default plan is configured this is a switch to it rather than a cancellation — an
        account with no plan is refused admission, so cancelling outright would cut off someone who
        only meant to drop back to the free tier. Without a default plan it is a real cancellation and
        the account is left with no plan on purpose.

        `timing` has to be stated. Ending immediately on an account that has already paid for the
        current period takes back what they paid for; ending at the end of the period does not. There
        is no default because the two are materially different and picking one silently would make the
        wrong one happen whenever the field is forgotten.

        Without this, someone who bought a paid plan can only stop paying by contacting support —
        which is how a cancellation becomes a chargeback.
      operationId: cancel-subscription
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: timing
          in: query
          required: true
          description: When it takes effect
          schema:
            type: string
            enum:
              - immediate
              - next_billing_cycle
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/top-ups/{paymentId}:
    get:
      summary: How far along a top-up is
      description: |-
        Credit arrives asynchronously, shortly after the payment provider confirms the money. Coming
        back from the payment page the balance has usually not moved yet, and without this there is no
        way to tell "it is on its way" from "it failed" — the only recourse is refreshing the balance
        and guessing.

        `settled` means the credit has landed. `pending` means the money arrived and the credit has
        not been issued yet, or the payment method is an asynchronous one and the money itself is
        still in transit.
      operationId: read-top-up
      tags:
        - Billing
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: paymentId
          in: path
          required: true
          description: The payment id returned when the top-up was started
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpStatus'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/payment-method:
    get:
      summary: Whether this account can be charged
      description: |-
        Answers whether a payment method is on file, and nothing else.

        ## It is a payment method, not a card

        A card is one kind. Direct debit and the recurring-payment mandates offered by regional
        wallets are others, and they occupy the same slot: something the provider can charge later
        without the account holder present. Naming the slot after cards would put an assumption
        into the contract that stops being true the day a second kind is accepted.

        ## Why there is no brand, no last four digits, no expiry

        Those would have to be read from the payment provider, and the two answers can disagree: a
        method present at the provider that the billing engine has not recorded as the default is
        exactly the state in which money cannot be collected — while a page built on the provider's
        answer would be showing one. What matters here is whether the party that will run the
        charge believes it can, so the answer comes from that party alone.

        To see it, replace it, or remove it, open the billing portal.

        ## Read this before offering a paid plan, not after

        `ready` being false is why the engine refuses to start a paid subscription. Discovering it
        at purchase time turns a missing payment method into a rejection whose wording is about
        something else entirely.

        An account that has never had one returns `ready: false`. That is the normal state of a
        new account, not an error.
      operationId: read-payment-method
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Add or replace the payment method on file
      description: |-
        Begins adding a payment method. Returns a URL to send the browser to; the details are
        entered there, on the payment provider's own page, and **no card data ever reaches this
        platform**.

        Which kinds are offered is the provider's decision, not this API's — a card today, a
        wallet mandate or a direct debit wherever the provider supports charging one later without
        the account holder present.

        ## This is a prerequisite for buying a plan, not a convenience

        A plan is charged by invoice, and the invoice is collected from the method on file. A
        subscription cannot start for an account that has none — so "add a payment method, then
        buy" is the order the system requires, not a flow that was chosen.

        It is *not* a prerequisite for topping up: a top-up collects the money there and then.

        Replacing uses the same operation. The new method becomes the default and the old one stops
        being used; nothing else about the account changes.
      operationId: start-payment-method-setup
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSetupSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/billing-portal:
    post:
      summary: Open the hosted billing portal
      description: |-
        Returns a URL to the payment provider's own portal, where the card can be replaced or
        removed, the billing address changed, and past invoices downloaded.

        ## Why replacing a card is not a form on this platform

        A form would mean a card number field, and no card data ever reaches this platform. The
        portal moves the whole interaction to the provider; only a session URL comes back.

        ## Something has to be able to replace an expiring card

        Cards expire. Once one does, the invoices for a plan stop being collectable, dunning runs
        out, and the projects paid for by this account are suspended for non-payment. Without this
        operation the account holder watches that happen with nowhere to fix it — adding a card
        does not help, since that operation only makes sense when there is none.

        The URL is single-use and expires. Do not store it.
      operationId: start-billing-portal
      tags:
        - BillingAccount
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingPortalSession'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/offers:
    get:
      summary: List the offers this account can buy
      description: |-
        Lists what is actually purchasable by this account, right now.

        ## Every offer here has passed the full eligibility check

        The list is not "everything on sale" filtered by status. A promotion whose places are gone, a
        first-month discount this person already used, a beta price they are not on the list for —
        none of them appear. Returning them and rejecting the purchase afterwards reads as a broken
        system rather than as a rule.

        The price is not here, and not because it was left out: an offer states **who may buy, and
        when**. What it costs comes from the plan it points at, and is reported by the offers list.
      operationId: list-offers
      tags:
        - Offer
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/offers/{offerKey}/purchase:
    post:
      summary: Buy an offer
      description: |-
        Puts the account on the plan this offer points at, taking one of its places if it has a limit.

        ## A card has to be on file first

        Unless the offer points at a free plan. A paid plan is collected from the card on file
        and refuses to start the subscription without one; that refusal arrives here as a
        precondition error rather than as a conflict.

        ## `timing` is required only when the account already has a plan

        Moving between plans immediately is what an upgrade wants — the customer paid more and wants
        it now. Waiting for the end of the period is what a downgrade wants — they already paid for
        this one. Neither is a safe default, and picking one silently gets the money wrong whenever
        the field is forgotten.

        ## Being refused says which rule refused

        Places gone, window closed, already used, not on the list — each needs the customer to do
        something different, and several of them need them to do nothing at all. A single "not
        eligible" sends everyone to support.

        ## Retrying is safe

        A place is taken before the subscription is created, so a failure in between leaves the place
        held rather than the discount given away. Retrying the same purchase finishes it instead of
        taking a second place.
      operationId: purchase-offer
      tags:
        - Offer
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - name: offerKey
          in: path
          required: true
          description: Which offer
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timing
          in: query
          required: false
          description: |-
            When the switch takes effect. Required if the account already has a plan, ignored otherwise
          schema:
            $ref: '#/components/schemas/PlanChangeTiming'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/prepaid-assets:
    get:
      summary: What I bought outright, and when it runs out
      description: |-
        Everything this account paid a term for, across every product, soonest to expire first.

        ## Why this is one list rather than a page inside each product

        Renewal is the one thing a customer forgets, and forgetting it stops the machine. Splitting
        the list per product means the instance about to lapse tomorrow is only visible to someone
        who thought to go and look at instances. Sorting by expiry rather than by purchase date is
        the same reason: the row that matters is the one at the top.

        ## Metered resources are not here

        There is no term to run out. Listing them with an empty expiry would invite renewing
        something that is already billed by the hour until it is deleted.

        ## `state` and `desired_state` are both reported

        A machine stopped because its term lapsed reads `suspended` for both. One that has just been
        renewed reads `suspended` and `active` — it is on its way back. Without the second field
        those look identical, and a customer who just paid concludes it did not work and pays again.
      operationId: list-prepaid-assets
      tags:
        - Prepaid
      parameters:
        - $ref: '#/components/parameters/AccountKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaidAssetList'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/prepaid-assets/{provisionId}/renewal:
    put:
      summary: Choose what happens when it expires
      description: |-
        Three choices, not two.

        ## Why automatic renewal has to be opted into

        Charging someone automatically has to be something they chose. Defaulting to it means a
        person who wanted to try one month is charged for a second they never agreed to — and that
        is where chargebacks come from. So a resource bought outright starts on `manual`.

        ## And why "let it expire" is its own choice, not just "not automatic"

        `manual` keeps reminding: the notice before expiry is mandatory, because expiry stops the
        resource. Someone who has decided to let it go does not want those, and the cost of sending
        them anyway is not annoyance — it is that the reminders get filtered away, taking the ones
        that mattered with them.

        ## Turning it on needs a known cycle

        Renewing automatically has to know for how long, which comes from the last purchase or
        renewal. A resource adopted into billing, or bought before this was recorded, has no cycle
        yet: renew it manually once and the cycle is written down.
      operationId: set-renewal-status
      tags:
        - Prepaid
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - $ref: '#/components/parameters/ProvisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetRenewalStatusRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaidAsset'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/prepaid-assets/{provisionId}/renewal-quote:
    get:
      summary: What renewing this would cost
      description: |-
        Priced the same way the charge is, from the same table, so the number shown is the number
        taken. Quoting separately from charging is what lets a customer see the price before
        committing; computing it twice in two places is what makes the two disagree, and a bill that
        disagrees with the page that sold it is a complaint rather than a bug report.

        ## Both the current and the resulting expiry are returned

        Renewing early adds the term to what is left, not to today — otherwise renewing a month
        ahead throws that month away, and everyone learns to wait until the last moment. Something
        that lapsed long ago is counted from now instead, because adding to a date in the past
        produces an expiry that is still in the past.

        Reporting only the new date leaves the customer unable to tell which of those happened.

        ## A withdrawn price still quotes

        Taking a product off sale means stop selling new ones. Refusing renewals as well would stop
        a batch of existing machines on their expiry date, which is not what the operator pressed
        that button for.
      operationId: quote-renewal
      tags:
        - Prepaid
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - $ref: '#/components/parameters/ProvisionId'
        - name: term
          in: query
          required: true
          description: |-
            How long to renew for, as an ISO 8601 duration (P1M, P1Y). A duration rather than a
            number of months: months are not the same length.
          schema:
            type: string
            minLength: 2
            maxLength: 16
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewalQuote'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /account/v1/billing-accounts/{accountKey}/prepaid-assets/{provisionId}/renew:
    post:
      summary: Renew it
      description: |-
        Takes the money from the balance and pushes the expiry out. The resource itself is not
        touched — nothing is rebuilt, nothing restarts, the id stays the same.

        ## An idempotency key is required, not optional

        Renewal is a pure charge. Unlike creating something, there is no resource whose uniqueness
        catches a repeat, so a double click is two charges and twice the term — and both calls
        return success. Letting the field be omitted would mean losing that protection silently, in
        the one case that looks completely normal until the books are reconciled.

        Sending the same key again returns the order that was already placed. It does not charge
        again, and it is not an error: reporting a repeat as a failure makes the caller retry
        forever, and makes the customer press the button a second time with a fresh key.

        ## What happens if the balance is short

        The order is recorded as failed and nothing else changes: no money moves, the expiry stays
        where it was, and the resource keeps running until its existing term ends. Retrying with the
        same key after topping up goes through.

        ## Renewing something that already lapsed brings it back

        Its term is counted from now, and it is asked to start again. Coming back is the
        reconciliation loop's job, so it is not instant — which is what `desired_state` on the asset
        list is for.
      operationId: renew-prepaid-asset
      tags:
        - Prepaid
      parameters:
        - $ref: '#/components/parameters/AccountKey'
        - $ref: '#/components/parameters/ProvisionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        The account token: the one obtained by signing in at auth.leaflow.net. It says who you are
        and names no project, which is what this API needs — a billing account belongs to a person,
        not to a project. A project token is never accepted here.
  parameters:
    ProvisionId:
      name: provisionId
      in: path
      required: true
      description: Which asset, from the prepaid list
      schema:
        type: string
        format: uuid
    AccountKey:
      name: accountKey
      in: path
      required: true
      description: |-
        The account's key, of the form `u_<user_id>_<seq>`. Ownership is stated by the key itself,
        which is why the key is what addresses the account.
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^u_.+_[0-9]+$'
  schemas:
    QuoteRequest:
      description: |-
        The usages to price. Quantities are the **raw amounts a service reports** — seconds, token
        counts, GiB-seconds. Conversion happens on the billing side, which is why services keep no
        conversion tables of their own.
      type: object
      additionalProperties: false
      required:
        - lines
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/QuoteUsage'
    QuoteUsage:
      description: |-
        One usage to price. Name the thing **either** by its rate card key **or** by the service and
        product it belongs to — exactly one of the two.

        # Why the second form exists

        A meter's key is a hash of `(service, product_id, variant)`, computed by a function that lives in
        one place on purpose: get it wrong and usage lands in the wrong bucket, or in none, and nothing
        reports it. A caller that derived the key itself would be a second copy of that convention.

        So callers that know what they are buying — a machine of a given type, a model's input tokens —
        give the service and product, and this side derives the key.
      type: object
      additionalProperties: false
      required:
        - quantity
      properties:
        key:
          description: |-
            The rate card's key. For a card tied to a meter that is the meter's key, because the engine
            requires the two to be identical.

            Leave it out when giving `service` and `product_id` instead
          type: string
          minLength: 1
        service:
          description: The service that owns the product, as it appears in its usage events
          type: string
          minLength: 1
        product_id:
          description: That service's own catalogue id for the thing being bought
          type: string
          minLength: 1
        variant:
          description: |-
            The fixed dimension values that split one product into several meters — canopy's token kind,
            for instance. Part of the key, so leaving it out names a different meter
          type: object
          additionalProperties:
            type: string
        quantity:
          description: The raw amount, before any conversion. A decimal string
          type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
    QuoteLine:
      description: |-
        One rate card priced, with every intermediate step.

        Each step is here on purpose: a single total that disagrees with the bill says nothing about
        which step went wrong, and this is a second implementation of the engine's rules
      type: object
      required:
        - key
        - name
        - metered
        - raw
        - converted
        - billable
        - free_units
        - charged
        - unit_price
        - gross
        - discount
        - total
      properties:
        key:
          type: string
        name:
          type: string
        metered:
          description: False for a flat fee, which ignores usage entirely
          type: boolean
        raw:
          description: The quantity as given
          type: string
        converted:
          description: After unit conversion, before rounding
          type: string
        billable:
          description: |-
            After rounding. `unit_config.rounding` applies to this step only — entitlement uses the
            exact converted value, which is the engine's documented behaviour
          type: string
        free_units:
          description: Units covered by the usage discount
          type: string
        charged:
          type: string
        unit_price:
          type: string
        gross:
          description: Before the percentage discount
          type: string
        discount:
          type: string
        total:
          description: |-
            Rounded to the currency's minor unit, **per line**. Not by rounding the sum: the engine
            rounds each line, and the difference grows with the number of lines
          type: string
    Quote:
      type: object
      required:
        - lines
        - total
      properties:
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        total:
          description: The sum of the already-rounded lines
          type: string
        unpriced:
          description: |-
            Keys that were given a usage but have no rate card on this plan.

            **Reported rather than ignored**, because ignoring them yields a smaller but entirely
            normal-looking number — and that is the most expensive misconfiguration there is: usage
            lands, the usage chart shows it, and the bill has no line for it
          type: array
          items:
            type: string
    PlanChangeTiming:
      description: |-
        When a plan change takes effect. There is no default: an upgrade and a downgrade want opposite
        answers, and the difference is money
      type: string
      enum:
        - immediate
        - next_billing_cycle
    OfferList:
      type: object
      additionalProperties: false
      properties:
        offers:
          type: array
          items:
            $ref: '#/components/schemas/Offer'
      required:
        - offers
    Offer:
      description: |-
        One thing this account can buy. It carries no price — the price is on the plan it points at,
        recorded in exactly one place
      type: object
      additionalProperties: false
      properties:
        offer_key:
          description: The stable identifier operations and support use for this offer
          type: string
        name:
          type: string
        description:
          type: string
        badge:
          description: A short label for the pricing page, e.g. the one marking the recommended tier
          type: string
        valid_until:
          description: When this offer stops being purchasable. Absent means it does not expire
          type: string
          format: date-time
        pricing:
          description: Present on offers that sell a plan
          $ref: '#/components/schemas/Pricing'
        top_up:
          description: Present on offers that sell credit
          $ref: '#/components/schemas/TopUpPricing'
      required:
        - offer_key
        - name
    Pricing:
      description: |-
        What this offer costs, as a structure rather than a number.

        A plan is rarely one number: an introductory period at one price followed by another, a monthly
        fee alongside metered usage, an allowance of free units before metering starts. Flattening that
        into a single figure means deciding which part to show, and every such decision is wrong for
        some plan.

        This is read on each request rather than stored alongside the offer. The plan owns
        prices; a second copy would be a second answer, and the two would drift without anything saying
        so — the visible symptom being a pricing page that disagrees with the invoice.
      type: object
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        billing_period:
          description: How often this recurs, as an ISO 8601 duration. `P1M` is monthly
          type: string
        phases:
          description: |-
            In order. A phase with no `duration` runs until the subscription ends, and there is at most
            one of those, last
          type: array
          items:
            $ref: '#/components/schemas/PricingPhase'
      required:
        - currency
        - phases
    PricingPhase:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        duration:
          description: How long this phase lasts, as an ISO 8601 duration. Absent means "until the end"
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PricingLine'
      required:
        - name
        - lines
    PricingLine:
      description: One charge within a phase — a fee, or a rate for something metered
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          description: |-
            `free` costs nothing. `flat` is charged once per period regardless of use. `unit` is charged
            per unit consumed
          type: string
          enum:
            - free
            - flat
            - unit
        amount:
          description: A decimal string. Money is never a float
          type: string
        units_per_charge:
          description: |-
            For `unit` lines whose meter counts something finer than what is charged for: how many
            metered units one charge covers. A price of `10` with `units_per_charge` of `1000000` is
            ten currency units per million.

            Absent means one for one. **Showing the amount without this is wrong by whatever this
            factor is**, which for token pricing is six orders of magnitude
          type: string
        free_units:
          description: How many units are not charged for before charging starts
          type: string
        percent_off:
          description: A reduction applied to this line, 0 to 100
          type: number
          format: float
        one_time:
          description: |-
            True when this is charged once at the start rather than every period. Absent or false means
            it recurs
          type: boolean
      required:
        - name
        - type
    UpdateBillingAccountRequestBody:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - display_name
    Order:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        project_id:
          type: string
        placed_by:
          type: string
        state:
          description: |-
            Whether the request went through. It is not the state of what was provisioned: that
            belongs to each resource and outlives the order.
          type: string
          enum: [pending, fulfilled, failed]
        failure_reason:
          type: string
        amount:
          description: |-
            What was taken, as a decimal string. Absent on a metered order, where the amount is not
            known when the order is placed: it comes from usage afterwards. Absent must be read as
            "billed by usage" — writing zero would make a metered order and a genuinely free one
            look the same.
          type: string
        currency:
          type: string
        payment_state:
          description: Always `none` on a metered order.
          type: string
          enum: [none, paid, refunded]
        created_at:
          format: date-time
          type: string
        lines:
          description: Only present on the single-order route.
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
      required:
        - id
        - project_id
        - placed_by
        - state
        - created_at
    OrderLine:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        action:
          type: string
          enum: [add, renew, modify, remove]
        service:
          description: Which service holds the thing, for example `compute`.
          type: string
        product_id:
          description: That service's own catalogue identifier for what was asked for.
          type: string
        quantity:
          type: integer
          format: int64
      required:
        - id
        - action
        - service
        - product_id
        - quantity
    PrepaidAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          description: Use this to quote and to renew.
          type: string
        project_id:
          type: string
        service:
          description: Which service holds it. Also which console it is managed from.
          type: string
        product_id:
          description: |-
            That service's own catalogue id, not a billing sku. The price of a machine is made of
            finer parts than the machine type — the type does not appear in the rate card at all.
          type: string
        resource_id:
          description: The id that service knows it by, so the two consoles can be lined up.
          type: string
        quantity:
          description: GiB for a disk, 1 for a machine or an address.
          type: integer
          format: int64
        term_end:
          description: Paid up to this instant. It stops being served after it, not before.
          format: date-time
          type: string
        state:
          type: string
          enum: [pending, active, suspended, terminated]
        desired_state:
          description: |-
            What it is being moved to. Differs from `state` while a change is still being applied —
            in particular right after a renewal, which is the moment a customer is most likely to
            conclude that nothing happened.
          type: string
          enum: [active, suspended, terminated]
        billing_cycle:
          description: |-
            How long one renewal buys, as an ISO 8601 duration (P1M, P1Y). Empty on something adopted
            into billing rather than bought through it — automatic renewal cannot be turned on until
            one manual renewal records it.
          type: string
        renewal_status:
          description: |-
            What happens at expiry. `manual` is where everything starts: charging automatically has
            to be chosen. `none` also stops the reminders, which is a different thing from `manual`
            — see the route that sets it.
          type: string
          enum: [manual, auto, none]
      required:
        - id
        - project_id
        - service
        - product_id
        - quantity
        - term_end
        - state
        - desired_state
        - renewal_status
    PrepaidAssetList:
      type: object
      additionalProperties: false
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/PrepaidAsset'
      required:
        - assets
    RenewalQuote:
      type: object
      additionalProperties: false
      properties:
        provision_id:
          type: string
        term:
          type: string
        amount:
          description: |-
            A decimal string, not a float. Money that survives a round trip through binary floating
            point is money that stops adding up.
          type: string
        currency:
          type: string
        current_term_end:
          description: What it is paid up to now.
          format: date-time
          type: string
        term_end:
          description: What it would be paid up to after renewing.
          format: date-time
          type: string
      required:
        - provision_id
        - term
        - amount
        - currency
        - current_term_end
        - term_end
    SetRenewalStatusRequestBody:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [manual, auto, none]
      required:
        - status
    RenewRequestBody:
      type: object
      additionalProperties: false
      properties:
        term:
          description: |-
            How long to renew for, as an ISO 8601 duration (P1M, P1Y). It does not have to match the
            term originally bought.
          type: string
          minLength: 2
          maxLength: 16
        idempotency_key:
          description: |-
            Generate one per renewal the customer starts — when the dialog opens, not when it is
            submitted — and send the same one on every retry of that renewal.
          type: string
          minLength: 8
          maxLength: 255
      required:
        - term
        - idempotency_key
    OrderList:
      type: object
      additionalProperties: false
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
        - orders
    TopUpList:
      type: object
      additionalProperties: false
      properties:
        top_ups:
          type: array
          items:
            $ref: '#/components/schemas/TopUpStatus'
      required:
        - top_ups
    CreditTransactionList:
      type: object
      additionalProperties: false
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/CreditTransaction'
      required:
        - transactions
    CreditTransaction:
      description: |-
        One movement of credit. Immutable — a correction is another movement, never an edit of this
        one, which is what lets the balance be recomputed from the list at any time
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/CreditTransactionType'
        amount:
          description: A decimal string. Never a float — a balance that rounds is a balance that drifts
          type: string
        currency:
          type: string
        booked_at:
          description: When it landed on the ledger, which is not always when it was requested
          type: string
          format: date-time
        balance_after:
          description: |-
            What the balance became. Recorded by the metering engine rather than recomputed here —
            recomputing assumes our understanding of the burn-down order matches its own, and this
            is its own account of it
          type: string
      required:
        - id
        - type
        - amount
        - currency
        - booked_at
        - balance_after
    CreditTransactionType:
      description: |-
        `funded` is credit arriving, `consumed` is it being spent, `expired` is a grant reaching the
        end of its life unspent, and `voided` is one cancelled — a refund, or a correction
      type: string
      enum:
        - funded
        - consumed
        - expired
        - voided
    TopUpPricing:
      description: |-
        What a top-up bundle costs and what it grants. Present only on offers that sell credit.

        Unlike a plan price, this is stated on the bundle itself: credit is granted per
        transaction and has no catalog of bundles to read from. There is no second copy to drift
        against, because there is no first one anywhere else
      type: object
      additionalProperties: false
      properties:
        pay:
          description: What is charged, as a decimal string
          type: string
        credit:
          description: How much credit is granted. Equal to `pay` when there is no bonus
          type: string
      required:
        - pay
        - credit
    Purchase:
      type: object
      additionalProperties: false
      properties:
        offer_key:
          type: string
        subscription_id:
          description: |-
            The subscription now serving this account. When the change was set to take effect at the
            end of the period, this is the one that takes over then, and its status says `scheduled`
          type: string
      required:
        - offer_key
        - subscription_id
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    BillingAccount:
      description: |-
        A billing account.

        Any internal identifier is deliberately absent: the key addresses everything on
        this API, and a second identifier is one more thing a client can pass in the wrong place, for
        no benefit to anyone reading the page.
      type: object
      additionalProperties: false
      properties:
        key:
          description: Addresses the account and states who owns it. Of the form `u_<user_id>_<seq>`
          type: string
        display_name:
          description: What the holder called it. Not unique, and it addresses nothing
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        project_ids:
          description: The projects this account pays for. Empty when it pays for none, never `null`
          type: array
          items:
            type: string
            format: uuid
      required:
        - key
        - display_name
        - currency
        - project_ids
    BillingAccountList:
      type: object
      additionalProperties: false
      properties:
        accounts:
          description: Every account belonging to the caller. Empty when they hold none
          type: array
          items:
            $ref: '#/components/schemas/BillingAccount'
      required:
        - accounts
    CreateBillingAccountRequestBody:
      type: object
      additionalProperties: false
      properties:
        seq:
          description: |-
            Which of the caller's accounts this is. Two requests carrying the same `seq` describe the
            same account, so a retry is safe; a different `seq` creates a different account.

            It is not optional. Defaulting it would mean that a client which forgot the field
            silently receives the account it already had, and reads that as a successful creation.
          type: integer
          format: int32
          minimum: 0
          maximum: 99
        display_name:
          description: A name for the holder's own benefit
          type: string
          minLength: 1
          maxLength: 100
        currency:
          $ref: '#/components/schemas/Currency'
        offer_key:
          description: |-
            Buy one of the top-up bundles from `/offers` instead of an arbitrary amount. When given,
            `amount` is ignored: the bundle says what is charged and how much credit it grants.

            How much credit arrives is decided when the money does, not now — and only if the amount
            collected matches what the bundle costs. A bundle whose places ran out, or whose window
            closed, in between still grants what was paid for; it just does not grant the bonus.
          type: string
          minLength: 1
          maxLength: 64
      required:
        - seq
        - display_name
    Balance:
      description: |-
        The three numbers a billing page needs, which are not the same number.

        `balance` answers "can I start another one" and is floored at zero, so it cannot express
        being past zero. `unsettled` is what the current period has run up. `available` is the
        difference between the two and **may be negative**.

        Reporting only the first would make an account that has overspent indistinguishable from one
        that spent exactly what it had, and those two call for different actions.
      type: object
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        balance:
          description: |-
            What is spendable right now, with usage reported but not yet settled already subtracted.
            Never negative — it is floored at zero, so it answers "can I start another machine" but
            not "how much do I owe". A decimal string; `"0"` when the account has never been topped up
          type: string
        cash:
          description: The amount booked to the ledger, before this period's usage is taken off
          type: string
        unsettled:
          description: |-
            What this period has run up and not yet been billed for. It keeps growing past the cash
            balance, which is precisely the case the live figure cannot show
          type: string
        available:
          description: |-
            `cash` minus `unsettled`. **Negative means already in arrears**, and being able to say that
            is the whole reason this field exists — the positive range is already covered by `balance`
          type: string
      required:
        - currency
        - balance
        - cash
        - unsettled
        - available
    ProjectBillingAccount:
      description: The account a project's resources are charged to
      type: object
      additionalProperties: false
      properties:
        account_key:
          type: string
        project_id:
          type: string
        display_name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        owned_by_me:
          description: |-
            Whether the caller owns this account, and therefore whether the balance routes will
            answer for it. False means someone else pays for this project: the figures are theirs,
            not the caller's, and a page should say so rather than showing nothing.
          type: boolean
      required:
        - account_key
        - project_id
        - display_name
        - currency
        - owned_by_me
    ProjectBinding:
      description: Which account pays for which project, as it stands once the request has been applied
      type: object
      additionalProperties: false
      properties:
        account_key:
          type: string
        project_id:
          type: string
          format: uuid
      required:
        - account_key
        - project_id
    StartTopUpRequestBody:
      type: object
      additionalProperties: false
      properties:
        amount:
          description: |-
            How much to add, as a decimal string — `"20"`, `"19.99"`.

            **Anything below one cent is rejected rather than rounded.** Rounding up overcharges and
            rounding down undercharges; both alter the amount somewhere the payer cannot see it, and
            this is the one number on this API where being wrong means money is wrong.
          type: string
          minLength: 1
          maxLength: 32
        currency:
          $ref: '#/components/schemas/Currency'
        offer_key:
          description: |-
            Buy one of the top-up bundles from `/offers` instead of an arbitrary amount. When given,
            `amount` is ignored: the bundle says what is charged and how much credit it grants.

            How much credit arrives is decided when the money does, not now — and only if the amount
            collected matches what the bundle costs. A bundle whose places ran out, or whose window
            closed, in between still grants what was paid for; it just does not grant the bonus.
          type: string
          minLength: 1
          maxLength: 64
      required:
        - amount
    PaymentMethodSetupSession:
      type: object
      additionalProperties: false
      properties:
        url:
          description: Send the browser here. It expires, so do not store it
          type: string
          format: uri
      required:
        - url
    BillingPortalSession:
      type: object
      additionalProperties: false
      properties:
        url:
          description: Send the browser here. It expires, so do not store it
          type: string
          format: uri
      required:
        - url
    PaymentMethod:
      description: |-
        Whether money can be collected from this account later, without the account holder present.

        Deliberately not called a card: a card is one kind of payment method, and direct debit and
        the recurring mandates offered by regional wallets occupy the same slot.
      type: object
      additionalProperties: false
      properties:
        ready:
          description: |-
            True when the billing engine holds a default payment method for this account and can
            therefore collect an invoice.

            This is the precondition for a paid plan. While it is false, starting a paid
            subscription is refused, and the refusal is about billing setup rather than about the
            plan — so check this first and say what is actually missing.

            It says nothing about which kind is on file. To show or change that, send the account
            holder to the billing portal.

            A free plan does not require it, which is what allows a new account to be placed on the
            default tier before anyone has entered a card.
          type: boolean
      required:
        - ready
    TopUpSession:
      type: object
      additionalProperties: false
      properties:
        payment_id:
          description: |-
            Identifies this attempt. Quote it in a support conversation — it is what ties the payment
            provider's record to the credit that was granted
          type: string
        url:
          description: Send the browser here. It expires, so do not store it
          type: string
          format: uri
      required:
        - payment_id
        - url
    Charge:
      description: One thing this period has been charged for
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        total:
          description: |-
            Decimal string, the real-time figure. The booked figure would show a machine that only
            just started as zero
          type: string
        feature_key:
          description: |-
            Which meter it is for, when the charge came from usage. A hash, not something to show —
            it is here so two rows can be told apart programmatically and so support can line a row
            up with the catalogue.
          type: string
        type:
          description: |-
            Whether this figure moves. A usage charge climbs through the period; a flat fee does not.
            Without it, the same number on two refreshes could mean "nobody used it" or "it never
            moves", and those need different next steps.
          type: string
          enum: [usage_based, flat_fee]
        period_from:
          description: |-
            Start of the service period this charge covers.

            This is what tells two same-named rows apart. Something billed by the hour produces
            hundreds of identically named charges in a month, and a list carrying only a name and an
            amount shows them as a wall of duplicates — which is what it looks like today.
          format: date-time
          type: string
        period_to:
          description: End of the service period this charge covers.
          format: date-time
          type: string
        credits:
          description: |-
            How much of this charge was covered by credit, as a decimal string.

            It is the answer to "I have a balance, why am I still being charged". Without it the
            customer sees a number that disagrees with what they expected and the only thing that
            explains it is on our side.
          type: string
        discounts:
          description: |-
            How much was taken off by a discount, as a decimal string. A usage allowance (the first N
            units free) lands here too.
          type: string
        description:
          description: Free text from the charge, usually empty. Set on charges raised by hand.
          type: string
        unit_price:
          description: |-
            What one unit costs, as a decimal string. Absent when the line has no single unit price
            — a flat fee, or a tiered price whose rate changes with volume.

            The conversion between reported and billed quantity is deliberately not here: the engine
            does not echo it back on a charge, only on an invoice line. So a charge answers "what
            does a unit cost", and an invoice answers "how the total was reached".
          type: string
      required:
        - id
        - name
        - total
        - type
        - period_from
        - period_to
    ChargeUsage:
      description: What produced one charge
      type: object
      additionalProperties: false
      properties:
        charge_id:
          type: string
        quantity:
          description: |-
            Total reported quantity for the period, as a decimal string. Empty on a charge with no
            meter behind it.

            Reported, not billed: see the route's description.
          type: string
        by_project:
          description: |-
            The same quantity split by project. Empty when the charge has no meter behind it — a
            flat fee has nothing to attribute.
          type: array
          items:
            $ref: '#/components/schemas/ProjectUsage'
        resources:
          description: |-
            Resources of this product in the account's projects — candidates for what produced the
            charge, not a per-resource breakdown. Absent when billing could not look them up; the
            charge itself is still answered.
          type: array
          items:
            $ref: '#/components/schemas/ChargeResource'
      required:
        - charge_id
        - quantity
        - by_project
    ProjectUsage:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
        quantity:
          description: Decimal string.
          type: string
      required:
        - project_id
        - quantity
    ChargeResource:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
        service:
          description: Which service holds it, and therefore which console manages it.
          type: string
        product_id:
          type: string
        resource_id:
          type: string
        state:
          type: string
          enum: [pending, active, suspended, terminated]
      required:
        - project_id
        - service
        - product_id
        - resource_id
        - state
    ChargeList:
      type: object
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/Charge'
        total_count:
          description: |-
            How many charges there are in total, across every page.

            Without it, "is there another page" has to be guessed from whether this one came back
            full — and that guess turns into one extra fetch of an empty page whenever the last page
            happens to be exactly full.
          type: integer
          format: int64
        total:
          description: |-
            The sum over the **whole period**, not this page — it is the same number as `unsettled`
            on the balance, and paging must not change it. A page-scoped sum would disagree with the
            balance card sitting next to it, and there would be no way to tell which one to believe.
          type: string
      required:
        - currency
        - charges
        - total
    InvoiceStatus:
      type: string
      enum:
        - draft
        - issuing
        - issued
        - payment_processing
        - overdue
        - paid
        - uncollectible
        - voided
    Invoice:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          type: string
        due_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - status
        - currency
        - total
        - created_at
    InvoiceList:
      type: object
      additionalProperties: false
      properties:
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
      required:
        - invoices
    InvoiceLine:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        description:
          type: string
        period_from:
          description: |-
            Required. Lines of the same name repeat many times on one invoice — hundreds on an hourly
            bill — and without the period they cannot be told apart
          type: string
          format: date-time
        period_to:
          type: string
          format: date-time
        amount:
          description: Before discounts and credit
          type: string
        discounts_total:
          type: string
        quantity:
          description: |-
            The billed quantity for this line, as a decimal string — after conversion. A machine
            billed by the hour reports machine-seconds; this is machine-hours.

            It comes from the line's detailed segments summed together: the engine splits a line
            into segments (different cost categories, different sub-periods) and the quantity lives
            on those.
          type: string
        unit_price:
          description: |-
            What one unit cost, as a decimal string, frozen at billing time. Absent on a flat fee,
            whose amount is the amount, and on tiered prices, whose rate changes with volume.
          type: string
        conversion_factor:
          description: |-
            How reported quantity became billed quantity — 3600 for a machine billed by the hour
            from machine-seconds, 1000000 for a price per million tokens.

            Without it, `quantity` disagrees with what the customer remembers doing, by whole orders
            of magnitude, and there is nothing on the page that explains the gap.
          type: string
        conversion_operation:
          description: What was done with the factor.
          type: string
          enum: [divide, multiply]
        credits_total:
          description: How much of this line credit covered
          type: string
        total:
          type: string
      required:
        - name
        - period_from
        - period_to
        - amount
        - total
    InvoiceDetail:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        currency:
          $ref: '#/components/schemas/Currency'
        total:
          type: string
        charges_total:
          type: string
        discounts_total:
          type: string
        credits_total:
          type: string
        taxes_total:
          type: string
        period_from:
          type: string
          format: date-time
        period_to:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLine'
      required:
        - id
        - status
        - currency
        - total
        - created_at
        - lines
    Subscription:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        plan_key:
          type: string
        plan_version:
          type: integer
        status:
          description: |-
            `canceled` still counts as being on a plan — it is serving until the end of the period,
            which has already been paid for
          type: string
      required:
        - id
        - plan_key
        - status
    TopUpStatus:
      type: object
      additionalProperties: false
      properties:
        payment_id:
          type: string
        state:
          description: |-
            `settled` means the credit has landed. `pending` means it has not yet — the payment is
            still being confirmed, or the money itself is still in transit
          type: string
          enum:
            - settled
            - pending
        amount:
          description: The credit that was issued, present once settled
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
      required:
        - payment_id
        - state
    Currency:
      description: |-
        ISO 4217, uppercase. `USD` is the only value the platform issues today, and a request
        naming any other is refused with `BILLING_CURRENCY_UNSUPPORTED`.

        Deliberately not an enumeration. The set of currency codes is governed outside this API, so
        a client generated today must still be able to read a response naming a code added later —
        an enumeration turns that response into a decode failure in a client nobody can redeploy.
        Restricting what may be *sent* is a rule about what the platform supports, and it lives
        where that rule can change without regenerating anything.
      type: string
      pattern: ^[A-Z]{3}$
      minLength: 3
      maxLength: 3
