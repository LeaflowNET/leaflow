paths:
  /api/v1/products:
    get:
      summary: List catalog products
      operationId: list-products
      tags:
        - products
      security: []
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - $ref: ./openapi.yaml#/components/parameters/IfNoneMatch
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: |-
                Changes whenever the catalogue changes. Send it back as `If-None-Match`
                to be told `304` instead of receiving the same listing again.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "304":
          $ref: ./openapi.yaml#/components/responses/NotModified
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProductID"
    get:
      summary: Get a service
      description: |-
        Resolves an identifier that was stored elsewhere — on an order line, an invoice line, or
        the terms of a credit — into something that can be displayed.
      operationId: get-product
      tags:
        - products
      security: []
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/IfNoneMatch
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Changes whenever this catalog representation changes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "304":
          description: Not Modified
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/ProductID"
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name
    ProductID:
      description: Immutable platform service identifier, such as compute, canopy or assistant.
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
    ProductList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
