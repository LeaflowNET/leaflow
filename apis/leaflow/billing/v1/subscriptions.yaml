paths:
  /api/v1/subscriptions:
    get:
      summary: List subscriptions
      description: Subscriptions paid by your billing accounts; members of a project list its subscriptions with `project_ids`. Deleted subscriptions are not listed.
      operationId: list-subscriptions
      tags:
      - subscriptions
      parameters:
      - name: expiring_before
        in: query
        schema:
          type: string
          format: date-time
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/subscriptions/{subscriptionId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    get:
      summary: Get subscription
      description: A subscription paid by your billing account or of a project you are a member of. Deleted subscriptions are reported as not found.
      operationId: get-subscription
      tags:
      - subscriptions
      responses:
        '200':
          description: Purchase and renewal agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Delete subscription
      description: Hides a canceled or terminated subscription from your subscription list and detail by setting deleted_at; its status, ended_at and history are kept. Only the owner of the subscription's current billing account can delete it. A subscription that has not ended is refused with 409 `BILLING_SUBSCRIPTION_NOT_ENDED` and `status`. Repeating it keeps the original deleted_at. It sends no cleanup command and creates no refund.
      operationId: delete-subscription
      tags:
      - subscriptions
      responses:
        '204':
          description: Hidden from subscription reads; financial history is kept.
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/subscriptions/{subscriptionId}/cancel:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    post:
      summary: Cancel subscription
      description: |-
        Requests cancellation on the purchase's agreed terms, with the same rules as creating a cancellation. Give the
        refund amount from a quote with this subscription in `cancellation.subscription_ids`. Open to the owner of the
        subscription's current billing account and to members of its project with the project permission
        `billing:finance.manage`.

        Immediate cancellation asks the owning service to release the resources now; period-end cancellation keeps the
        subscription active or suspended until the paid term ends. The subscription becomes canceled when the service
        confirms the release; follow the returned cancellation. Subscriptions released together must be canceled
        together through create-cancellation, and pending or provisioning purchases through their order. Repeating the
        request while the cancellation is open returns it.
      operationId: cancel-subscription
      tags:
      - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelSubscriptionRequest'
      responses:
        '202':
          description: Cancellation requested; cleanup and any refund can still be pending.
          content:
            application/json:
              schema:
                $ref: ./cancellations.yaml#/components/schemas/Cancellation
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/subscriptions/{subscriptionId}/renew:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    post:
      summary: Renew subscription
      description: |-
        Buys licensed periods from current_term_end at the agreed recurring amount and pays for them at once. A
        different interval selects the price currently sold for it and fixes new terms on the order, applied after
        fulfillment. Paid periods keep their value.

        Without `payment_method_id`, the renewal is paid from credit grants and balance as `use_credits` and
        `use_balance` allow; when they cannot cover it, the request fails with `BILLING_INSUFFICIENT_FUNDS` and no
        order is left. To apply a promotion code or pay later, create a renewal Checkout Session.

        Open to the owner of the subscription's current billing account and to members of its project with the
        project permission `billing:finance.manage`. Only the owner can pay with `payment_method_id`.

        Keep order_id and read the order after an unknown outcome; creating it again conflicts.
      operationId: renew-subscription
      tags:
      - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
      responses:
        '409':
          description: 'The order already exists, or the subscription has an operation in progress, refused with `BILLING_SUBSCRIPTION_OPERATION_PENDING`: a pending renewal, a pending or paid change waiting to switch, an open cancellation or a committed reclaim.'
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: ./payments.yaml#/components/schemas/PaymentResult
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/subscriptions/{subscriptionId}/auto-renew:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/SubscriptionId
    put:
      summary: Set auto renew
      description: 'Turns automatic renewal of an active or suspended licensed subscription on or off. Turning it off does not shorten current_term_end and still allows manual renewal. Refused with 409 `BILLING_SUBSCRIPTION_AUTO_RENEW_INACTIVE` for a pending or provisioning subscription, 409 `BILLING_SUBSCRIPTION_AUTO_RENEW_FIXED` for a metered subscription, which continues until it is canceled, and 409 `BILLING_SUBSCRIPTION_OPERATION_PENDING` with `meta.cancellation_id` while a cancellation is open: creating it turned renewal off, and withdrawing it does not turn renewal back on. Open to the owner of the subscription''s current billing account and to members of its project with the project permission `billing:finance.manage`.'
      operationId: set-auto-renew
      tags:
      - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRenewSet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    CancelSubscriptionRequest:
      type: object
      properties:
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
        proration_date:
          description: For immediate cancellation, the quoted whole-second refund basis. Now when omitted.
          type: string
          format: date-time
        expected_refundable_amount:
          description: The cancellation quote's refundable amount, including an explicit zero.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: string
            pattern: ^[0-9]{1,15}([.][0-9]{1,10})?$
        reason:
          type: string
          maxLength: 1024
      required:
      - mode
      - expected_refundable_amount
      additionalProperties: false
    ScheduledChange:
      description: 'The next accepted period-end change of the subscription: the target terms, applied at effective_at.'
      type: object
      properties:
        order_id:
          type: string
          format: uuid
        status:
          $ref: ./orders.yaml#/components/schemas/OrderStatus
        effective_at:
          description: When the target terms take effect, normally the end of the current paid period.
          type: string
          format: date-time
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        price_id:
          type: string
          format: uuid
        quantity:
          type: string
        recurring_amount:
          description: The target licensed renewal amount before tax.
          type: string
        currency:
          type: string
        interval:
          type: string
          enum:
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
      required:
      - order_id
      - status
      - effective_at
      - plan_id
      - plan_name
      - price_id
      - quantity
      - recurring_amount
      - currency
      - interval
      - interval_count
    SubscriptionRestriction:
      description: An operation prevented on the subscription. `billing.subscriptions.use` stops the service. `renew` prevents renewal and paying a renewal order. `modify` prevents placing a change order. `cancel` prevents cancellation. `terminate` prevents immediate termination.
      type: string
      enum:
      - billing.subscriptions.use
      - billing.subscriptions.renew
      - billing.subscriptions.modify
      - billing.subscriptions.cancel
      - billing.subscriptions.terminate
    SubscriptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    Subscription:
      description: |-
        A purchase that is billed, renewed and changed on its own, separate from the owning service's resource. A new
        recurring purchase creates a pending subscription for each order line; its ID is returned on the order item
        and stays the same through checkout, delivery, renewals and changes. A one-time purchase may create none.

        Pending and provisioning subscriptions grant no service. A subscription becomes provisioning when the owning
        service accepts the order, and active when the service confirms delivery, which sets started_at; payment
        changes neither. Licensed service periods start at delivery, and metered usage is charged as the service
        reports it. Canceling or failing an undelivered purchase cancels its subscriptions without starting a period.
        Renewals use recurring_amount and the agreed interval; paid periods keep their value.

        A shared capacity limit, such as a regional snapshot quota, has one subscription for the purchased quantity
        rather than one per item.
      type: object
      properties:
        renewal_discounts_enabled:
          description: Whether new account discounts may apply to future renewals. A fixed operator renewal agreement disables automatic discounts; catalog repricing or a newly selected purchase agreement enables them.
          type: boolean
        currency:
          type: string
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          $ref: ./prices.yaml#/components/schemas/UsageType
        dimensions:
          description: The dimension values of what was bought, such as region and instance type. Empty when the purchase gave none.
          type: object
          additionalProperties:
            type: string
        interval:
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          type: integer
          minimum: 1
        recurring_amount:
          description: The whole licensed subscription's renewal amount, after continuing discounts and before tax. A pending subscription shows base terms until paying the order fixes any new discount. Absent for metered and one-time subscriptions.
          type: string
        cancellation_policy:
          $ref: ./prices.yaml#/components/schemas/CancellationPolicy
        refund_policy:
          $ref: ./prices.yaml#/components/schemas/RefundPolicy
        short_rate_multiplier:
          description: Refund policy `short_rate` only, as on the price bought.
          type: string
        short_rate_threshold_seconds:
          description: Refund policy `short_rate` only, as on the price bought.
          type: integer
          format: int64
        monthly_list_amount:
          description: Licensed recurring only, the `monthly_list_amount` that a renewal at the agreed amount keeps; see the order item.
          type: string
        order_item_id:
          type: string
          format: uuid
        coupon_id:
          type: string
          format: uuid
        coupon:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        discounted_renewals_remaining:
          type: integer
          minimum: 0
        restrictions:
          description: The operations currently prevented on the subscription, sorted; it is suspended while this contains `billing.subscriptions.use`.
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionRestriction'
        billing_cycle_anchor:
          type: string
          format: date-time
        cancellation:
          $ref: ./cancellations.yaml#/components/schemas/SubscriptionCancellation
        scheduled_change:
          description: The accepted period-end change scheduled for this subscription; null when there is none.
          oneOf:
          - $ref: '#/components/schemas/ScheduledChange'
          - type: 'null'
        default_payment_method_id:
          description: The saved payment method automatic renewal charges after balance and credits, before the account's default payment method. Set when a purchase, renewal or change is paid with a saved payment method. Used only while it belongs to the account paying the renewal.
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        billing_account_id:
          description: The billing account that made the purchase. Renewals of a project subscription are charged to the project's current billing account.
          type: integer
          format: int64
        account:
          $ref: ./accounts.yaml#/components/schemas/AccountIdentity
        product_id:
          $ref: ./products.yaml#/components/schemas/ProductID
        project_id:
          description: The project it is for. Absent for an account-level purchase, such as a membership.
          type:
          - string
          - 'null'
          format: uuid
        project:
          description: The project and its current name. Absent for an account-level purchase or when the project cannot be read; `project_id` still identifies it.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        product:
          $ref: ./products.yaml#/components/schemas/Product
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        price_id:
          type: string
          format: uuid
        quantity:
          type: string
        current_term_end:
          description: 'When a licensed subscription renews or expires: the end of the last period bought, moved by renewing in advance. Null until the subscription becomes active, even when its purchase has been paid, and for metered subscriptions.'
          type:
          - string
          - 'null'
          format: date-time
        current_period_start:
          description: Start of the service period in effect now. Null when none is, including for metered subscriptions.
          type:
          - string
          - 'null'
          format: date-time
        current_period_end:
          description: End of the service period in effect now; renewing in advance moves `current_term_end`, not this. Null when no period is in effect, including for metered subscriptions.
          type:
          - string
          - 'null'
          format: date-time
        auto_renew:
          description: Whether a licensed subscription renews automatically. A metered subscription continues until it is canceled; for it this is true until a cancellation is requested, and cannot be set.
          type: boolean
        status:
          description: '`pending`: the order has not been accepted. `provisioning`: the owning service accepted the order and is delivering. `active`: delivery was confirmed; payment alone does not make a subscription active. `suspended`: service is stopped while a lien restricts its use. `canceled`: cancellation completed, or an undelivered purchase was canceled or failed. `terminated`: an operator or the owning service ended it immediately.'
          type: string
          enum:
          - pending
          - provisioning
          - active
          - suspended
          - canceled
          - terminated
        started_at:
          description: When service started. Null until a new subscription becomes active, also after payment.
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - plan_id
      - price_id
      - quantity
      - status
      - billing_account_id
      - account
      - product_id
      - product
      - plan_name
      - type
      - usage_type
      - dimensions
      - currency
      - interval
      - auto_renew
    RenewRequest:
      type: object
      properties:
        order_id:
          description: The order ID, chosen by the caller. Creating it again conflicts; read the order after an unknown outcome.
          type: string
          format: uuid
        periods:
          description: How many further periods to buy, each at the price the subscription already renews at. To buy a longer term at its own price, give `interval` and `interval_count` instead.
          type: integer
          default: 1
          minimum: 1
        interval_count:
          description: |-
            Renew for a term of this length instead, at the price currently sold for it. Give
            `interval` with it.

            Leaving both out renews at the price this item already bills at, which a later price
            change does not affect. Naming a term that differs from the current one is a fresh
            choice, so it is bought at today's price. Naming the current term changes nothing. A
            term sold at several prices that differ in cancellation policy is refused with 409
            `BILLING_RENEWAL_OPTION_AMBIGUOUS` unless `cancellation_policy` is given.

            List the terms on offer with the renewal prices operation.
          type: integer
          minimum: 1
        interval:
          description: The unit interval_count counts in.
          type: string
          enum:
          - day
          - month
          - year
        cancellation_policy:
          description: With `interval` and `interval_count`, chooses among prices of that term that differ in cancellation policy.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/CancellationPolicy
        payment_method_id:
          type: string
          format: uuid
        use_balance:
          description: Whether to pay from the balance, with or without `payment_method_id`.
          type: boolean
          default: true
        use_credits:
          description: Whether to pay from eligible credit grants before the balance.
          type: boolean
          default: true
        return_url:
          type: string
      required:
      - order_id
      additionalProperties: false
    AutoRenewSet:
      type: object
      properties:
        auto_renew:
          type: boolean
      required:
      - auto_renew
      additionalProperties: false
