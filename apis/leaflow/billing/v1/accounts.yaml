paths:
  /api/v1/currencies:
    get:
      summary: List currencies accounts can be opened in
      description: 'The currencies a new billing account can be opened in. A retired currency is not listed,

        although accounts already opened in it keep working. Results are paginated.'
      operationId: list-currencies
      tags:
      - accounts
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts:
    get:
      summary: List billing accounts
      description: Paginated billing accounts owned by the authenticated user. Accounts owned by other users are
        excluded; the result is empty when the user owns none.
      operationId: list-billing-accounts
      tags:
      - accounts
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Create billing account
      description: 'The currency is chosen here and cannot be changed afterwards. Everything charged to the

        account — prices, orders, invoices, balance — is denominated in it.


        One person may hold several accounts, for example a personal one and one for a team.'
      operationId: create-billing-account
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAccountCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts/{accountId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    get:
      summary: Get billing account
      description: Returns an owned account settlement currency, lifecycle state and selected invoice contact. Returns
        404 if the account does not exist and 403 if it belongs to another user.
      operationId: get-billing-account
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Update billing account
      description: |-
        Select an active contact belonging to this account for future invoices. Its legal name,
        address and tax identifier are copied when an invoice is issued; issued snapshots are
        retained. Set invoice_contact_id to null to clear the selection. The currency cannot change.
      operationId: update-billing-account
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAccountUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts/{accountId}/balance:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    get:
      summary: Get account balance
      description: Returns the owned account balance, applicable credit groups, unpaid invoice amounts, unbilled
        estimates and pending returns separately. Returns 404 for a missing account and 403 for an account owned by
        another user.
      operationId: get-account-balance
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/assignments:
    get:
      summary: List project assignments
      description: Paginated current project assignments to accounts owned by the authenticated user. Filter by
        billing_account_id or project_ids; historical financial records keep their original account assignment.
      operationId: list-project-assignments
      tags:
      - accounts
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - name: billing_account_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssignmentList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/assignments/{projectId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/ProjectId
    get:
      summary: Get project assignment
      description: 'Returns the current assignment for the project identified by projectId. Returns 404 when

        no billing account is assigned; no resources can be created until one is assigned.'
      operationId: get-project-assignment
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssignment'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    put:
      summary: Set project assignment
      description: 'Charges already incurred remain with the billing account that was linked when they

        occurred, and are still invoiced to it. Metered resources are settled up to the moment of

        the change. Amounts owed by the previous billing account remain owed by it and do not

        prevent the change.


        Orders keep the billing account they were placed with and are fulfilled as placed. Periods

        already paid for are unaffected; renewals are charged to the new billing account.


        The request is refused once the project no longer accepts purchases because it is being

        deleted, and while a subscription or an order in progress in the project uses a currency

        other than that of the new billing account.'
      operationId: set-project-assignment
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectAssignmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssignment'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Unlink project billing account
      description: 'Ends the project''s current assignment without deleting its assignment history.


        Permitted only when nothing in the project is still running or in progress: no metered

        resources, no subscriptions that have not ended, and no orders in progress, including

        changes scheduled for the end of a period. Orders are not modified by this request; wait

        for them to complete, and have the service that scheduled a change call it off.


        Charges already incurred remain with the billing account and are invoiced to it as usual.

        Amounts the billing account owes do not prevent unlinking.


        After this the project cannot make purchases until a billing account is linked again.'
      operationId: unlink-project-billing-account
      tags:
      - accounts
      responses:
        '204':
          description: Unlinked
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    BillingAccount:
      type: object
      properties:
        invoice_contact_id:
          description: The active contact used for invoicing. Must belong to this account; null clears the selection.
          type:
          - string
          - 'null'
          format: uuid
        id:
          type: integer
          format: int64
        name:
          description: What you call this account.
          type: string
        currency:
          description: Fixed when the account was opened.
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - closed
        grace_amount:
          description: 'How far past the suspension threshold this account may go before its resources are

            suspended. "0" means none: the account is suspended as soon as it crosses the threshold.'
          type: string
        grace_period_seconds:
          description: 'How long this account has to top up after crossing the suspension threshold.

            0 means none. Whichever runs out first — this or grace_amount — ends the grace.'
          type: integer
          format: int64
        closed_at:
          description: |-
            The actual time this account was closed, in UTC (RFC 3339).
            Null or absent if the account is not closed or its historical close time is unknown.
          type: [string, "null"]
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - currency
      - status
      - created_at
    Currency:
      description: A currency a billing account can be opened in.
      type: object
      properties:
        code:
          description: ISO 4217 alpha-3, uppercase.
          type: string
          minLength: 3
          maxLength: 3
        exponent:
          description: Decimal places of the currency, the ISO 4217 minor unit.
          type: integer
          format: int32
          minimum: 0
          maximum: 4
        name:
          type: string
          minLength: 1
          maxLength: 64
        minimum_top_up:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: The smallest top-up accepted. Zero means no lower bound.
      required:
      - code
      - exponent
      - name
      - minimum_top_up
      additionalProperties: false
    CurrencyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    BillingAccountCreate:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          maxLength: 255
      required:
      - currency
      additionalProperties: false
    BillingAccountUpdate:
      type: object
      properties:
        invoice_contact_id:
          description: The active contact used for invoicing. Must belong to this account; null clears the selection.
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          maxLength: 255
      additionalProperties: false
    BillingAccountList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingAccount'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    AccountBalance:
      description: Account balance, credits, and unpaid charges are reported separately.
      type: object
      properties:
        available_credit:
          description: Balance minus pending balance returns, unbilled usage estimates and issued unpaid amounts.
            Credit grants are excluded; the result may be negative.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        unbilled_amount:
          description: Current estimate of rated usage that has not been invoiced. Final pricing and tax are fixed
            at issuance.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        billing_account_id:
          type: integer
          format: int64
        currency:
          type: string
        balance:
          description: 'Prepaid funds in the account currency, excluding credits. May be negative after a payment

            dispute. Outstanding charges are reported separately in due; this value is not a withdrawal quote.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credits:
          description: 'The recorded remaining credit, including restricted grants. It is not withdrawable

            and is not part of balance. credit_groups describes currently valid credit by permitted use; a positive

            credits balance does not imply that due is zero.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        restricted_credits:
          description: Currently valid credit whose use has applicable product, operation or eligibility conditions.
            Included in credits, separate from the balance.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_groups:
          description: 'Currently valid, unspent credit grouped by permitted use. Restrictions and

            validity dates determine which charges a group can cover, so these groups are not a general

            spendable balance and may differ from the recorded credits total.'
          type: array
          items:
            $ref: ./credit-grants.yaml#/components/schemas/CreditGroup
        due:
          description: Amount still payable on issued invoices. Unbilled usage is reported separately; arrears depend
            on actual eligible funding and grace terms.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        pending_returns_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Balance committed to pending top-up refunds or payouts. Already unavailable for spending;
            unbilled usage does not freeze the balance.
      required:
      - billing_account_id
      - currency
      - balance
      - credits
      - restricted_credits
      - credit_groups
      - due
      - available_credit
      - unbilled_amount
      - pending_returns_amount
    ProjectAssignment:
      description: A project's assignment to a billing account for the interval from effective_from to effective_to.
        An open-ended assignment has no end time.
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        project:
          description: 'The project and its current name, for display. Absent when the project no longer exists
            or its

            details cannot be read at the moment; `project_id` still identifies it.'
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        billing_account_id:
          type: integer
          format: int64
        account_name:
          type: string
        currency:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - project_id
      - billing_account_id
      - currency
      - effective_from
    ProjectAssignmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssignment'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    SetProjectAssignmentRequest:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
      required:
      - billing_account_id
      additionalProperties: false
    AccountIdentity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        currency:
          type: string
      required:
      - id
      - name
      - currency
