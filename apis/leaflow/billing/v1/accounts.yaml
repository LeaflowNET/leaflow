paths:
  /api/v1/currencies:
    get:
      summary: List currencies accounts can be opened in
      description: Currencies a new billing account can be opened in; retired currencies are not listed.
      operationId: list-currencies
      tags:
      - accounts
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts:
    get:
      summary: List billing accounts
      description: Billing accounts owned by the authenticated user.
      operationId: list-billing-accounts
      tags:
      - accounts
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Create billing account
      description: 'Creates a billing account. Its currency is fixed: prices, orders, invoices and balance are all in it.'
      operationId: create-billing-account
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAccountCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts/{accountId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    get:
      summary: Get billing account
      description: Your billing account with its currency, status and invoice contact. Returns 404 if it does not exist and 403 if it belongs to another user.
      operationId: get-billing-account
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Update billing account
      description: Selects an active contact of this account for future invoices; its legal name, address and tax identifier are copied when an invoice is issued. Set invoice_contact_id to null to clear it. The currency cannot change.
      operationId: update-billing-account
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAccountUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts/{accountId}/suspend:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    post:
      summary: Suspend billing account
      description: |-
        Suspends your active billing account without closing it, also while it is in arrears. While suspended, it
        accepts no new purchases, renewals or project links, and the services it pays for start no new resources;
        running services, their charges and the handling of arrears continue, and you can still top up and pay
        invoices. Resume it yourself; one suspended by Leaflow can only be resumed by Leaflow. Does not create a
        resource.
      operationId: suspend-billing-account
      tags:
      - accounts
      responses:
        '200':
          description: The account after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts/{accountId}/resume:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    post:
      summary: Resume billing account
      description: |-
        Resumes a billing account you suspended. Refused with `BILLING_ACCOUNT_SUSPENDED_BY_OPERATOR` when Leaflow
        suspended it. Does not create a resource.
      operationId: resume-billing-account
      tags:
      - accounts
      responses:
        '200':
          description: The account after the request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/billing-accounts/{accountId}/balance:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    get:
      summary: Get account balance
      description: The balance of your account, with credit groups, unpaid invoice amounts, unbilled estimates and pending returns. Returns 404 for a missing account and 403 for another user's account.
      operationId: get-account-balance
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalance'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/account-deletion/readiness:
    get:
      summary: Check billing accounts before deleting your Leaflow account
      description: |-
        Lists every billing account you own that is not closed, with what stops each from closing. Deleting your Leaflow
        account closes all of them and is refused while any lists an objection. Balance and credits left on them are
        forfeited when they close; the accounts and their records are kept, closed.

        A preview that holds nothing: the same check runs again when you request deletion and once more when the grace
        period ends.
      operationId: get-account-deletion-readiness
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionReadiness'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/assignments:
    get:
      summary: List project assignments
      description: Current project assignments to your billing accounts, filtered by billing_account_id or project_ids. Past charges keep the account they were assigned to.
      operationId: list-project-assignments
      tags:
      - accounts
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - name: billing_account_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssignmentList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/assignments/{projectId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/ProjectId
    get:
      summary: Get project assignment
      description: The project's current assignment. Returns 404 when no billing account is assigned; the project cannot create resources until one is.
      operationId: get-project-assignment
      tags:
      - accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssignment'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    put:
      summary: Set project assignment
      description: |-
        Links the project to another billing account. Charges already incurred stay with the account linked when they
        occurred and are invoiced to it; metered resources are settled up to the moment of the change. Amounts the
        previous account owes do not prevent the change. Orders keep the account they were placed with; paid periods
        are unaffected, and renewals are charged to the new account.

        Refused once the project no longer accepts purchases because it is being deleted, and while a subscription or
        an in-progress order of the project uses a currency other than the new account's.
      operationId: set-project-assignment
      tags:
      - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectAssignmentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAssignment'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Unlink project billing account
      description: Ends the project's current assignment; the assignment history is kept. Allowed only when the project has no metered resources, no subscriptions that have not ended and no orders in progress, including period-end changes; orders are not modified, so wait for them to complete. Charges already incurred stay with the billing account and are invoiced as usual; amounts it owes do not prevent unlinking. The project cannot make purchases until a billing account is linked again.
      operationId: unlink-project-billing-account
      tags:
      - accounts
      responses:
        '204':
          description: Unlinked
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    BillingAccount:
      type: object
      properties:
        invoice_contact_id:
          description: The active contact used for invoices, of this account; null clears it.
          type:
          - string
          - 'null'
          format: uuid
        id:
          type: integer
          format: int64
        name:
          description: Your name for the account.
          type: string
        currency:
          description: Fixed when the account was opened.
          type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - closed
        suspended_by:
          description: 'Who suspended the account: `owner` (you), `operator` (Leaflow), or `none` while it is not suspended. Only a suspension by `owner` can be resumed by you.'
          type: string
          enum:
          - none
          - owner
          - operator
        grace_amount:
          description: How far past the suspension threshold the account may go before its resources are suspended; `0` means none.
          type: string
        grace_period_seconds:
          description: How long the account has to top up after crossing the suspension threshold, in seconds; `0` means none. Grace ends when this or grace_amount runs out.
          type: integer
          format: int64
        closed_at:
          description: When the account was closed. Null if it is not closed or the time is unknown.
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - currency
      - status
      - suspended_by
      - created_at
    Currency:
      description: A currency a billing account can be opened in.
      type: object
      properties:
        code:
          description: ISO 4217 alpha-3, uppercase.
          type: string
          minLength: 3
          maxLength: 3
        exponent:
          description: Decimal places of the ISO 4217 minor unit.
          type: integer
          format: int32
          minimum: 0
          maximum: 4
        name:
          type: string
          minLength: 1
          maxLength: 64
        minimum_top_up:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: The smallest top-up accepted. Zero means no lower bound.
      required:
      - code
      - exponent
      - name
      - minimum_top_up
      additionalProperties: false
    CurrencyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    BillingAccountCreate:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        name:
          type: string
          maxLength: 255
      required:
      - currency
      additionalProperties: false
    BillingAccountUpdate:
      type: object
      properties:
        invoice_contact_id:
          description: The active contact used for invoices, of this account; null clears it.
          type:
          - string
          - 'null'
          format: uuid
        name:
          type: string
          maxLength: 255
      additionalProperties: false
    BillingAccountList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingAccount'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    AccountBalance:
      description: Balance, credits and unpaid charges, each reported separately.
      type: object
      properties:
        available_credit:
          description: Balance minus pending balance returns and the part of unbilled_amount and due that estimated_credit_applied does not cover. Negative only when the balance and applicable credit fall short of what the account owes.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        estimated_credit_applied:
          description: Credit expected to pay unbilled_amount and due, matching each charge to the grants whose scope, validity and conditions it meets, in the order credit is applied at payment. Nothing is deducted until an invoice is paid, so credits still includes this amount.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        unbilled_amount:
          description: Current estimate of priced usage that has not been invoiced. Final pricing and tax are fixed at issuance.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        billing_account_id:
          type: integer
          format: int64
        currency:
          type: string
        balance:
          description: Topped-up funds in the account's currency, excluding credits. May be negative after a payment dispute. Amounts owed are reported in due; this is not a withdrawable amount.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credits:
          description: Remaining credit, including restricted grants; not withdrawable and not part of balance. credit_groups shows currently valid credit by permitted use; positive credits do not mean due is zero.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        restricted_credits:
          description: Currently valid credit restricted to certain products, operations or conditions; part of credits, not of balance.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_groups:
          description: Currently valid unspent credit grouped by permitted use. Each group covers only the charges its restrictions and validity allow, and the groups may differ from the recorded credits total.
          type: array
          items:
            $ref: ./credit-grants.yaml#/components/schemas/CreditGroup
        due:
          description: Amount still payable on issued invoices. The invoice of an order not yet accepted is excluded, here and from available_credit. Usage not yet invoiced is reported separately.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        pending_returns_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Balance held for pending top-up refunds and not spendable. Unbilled usage does not hold balance.
      required:
      - billing_account_id
      - currency
      - balance
      - credits
      - restricted_credits
      - credit_groups
      - due
      - available_credit
      - estimated_credit_applied
      - unbilled_amount
      - pending_returns_amount
    AccountDeletionReadiness:
      type: object
      properties:
        accounts:
          description: Every billing account you own that is not closed; empty when you own none.
          type: array
          items:
            $ref: '#/components/schemas/AccountDeletionReadinessItem'
      required:
      - accounts
    AccountDeletionReadinessItem:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/BillingAccount'
        balance:
          description: Topped-up funds, in the account's currency, forfeited when it closes. Negative means arrears.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credits:
          description: Remaining credit, in the account's currency, forfeited when it closes.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        objections:
          description: What stops this account from closing; empty when it can close.
          type: array
          items:
            $ref: '#/components/schemas/AccountDeletionObjection'
      required:
      - account
      - balance
      - credits
      - objections
    AccountDeletionObjection:
      description: |-
        `ARREARS`: the balance is negative. `PROJECTS_ASSIGNED`: the account still pays for a project, yours or anyone
        else's. `ACTIVE_SUBSCRIPTION`: a subscription it bought has not ended. `OPEN_ORDER`: an order is not finished.
        `UNPAID_INVOICE`: an issued invoice is not settled. `UNBILLED_USAGE`: usage has not been invoiced yet; it is
        invoiced in the next billing run. `PENDING_TRANSACTION`: a top-up, refund or withdrawal is still pending.
      type: string
      enum:
      - ARREARS
      - PROJECTS_ASSIGNED
      - ACTIVE_SUBSCRIPTION
      - OPEN_ORDER
      - UNPAID_INVOICE
      - UNBILLED_USAGE
      - PENDING_TRANSACTION
    ProjectAssignment:
      description: A project's assignment to a billing account from effective_from until effective_to; an open assignment has no end.
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        project:
          description: The project and its current name. Absent when the project cannot be read; `project_id` still identifies it.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        billing_account_id:
          type: integer
          format: int64
        account_name:
          type: string
        currency:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_to:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - project_id
      - billing_account_id
      - currency
      - effective_from
    ProjectAssignmentList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectAssignment'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    SetProjectAssignmentRequest:
      type: object
      properties:
        billing_account_id:
          type: integer
          format: int64
      required:
      - billing_account_id
      additionalProperties: false
    AccountIdentity:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        currency:
          type: string
      required:
      - id
      - name
      - currency
