paths:
  /api/v1/cancellations:
    get:
      summary: List cancellations
      description: Newest first; members of a project list its cancellations with `project_ids`. Filter by `subscription_id` and `status=open` to find a subscription's cancellation in progress.
      operationId: list-cancellations
      tags:
      - cancellations
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - name: subscription_id
        in: query
        required: false
        description: Only cancellations that include this subscription.
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        description: Only cancellations in this status. `open` means requested, scheduled or releasing.
        schema:
          type: string
          enum:
          - open
          - requested
          - scheduled
          - releasing
          - completed
          - canceled
          - failed
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Cancel subscriptions
      description: |-
        Ends subscriptions of one service together. Deleting a resource is an `immediate` cancellation of every
        subscription released with it, such as a server with its disks or an address with its bandwidth. Open to the
        owner of the subscriptions' current billing account and to members of their project with the project
        permission `billing:finance.manage`.

        The owning service releases the resources at once for `immediate`, or at `scheduled_at`, the end of the paid
        term, for `period_end`. When release is confirmed, the unused value is returned to the original payment
        sources under each subscription's refund terms. For `immediate` the refund is computed as of `proration_date`
        and is not reduced by service used during release. Metered usage is charged until release.

        `mode` must be allowed for every subscription. Metered and one-time subscriptions end only `immediate`. A
        licensed subscription ends `period_end` while its paid term lasts, and `immediate` unless its terms allow only
        the end of the paid term and that term has not ended. For `period_end` all paid terms must end at the same
        time.

        Refused with:

        - 400 `BILLING_CANCELLATION_INVALID` when `subscription_ids` or `proration_date` is invalid (`meta.field`), or
          the subscriptions do not share one service, project, account and currency;
        - 409 `BILLING_CANCELLATION_CONFLICT` when a subscription has not started or has ended;
        - 422 `BILLING_CANCELLATION_MODE_FIXED` when `mode` is not allowed, and `BILLING_CANCELLATION_TERMS_UNSET`
          when a licensed subscription has no cancellation terms, both with `meta.subscription_id`;
        - 409 `BILLING_CANCELLATION_SCHEDULES_DIFFER` when, for `period_end`, the paid terms end at different times;
        - 409 `BILLING_SUBSCRIPTION_OPERATION_PENDING` when a subscription is already being canceled
          (`meta.cancellation_id`) or reclaimed (`meta.reason` `reclaim_requested`), or has a paid change waiting to
          switch (`meta.order_id`);
        - 409 `BILLING_ORDER_PAYMENT_IN_FLIGHT` while an online renewal payment for one of them is in progress;
        - 409 `BILLING_CANCELLATION_REFUND_CHANGED` when the refund no longer equals `expected_refundable_amount`.

        Repeating the request for the same subscriptions, mode and amount while the cancellation is open returns it
        with 200. Unpaid renewal orders are canceled with it, and automatic renewal is turned off for every
        subscription.
      operationId: create-cancellation
      tags:
      - cancellations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '200':
          description: The same cancellation, already open
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/cancellations:preview:
    query:
      summary: Preview a cancellation
      description: What creating the cancellation now would return, per subscription and in total. Nothing is canceled, ended or refunded. Open to the owner of the subscriptions' current billing account and to members of their project; refused for the same states as creating it.
      operationId: preview-cancellation
      tags:
      - cancellations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationPreviewRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationPreview'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/cancellations/{cancellationId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/CancellationId
    get:
      summary: Get a cancellation
      description: A cancellation paid by your billing account or of a project you are a member of, with its schedule, expected refundable amount and the outcome for each subscription, including partial success.
      operationId: get-cancellation
      tags:
      - cancellations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Withdraw a cancellation
      description: Withdraws the whole cancellation, which stays with status `canceled`, while no resource has begun to be released; afterwards it is refused with 409 `BILLING_CANCELLATION_CONFLICT`. The subscriptions continue, but automatic renewal, turned off when the cancellation was created, stays off until it is turned on again. Withdrawing a withdrawn cancellation returns it unchanged. Open to the owner of the subscriptions' current billing account and to members of their project with the project permission `billing:finance.manage`.
      operationId: withdraw-cancellation
      tags:
      - cancellations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    CancellationCreate:
      type: object
      properties:
        subscription_ids:
          description: As in the preview.
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
        proration_date:
          description: 'For `immediate`, the preview''s `proration_date`: a whole second, not in the future and at most ten minutes old; the refund is computed as of it. Now when omitted.'
          type: string
          format: date-time
        expected_refundable_amount:
          description: The preview's `refundable_amount`; the cancellation is refused when the refund differs.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: string
            pattern: ^[0-9]{1,15}([.][0-9]{1,10})?$
        reason:
          description: A note from the account holder, kept with the cancellation.
          type: string
          maxLength: 1024
      required:
      - subscription_ids
      - mode
      - expected_refundable_amount
      additionalProperties: false
    Cancellation:
      description: |-
        One cancellation of a set of subscriptions of one service, released together at one time.

        - `requested`: `immediate`, release has not begun.
        - `scheduled`: `period_end`, waiting for `scheduled_at`.
        - `releasing`: release has begun; it can no longer be withdrawn.
        - `completed`: every subscription has ended and its refund has been made.
        - `canceled`: withdrawn before release began; the subscriptions continue.
        - `failed`: the service could not carry it out, for the reason in `failure_code`; the
          subscriptions continue and can be canceled again.
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - requested
          - scheduled
          - releasing
          - completed
          - canceled
          - failed
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
        scheduled_at:
          type: string
          format: date-time
        proration_date:
          description: For `immediate`, the second the refund is computed as of.
          type: string
          format: date-time
        origin:
          description: Who requested it; `project_deletion` means the project was deleted.
          type: string
          enum:
          - customer
          - operator
          - project_deletion
        billing_account_id:
          description: 'The billing account paying for these subscriptions when the cancellation was created: the purchasing account of an account-level purchase, or the project''s linked account.'
          type: integer
          format: int64
        currency:
          type: string
        expected_refundable_amount:
          description: The refund confirmed when the cancellation was created. Absent when the platform created it.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        failure_code:
          description: 'Present with `failed`: the owning service''s code, such as for a disk that can only be released with its server.'
          type: string
        requested_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        canceled_at:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CancellationItem'
      required:
      - id
      - status
      - mode
      - origin
      - billing_account_id
      - currency
      - requested_at
      - items
    CancellationItem:
      description: One subscription of the cancellation.
      type: object
      properties:
        id:
          description: The subscription's cancellation item, the same as `Subscription.cancellation.id`.
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          description: |-
            Creating the cancellation turned automatic renewal off; withdrawing it turns renewal back on
            for a `metered` subscription and leaves it off for a `licensed` one.
          allOf:
          - $ref: ./prices.yaml#/components/schemas/UsageType
        status:
          type: string
          enum:
          - requested
          - scheduled
          - releasing
          - completed
          - canceled
          - failed
        failure_code:
          description: The release stopped or its result is unknown; present while the release needs resolution.
          type: string
        release_started_at:
          type: string
          format: date-time
        effective_at:
          description: When the service ended, as confirmed by the service that provides it.
          type: string
          format: date-time
        balance_amount:
          description: Present with `completed`. The part of the refund returned to the account balance.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          description: Present with `completed`. The part restored to the credit grants that paid.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        gateway_amount:
          description: Present with `completed`. The part returned to the payment method it was paid with.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - id
      - subscription_id
      - plan_id
      - plan_name
      - type
      - usage_type
      - status
    CancellationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cancellation'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    SubscriptionCancellation:
      description: 'The latest cancellation including the subscription, with this subscription''s item: `id` is the item and `cancellation_id` the cancellation. scheduled_at is the intended time and effective_at the confirmed end of service.'
      type: object
      properties:
        reason:
          type: string
        cancellation_id:
          description: The cancellation this item belongs to, with the other subscriptions released together.
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        subscription_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - requested
          - scheduled
          - releasing
          - failed
          - completed
          - canceled
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
        requested_at:
          type: string
          format: date-time
        scheduled_at:
          type: string
          format: date-time
        effective_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        release_started_at:
          type: string
          format: date-time
        canceled_at:
          type: string
          format: date-time
        forfeit_remaining_value:
          type: boolean
        failure_code:
          type: string
        failure_reason:
          type: string
      required:
      - id
      - subscription_id
      - status
      - mode
      - requested_at
      - forfeit_remaining_value
    CancellationPreviewRequest:
      description: 'What ending these subscriptions together would return, for one mode; preview `immediate` and `period_end` separately to compare. Refused with 409 `BILLING_SUBSCRIPTION_OPERATION_PENDING` when a subscription is already being canceled (`meta.cancellation_id`), is being reclaimed (`meta.reason` `reclaim_requested`) or has a paid change waiting to switch (`meta.order_id`).'
      type: object
      properties:
        billing_account_id:
          description: A billing account you own that currently pays for every subscription.
          type: integer
          format: int64
          minimum: 1
        subscription_ids:
          description: The subscriptions to end together, all of one service, including every subscription released with a resource.
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
      required:
      - billing_account_id
      - subscription_ids
      - mode
      additionalProperties: false
    CancellationPreview:
      description: |-
        What the cancellation would return, per subscription and in total, as of now. Give `proration_date` and
        `refundable_amount` when creating the cancellation.

        - `unused_amount`: before tax, the amount paid for the current periods in proportion to the time remaining.
        - `short_rate_surcharge_amount`: before tax, the part of `forfeited_amount` due to the short rate of the
          refund policy.
        - `refundable_amount`: what is returned the way it was paid, tax included; `refund_amount` plus
          `credit_amount`.
        - `refund_amount`: the part returned to the balance or the payment method.
        - `credit_amount`: the part restored to the credit grants that paid.
        - `tax_amount`: the tax included in `refundable_amount`.
        - `forfeited_amount`: before tax, the part of `unused_amount` the refund terms do not return.

        Metered and one-time subscriptions show zero; their usage until release is charged as usual.
      type: object
      properties:
        mode:
          $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
        scheduled_at:
          description: For `period_end`, when release begins, the end of the paid terms.
          type: string
          format: date-time
        proration_date:
          description: For `immediate`, the second the refund is computed as of. Give it when creating the cancellation.
          type: string
          format: date-time
        currency:
          type: string
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        short_rate_surcharge_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        items:
          type: array
          items:
            $ref: '#/components/schemas/CancellationPreviewItem'
      required:
      - mode
      - currency
      - unused_amount
      - short_rate_surcharge_amount
      - refundable_amount
      - refund_amount
      - credit_amount
      - tax_amount
      - forfeited_amount
      - items
    CancellationPreviewItem:
      description: One subscription of the previewed cancellation.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        project:
          description: The project and its current name. Absent for an account-level purchase or when the project cannot be read.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        type:
          $ref: ./prices.yaml#/components/schemas/PriceType
        usage_type:
          $ref: ./prices.yaml#/components/schemas/UsageType
        auto_renew:
          description: Whether automatic renewal is on now. Creating the cancellation turns it off; withdrawing it turns it back on for a metered subscription but not for a licensed one.
          type: boolean
        unused_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        short_rate_surcharge_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refundable_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        refund_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        forfeited_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - subscription_id
      - plan_id
      - plan_name
      - type
      - usage_type
      - auto_renew
      - unused_amount
      - short_rate_surcharge_amount
      - refundable_amount
      - refund_amount
      - credit_amount
      - tax_amount
      - forfeited_amount
