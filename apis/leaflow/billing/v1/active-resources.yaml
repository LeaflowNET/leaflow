paths:
  /api/v1/active-resources:
    get:
      summary: List active resources
      description: Continuous metering registrations paid for by your billing accounts; members of a project list its registrations with `project_ids`. Their state does not describe the resource's runtime.
      operationId: list-active-resources
      tags:
      - active-resources
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - $ref: ./openapi.yaml#/components/parameters/ProjectIdsQuery
      - name: meter_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: product_id
        in: query
        required: false
        schema:
          $ref: ./products.yaml#/components/schemas/ProductID
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - suspended
          - closing
          - closed
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveResourceList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    ActiveResource:
      description: A resource charged continuously by the second.
      type: object
      properties:
        id:
          type: string
          format: uuid
        ended_at:
          type: string
          format: date-time
        suspended_at:
          type: string
          format: date-time
        state_changed_at:
          type: string
          format: date-time
        subscription_id:
          description: The metered subscription charged for this metering record.
          type: string
          format: uuid
        resource_id:
          type: string
        product:
          $ref: ./products.yaml#/components/schemas/Product
        resource_type:
          description: The resource type, as the owning service names it.
          type: string
        meter:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        unit:
          type: string
        quantity:
          description: How much is held, such as cores, MiB or cards; not how much was used.
          type: string
        dimensions:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum:
          - active
          - suspended
          - closing
          - closed
        started_at:
          type: string
          format: date-time
        project_id:
          type: string
          format: uuid
        usage_generated_until:
          description: Usage has been generated up to this boundary; it says nothing about invoicing or payment.
          type: string
          format: date-time
      required:
      - id
      - subscription_id
      - usage_generated_until
      - resource_id
      - product
      - meter
      - quantity
      - status
      - started_at
    ActiveResourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActiveResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
