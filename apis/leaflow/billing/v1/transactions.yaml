paths:
  /api/v1/transactions:
    get:
      summary: List transactions
      description: Ledger entries of your billing accounts, filtered by billing_account_id and creation time.
      operationId: list-transactions
      tags:
      - transactions
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - $ref: ./openapi.yaml#/components/parameters/From
      - $ref: ./openapi.yaml#/components/parameters/To
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    TransactionType:
      description: topup adds to the balance; payment settles an invoice; refund returns original funds; adjustment changes the balance with an audit reason.
      type: string
      enum:
      - topup
      - payment
      - refund
      - adjustment
      - fee
    Transaction:
      description: A funds movement with one source. Refunds name the original transaction. Unknown gateway results stay pending.
      type: object
      properties:
        invoice_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        credit_grant_id:
          description: The credit grant that paid, or for a refund, the credit grant restored.
          type: string
          format: uuid
        credit_grant:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        refund_id:
          type: string
          format: uuid
        refund_destination:
          description: 'Present on refunds: where this part goes. `balance`: the account balance. `credit`: the credit grant that paid, keeping its original expiry. `gateway`: the payment method it was paid with.'
          type: string
          enum:
          - balance
          - credit
          - gateway
        status:
          description: '`failed`: the operation did not succeed; for a gateway payment, the gateway declined it. `canceled`: a gateway payment was withdrawn without collecting money. Either way, the invoice it was for stays open.'
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - canceled
        cancellation_reason:
          $ref: ./payments.yaml#/components/schemas/PaymentCancellationReason
          description: Why the payment was withdrawn. Present with `canceled`.
        payment_gateway:
          type: string
        method_type:
          type: string
        failure_reason:
          description: 'Why it failed; present with `failed`. For a declined gateway payment, the gateway''s code unchanged: the issuer''s decline code when there is one (Stripe decline_code, such as insufficient_funds), otherwise the gateway''s error code (Stripe code, such as card_declined). Treat an unknown value as a generic decline.'
          type: string
        settled_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        type:
          $ref: '#/components/schemas/TransactionType'
        amount:
          description: 'Signed by type: positive for `topup` and `payment`, negative for `refund`. An `adjustment` is positive when it adds to the balance and negative when it takes from it. For other types the sign does not show the effect on the balance: a payment from balance lowers it, a payment by gateway or credit does not.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        remaining_amount:
          description: How much of this transaction is still in the balance. Only top-ups, positive adjustments and gateway payments returned to the balance can be non-zero.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - type
      - amount
      - remaining_amount
      - currency
      - created_at
      additionalProperties: false
    TransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
