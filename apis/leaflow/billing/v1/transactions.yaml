paths:
  /api/v1/transactions:
    get:
      summary: List transactions
      operationId: list-transactions
      tags:
        - transactions
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
        - $ref: ./openapi.yaml#/components/parameters/From
        - $ref: ./openapi.yaml#/components/parameters/To
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    TransactionType:
      description: topup adds to the balance; payment settles an invoice; refund returns original funds; payout withdraws from the balance; adjustment changes the balance with an audit reason.
      type: string
      enum:
        - topup
        - payment
        - refund
        - payout
        - adjustment
    Transaction:
      description: A funds operation. Each payment has one source; refunds identify the original successful transaction. Unknown gateway results remain pending. Payments from the balance or a gateway are distinct from credit-grant payments.
      type: object
      properties:
        invoice_id:
          type: string
          format: uuid
        transaction_id:
          type: string
          format: uuid
        credit_grant_id:
          description: The credit grant that paid, or for a refund, the credit grant restored.
          type: string
          format: uuid
        credit_grant:
          $ref: ./openapi.yaml#/components/schemas/ObjectIdentity
        refund_id:
          type: string
          format: uuid
        refund_destination:
          description: |-
            Present on refunds. Where this part of the refund goes.

            - `balance`: back to the account balance.
            - `credit`: back to the credit grant that paid, which keeps its original expiry.
            - `gateway`: back to the payment method it was paid with.
          type: string
          enum:
            - balance
            - credit
            - gateway
        status:
          description: |-
            `failed` means the operation did not succeed; for a gateway payment, that the gateway declined
            it. `canceled` means a gateway payment was withdrawn without collecting money. After either,
            an invoice the payment was meant to pay remains open for another payment.
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - canceled
        cancellation_reason:
          $ref: ./payments.yaml#/components/schemas/PaymentCancellationReason
          description: Why the payment was withdrawn. Present with `canceled`.
        payment_gateway:
          type: string
        method_type:
          type: string
        failure_reason:
          description: |-
            Why it failed. Present with `failed`. For a declined gateway payment the value is the
            gateway's own code, passed on unchanged: the card issuer's decline code when there is one
            (Stripe's decline_code, such as insufficient_funds or lost_card), otherwise the gateway's
            error code (Stripe's code, such as card_declined, expired_card or
            payment_intent_authentication_failure). Clients map it to their own wording and treat an
            unknown value as a generic decline.
          type: string
        settled_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        amount:
          description: |-
            Signed by type: positive for `topup` and `payment`, negative for `refund` and `payout`.
            An `adjustment` is positive when it adds to the balance and negative when it takes from
            it. For the other types the sign does not tell the effect on the balance: a payment from
            the balance lowers it, while a payment by gateway or by credit leaves it unchanged.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        remaining_amount:
          description: |-
            How much of this transaction is still available in the balance. Only top-ups, positive
            adjustments and gateway payments later returned to the balance can be non-zero.
          allOf:
            - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - type
        - amount
        - remaining_amount
        - currency
        - created_at
      additionalProperties: false
    TransactionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
