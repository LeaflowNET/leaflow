paths:
  /api/v1/credit-grants:
    get:
      summary: List credit grants
      description: |-
        Each grant shows what remains and what it may be used for. Credit is spent before the balance
        and cannot be withdrawn.
      operationId: list-credit-grants
      tags:
        - credit-grants
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - depleted
              - expired
              - voided
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditGrantList"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    CreditGroup:
      type: object
      properties:
        applies_to:
          description: What the credit in this group may pay for. No restrictions means anything on the account.
          allOf:
            - $ref: ./discounts.yaml#/components/schemas/Applicability
        first_purchase_only:
          description: Restricted to your first purchase of anything it applies to.
          type: boolean
        amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
        - applies_to
        - amount
    CreditGrant:
      type: object
      properties:
        min_amount:
          type: string
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        name:
          type: string
        amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        remaining_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        applies_to:
          description: What this credit may pay for. No restrictions means anything on the account.
          allOf:
            - $ref: ./discounts.yaml#/components/schemas/Applicability
        first_purchase_only:
          description: Restricted to your first purchase of anything it applies to.
          type: boolean
        status:
          type: string
          enum:
            - active
            - depleted
            - expired
            - voided
        valid_from:
          type: string
          format: date-time
        valid_until:
          type:
            - string
            - "null"
          format: date-time
      required:
        - applies_to
        - id
        - name
        - amount
        - remaining_amount
        - currency
        - status
        - valid_from
    CreditGrantList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CreditGrant"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
