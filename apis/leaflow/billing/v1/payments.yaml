paths:
  /api/v1/billing-accounts/{accountId}/payment-options:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/AccountId
    get:
      summary: List payment options
      description: The payment gateways and methods currently accepting the account's currency, preferred gateway first. Top-ups and invoice payments must use one listed here. An empty result means online payment is unavailable for the account.
      operationId: list-payment-options
      tags:
      - payments
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOptionList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/top-ups:
    get:
      summary: List top ups
      description: Your top-ups, including pending, failed and canceled attempts. Items carry no `action`; read a pending top-up with get-top-up to continue its payment.
      operationId: list-top-ups
      tags:
      - payments
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUpList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Create top up
      description: Creates a top-up for an account of the authenticated user and returns its payment information. The balance increases when the gateway confirms receipt. Keep the supplied ID to read the attempt after a lost response; creating it again conflicts.
      operationId: create-top-up
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/top-ups/{topUpId}:
    parameters:
    - name: topUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Get top up
      description: A top-up of the authenticated user, with its outcome and unspent amount. While it is pending, `action` carries the customer's next step as the gateway reports it, so an interrupted payment can be continued; when the gateway cannot be reached, `action` is omitted.
      operationId: get-top-up
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/top-ups/{topUpId}/cancel:
    parameters:
    - name: topUpId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Cancel top up
      description: |-
        Withdraws a pending top-up of the authenticated user at the payment gateway. It becomes `canceled` with
        `cancellation_reason` `requested_by_customer`, and nothing is collected. Canceling a canceled top-up returns
        it unchanged. If the gateway has already collected the payment, the top-up is returned as `succeeded` with the
        balance increased; check `status` in the response.

        Fails with 409 `BILLING_TOPUP_NOT_CANCELABLE` when the top-up has succeeded or failed, with `status` naming
        the outcome, or while the gateway is processing the payment, with `status` `pending`; read the top-up again
        later.
      operationId: cancel-top-up
      tags:
      - payments
      responses:
        '200':
          description: 'The top-up after the request: canceled or succeeded.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopUp'
        '409':
          description: The top-up already has another outcome or can no longer be withdrawn.
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Error
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/payment-methods:
    get:
      summary: List payment methods
      description: Saved payment methods of your billing accounts, optionally for one billing_account_id. Removed methods are not listed.
      operationId: list-payment-methods
      tags:
      - payments
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/payment-methods/setup:
    post:
      summary: Create payment method setup
      description: Returns what the browser needs to open the payment gateway's card form. Nothing is charged; the method is listed once the gateway confirms it. Card numbers never reach this service.
      operationId: create-payment-method-setup
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodSetup'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSetupResult'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/payment-methods/{paymentMethodId}/default:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/PaymentMethodId
    put:
      summary: Set default payment method
      description: Makes an active saved payment method the default for its billing account and returns it. Expired or removed methods cannot be selected; selecting the current default changes nothing.
      operationId: set-default-payment-method
      tags:
      - payments
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/payment-methods/{paymentMethodId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/PaymentMethodId
    delete:
      summary: Delete payment method
      description: Refused when it is the only payment method of an account with metered resources.
      operationId: delete-payment-method
      tags:
      - payments
      responses:
        '204':
          description: Removed
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/invoices/{invoiceId}/pay:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/InvoiceId
    post:
      summary: Pay an invoice
      description: |-
        Pays the invoice from eligible credit grants and balance as requested, and collects the remainder through the
        selected gateway and method. Without a gateway, insufficient funds fail and no online payment starts. The
        invoice's amounts and discount were fixed when it was issued and are not changed by paying; promotion codes
        are applied when completing a Checkout Session.

        Returns a payment action when the customer must act; requires_action and processing are not paid. An
        unresolved online payment with the same gateway, method and saved payment method is reused, and retries never
        apply credit grants or balance twice. Paying any other way first cancels that payment; if the gateway had
        already collected it, the invoice is paid by it and nothing more is charged. A payment the gateway is still
        processing fails with `BILLING_PAYMENT_PENDING` and `meta.transaction_id`.

        A paid invoice returns its existing result without another charge. Refused with `BILLING_INVOICE_NOT_PAYABLE`
        for a void invoice; `BILLING_ORDER_FAILED` or `BILLING_ORDER_CANCELED` for the invoice of a failed or canceled
        order; `BILLING_ORDER_EXPIRED` after the order's payment deadline; `BILLING_INVOICE_NOT_PAYABLE` with
        `meta.reason` `subscription_canceling`, `subscription_reclaiming` or `subscription_ended` for a renewal
        invoice whose subscription is being canceled, is being reclaimed or has ended; and
        `BILLING_INVOICE_NOT_PAYABLE` with `meta.reason` `fractional_amount` when the amount left for the gateway is
        not a whole number of the currency's minor unit; such an invoice is collected from credit grants and balance
        automatically, including right after a top-up.
      operationId: pay-invoice
      tags:
      - payments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayInvoiceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/invoices/{invoiceId}/payment-preview:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/InvoiceId
    get:
      summary: Preview invoice payment
      description: |-
        What paying this invoice now would take from credit grants, from the balance and, for the rest,
        from a payment gateway. It is computed as paying computes it, so paying with the same options
        straight afterwards takes exactly these amounts unless the account's funds change in between.
        Nothing is charged, reserved or created.

        Refused with the same errors as paying, except that insufficient funds are not an error here:
        they show as a `gateway_amount` above zero.
      operationId: preview-invoice-payment
      tags:
      - payments
      parameters:
      - name: use_balance
        in: query
        required: false
        description: As in paying. True when omitted.
        schema:
          type: boolean
          default: true
      - name: use_credits
        in: query
        required: false
        description: As in paying. True when omitted.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPreview'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/payments:
    post:
      summary: Pay together
      description: |-
        Pays outstanding invoices, including those of the listed orders, from eligible credit grants and then balance,
        without a payment gateway.

        All invoices are paid or none: insufficient funds fail with `BILLING_INSUFFICIENT_FUNDS`, and a total other
        than expected_amount fails with `BILLING_AMOUNT_CHANGED`, charging nothing. Paid invoices are not charged
        again. An earlier online payment for one of the invoices is canceled first; one the gateway is still
        processing is refused with `BILLING_PAYMENT_PENDING` and `meta.transaction_id`. Also refused with
        `BILLING_INVOICE_NOT_PAYABLE` for a void invoice; `BILLING_ORDER_FAILED`, `BILLING_ORDER_CANCELED` or `BILLING_ORDER_EXPIRED` for an order in that
        state; and `BILLING_INVOICE_NOT_PAYABLE` with `meta.reason` `subscription_canceling`,
        `subscription_reclaiming` or `subscription_ended` for a renewal invoice of a subscription being canceled,
        being reclaimed or ended.
      operationId: pay-together
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayTogetherRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResult'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/payments/preview:
    query:
      summary: Preview paying together
      description: What paying these invoices together now would take from credit grants and from the balance, per invoice in payment order, calculated as paying together does. Nothing is charged, reserved or created. Refused with the same errors as paying together, except that insufficient funds show as a `gateway_amount` above zero instead of an error.
      operationId: preview-pay-together
      tags:
      - payments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayTogetherRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPreview'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    TopUp:
      description: A top-up attempt and its outcome. A successful top-up adds to the balance; it is not a credit grant and has no invoice.
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        account:
          $ref: ./accounts.yaml#/components/schemas/AccountIdentity
        amount:
          description: What is credited to the account, in its currency.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        remaining_amount:
          description: The part of this top-up still in the balance. Pending refunds may hold part of it, so not all of it is necessarily withdrawable.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        status:
          description: '`pending` until the payment gateway reaches a result; the balance increases on `succeeded`. `failed`: the gateway declined the payment, which is withdrawn at the gateway; create a new top-up to pay another way. `canceled`: withdrawn without collecting money, for the reason in `cancellation_reason`. Unknown gateway outcomes stay `pending`; a browser redirect is not proof of payment. `failed` and `canceled` are final; a payment the gateway collects afterwards is credited as a separate `succeeded` top-up.'
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - canceled
        cancellation_reason:
          $ref: '#/components/schemas/PaymentCancellationReason'
          description: Why the top-up was withdrawn. Present with `canceled`.
        payment_gateway:
          description: Which payment gateway collected it.
          type: string
        method_type:
          description: The selected payment method, such as card, wechat_pay or alipay.
          type: string
        presentment_currency:
          description: The currency the customer was charged in when the checkout collected a local currency; absent when it is the account's.
          type: string
        presentment_amount:
          description: The amount charged in `presentment_currency`, as shown on the customer's statement.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        failure_reason:
          description: 'Why the gateway declined it; present with `failed`. The gateway''s code unchanged: the issuer''s decline code when there is one (Stripe decline_code, such as insufficient_funds), otherwise the gateway''s error code (Stripe code, such as card_declined). Treat an unknown value as a generic decline.'
          type: string
        action:
          $ref: '#/components/schemas/PaymentAction'
          description: The customer's next step while the top-up is `pending` and the gateway awaits them, as the gateway currently reports it. Returned by create-top-up and get-top-up, not by list-top-ups, and absent once the top-up has a result. Completing it is not confirmation of receipt.
        created_at:
          type: string
          format: date-time
        settled_at:
          description: When the funds arrived, possibly days after `created_at`. Absent until the payment completes.
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - billing_account_id
      - account
      - amount
      - currency
      - status
      - created_at
    TopUpCreate:
      type: object
      properties:
        payment_gateway:
          description: The gateway selected from the available payment options.
          type: string
          minLength: 1
          maxLength: 32
        method_type:
          description: The selected method, such as card, wechat_pay or alipay.
          type: string
          minLength: 1
          maxLength: 64
        id:
          description: The top-up ID, chosen by the caller. Read it after an uncertain response.
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        amount:
          description: In the account's currency, no finer than its smallest unit (two decimals for most currencies, none for JPY). An amount below the currency's minimum top-up is refused, and the minimum is returned with the error.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: string
            pattern: ^(?:(?:[1-9][0-9]{0,14}|0(?:[1-9][0-9]{0,13}|0(?:[1-9][0-9]{0,12}|0(?:[1-9][0-9]{0,11}|0(?:[1-9][0-9]{0,10}|0(?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))))))([.][0-9]{1,10})?|0{1,15}[.](?:[1-9][0-9]{0,9}|0(?:[1-9][0-9]{0,8}|0(?:[1-9][0-9]{0,7}|0(?:[1-9][0-9]{0,6}|0(?:[1-9][0-9]{0,5}|0(?:[1-9][0-9]{0,4}|0(?:[1-9][0-9]{0,3}|0(?:[1-9][0-9]{0,2}|0(?:[1-9][0-9]{0,1}|0[1-9]))))))))))$
        payment_method_id:
          description: Charge a saved payment method instead of opening a checkout page.
          type: string
          format: uuid
        return_url:
          description: Where to send the customer after checkout.
          type: string
      required:
      - payment_gateway
      - method_type
      - id
      - billing_account_id
      - amount
      additionalProperties: false
    TopUpList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopUp'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    PaymentCancellationReason:
      description: 'Why a gateway payment was withdrawn: `abandoned` when the customer did not complete it in time, `requested_by_customer` when the customer canceled it.'
      type: string
      enum:
      - abandoned
      - requested_by_customer
    PaymentOption:
      description: A gateway accepting the account's currency, with its payment methods.
      type: object
      properties:
        payment_gateway:
          description: The value to send as `payment_gateway`.
          type: string
        methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOptionMethod'
      required:
      - payment_gateway
      - methods
      additionalProperties: false
    PaymentOptionMethod:
      type: object
      properties:
        method_type:
          description: The value to send as `method_type`, such as card, wechat_pay or alipay.
          type: string
        reusable:
          description: Whether this method type can be saved with create-payment-method-setup and charged later without the customer.
          type: boolean
      required:
      - method_type
      - reusable
      additionalProperties: false
    PaymentOptionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOption'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        payment_gateway:
          type: string
        brand:
          type: string
        last4:
          type: string
        exp_month:
          type:
          - integer
          - 'null'
        exp_year:
          type:
          - integer
          - 'null'
        is_default:
          type: boolean
        status:
          type: string
          enum:
          - active
          - expired
          - removed
      required:
      - id
      - billing_account_id
      - payment_gateway
      - is_default
      - status
    PaymentMethodList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    PaymentMethodSetup:
      type: object
      properties:
        payment_gateway:
          description: The selected gateway supporting saved payment methods.
          type: string
          minLength: 1
          maxLength: 32
        billing_account_id:
          type: integer
          format: int64
      required:
      - payment_gateway
      - billing_account_id
      additionalProperties: false
    PaymentMethodSetupResult:
      description: What the payment gateway's browser library needs to collect a card in the page; the card goes from the browser straight to the gateway.
      type: object
      properties:
        setup_id:
          description: The gateway's identifier for this attempt.
          type: string
        payment_gateway:
          type: string
        action:
          $ref: '#/components/schemas/PaymentAction'
          description: Browser configuration for this card setup, including the gateway's public key; no secrets.
      required:
      - setup_id
      - payment_gateway
      - action
    PayInvoiceRequest:
      description: |-
        Applies eligible credit grants and the available balance as requested, then collects only the remainder
        through the selected gateway. Grants restricted to other purchases are not counted as available funds.
        An unresolved channel payment is reused; retries do not apply the grant or balance portions twice.
        Without a gateway selection, insufficient account funds fail without starting an online payment.

        `payment_gateway` and `method_type` are given together, and `payment_method_id` only with both;
        otherwise the request is refused with `BILLING_PURCHASE_INVALID`.
      type: object
      properties:
        payment_gateway:
          description: Required to collect an online remainder. An existing attempt keeps its gateway.
          type: string
          minLength: 1
          maxLength: 32
        method_type:
          description: Required with payment_gateway; for example card, wechat_pay or alipay.
          type: string
          minLength: 1
          maxLength: 64
        payment_method_id:
          description: A saved card of this billing account at the selected gateway. Omit to pay interactively.
          type: string
          format: uuid
        use_balance:
          description: Whether to apply the balance; credit grants are controlled by use_credits.
          type: boolean
          default: true
        use_credits:
          description: Apply eligible, unexpired credit grants before the balance. Grants are never converted into balance.
          type: boolean
          default: true
        return_url:
          type: string
      additionalProperties: false
      dependentRequired:
        payment_gateway:
        - method_type
        method_type:
        - payment_gateway
        payment_method_id:
        - payment_gateway
        - method_type
    PayTogetherRequest:
      description: Name at least one invoice or order. All must belong to one account in its currency.
      type: object
      properties:
        invoice_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        order_ids:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        expected_amount:
          description: The amount due across all invoices, before credit grants or balance, as preview-pay-together gave it. A different amount fails with `BILLING_AMOUNT_CHANGED` and nothing is charged. Omit to skip the check.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
          - type: string
            pattern: ^[0-9]{1,15}([.][0-9]{1,10})?$
      additionalProperties: false
    PaymentAction:
      description: The customer's next step; the payment outcome is reported separately.
      type: object
      properties:
        type:
          type: string
          enum:
          - redirect
          - qr_code
          - sdk
        provider:
          description: The browser adapter for the action, for example stripe.
          type: string
        url:
          type: string
          format: uri
        qr_code:
          description: QR content to render, not an image URL.
          type: string
        client_secret:
          description: Short-lived client credential for confirming this payment in the browser.
          type: string
        public_key:
          type: string
      required:
      - type
      additionalProperties: false
    PaymentStatus:
      description: '`succeeded`: paid. `processing`: confirmation is pending; poll the invoice or order instead of paying again. `requires_action`: the customer must complete the returned action. `failed`: the attempt did not succeed, for the reason in failure_reason; a declined gateway payment is withdrawn, and paying again starts a new payment.'
      type: string
      enum:
      - succeeded
      - processing
      - requires_action
      - failed
    AppliedCredit:
      description: A credit grant and what it would pay.
      type: object
      properties:
        credit_grant_id:
          type: string
          format: uuid
        name:
          type: string
        amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - credit_grant_id
      - name
      - amount
    PaymentPreviewInvoice:
      type: object
      properties:
        invoice_id:
          type: string
          format: uuid
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        amount_due:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_applied:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        balance_applied:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - invoice_id
      - amount_due
      - credit_applied
      - balance_applied
    PaymentPreview:
      description: What paying would take, calculated as paying does. Nothing is charged or reserved.
      type: object
      properties:
        funds:
          $ref: ../type/v1/funds.yaml#/components/schemas/Funds
        currency:
          type: string
        amount_due:
          description: What is outstanding before paying.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_applied:
          description: What credit grants would pay. Grants restricted to other purchases pay nothing here.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_grants:
          description: The credit grants that would pay, in the order used.
          type: array
          items:
            $ref: '#/components/schemas/AppliedCredit'
        balance_applied:
          description: What the balance would pay.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        gateway_amount:
          description: What would remain to pay online. Paying without a gateway is refused with `BILLING_INSUFFICIENT_FUNDS` while this is above zero.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        balance_after:
          description: The available balance after paying.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        invoices:
          description: 'Paying together only: each invoice, in payment order.'
          type: array
          items:
            $ref: '#/components/schemas/PaymentPreviewInvoice'
      required:
      - currency
      - amount_due
      - credit_applied
      - credit_grants
      - balance_applied
      - gateway_amount
      - balance_after
    PaymentResult:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: ./transactions.yaml#/components/schemas/Transaction
        transaction_id:
          description: The gateway transaction, when one is involved.
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount_paid:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount_due:
          description: 'What is still outstanding: zero once the payment succeeds, unchanged while `processing`.'
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        currency:
          type: string
        credit_applied:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: Credit grants applied to this invoice.
        gateway_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
          description: The remainder sent to the selected payment gateway.
        payment_gateway:
          type: string
        method_type:
          type: string
        balance_applied:
          description: The amount already paid from balance toward this invoice; retrying the online remainder does not debit it again.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        action:
          $ref: '#/components/schemas/PaymentAction'
        retriable:
          description: Whether paying again can succeed. False for a refusal that will repeat, such as a closed account or an amount over a limit.
          type: boolean
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        failure_reason:
          description: 'Why the payment failed; present with `failed`. For a declined gateway payment, the gateway''s code unchanged: the issuer''s decline code when there is one (Stripe decline_code, such as insufficient_funds), otherwise the gateway''s error code (Stripe code, such as card_declined). Treat an unknown value as a generic decline.'
          type: string
      required:
      - transactions
      - status
      - amount_paid
      - amount_due
      - currency
