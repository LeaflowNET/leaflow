paths:
  /api/v1/invoices:
    get:
      summary: List invoices
      description: Issued invoices of your billing accounts. Top-ups have no invoices.
      operationId: list-invoices
      tags:
      - invoices
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      - $ref: ./openapi.yaml#/components/parameters/AccountIdQuery
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/InvoiceStatus'
      - name: subscription_id
        in: query
        required: false
        description: Only invoices with a charge from this subscription; amounts are for the whole invoice.
        schema:
          type: string
          format: uuid
      - $ref: ./openapi.yaml#/components/parameters/From
      - $ref: ./openapi.yaml#/components/parameters/To
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/invoices/{invoiceId}:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/InvoiceId
    get:
      summary: Get invoice
      description: An issued invoice of your billing account, or the invoice of an order of a project you are a member of, with its amounts, tax lines and payment state. A missing or unissued invoice returns 404; any other invoice returns 403.
      operationId: get-invoice
      tags:
      - invoices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/invoices/{invoiceId}/items:
    parameters:
    - $ref: ./openapi.yaml#/components/parameters/InvoiceId
    get:
      summary: List invoice items
      description: Lines of an invoice readable with get-invoice, with their service periods and projects. A missing or unissued invoice returns 404; any other invoice returns 403.
      operationId: list-invoice-items
      tags:
      - invoices
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceItemList'
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    InvoiceStatus:
      description: '`open`: issued and not yet settled; a zero-total invoice is paid at once. `paid` stays paid after a refund, with the refunded part in amount_refunded. `void`: collection has stopped and any funds received have been returned. Usage not yet invoiced is not on any invoice.'
      type: string
      enum:
      - open
      - paid
      - void
    Invoice:
      type: object
      properties:
        void_requested_at:
          description: Collection has stopped; accepted return obligations are completed.
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
        amount_refunded:
          type: string
        tax_items:
          type: array
          items:
            $ref: '#/components/schemas/TaxItem'
        id:
          type: string
          format: uuid
        billing_account_id:
          type: integer
          format: int64
        number:
          description: Numbered per account and per month.
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        subtotal:
          description: |-
            Sum of the line amounts before discounts. Where prices include tax, the tax contained in
            each line's discounted amount is taken out here, so that total = subtotal -
            discount_amount + tax_amount always holds.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: Sum of the line discounts, taken off before tax.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credit_applied:
          description: Successful credit-grant payments, included in amount_paid; they do not reduce the receivable or tax base.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        total:
          description: Subtotal less discount plus tax. Balance and credit grants pay it plus rounding_amount; they do not reduce it.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        rounding_amount:
          description: Added to total to round the amount payable to the currency's minor unit; negative when rounded down. The rounding of a usage invoice carries over to the next invoice of the same billing period.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount_paid:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        pre_payment_credit_notes_amount:
          description: Issued credit notes that reduced unpaid receivables; the original invoice total is unchanged.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        post_payment_credit_notes_amount:
          description: Issued credit notes against payments already received; their refunds may not have completed.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount_due:
          description: What is still collectible from total plus rounding_amount after unpaid credit notes and successful payments; never below zero. Zero for a paid or void invoice.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        period_start:
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          description: Exclusive.
          type:
          - string
          - 'null'
          format: date-time
        customer_name:
          description: The billing details recorded when the invoice was issued.
          type: string
        customer_email:
          type: string
        customer_tax_id:
          type: string
        customer_tax_exempt:
          description: How tax applied to the customer when the invoice was issued; `reverse` means no tax was charged under the reverse-charge mechanism.
          type: string
          enum:
          - none
          - exempt
          - reverse
        customer_address_line1:
          type: string
        customer_address_line2:
          type: string
        customer_address_city:
          type: string
        customer_address_state:
          type: string
        customer_address_postal_code:
          type: string
        customer_address_country:
          type: string
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - tax_items
      - id
      - billing_account_id
      - number
      - currency
      - status
      - total
      - rounding_amount
      - amount_due
      - pre_payment_credit_notes_amount
      - post_payment_credit_notes_amount
    InvoiceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    InvoiceItem:
      type: object
      properties:
        taxable:
          type: boolean
        discount_amount:
          description: Discount applied to this line before tax.
          type: string
        discount_id:
          description: The account discount applied to this line.
          type:
          - string
          - 'null'
          format: uuid
        coupon_id:
          description: The coupon applied to this line.
          type:
          - string
          - 'null'
          format: uuid
        tax_amount:
          description: Tax on the discounted line, including tax already included in the price.
          type: string
        tax_included_amount:
          description: The part of tax_amount already included in amount.
          type: string
        id:
          type: string
          format: uuid
        project_id:
          type:
          - string
          - 'null'
          format: uuid
        project:
          description: The project the charge was for and its current name. Absent when the line has no project or the project cannot be read; `project_id` still identifies it.
          oneOf:
          - $ref: ../../type/v1/identity.yaml#/components/schemas/NamedIdentity
          - type: 'null'
        resource_id:
          type: string
        description:
          description: The line's wording as recorded when the invoice was issued.
          type: string
        unit:
          type: string
        quantity:
          type: string
        deducted_quantity:
          description: The part covered by an included allowance, and therefore not charged.
          type: string
        unit_amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        unit_quantity:
          description: 'The quantity `unit_amount` prices, such as 1000000 tokens or 3600 seconds: `amount` is `quantity` × `unit_amount` ÷ `unit_quantity`. Present together with `unit_amount`.'
          type: string
        amount:
          $ref: ../../type/v1/money.yaml#/components/schemas/Money
        rounding_amount:
          description: This line's share of the invoice's rounding_amount. The line's net amount is amount - discount_amount + tax_amount - tax_included_amount + rounding_amount.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        usage_charge_count:
          description: Usage charges billed on this line; zero for other lines.
          type: integer
          format: int32
        currency:
          type: string
        period_start:
          type:
          - string
          - 'null'
          format: date-time
        period_end:
          type:
          - string
          - 'null'
          format: date-time
        dimensions:
          description: For a usage line, the values of its meter's presentation dimensions, such as the model and token kind. Empty for other lines.
          type: object
          additionalProperties:
            type: string
        prorations:
          description: |-
            Present on a line that changes a subscription immediately, one entry for each paid period it
            covers. `amount` is the sum of `remaining_amount` minus `credited_amount` over the entries.
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItemProration'
      required:
      - id
      - description
      - amount
      - rounding_amount
      - usage_charge_count
      - currency
    InvoiceItemProration:
      description: The value of one paid period moved to the new configuration of a subscription.
      type: object
      properties:
        credited_invoice_item_id:
          description: The earlier invoice line that paid for the period.
          type: string
          format: uuid
        description:
          description: The earlier invoice line's wording as recorded.
          type: string
        period_start:
          type: string
          format: date-time
        period_end:
          description: Exclusive.
          type: string
          format: date-time
        remaining_amount:
          description: Before tax and discounts, the new configuration for the period.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        credited_amount:
          description: Before tax, the unused value of the earlier line for the period, credited against `remaining_amount`.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
      required:
      - credited_invoice_item_id
      - description
      - period_start
      - period_end
      - remaining_amount
      - credited_amount
    InvoiceItemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceItem'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
    InvoiceSummary:
      description: An order's invoice amounts, without contact details or payment methods, issued when the order is created; a zero-total invoice is paid at once.
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
        currency:
          type: string
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        subtotal:
          description: |-
            Sum of the line amounts before discounts. Where prices include tax, the tax contained in
            each line's discounted amount is taken out here, so that total = subtotal -
            discount_amount + tax_amount always holds.
          type: string
        discount_amount:
          description: Sum of the line discounts, taken off before tax.
          type: string
        tax_amount:
          type: string
        total:
          type: string
        amount_paid:
          type: string
        pre_payment_credit_notes_amount:
          description: Issued credit notes that reduced unpaid receivables; the original invoice total is unchanged.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        post_payment_credit_notes_amount:
          description: Issued credit notes against payments already received; their refunds may not have completed.
          allOf:
          - $ref: ../../type/v1/money.yaml#/components/schemas/Money
        amount_due:
          description: What is still collectible after unpaid credit notes and successful payments; never below zero.
          type: string
          pattern: ^\d+(\.\d{1,10})?$
        amount_refunded:
          type: string
        due_at:
          type: string
          format: date-time
      required:
      - id
      - currency
      - status
      - subtotal
      - discount_amount
      - tax_amount
      - total
      - amount_paid
      - amount_due
      - pre_payment_credit_notes_amount
      - post_payment_credit_notes_amount
      - amount_refunded
    TaxItem:
      description: Tax name, rate and amounts frozen on the invoice.
      type: object
      properties:
        id:
          type: string
          format: uuid
        invoice_id:
          type: string
          format: uuid
        name:
          type: string
        percentage:
          type: string
        country:
          type: string
        state:
          type: string
        taxable_amount:
          type: string
        tax_amount:
          type: string
        currency:
          type: string
      required:
      - id
      - invoice_id
      - name
      - percentage
      - country
      - taxable_amount
      - tax_amount
      - currency
