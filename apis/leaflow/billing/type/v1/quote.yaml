openapi: 3.2.1
info:
  title: Quote Types
  version: v1
  description: Price previews returned before purchase confirmation. Types only; this document declares no operations.
paths: {}
components:
  schemas:
    Quote:
      description: |-
        A price preview for the purchase described by a service, calculated by Billing. Nothing is saved,
        charged or reserved, and no discount redemption is consumed. Account discounts and tax are
        evaluated as for automatic checkout. Promotion codes are evaluated by Billing at checkout, not here.
        All amounts use currency. This preview does not lock prices or guarantee discount availability.
        Success includes complete checkout amounts and every requested usage estimate. If any item or
        requested usage estimate cannot be calculated, the operation returns its existing structured
        error response; it never returns a partial quote with HTTP 200. A quote without a billing account
        has no funds and no account discount, and leaves out tax that would be added.
      type: object
      properties:
        funds:
          description: Null for a quote without a billing account.
          oneOf:
          - $ref: ./funds.yaml#/components/schemas/Funds
          - type: 'null'
        tax_status:
          description: '`complete`: tax is calculated for the billing account''s invoice contact. `requires_location_inputs`:
            a quote without a billing account, which leaves out tax that would be added; tax already contained in a
            price is included.'
          type: string
          enum:
          - complete
          - requires_location_inputs
        items:
          description: One line for each item the purchase would order, in the order it would order them.
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
        subtotal:
          description: |-
            Sum of line amounts before discounts, less tax already included in the discounted line
            amounts, as on an invoice.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: Sum of line discounts.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          description: Sum of tax on the discounted line amounts.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        total:
          description: |-
            subtotal minus discount_amount plus tax_amount: what checkout collects, before applying
            credit grants or balance. Equals the sum of line totals and excludes estimated_usage_amount.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        estimated_usage_amount:
          description: |-
            Sum of the lines' estimated_usage_amount. A projection, not part of total and not collected at
            checkout. Null when no usage estimate is requested.
          oneOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        currency:
          type: string
        proration_date:
          description: |-
            Changes only; null otherwise. The instant the change is priced from. Pass it with the change so the
            order is priced from the same instant.
          type:
          - string
          - 'null'
          format: date-time
        refundable_amount:
          description: |-
            Changes that lower the price only; null otherwise. What the change would return to the original
            payment sources, including the tax paid on it. total is zero for such a change.
          oneOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
      required:
      - funds
      - tax_status
      - items
      - subtotal
      - discount_amount
      - tax_amount
      - total
      - estimated_usage_amount
      - currency
      - proration_date
      - refundable_amount
      additionalProperties: false
    QuoteItem:
      description: |-
        One calculated purchase line. Fixed purchase amounts are rounded as checkout rounds them.
        A line without an immediate charge has zero checkout amounts. unit_amount remains null when
        no single unit price applies; an unrequested usage estimate remains null.
      type: object
      properties:
        product_id:
          type: string
        plan_id:
          type: string
          format: uuid
        plan_name:
          type: string
        price_id:
          description: |-
            The price the line is priced at, including one Billing selected. With quantity and dimensions it
            prices the same line in Billing's own quote, for example with a promotion code.
          type: string
          format: uuid
        dimensions:
          description: The dimension values the line is priced at, such as region and instance type.
          type: object
          additionalProperties:
            type: string
        type:
          description: one_time or recurring.
          type: string
          enum:
          - one_time
          - recurring
        usage_type:
          description: licensed or metered.
          type: string
          enum:
          - licensed
          - metered
        interval:
          description: The billing period of a recurring licensed line; `none` otherwise.
          type: string
          enum:
          - none
          - day
          - month
          - year
        interval_count:
          description: Periods per billing cycle of a recurring licensed line; null otherwise.
          type:
          - integer
          - 'null'
          minimum: 1
        setup_amount:
          description: The setup charge already included in amount; null when none applies.
          oneOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        recurring_amount:
          description: |-
            Recurring licensed lines only; null otherwise. What each later period renews at, before discounts
            and tax, which differs from amount when the first period is priced differently.
          oneOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        unit_amount:
          description: |-
            Unit price before discounts, with tax included only where the price includes it. Null when
            no single unit price applies, such as tiered or multiple-rate pricing or an immediate change.
          oneOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        quantity:
          description: The quantity priced.
          type: string
        amount:
          description: |-
            Before discounts, including any setup charges. Contains tax only where the price includes it.
            Zero for an item with no immediate charge.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        discount_amount:
          description: Total reduction on this line, including any committed recurring discount.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        tax_amount:
          description: Tax on the discounted amount, including any tax already contained in that amount.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        tax_included_amount:
          description: The part of tax_amount already contained in amount minus discount_amount.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        total:
          description: amount minus discount_amount plus tax_amount minus tax_included_amount.
          allOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
        estimated_usage_amount:
          description: |-
            Projected charge for this line's future usage over the period stated by the quoting operation,
            at current rates, before discounts and tax and not rounded. Not part of amount or total and
            not collected at checkout. Null when no usage estimate is requested for this line.
          oneOf:
          - $ref: ../../../type/v1/money.yaml#/components/schemas/Money
          - type: 'null'
        currency:
          type: string
      required:
      - product_id
      - plan_id
      - plan_name
      - price_id
      - dimensions
      - type
      - usage_type
      - interval
      - interval_count
      - setup_amount
      - recurring_amount
      - unit_amount
      - quantity
      - amount
      - discount_amount
      - tax_amount
      - tax_included_amount
      - total
      - estimated_usage_amount
      - currency
      additionalProperties: false
