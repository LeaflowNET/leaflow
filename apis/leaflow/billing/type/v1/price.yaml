openapi: 3.2.1
info:
  title: Billing Price Types
  version: v1
  description: Shared price terms for services that sell through Billing. Types only; this document declares no operations.
paths: {}
components:
  schemas:
    Interval:
      description: |-
        The unit a prepaid price's period is counted in, as the price states it in `interval`. A service forwards it to
        Billing unchanged; the periods a plan is sold for are those its prices in Billing state, and Billing refuses a
        period the plan has no price for.
      type: string
      enum:
        - day
        - month
        - year
