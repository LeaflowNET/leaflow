openapi: 3.1.0
info:
  title: Shared Security Schemes
  version: v1
  description: |-
    The security schemes shared across the user-facing APIs. This document declares schemes only;
    it has no operations and `paths` is empty.
paths: {}
components:
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        The access token issued by auth.leaflow.net. It states who the caller is and names no project.

        Use it to list the projects the caller belongs to and to obtain a scoped token.
    ScopedToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        A scoped token issued by IAM. Sign in at auth.leaflow.net to obtain an access token, then exchange it for a scoped token (`POST /account/v1/projects/{projectId}/scoped-tokens`).

        A scoped token states both the current user and the current project. Neither the path nor the headers carry a `project_id`.

        `TOKEN_MISSING` means no token was sent. `TOKEN_EXPIRED` means the scoped token has expired; exchange the access token for a new one without signing in again. `TOKEN_INVALID` means the token did not verify. `NOT_A_MEMBER` means the account is not a member of the project. `USER_SUSPENDED` and `USER_BANNED` mean the account itself is barred from operating.
