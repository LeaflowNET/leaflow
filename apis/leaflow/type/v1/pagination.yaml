openapi: 3.2.1
info:
  title: Pagination types
  version: v1
  description: |-
    Shared pagination request parameters and response metadata. Page and PageSize are used for
    numbered pages; Limit and Offset for offset paging; Cursor and Limit for keyset paging.
    Filtering is independent of pagination. This document declares no operations.
paths: {}
components:
  schemas:
    OffsetPagination:
      description: Pagination metadata for stable numbered pages. total_count is returned only when the operation can determine it without an unbounded scan.
      type: object
      properties:
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          format: int64
          minimum: 1
        total_count:
          type: integer
          format: int64
          minimum: 0
      required:
        - page
        - page_size
      additionalProperties: false
    CursorPagination:
      description: Pagination metadata for keyset traversal. Pass next_cursor as cursor to read the following page; null means there is no following page.
      type: object
      properties:
        page_size:
          type: integer
          format: int64
          minimum: 1
        next_cursor:
          type:
            - string
            - "null"
      required:
        - page_size
      additionalProperties: false
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number. Defaults to 1.
      schema:
        type: integer
        format: int64
        default: 1
        minimum: 1
        maximum: 2147483647
    PageSize:
      name: page_size
      in: query
      required: false
      description: Items per page. Defaults to 50; at most 200.
      schema:
        type: integer
        format: int64
        default: 50
        minimum: 1
        maximum: 200
    Ids:
      name: ids
      in: query
      description: |-
        Return only the rows whose id is in this list. Comma-separated ids, at most 100.

        It narrows a listing the way every other filter does: it is combined with them as AND, and the
        result is paged as usual. Ids that match no row are left out of the result rather than reported;
        a caller that needs to know which of its ids exist compares the ids it sent with the ones it got
        back.

        At least one id is required. An empty value is rejected rather than treated as "no filter",
        because a caller that builds this list from a selection and finds it empty would otherwise
        receive the whole table and show it as the selection.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    Cursor:
      name: cursor
      in: query
      required: false
      description: The next_cursor returned by the previous page. Omit it for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      description: Items returned in this page. Defaults to 50; at most 200.
      schema:
        type: integer
        format: int64
        default: 50
        minimum: 1
        maximum: 200
    Offset:
      name: offset
      in: query
      required: false
      description: Items to skip. Defaults to 0; at most 10000.
      schema:
        type: integer
        format: int64
        default: 0
        minimum: 0
        maximum: 10000
