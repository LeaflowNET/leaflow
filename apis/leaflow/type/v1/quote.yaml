openapi: 3.1.0
info:
  title: Quote Types
  version: v1
  description: Price previews returned before purchase confirmation. Types only; this document declares no operations.
paths: {}
components:
  schemas:
    Quote:
      description: |-
        A price preview for the purchase described by a service, calculated by Billing. Nothing is saved,
        charged or reserved, and no discount redemption is consumed. Account discounts and tax are
        evaluated as for automatic checkout. Promotion codes are evaluated through Billing quote operations.
        All amounts use currency. This preview does not lock prices or guarantee discount availability.
      type: object
      properties:
        lines:
          description: One line for each item the purchase would order, in the order it would order them.
          type: array
          items:
            $ref: '#/components/schemas/QuotedLine'
        subtotal:
          description: |-
            Sum of line amounts before discounts, less tax already included in the discounted line
            amounts, as on an invoice. Null when any line cannot be priced.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        discount_amount:
          description: Sum of line discounts. Null when any line cannot be priced.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        tax_amount:
          description: Sum of tax on the discounted line amounts. Null when any line cannot be priced.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        total:
          description: |-
            subtotal minus discount_amount plus tax_amount: what checkout collects, before applying
            credit grants or balance. Equals the sum of line totals and excludes estimated_usage_amount.
            Null when any line cannot be priced.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        estimated_usage_amount:
          description: |-
            Sum of the lines' estimated_usage_amount. A projection, not part of total and not collected at
            checkout. Null when no line is billed for usage or when any usage cannot be priced.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        currency:
          type: string
      required:
      - lines
      - subtotal
      - discount_amount
      - tax_amount
      - total
      - estimated_usage_amount
      - currency
      additionalProperties: false
    QuotedLine:
      description: |-
        One calculated purchase line. Fixed purchase amounts are rounded as checkout rounds them.
        When priced is false, price_id and every monetary field are null. A priced line without an
        immediate charge has zero amounts; an unavailable unit price remains null.
      type: object
      properties:
        priced:
          description: Whether the line can be priced. When false, unpriced_reason states what is missing.
          type: boolean
        unpriced_reason:
          description: Why no price was found; `none` while `priced` is true.
          type: string
          enum:
          - none
          - no_price
        price_id:
          description: The price selected, including when the request left the choice to the service. Order with this
            price.
          type:
          - string
          - 'null'
          format: uuid
        plan_name:
          type: string
        unit_amount:
          description: Unit price before discounts, with tax included only where the price includes it.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        quantity:
          description: The quantity priced.
          type: string
        amount:
          description: |-
            Before discounts, including any setup charges. Contains tax only where the price includes it.
            Zero for a priced order item with no immediate charge.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        discount_amount:
          description: Total reduction on this line, including any committed recurring discount.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        tax_amount:
          description: Tax on the discounted amount, including any tax already contained in that amount.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        tax_included_amount:
          description: The part of tax_amount already contained in amount minus discount_amount.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        total:
          description: amount minus discount_amount plus tax_amount minus tax_included_amount.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        estimated_usage_amount:
          description: |-
            Projected charge for this line's future usage over the period stated by the quoting operation,
            at current rates, before discounts and tax and not rounded. Not part of amount or total and
            not collected at checkout. Null when the line is not billed for usage or its usage cannot be
            priced.
          oneOf:
          - $ref: ./money.yaml#/components/schemas/Money
          - type: 'null'
        currency:
          type: string
      required:
      - priced
      - unpriced_reason
      - price_id
      - plan_name
      - unit_amount
      - quantity
      - amount
      - discount_amount
      - tax_amount
      - tax_included_amount
      - total
      - estimated_usage_amount
      - currency
      additionalProperties: false
