openapi: 3.1.0
info:
  title: Leaflow shared types
  version: v1
  description: |-
    Shapes shared across the platform. This document declares types only; it has no
    operations and `paths` is empty.
paths: {}
components:
  schemas:
    Error:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        meta:
          additionalProperties: {}
          type: object
        status:
          format: int64
          type: integer
      required:
        - status
        - message
      type: object
    Violation:
      description: |-
        A single mismatch between the request and the contract.

        Violations appear in `Error.meta.violations`. They are present on every response
        whose `code` is `VALIDATION_FAILED` and on no other response.

        Use `field` to locate the input, `rule` to decide what to tell the user, and
        `reason` only for diagnostics.
      additionalProperties: false
      properties:
        field:
          description: |-
            Dot-separated path to the field, such as `name` or
            `schedule.0.start_time_seconds`.
          type: string
        rule:
          description: |-
            The JSON Schema keyword that failed, such as `minLength`, `minimum` or
            `pattern`.
          type: string
        reason:
          description: |-
            The validator's own wording, in English. Intended for diagnostics; do not
            display it to end users.
          type: string
      required:
        - field
        - rule
      type: object
