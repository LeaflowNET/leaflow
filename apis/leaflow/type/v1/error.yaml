openapi: 3.1.0
info:
  title: Shared Types
  version: v1
  description: |-
    Shapes shared across the platform. This document declares types only; it has no
    operations and `paths` is empty.
paths: {}
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        meta:
          description: |-
            What a given `code` carries alongside the message. The keys depend on the code,
            and a client that does not recognise one ignores it.
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int64
      required:
        - status
        - message
      additionalProperties: false
