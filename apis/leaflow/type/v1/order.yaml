openapi: 3.2.1
info:
  title: Order Types
  version: v1
  description: Order references returned by product purchases. Types only; this document declares no operations.
paths: {}
components:
  schemas:
    PlacedOrder:
      description: Identifies the purchase. Read the order for purchase progress and its invoice for amounts and
        payment status.
      type: object
      properties:
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The invoice for this purchase, which may still be a draft awaiting checkout. Null when no
            invoice has been created. Its presence or absence does not establish whether delivery may begin.
        order_id:
          description: The order, including for purchases without an immediate charge. Payment alone does not
            imply that the service has completed delivery.
          type: string
          format: uuid
      required:
      - order_id
      - invoice_id
      additionalProperties: false
