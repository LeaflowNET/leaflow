openapi: 3.1.0
info:
  title: Order Types
  version: v1
  description: 'The handle a service returns after creating a billable order. Types only; this document

    declares no operations.'
paths: {}
components:
  schemas:
    PlacedOrder:
      description: Identifies the purchase. Read the order for purchase progress and its invoice for amounts and
        payment status.
      type: object
      properties:
        invoice_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The invoice for this purchase. Null when there is no immediate invoice. Read the invoice for
            its current payment state.
        order_id:
          description: The order, including for purchases without an immediate charge. Payment alone does not
            imply that the service has completed delivery.
          type: string
          format: uuid
      required:
      - order_id
      - invoice_id
      additionalProperties: false
    OrderOptions:
      type: object
      properties:
        auto_pay:
          type: boolean
          default: true
          description: Defaults to true. When true, the purchase is paid from available account funds and applicable
            grants when it is placed. If they do not cover the amount due, the request fails with HTTP 422 and code
            BILLING_INSUFFICIENT_FUNDS; no order is created and nothing is charged. When false, the order is created
            without payment, and its invoice, if any, is paid through Billing.
        expected_amount:
          type: string
          pattern: ^\d+(\.\d{1,10})?$
        redemption_code:
          type: string
          minLength: 1
          maxLength: 128
      additionalProperties: false
      description: Purchase options. Every request places an order of its own.
