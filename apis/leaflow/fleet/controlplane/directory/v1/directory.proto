syntax = "proto3";

package leaflow.fleet.controlplane.directory.v1;

option go_package = "github.com/leaflowapis/leaflow-go/fleet/controlplane/directory/v1;directoryv1";

// Logins of platform users on the machines of their projects: every platform
// user has one directory account, with the same name and uid on every machine
// of every project, each project has its groups, and an individual machine may
// bind an existing local account of its own (/etc/passwd) to a platform user
// instead. Every call travels on the daemon's control connection
// (leaflow.fleet.controlplane.control.v1) and fails there with the reasons of each method
// in a google.rpc.ErrorInfo of the domain "fleet.leaflow.cloud".
//
// On-demand resolution. When the machine reports the "on_demand" detail of
// this feature, nothing of the project's directory is pushed when the machine
// connects: the Agent resolves accounts and groups on demand with GetAccount
// and GetGroup, caches active entries across restarts so that lookups and
// logins keep working while the service is unreachable, and refreshes or
// evicts cached entries when the service calls InvalidateDirectory.
// Enumeration (getpwent(3), getgrent(3)) returns only the active directory
// entries cached on the machine. For older Agents without "on_demand", the
// service sends the project's directory with SetDirectory and UpdateDirectory
// and answers GetAccount.
//
// Directory accounts vs. bound local accounts:
//   - Directory accounts (Account) and groups (Group) never appear in
//     /etc/passwd or /etc/group, and the local accounts and groups of the
//     machine are left as they are. Directory accounts have no password: a
//     person on a participant of one of the account's sessions approves
//     elevation through sudo, or the account's owner does on the platform, or
//     their setting for the machine does at once
//     (leaflow.fleet.controlplane.privilege.v1); inside a command the platform runs for the
//     account, its request does (leaflow.fleet.controlplane.command.v1).
//   - Bound local accounts (LocalAccount) map an existing non-system user of
//     the machine's /etc/passwd 1:1 to a platform user on that machine only.
//     The local account keeps its own uid, primary group, local supplementary
//     groups, GECOS name, home directory, shell, password and authorized_keys
//     files; Fleet opens sessions, runs commands and starts MCP servers as
//     that local account, serves its membership in the project's groups
//     through NSS initgroups alongside its local groups, accepts the platform
//     user's SSH public keys through AuthorizedKeysCommand in addition to the
//     local account's own authorized_keys files, and approves sudo through
//     leaflow.fleet.controlplane.privilege.v1 while admin is set. Non-Fleet logins, cron
//     jobs and local authentication of the local account are left untouched.
//
// Feature "leaflow.fleet.controlplane.directory.v1" (leaflow.fleet.controlplane.machine.v1 Feature):
// AVAILABLE while the Agent's NSS module serves passwd and group and its PAM
// module is in the account stack of the machine's PAM services. Details, each
// present when the machine has it:
//   - "ssh": sshd(8) takes the accounts' SSH keys from the Agent's
//     AuthorizedKeysCommand, in addition to authorized_keys files;
//   - "sudo": sudo is installed, so accounts with admin may become root;
//   - "on_demand": the Agent resolves accounts and groups on demand with
//     GetAccount and GetGroup and handles InvalidateDirectory, so the service
//     sends neither SetDirectory nor UpdateDirectory;
//   - "local_accounts": the Agent serves LocalAccount bindings of existing
//     local accounts on the machine.

// Keeps the machine's copy of the directory. Served by the daemon; the
// service calls it, one call at a time per machine, so that an earlier copy
// never arrives after a later one.
service MachineDirectoryService {
  // Replaces the machine's copy of the directory. The Agent serves the
  // accounts and groups of the request through NSS and PAM from then on,
  // keeps the copy across restarts and answers from it while the service is
  // unreachable. A request with the revision the Agent holds changes
  // nothing.
  //
  // For each account:
  //   - its name, uid, primary group (its own group of the same name and
  //     id), GECOS name, home directory and shell resolve whatever its
  //     access, so that the files it owns keep their owner;
  //   - PAM admits it only while login_allowed is set; when it loses it,
  //     the Agent ends what it runs through the machine's features, such as
  //     its sessions, which end with SESSION_CLOSE_REASON_ACCESS_REVOKED
  //     (leaflow.fleet.controlplane.host.v1);
  //   - sshd(8) accepts its ssh_public_keys, through the Agent's
  //     AuthorizedKeysCommand, only while login_allowed is set;
  //   - sudo(8) lets it become root only while admin is set as well;
  //   - its home directory is created on its first login, owned by it, and
  //     never deleted.
  // Each group resolves with its members. An account or group missing from
  // the request no longer resolves; its files keep their ids.
  //
  // An account or group whose name or id a local account or group of the
  // machine already uses is not served, so that it can take over no local
  // file or right. So is one with an id outside 65536 to 2147483647 (below
  // are the system's and the local administrator's) or within the
  // subordinate ids of a local user (subuid(5), subgid(5)). The Agent reports
  // each with ReportMachineEvents (leaflow.fleet.controlplane.machine.v1) when it begins.
  //
  // Fails with INVALID_ARGUMENT and reason INVALID_REQUEST, with metadata
  // "field" naming the first offending field, for a directory that breaks a
  // rule of Directory, Account or Group; nothing of it is served then.
  rpc SetDirectory(SetDirectoryRequest) returns (SetDirectoryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Changes the machine's copy of the directory from base_revision, the
  // revision it holds, to revision: the accounts and groups of the request
  // are added or replace those of the same name, and the names removed go.
  // What results is served exactly as the same directory sent whole with
  // SetDirectory would be. The service sends a change instead of the whole
  // directory when it knows the revision the machine holds
  // (ReportDirectoryStatus, or the last call that succeeded), and the whole
  // directory whenever this call fails. A request with the revision the
  // Agent holds already changes nothing, so that a retry succeeds.
  //
  // Fails with:
  //   - FAILED_PRECONDITION and reason REVISION_MISMATCH, with metadata
  //     "revision", the revision the Agent holds (empty for none), when
  //     base_revision is not it; the copy stays as it is;
  //   - INVALID_ARGUMENT and reason INVALID_REQUEST, with metadata "field"
  //     naming the first offending field, for a request that names an entry
  //     twice, adds and removes the same name or removes one the copy does
  //     not have, or whose result breaks a rule of Directory, Account or
  //     Group; the copy stays as it is.
  rpc UpdateDirectory(UpdateDirectoryRequest) returns (UpdateDirectoryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // Notifies the daemon that cached directory entries on this machine may be
  // stale. For a machine that reports the "on_demand" detail, the service
  // sends this instead of SetDirectory or UpdateDirectory whenever an
  // account's access, SSH keys, attributes or local-account binding on this
  // machine changes, or a project group changes.
  //
  // For each named user_id, username or group_name that the daemon currently
  // caches or runs sessions or MCP servers for (or for every cached entry when
  // all is true), the daemon refreshes or evicts its cached entry and ends any
  // Fleet sessions and MCP servers of an account that may no longer log in
  // (SESSION_CLOSE_REASON_ACCESS_REVOKED of leaflow.fleet.controlplane.host.v1). Entries
  // the daemon has never cached on this machine require no action and no call
  // back.
  rpc InvalidateDirectory(InvalidateDirectoryRequest) returns (InvalidateDirectoryResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Answers the Agent's questions about the directory and takes its reports.
// Served by the service on daemon connections.
service DirectoryService {
  // Returns an account on the calling machine as it stands now, by login name
  // or directory uid, from the platform's current permissions, SSH keys and
  // local-account bindings for this machine, together with the project groups
  // the account belongs to. The Agent asks on demand (for NSS cache misses,
  // AuthorizedKeysCommand, PAM checks, sessions, commands and MCP) and caches
  // active entries locally across restarts for offline use.
  //
  // When this machine reports "local_accounts" and binds an existing local
  // account of that username to a platform user, the response carries
  // local_account instead of account: the machine keeps the local account's own
  // passwd(5) entry, groups and authorized_keys, and uses local_account for
  // Fleet sessions, commands, MCP servers, sudo approvals and additional SSH
  // keys. A platform user bound to a local account on this machine resolves
  // only as that local account here; querying their directory username or uid
  // on this machine fails with ACCOUNT_NOT_FOUND.
  //
  // Fails with:
  //   - INVALID_ARGUMENT and reason INVALID_REQUEST, with metadata "field"
  //     naming the offending field, when neither username nor uid is set, both
  //     are set, or the value breaks its field rules;
  //   - NOT_FOUND and reason ACCOUNT_NOT_FOUND when no directory account or
  //     bound local account of this machine matches.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Returns a group of the calling machine's project directory by name or gid,
  // on demand when NSS looks up a group not yet in the machine's cache.
  //
  // Fails with:
  //   - INVALID_ARGUMENT and reason INVALID_REQUEST, with metadata "field"
  //     naming the offending field, when neither name nor gid is set or the
  //     value breaks its field rules;
  //   - NOT_FOUND and reason GROUP_NOT_FOUND when no group of the project's
  //     directory matches.
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Reports the copy the Agent serves. Kept for Agents without "on_demand".
  rpc ReportDirectoryStatus(ReportDirectoryStatusRequest) returns (ReportDirectoryStatusResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// The directory of the machine's project, as the machine sees it.
message Directory {
  // Names this content: it changes whenever anything below changes. 1 to
  // 256 bytes without control characters.
  string revision = 1;
  // At most 10000.
  repeated Account accounts = 2;
  // At most 10000.
  repeated Group groups = 3;
}

// A directory account (passwd(5)).
message Account {
  // The login name, as useradd(8) accepts it by default: 1 to 32 characters
  // of [a-z0-9_-], starting with a letter or "_". No other account or group
  // of the directory has it.
  string username = 1;
  // The user id, from 65536 to 2147483647. No other account has it.
  uint32 uid = 2;
  // The primary group id: the account's own group, of the same name and id,
  // so equal to uid.
  uint32 gid = 3;
  // The full name for the GECOS field, plain text of at most 1024 bytes;
  // ':' and ',' show as spaces.
  string display_name = 4;
  // The home directory: an absolute path below /home without ".", ".." or
  // empty components, whitespace or ':', such as "/home/alice". No other
  // account has it.
  string home_directory = 5;
  // The login shell: an absolute path with the same rules, such as
  // "/bin/bash".
  string shell = 6;
  // The platform user of the account.
  string user_id = 7;
  // The SSH public keys the account logs in with, each an authorized_keys(5)
  // key without options, such as "ssh-ed25519 AAAAC3Nz...".
  repeated string ssh_public_keys = 9;
  // The account may log in to this machine.
  bool login_allowed = 10;
  // The account may become root on this machine through sudo(8).
  bool admin = 11;
}

// A directory group (group(5)).
message Group {
  // The group name, by the rules of Account.username; no account or other
  // group of the directory has it.
  string name = 1;
  // The group id, from 65536 to 2147483647; no other group and no account's
  // own group has it.
  uint32 gid = 2;
  // The usernames of its members, each an account of the directory.
  repeated string members = 3;
}

// The request of SetDirectory.
message SetDirectoryRequest {
  // The machine's whole directory.
  Directory directory = 1;
}

// The response of SetDirectory.
message SetDirectoryResponse {}

// The request of UpdateDirectory.
message UpdateDirectoryRequest {
  // The revision the change applies to: Directory.revision of the copy the
  // machine holds.
  string base_revision = 1;
  // Directory.revision after the change.
  string revision = 2;
  // Accounts added, or replacing the account of the same username.
  repeated Account accounts = 3;
  // Groups added, or replacing the group of the same name.
  repeated Group groups = 4;
  // The usernames of the accounts removed.
  repeated string removed_accounts = 5;
  // The names of the groups removed.
  repeated string removed_groups = 6;
}

// The response of UpdateDirectory.
message UpdateDirectoryResponse {}

// The request of GetAccount. Exactly one of username or uid is set.
message GetAccountRequest {
  // The login name to look up: either a bound local account of this machine or
  // a directory account of the project.
  string username = 1;
  // A directory account's uid, from 65536 to 2147483647, when looking up by
  // uid instead of username.
  uint32 uid = 2;
}

// The response of GetAccount. Exactly one of account or local_account is set.
message GetAccountResponse {
  // Set when the resolved account on this machine is a directory account
  // served through NSS.
  Account account = 1;
  // Set instead of account when this machine binds an existing local account
  // of /etc/passwd to a platform user.
  LocalAccount local_account = 2;
  // The groups of the project's directory that this account belongs to,
  // ordered by name, so that initgroups(3) needs no separate call.
  repeated AccountGroup groups = 3;
}

// The request of ReportDirectoryStatus.
message ReportDirectoryStatusRequest {
  // Directory.revision of the copy the Agent serves. Empty before the first
  // SetDirectory.
  string revision = 1;
  // Orders the reports the daemon sends on this connection by when it
  // observed what they report (leaflow.fleet.controlplane.control.v1 Reports): it
  // increases with every report, 1 for the first, and a report sent again
  // keeps its sequence.
  uint64 sequence = 2;
}

// The response of ReportDirectoryStatus.
message ReportDirectoryStatusResponse {}

// An existing local account of the machine (/etc/passwd) bound 1:1 to a
// platform user on this machine.
//
// Its uid, primary group, local supplementary groups, GECOS name, home
// directory and login shell come from the machine's own account files and are
// never overwritten. The Agent refuses to serve a LocalAccount when no local
// user of that name exists on the machine, when it is root (uid 0 or gid 0) or
// a system or non-login account (uid below UID_MIN, nobody, the Agent's own
// user, or a non-interactive shell), or when the machine's local configuration
// disallows binding it, and reports MACHINE_EVENT_TYPE_LOCAL_ACCOUNT_REFUSED
// (leaflow.fleet.controlplane.machine.v1).
message LocalAccount {
  // The local login name on this machine, by the rules of Account.username,
  // never "root".
  string username = 1;
  // The platform user bound to this local account on this machine.
  string user_id = 2;
  // The SSH public keys of the platform user, each an authorized_keys(5) key
  // without options. sshd(8) accepts them through the Agent's
  // AuthorizedKeysCommand in addition to the local account's own
  // authorized_keys files while login_allowed is set.
  repeated string ssh_public_keys = 3;
  // The platform user may open Fleet sessions, run commands, start MCP servers
  // and log in with ssh_public_keys as this local account on this machine.
  // Local passwords, local authorized_keys and non-Fleet PAM services of the
  // local account are unaffected.
  bool login_allowed = 4;
  // The platform user may become root as this local account through Fleet's
  // sudo approval (leaflow.fleet.controlplane.privilege.v1) and inside Fleet commands
  // (leaflow.fleet.controlplane.command.v1).
  bool admin = 5;
}

// A project group an account belongs to.
message AccountGroup {
  // The group name, by the rules of Group.name.
  string name = 1;
  // The group id, from 65536 to 2147483647.
  uint32 gid = 2;
}

// The request of GetGroup.
message GetGroupRequest {
  // Which group to look up; set one.
  oneof query {
    // The group name, by the rules of Group.name.
    string name = 1;
    // The group id, from 65536 to 2147483647.
    uint32 gid = 2;
  }
}

// The response of GetGroup.
message GetGroupResponse {
  // The group as the calling machine's project directory has it now, with the
  // effective usernames on this machine of its members.
  Group group = 1;
}

// The request of InvalidateDirectory.
message InvalidateDirectoryRequest {
  // Platform user ids whose resolved account, permissions, SSH keys or
  // local-account binding changed.
  repeated string user_ids = 1;
  // Account usernames (directory or local) that changed or were unbound on
  // this machine.
  repeated string usernames = 2;
  // Project group names that were renamed, removed or had membership changes.
  repeated string group_names = 3;
  // When true, invalidates every cached directory entry on the machine.
  bool all = 4;
}

// The response of InvalidateDirectory.
message InvalidateDirectoryResponse {}
