syntax = "proto3";

package leaflow.fleet.virtualdesktop.lease.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/leaflowapis/leaflow-go/fleet/virtualdesktop/lease/v1;leasev1";

// Who operates a desktop session: the input lease, and the rules for operation
// calls. The session does not tell people and programs apart: several
// participants may operate it together, and the rules follow how a participant
// acts, not who it is.
//
// Channel type "leaflow.fleet.virtualdesktop.lease.v1", lane "metadata": opened
// by the participant right after the session channel
// (leaflow.fleet.session.v1), one per connection. The session sends
// ServerMessage: the InputLease, SnapshotEnd, then changes.
//
// Revisions. The session numbers what it observes changing in its windows,
// pixels and accessibility trees with one logical clock, the revision, which
// starts at 1 and only grows (after the etcd revision). Operation calls that
// act on the session return the revision at which their action took effect,
// and calls that read state return the revision the state belongs to; every
// change observed later has a larger revision. Revisions order observations
// across channels, which the channels themselves do not.
//
// Input lease. One participant at a time gives input: the holder of the input
// lease. A participant that is not read-only takes it with its input while
// nobody holds it, and keeps it until it has been idle until expires_at. Input
// on the input channel takes the lease at once, from whoever holds it.
//
// Operation calls. Participants may also operate the session through the
// service channels of the domain packages. Every call that injects input,
// activates or changes windows, or acts on applications through accessibility,
// the tray, notifications or drops needs the input lease, and the session
// refuses it, before doing anything, with:
//   - PERMISSION_DENIED and reason READ_ONLY for a read-only participant;
//   - UNAVAILABLE and reason INPUT_BUSY, with a google.rpc.RetryInfo, while
//     another participant holds the lease or another such call of the session
//     is still running;
//   - FAILED_PRECONDITION and reason BLOCKED_BY_MODAL for a window a modal
//     window blocks (metadata "windowId" and "modalWindowId").
// Failed calls tell whether they had an effect (leaflow.fleet.rpc.v1
// ExecutionState). The session never reports the text of password fields.

// A message from the session.
message ServerMessage {
  // The message.
  oneof message {
    // Who holds the input lease.
    InputLease input_lease = 1;
    // Ends the snapshot.
    SnapshotEnd snapshot_end = 2;
  }
}

// Who holds the input lease. Sent in the snapshot and whenever it changes,
// so that every participant sees who operates the session.
message InputLease {
  // The participant that holds it. 0: nobody; the next input takes it.
  uint64 holder_participant_id = 1;
  // The platform user of the holder.
  string holder_user_id = 2;
  // When the holder took it.
  google.protobuf.Timestamp acquired_at = 3;
  // When it ends if its holder gives no more input, on the session's clock.
  // Unset when nobody holds it.
  google.protobuf.Timestamp expires_at = 4;
}

// Ends the snapshot of this channel: the InputLease has been sent.
message SnapshotEnd {}
