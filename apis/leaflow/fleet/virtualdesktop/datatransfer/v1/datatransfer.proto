syntax = "proto3";

package leaflow.fleet.virtualdesktop.datatransfer.v1;

import "google/protobuf/duration.proto";
import "google/rpc/status.proto";
import "leaflow/fleet/filetransfer/v1/filetransfer.proto";

option go_package = "github.com/leaflowapis/leaflow-go/fleet/virtualdesktop/datatransfer/v1;datatransferv1";

// Data passed between the participant's own desktop and the session by copy and
// paste or by drag and drop. As in the W3C HTML DataTransfer interface and the
// Wayland data device, both share one model: the side that has the data lists
// the formats it can provide, as media types, and the other side reads a
// format when it needs it (delayed rendering, MS-RDPECLIP). Files are
// referenced as a file transfer offer and fetched like any other. The session
// converts formats to and from ICCCM targets, such as UTF8_STRING and
// "text/plain"; text is UTF-8, and the session turns CRLF from the participant
// into LF. In the session, copy and paste use the X11 selections and drag and
// drop uses XDND (freedesktop XDND protocol 5).
//
// Channel types:
//   - "leaflow.fleet.virtualdesktop.datatransfer.v1.clipboard", lane
//     "interactive": opened by the participant, one per connection. The
//     participant sends ClipboardClientMessage, the session
//     ClipboardServerMessage.
//   - "leaflow.fleet.virtualdesktop.datatransfer.v1.drag", lane "interactive":
//     opened by the participant, one per connection. The participant sends
//     DragClientMessage, the session DragServerMessage.
//   - "leaflow.fleet.virtualdesktop.datatransfer.v1.data", lane "bulk": opened
//     by the side that reads data, one per read, as many as it reads. The
//     opener sends one DataRequest; the side that has the data answers with
//     DataResponse messages. Flow control is the channel's credit; closing the
//     channel with CANCELLED abandons the read, and the other side releases
//     what it spooled for it.
//   - "leaflow.fleet.virtualdesktop.datatransfer.v1.DataTransferService", lane
//     "interactive": opened by the participant, for participants that operate
//     the session through calls and have no clipboard or drag loop of their
//     own, and to drop uploaded files.
//
// Read-only participants transfer no data, so that a watcher cannot take away
// what was copied in the session. Data has no size limit and never enters
// logs. The data of a drag never goes through a clipboard.
//
// Copy and paste. The clipboard channel starts with a snapshot:
// ClipboardStatus, then, when an application owns a shared selection and the
// participant may read it, its ClipboardFormatList, then SnapshotEnd. The
// participant sends no format list before SnapshotEnd. The input channel is not
// ordered against this one: input that may paste names the sequence of the
// latest format list the participant sent (see the input channel), and the
// session holds it until its ClipboardFormatListResponse for that list
// succeeded.
//
// Drag and drop. The side holding the real source sends DragStart; the other
// side confirms it with DragStartResponse. The participant always reports the
// targets of its own drag loop: DragEnter for each new target, DragPosition
// while over it, DragLeave and DragDrop. The side where the target lives
// answers every position with DragStatus and ends the drag with DragFinish.
//   - Into the session: the participant's drag enters the canvas; the
//     participant sends DragStart, then reports the session windows it crosses,
//     and the session drags into them as an XDND source. A browser learns the
//     files of a drag only when they are dropped, so it announces
//     files_available and provides the offer when the target reads the files.
//   - Out of the session: when a drag that the participant's input drives in a
//     session window reaches the edge of the participant's view of the session,
//     the participant asks with DragSourceRequest. The session installs its own
//     XDND target, waits for the source's XdndEnter, then answers with the
//     DragStart; the participant continues the drag in its own drag loop,
//     reporting its own targets with window_id 0.
// Neither side starts a native drag because of a message alone: a drag is
// bound to the person's current gesture and the input lease, and the pointer
// grab passes to the participant's drag loop explicitly, so that no release is
// applied twice. Each DragEnter names a new target_id, and sequence grows
// across the whole drag; a status applies only to the target and sequence it
// echoes, so a late status never accepts another target. Positions of one
// target may be coalesced before sending; enter, leave, drop and finish never
// are. DragLeave clears the target and keeps the drag. DragDrop is allowed
// only on the target of the last accepting status. DragFinish ends a drag
// once, with the action the target performed; MOVE succeeds only when both
// source and target keep their native move semantics, and the session never
// deletes source files on a guess. A connection has at most one drag at a
// time and a session one drag from a native source of its own; competing ones
// fail with RESOURCE_EXHAUSTED.
// DragPolicy.max_duration 与输入手势持有权约束 DragDrop 之前的物理手势。
// 目标受理 DragDrop 后，原生确认、格式读取和文件交付属于已受理操作，不因原手势
// 到期或按钮已释放而取消；仍受当前参与端的对应方向及文件权限约束。
// 明确取消、来源丢失、参与端失权或连接结束仍释放相关读取期和来源；通道存活时
// 目标仍发送失败的 DragFinish，断线后不重放。
// COPY 的数据代理已持续持有全部声明格式后，可以先完成来源的原生拖放握手：
// 原生格式按需取得并保留可重复读取的完整表示，文件引用由 filetransfer 持有。
// 不得为了提前握手而丢弃未取得的格式或预先把文件计为已保存。原生握手结束不是
// DragFinish 或 FileTransferResult；网络传送和文件保存仍分别等待其完整回执。
// MOVE 不得使用这一步提前触发来源删除原文件。

// Windows 原生表示不能仅按格式名合并：同一格式的 aspect、index 和介质各自独立。
// 无法用标准媒体类型完整表达的可序列化表示使用下列媒体类型（参数均为 ASCII）：
// application/x-leaflow-windows-format;name=<utf16hex>;aspect=<u32>;index=<i32>;medium=<kind>
// name 为格式名每个 UTF-16 单元的四位十六进制串，不含终止 NUL；接收端以名称重新
// 注册格式，不得跨机复用来源的注册号。非注册格式改用 id=<1..49151>，不得同时带 name。
// aspect、index、medium 必须显式存在，不得丢失、重复或以未知参数降级为其它格式。
// medium=bytes 为 HGLOBAL/IStream 的可序列化字节，medium=storage 为完整 Compound File
// Binary 表示，medium=emf 为 TYMED_ENHMF 的完整增强型图元文件记录，不得降为位图。
// 普通 CF_ENHMETAFILE 的内容表示使用 image/emf；其它 aspect/index 保留显式选择器。
// medium=file 为 TYMED_FILE 承载的某种格式的完整正文，不是 lpszFileName 或文件引用。
// 仅在读取该表示时打开来源本机介质，按块取得正文；空正文有效，读取失败不改用其它格式。
// 接收端按需创建独立的本机临时介质文件，文件名仅交给本机 OLE 目标，绝不跨机发送。
// 已交出的介质由自己的 STGMEDIUM/pUnkForRelease 持有，不随原声明或读取期结束提前删除；
// 最后一个介质引用释放时删除自己创建的临时文件。来源介质仍按原 STGMEDIUM 的规则释放。
// medium=metafile-picture 为 TYMED_MFPICT：先依次编码 mm、xExt、yExt 三个 i32 小端数，
// 随后是完整 WMF 记录；不得发送 METAFILEPICT 的本机结构、对齐填充或 hMF 句柄。
// medium=gdi 为 TYMED_GDI：先编码对象种类 u32 小端数，7 为位图，5 为调色板。
// 位图随后为 40 字节 BITMAPINFOHEADER、BI_BITFIELDS 所需的三个颜色掩码、声明的
// RGBQUAD 颜色表及 DWORD 对齐的完整像素行；仅使用 BI_RGB 或 BI_BITFIELDS，保留
// 有效色深和像素，biSizeImage 精确等于像素长度，不含 BMP 文件头或本机指针。
// 调色板随后为 LOGPALETTE：version=0x300、条目数两个 u16 小端数，再依次编码每个
// PALETTEENTRY 的 red、green、blue、flags 四字节，接收端创建新的本机 GDI 对象。
// FORMATETC 的非空 ptd 另以可选 device=<bytehex> 参数声明整个 DVTARGETDEVICE；
// 每字节两个十六进制字符，包含 tdSize 指定的完整描述、DEVMODE 和驱动私有尾部。
// 省略 device 表示空 ptd；长度和内部偏移必须有效，不得把畸形或重复参数降级为普通
// 注册格式。设备描述也是表示身份，枚举、读取、缓存和重建不得合并不同 device。
// 各次原生枚举交出独立、可由 COM 分配器释放的副本；不得预读正文来取得该声明。
// 设备描述仅供保留和匹配，不得据此加载来源驱动或创建来源设备，也不进入日志。
// 本机介质与以完整媒体类型名提供的原始 HGLOBAL/IStream 字节表示可同时存在；
// 两者声明同一跨机格式时优先读取原始序列化字节，不得先经过本机 GDI 编组而改变
// 像素、色表、掩码或其它记录。两种本机表示共用同一媒体类型、读取期和数据通道。
// 接收端从记录重建介质，绝不把原生句柄、指针、COM 接口或源文件路径当正文。
// CF_HDROP(id=15)、FileContents、FileGroupDescriptor、PIDL、FileName 等文件/路径格式及
// 拖放控制格式仍归 filetransfer 或拖放适配，不得用此媒体类型绕过文件引用和权限。
// 原生声明和取得流引用不能预读正文；各表示继续独立按需读取、校验和取消。
//
// Data of one format.
message DataTransferItem {
  // The media type.
  string mime_type = 1;
  // The data.
  bytes data = 2;
}

// A message from the participant on the clipboard channel.
message ClipboardClientMessage {
  // The message.
  oneof message {
    // The participant became the owner of a selection.
    ClipboardFormatList format_list = 1;
    // The participant applied a format list of the session.
    ClipboardFormatListResponse format_list_response = 2;
  }
}

// A message from the session on the clipboard channel.
message ClipboardServerMessage {
  // The message.
  oneof message {
    // What this participant may do, first in the snapshot and again whenever it
    // changes.
    ClipboardStatus status = 1;
    // An application became the owner of a selection.
    ClipboardFormatList format_list = 2;
    // The session applied a format list of the participant.
    ClipboardFormatListResponse format_list_response = 3;
    // Ends the snapshot.
    SnapshotEnd snapshot_end = 4;
  }
}

// An X11 selection (ICCCM).
enum Selection {
  SELECTION_UNSPECIFIED = 0;
  // CLIPBOARD: explicit copy or cut, then paste.
  SELECTION_CLIPBOARD = 1;
  // PRIMARY: select to copy, middle button to paste. Reserved: neither side
  // sends it yet, and messages that use it are ignored.
  SELECTION_PRIMARY = 2;
}

// What the participant may do with the clipboard. The participant does not
// offer, read or accept what it forbids.
message ClipboardStatus {
  // The participant receives the session's format lists and reads their data
  // (ClipboardPolicy.read_allowed).
  bool read_allowed = 1;
  // The participant's format lists are applied to the session
  // (ClipboardPolicy.write_allowed).
  bool write_allowed = 2;
  // The selections shared. For now only CLIPBOARD.
  repeated Selection selections = 3;
}

// The sender became the owner of a selection (MS-RDPECLIP Format List PDU).
// From the session: an application copied; the session read its targets. From
// the participant: its person copied, or is about to paste into a session
// window; the session takes ownership of the selection, then answers.
message ClipboardFormatList {
  // The selection.
  Selection selection = 1;
  // Grows by one with every format list of the sender on the connection,
  // starting at 1. A list replaces the older lists of its selection; a read
  // that names an older one fails with ABORTED.
  uint64 sequence = 2;
  // The formats offered, most preferred first, such as "text/plain",
  // "text/html" or "image/png". Empty: the selection has no owner anymore.
  repeated string mime_types = 3;
  // Data of small formats sent along, at most 64 KiB in total, so that a
  // paste of them needs no round trip.
  repeated DataTransferItem items = 4;
  // 文件复制的首个独立文件操作。接收方按需取得正文，设置
  // FileTransferRequest.clipboard，并仅发布本机引用，不传来源机器的路径。
  // 该操作的完成、跳过或取消不结束复制声明；同一有效 sequence 的后续
  // 粘贴通过 DataRequest.files 取得新的操作，不复用已结算的 transfer_id。
  leaflow.fleet.filetransfer.v1.FileTransferOffer file_offer = 5;
}

// The receiver of a format list applied it (MS-RDPECLIP Format List Response
// PDU). Always sent. From the session, success releases the input that waits
// for its sequence; failure drops that input, and older content is never
// pasted instead.
message ClipboardFormatListResponse {
  // ClipboardFormatList.selection.
  Selection selection = 1;
  // ClipboardFormatList.sequence.
  uint64 sequence = 2;
  // Unset on success. Otherwise PERMISSION_DENIED when the direction is not
  // allowed, FAILED_PRECONDITION when the selection could not be taken, or
  // ABORTED when a newer list was applied first.
  google.rpc.Status error = 3;
}

// Ends the snapshot.
message SnapshotEnd {}

// A message from the participant on the drag channel.
message DragClientMessage {
  // The message.
  oneof message {
    // Asks the session for the native drag a session window started.
    DragSourceRequest source_request = 1;
    // Withdraws a DragSourceRequest.
    DragSourceCancel source_cancel = 2;
    // A drag of the participant reaches the session.
    DragStart start = 3;
    // The participant confirms a drag of the session.
    DragStartResponse start_response = 4;
    // The participant's drag loop entered a target.
    DragEnter enter = 5;
    // The participant's drag loop moved over its target.
    DragPosition position = 6;
    // The participant's drag loop left its target.
    DragLeave leave = 7;
    // The participant's drag loop dropped on its target.
    DragDrop drop = 8;
    // What a target of the participant's desktop would do with a drop.
    DragStatus status = 9;
    // A drag of the session ended on the participant's desktop.
    DragFinish finish = 10;
    // The participant abandoned a drag.
    DragCancel cancel = 11;
  }
}

// A message from the session on the drag channel.
message DragServerMessage {
  // The message.
  oneof message {
    // The answer to a DragSourceRequest.
    DragSourceResponse source_response = 1;
    // The session confirms a drag of the participant.
    DragStartResponse start_response = 2;
    // What a session window would do with a drop.
    DragStatus status = 3;
    // A drag of the participant ended in the session.
    DragFinish finish = 4;
    // The session abandoned a drag, such as when its source went away.
    DragCancel cancel = 5;
  }
}

// What can be done with dragged data (XDND actions; HTML dropEffect).
enum DragAction {
  DRAG_ACTION_UNSPECIFIED = 0;
  // The target copies the data.
  DRAG_ACTION_COPY = 1;
  // The target takes the data and the source deletes it.
  DRAG_ACTION_MOVE = 2;
  // The target links to the data.
  DRAG_ACTION_LINK = 3;
}

// Asks the session for the native drag that a session window started with the
// participant's held button. The session answers with DragSourceResponse: the
// DragStart once the source's XdndEnter reached the session's own XDND target,
// or an error when no drag comes, such as on a timeout.
message DragSourceRequest {
  // Chosen by the participant, never reused on the connection.
  uint64 request_id = 1;
  // The window the drag started in.
  uint64 source_window_id = 2;
  // input_seq of the participant's latest input of the gesture.
  uint64 input_seq = 3;
}

// The answer to a DragSourceRequest.
message DragSourceResponse {
  // DragSourceRequest.request_id.
  uint64 request_id = 1;
  // The outcome.
  oneof result {
    // The drag. The participant confirms it with DragStartResponse before
    // starting its own drag loop.
    DragStart start = 2;
    // Why there is no drag.
    google.rpc.Status error = 3;
  }
}

// Withdraws a DragSourceRequest before it was answered, such as when the
// person released the button or pressed Escape. The session removes its XDND
// target and answers the request with CANCELLED; a later result never starts
// a drag.
message DragSourceCancel {
  // DragSourceRequest.request_id.
  uint64 request_id = 1;
}

// A drag reaches the other side.
message DragStart {
  // Chosen by the source side, unique on the connection.
  string drag_id = 1;
  // The session window the drag came from. 0 for a drag of the participant.
  uint64 source_window_id = 2;
  // The formats the source provides, most faithful first. Names are non-empty,
  // distinct media types without control characters. Do not truncate the list
  // or its names; the channel's message framing applies to the declaration,
  // while format data is read on demand over the data channel.
  repeated string mime_types = 3;
  // The actions the source allows, most preferred first.
  repeated DragAction actions = 4;
  // input_seq of the participant's latest input of the gesture. 0 for a drag
  // from the participant's desktop into the session.
  uint64 input_seq = 5;
  // The files dragged, as names, types and sizes. Unset when no files are
  // dragged or they are provided only when read.
  leaflow.fleet.filetransfer.v1.FileTransferOffer file_offer = 6;
  // Files are dragged whose offer the target reads with DataRequest.files,
  // such as from a browser that learns them only at the drop.
  bool files_available = 7;
}

// Confirms or refuses a DragStart.
message DragStartResponse {
  // The drag.
  string drag_id = 1;
  // Why the drag was refused. Unset when it was accepted.
  google.rpc.Status error = 2;
}

// The participant's drag loop entered a target.
message DragEnter {
  // The drag.
  string drag_id = 1;
  // A new id for this target, chosen by the participant.
  string target_id = 2;
  // The session window under the pointer. 0: a target of the participant's own
  // desktop.
  uint64 window_id = 3;
  // The point relative to the window.
  sint32 x = 4;
  // See x.
  sint32 y = 5;
  // Window.resize_counter the point belongs to.
  uint64 resize_counter = 6;
  // The position in the drag's order.
  uint64 sequence = 7;
  // The action the participant proposes, such as MOVE while Shift is held.
  DragAction proposed_action = 8;
}

// The participant's drag loop moved over its current target.
message DragPosition {
  // The drag.
  string drag_id = 1;
  // The target.
  string target_id = 2;
  // The point relative to the target's window.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // Window.resize_counter the point belongs to.
  uint64 resize_counter = 5;
  // The position in the drag's order.
  uint64 sequence = 6;
  // The action the participant proposes.
  DragAction proposed_action = 7;
}

// What a target would do with a drop there (XdndStatus).
message DragStatus {
  // The drag.
  string drag_id = 1;
  // The target.
  string target_id = 2;
  // The DragEnter or DragPosition sequence it answers.
  uint64 sequence = 3;
  // The target would take a drop.
  bool accepted = 4;
  // The action it would perform.
  DragAction action = 5;
  // Why it would not take one. Unset otherwise.
  google.rpc.Status error = 6;
}

// The participant's drag loop left its target (XdndLeave). The drag goes on.
message DragLeave {
  // The drag.
  string drag_id = 1;
  // The target.
  string target_id = 2;
  // The position in the drag's order.
  uint64 sequence = 3;
}

// The participant's drag loop dropped on its target (XdndDrop).
message DragDrop {
  // The drag.
  string drag_id = 1;
  // The target, which the last status accepted.
  string target_id = 2;
  // The position in the drag's order.
  uint64 sequence = 3;
  // The action to perform.
  DragAction action = 4;
}

// A drag ended (XdndFinished). Sent once per drag by the side of the target.
message DragFinish {
  // The drag.
  string drag_id = 1;
  // The target it ended on. Empty when it ended on none.
  string target_id = 2;
  // The target took the drop.
  bool accepted = 3;
  // The action the target performed.
  DragAction action = 4;
  // Why the drop failed. Unset on success or when nothing took it.
  google.rpc.Status error = 5;
}

// A drag was abandoned.
message DragCancel {
  // The drag.
  string drag_id = 1;
  // Why, when it failed. Unset when a person cancelled it.
  google.rpc.Status error = 2;
}

// Asks for data of a clipboard selection or of a drag (MS-RDPECLIP Format
// Data Request PDU). The only message the opener of a data channel sends.
message DataRequest {
  // Whose data.
  oneof source {
    // The data of a format list.
    ClipboardSource clipboard = 1;
    // The data of a drag, by DragStart.drag_id.
    string drag_id = 2;
  }
  // What to read.
  oneof format {
    // The data of one of the formats offered.
    string mime_type = 3;
    // 必须为 true。拖放读取已声明 files_available 的来源；剪贴板读取
    // 原 ClipboardFormatList.file_offer 对应的同一复制声明。
    // 剪贴板每次成功读取均返回新的 transfer_id，保留原清单的 file_id、
    // parent_id、元数据与来源文件版本，不重新扫描目录或换用当前的新复制。
    // 读取仍检查方向权限和连接代际；复制已被替换时返回 ABORTED。
    // 已接受的文件引用可独立完成；本次文件操作不能撤销其它读取或复制声明。
    bool files = 4;
  }
}

// A format list to read from.
message ClipboardSource {
  // The selection.
  Selection selection = 1;
  // ClipboardFormatList.sequence.
  uint64 sequence = 2;
}

// Part of the data read, from the side that has it (MS-RDPECLIP Format Data
// Response PDU). The data comes as the total size, the bytes in order, then
// the end; a files read is answered by a file offer alone.
message DataResponse {
  // The part.
  oneof part {
    // The size of the whole data. The first message; the session spools the
    // whole data before sending it, so the size is known.
    uint64 total_size_bytes = 1;
    // The next bytes, at most 256 KiB.
    bytes data = 2;
    // The end of the data. The last message.
    DataEnd end = 3;
    // The answer to a files read: the files, fetched as for any offer. The
    // only message.
    leaflow.fleet.filetransfer.v1.FileTransferOffer file_offer = 4;
    // The read failed; the reader discards what it received. NOT_FOUND when
    // the format is not offered or the application refused it,
    // RESOURCE_EXHAUSTED when storage ran out, PERMISSION_DENIED when the
    // direction is not allowed, ABORTED when the format list was replaced,
    // or DEADLINE_EXCEEDED when the application did not answer in time. The
    // last message.
    google.rpc.Status error = 5;
  }
}

// The end of the data read.
message DataEnd {
  // SHA-256 of all the data, 32 bytes.
  bytes sha256 = 1;
}

// Copy and paste and drops through calls, and drops of uploaded files. Calls
// need a participant that is not read-only; drops also need the input lease.
service DataTransferService {
  // Returns the formats a selection holds and, if asked, the data of one.
  // Needs ClipboardPolicy.read_allowed.
  rpc ReadClipboard(ReadClipboardRequest) returns (ReadClipboardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Takes a selection with the given data. Needs
  // ClipboardPolicy.write_allowed.
  rpc WriteClipboard(WriteClipboardRequest) returns (WriteClipboardResponse);
  // Drops the stored files of a completed upload on a point of a window, as
  // an XDND copy of their file URIs, and returns once the window took the
  // drop or refused it. Needs FileTransferPolicy.upload_allowed.
  rpc DropFiles(DropFilesRequest) returns (DropFilesResponse);
  // Drops data, or files of the session, on a point of a window as a drag
  // from nowhere would, and returns once the window took the drop or refused
  // it. Needs DragPolicy.upload_allowed.
  rpc DropData(DropDataRequest) returns (DropDataResponse);
}

// The request of ReadClipboard.
message ReadClipboardRequest {
  // The selection. Unset: CLIPBOARD.
  Selection selection = 1;
  // The format to return the data of. Empty: none, only the formats. One the
  // selection does not hold fails with NOT_FOUND.
  string mime_type = 2;
}

// The response of ReadClipboard.
message ReadClipboardResponse {
  // The formats available, most preferred first. Empty: the selection has no
  // owner.
  repeated string mime_types = 1;
  // The data of the format asked for. Data larger than 960 KiB, what fits a
  // channel message, fails with RESOURCE_EXHAUSTED.
  DataTransferItem item = 2;
}

// The request of WriteClipboard.
message WriteClipboardRequest {
  // The selection. Unset: CLIPBOARD.
  Selection selection = 1;
  // The data, one item per format, at most 960 KiB in total. Files of the
  // session are written as "text/uri-list" with file URIs. Empty: clears the
  // selection. The session holds the content itself, so it stays after the
  // client left.
  repeated DataTransferItem items = 2;
}

// The response of WriteClipboard.
message WriteClipboardResponse {
  // The session revision at which the session took the selection.
  uint64 revision = 1;
}

// The request of DropFiles.
message DropFilesRequest {
  // The upload, whose files the session has stored.
  string transfer_id = 1;
  // The window.
  uint64 window_id = 2;
  // The point, relative to the window.
  sint32 x = 3;
  // See x.
  sint32 y = 4;
  // Window.resize_counter the point belongs to.
  uint64 resize_counter = 5;
}

// The response of DropFiles.
message DropFilesResponse {
  // The window took the drop.
  bool accepted = 1;
  // The session revision at which the drop ended.
  uint64 revision = 2;
}

// The request of DropData.
message DropDataRequest {
  // The window.
  uint64 window_id = 1;
  // The point, relative to the window.
  sint32 x = 2;
  // See x.
  sint32 y = 3;
  // The data, one item per format, at most 960 KiB in total. Files of the
  // session are dropped as "text/uri-list" with file URIs.
  repeated DataTransferItem items = 4;
  // The action to propose.
  DragAction action = 5;
}

// The response of DropData.
message DropDataResponse {
  // The window took the drop.
  bool accepted = 1;
  // The action it performed.
  DragAction action = 2;
  // The session revision at which the drop ended.
  uint64 revision = 3;
}

// What a participant may do with the clipboard. Carried in the participant's
// signed authorization; without it the participant shares no clipboard.
message ClipboardPolicy {
  // The participant may read the session's clipboard.
  bool read_allowed = 1;
  // The participant may write the session's clipboard.
  bool write_allowed = 2;
}

// What a participant may drag. Carried in the participant's signed
// authorization; without it the participant drags nothing. Dragging files also
// needs the matching direction of FileTransferPolicy.
message DragPolicy {
  // The participant may drag into the session.
  bool upload_allowed = 1;
  // The participant may drag out of the session.
  bool download_allowed = 2;
  // The formats that may be dragged, exactly, unless all_mime_types_allowed
  // is true. Empty with all_mime_types_allowed false: none. Files travel only
  // as offers and still need the matching direction of FileTransferPolicy.
  repeated string allowed_mime_types = 3;
  // DragDrop 之前物理手势的最长时间，至多 5 分钟；未设置或 0 表示不能拖拽。
  // 已受理的原生确认、格式读取及文件交付不受旧手势时限约束，不代表放宽当前权限。
  google.protobuf.Duration max_duration = 4;
  // The participant may drag any format the source offers, including private
  // application formats. Does not grant a direction or permission to files;
  // upload_allowed, download_allowed and FileTransferPolicy still apply.
  bool all_mime_types_allowed = 5;
}
