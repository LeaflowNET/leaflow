syntax = "proto3";

package leaflow.fleet.filetransfer.v1;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "github.com/leaflowapis/leaflow-go/fleet/filetransfer/v1;filetransferv1";

// Files moving between the participant and the session, and the session user's
// files. File operations run as the session's user; nothing here runs as
// root.
//
// Channel types:
//   - "leaflow.fleet.filetransfer.v1", lane "interactive": opened by
//     the participant, one per connection. Both ends send FileTransferMessage.
//   - "leaflow.fleet.filetransfer.v1.content", lane "bulk": 接收方按需打开，
//     每个文件或清单各用一个连接内通道。先发送一个 FileContentRequest，来源以
//     FileContent 分段答复，最后发送 end。接收方校验、存储后以 NO_ERROR 关闭，
//     或以 CANCELLED 中止；写入或消费数据后归还通道额度，不另设整包大小限制。
//   - "leaflow.fleet.filetransfer.v1.FileSystemService", lane
//     "interactive": opened by the participant to browse and change files.
//
// 来源以 FileTransferOffer 声明文件；清单不嵌入控制消息，接收方先通过 content
// 通道请求并校验清单，再用 FileTransferRequest 选择文件。来源以
// FileTransferResponse 确认后才可请求文件正文；提前到达的正文请求最多等待五秒
// 确认，随后失败。清单请求不需要文件选择确认，也不表示已接受复制。
// 接收方按需读取每个普通文件，最终用 FileTransferResult 报告交付结果。
// 未请求的文件正文不会写入。
//
// Request、Response、Result 的 file_ids 分片发送，每个 FileTransferMessage
// 编码后最多 256 KiB。part_index 从 0 连续增加，仅最后一片的 last_part 为 true；
// 一片即可容纳时也须发送 last_part=true。接收方只在最后一片到齐后执行整项操作，
// 不把部分选择当作确认或终态。分片共享 transfer_id，Request/Response 还共享
// request_id；Request 的 clipboard 必须一致。不同请求可交错，Cancel 可随时中止
// 并丢弃相应的未完成集合；连接结束也丢弃它们。重复、乱序或相互冲突的分片以
// INVALID_ARGUMENT 结束该传输，不结束会话。file_ids 总数只受声明清单和策略约束，
// 不受单条消息的大小约束。
//
// An offer names files by opaque ids and plain names, never by paths of the
// source. A name is one path component of at most 255 bytes: not empty, not
// "." or "..", without "/" or NUL. Symbolic links are never transferred.
// Offers belong to the connection: when it ends, its offers and unfinished
// files are discarded and nothing resumes; the originals and files already
// stored remain. File sizes and counts are not limited beyond
// FileTransferPolicy; a failed file ends with google.rpc.Status and never
// ends the session. Read-only participants open none of these channels.

// A message on the filetransfer channel, from either end.
message FileTransferMessage {
  // The message.
  oneof message {
    // Files the sender offers.
    FileTransferOffer offer = 1;
    // The receiver chooses files of an offer.
    FileTransferRequest request = 2;
    // The sender confirms the files chosen.
    FileTransferResponse response = 3;
    // Stops a transfer.
    FileTransferCancel cancel = 4;
    // What the receiver stored.
    FileTransferResult result = 5;
  }
}

// 文件声明，不携带清单正文。清单通过 FileContentRequest.manifest 按需读取，
// 剪贴板、拖拽、文件管理和直接传输都引用同一份连接内声明。
message FileTransferOffer {
  reserved 2;
  reserved "entries";

  // Chosen by the sender, unique on the connection.
  string transfer_id = 1;
  // The sum of the regular files' sizes.
  uint64 total_size_bytes = 3;
  // From the participant only: the directory of the session user to store the
  // files in, which needs FileTransferPolicy.file_system_allowed. Empty: the
  // user's private transfer directory. Existing files are never overwritten.
  string destination_directory = 4;
  // 清单的准确条目数，包含目录，必须大于 0。只受 FileTransferPolicy.max_entries
  // 约束；不能按一条控制消息可以容纳多少条目再缩减。
  uint64 entry_count = 5;
}

// One file or directory of an offer.
message FileEntry {
  // Chosen by the sender, unique in the offer. Not a path.
  string file_id = 1;
  // The directory it is in. Empty for a top-level entry.
  string parent_id = 2;
  // Its name.
  string name = 3;
  // A regular file or a directory.
  FileType type = 4;
  // The exact size of a regular file; 0 for a directory.
  uint64 size_bytes = 5;
  // Its media type, such as "text/plain". Empty when unknown.
  string mime_type = 6;
}

// The type of a file.
enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  // A regular file.
  FILE_TYPE_REGULAR = 1;
  // A directory.
  FILE_TYPE_DIRECTORY = 2;
  // A symbolic link, listed by ListDirectory but never transferred.
  FILE_TYPE_SYMBOLIC_LINK = 3;
}

// The receiver chooses files of an offer.
message FileTransferRequest {
  // Chosen by the receiver, unique among its requests on the connection.
  uint64 request_id = 1;
  // The offer.
  string transfer_id = 2;
  // The regular files, and the directories whose whole contents, it wants.
  repeated string file_ids = 3;
  // The files go to the receiver's clipboard once stored. Needs the matching
  // direction of the participant's ClipboardPolicy as well.
  bool clipboard = 4;
  // 本请求的分片序号，从 0 连续增加。
  uint64 part_index = 5;
  // 本请求的最后一片。完整选择到齐后才能确认和读取正文。
  bool last_part = 6;
}

// The sender confirms the files chosen.
message FileTransferResponse {
  // FileTransferRequest.request_id.
  uint64 request_id = 1;
  // The offer.
  string transfer_id = 2;
  // The files the receiver may fetch.
  repeated string file_ids = 3;
  // 拒绝原因，仅最后一片可携带。成功时不设置；失败时此前分片不授权读取。
  google.rpc.Status error = 4;
  // 本响应的分片序号，从 0 连续增加。
  uint64 part_index = 5;
  // 本响应的最后一片，收到后才生效。
  bool last_part = 6;
}

// Stops a transfer. Either end; open content channels of it close with
// CANCELLED.
message FileTransferCancel {
  // The transfer.
  string transfer_id = 1;
}

// 接收方交付的文件。选择的文件全部完成或发生失败时发送一个逻辑结果，可由多个
// 分片组成。只有最后一片到齐后才能发布终态并释放整项传输的来源。
message FileTransferResult {
  // The transfer.
  string transfer_id = 1;
  // The files verified and stored.
  repeated string file_ids = 2;
  // 其余文件的失败原因，仅最后一片可携带。全部成功时不设置。
  google.rpc.Status error = 3;
  // 本结果的分片序号，从 0 连续增加。
  uint64 part_index = 4;
  // 本结果的最后一片，收到后才生效。
  bool last_part = 5;
}

// 请求声明的清单或已确认的一个普通文件。这是 content 通道发起方发送的唯一消息。
message FileContentRequest {
  // The transfer.
  string transfer_id = 1;
  // 必须选择一项，不能以空文件 id 代指清单。
  oneof content {
    // 已确认的普通文件的 id。
    string file_id = 2;
    // 必须为 true。清单是逐条 FileEntry 的 protobuf 长度前缀编码：每条先发送
    // protobuf varint 长度，再发送该 FileEntry 的编码字节；目录先于其内容。
    // FileContent.data 可在任意字节处拆分，包括长度前缀和单个条目内部。
    // 接收方递增校验条目 id、父目录、名称和类型，最后核对 entry_count、
    // total_size_bytes 和 FileContentEnd.sha256。摘要覆盖全部长度前缀和条目字节。
    // 清单读取成功仅确认元数据，不选择文件、不发送 FileTransferResult。
    bool manifest = 3;
  }
}

// 来源发送的文件正文或清单字节。
message FileContent {
  // The part.
  oneof part {
    // The next bytes, in order, at most 256 KiB.
    bytes data = 1;
    // The end of the file. The last message of the channel.
    FileContentEnd end = 2;
  }
}

// 文件正文或清单的结束。接收方校验摘要，并核对文件长度或清单条目及总大小，
// 校验通过后才交付。
message FileContentEnd {
  // SHA-256 of the whole content, 32 bytes. Empty with error.
  bytes sha256 = 1;
  // Why the source could not send the file, such as because it changed or
  // vanished. Unset on success.
  google.rpc.Status error = 2;
}

// The files of the session's user, by absolute path. Paths are resolved as
// that user; an empty path is the user's home directory. Nothing is removed
// recursively, a directory goes to the trash with its contents instead, and
// nothing is overwritten implicitly. Needs
// FileTransferPolicy.file_system_allowed.
service FileSystemService {
  // Lists a directory of at most 4096 entries and 512 KiB, a page at a time.
  // A page token becomes invalid when the directory changes, and is then
  // refused with ABORTED.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Creates a directory.
  rpc CreateDirectory(CreateDirectoryRequest) returns (CreateDirectoryResponse);
  // Renames or moves a file or directory.
  rpc RenameFile(RenameFileRequest) returns (RenameFileResponse);
  // Removes a file or an empty directory.
  rpc RemoveFile(RemoveFileRequest) returns (RemoveFileResponse);
  // Copies a file, a symbolic link (as the link) or a directory with its
  // contents, keeping permission bits and modification times, as file
  // managers copy (GIO g_file_copy with G_FILE_COPY_NOFOLLOW_SYMLINKS). It
  // fails with ALREADY_EXISTS when something is at the destination. The copy
  // appears whole or not at all: it is made under a hidden name in the
  // destination's directory and renamed into place, and a copy that fails or
  // is cancelled (leaflow.fleet.rpc.v1 CallCancel) leaves nothing behind.
  // Copying a directory into itself fails with INVALID_ARGUMENT and reason
  // FILE_COPY_INTO_ITSELF; a FIFO, socket or device, on its own or inside a
  // directory, with FAILED_PRECONDITION and reason FILE_TYPE_UNSUPPORTED.
  rpc CopyFile(CopyFileRequest) returns (CopyFileResponse);
  // Moves a file or a directory with its contents to the user's trash
  // (freedesktop Trash Specification 1.0), where the person can restore it
  // from: the home trash ($XDG_DATA_HOME/Trash) for files on the file system
  // of the home directory, otherwise the trash of the file's mount,
  // $topdir/.Trash/$uid or $topdir/.Trash-$uid, as GIO g_file_trash chooses.
  // Fails with FAILED_PRECONDITION and reason FILE_TRASH_UNAVAILABLE where the
  // file system has no trash, such as a tmpfs or another mount of the system's
  // own; with PERMISSION_DENIED for a directory holding files the user could
  // not remove from the trash again.
  rpc TrashFile(TrashFileRequest) returns (TrashFileResponse);
  // Offers files of the user to the participant, which fetches them as for any
  // offer.
  rpc CreateFileOffer(CreateFileOfferRequest) returns (CreateFileOfferResponse);
}

// The request of ListDirectory.
message ListDirectoryRequest {
  // The directory.
  string path = 1;
  // At most 256; 0 means 256.
  uint32 page_size = 2;
  // From the previous response. Empty for the first page.
  string page_token = 3;
}

// The response of ListDirectory.
message ListDirectoryResponse {
  // The absolute path that was listed.
  string path = 1;
  // The entries of this page.
  repeated DirectoryEntry entries = 2;
  // Empty on the last page.
  string next_page_token = 3;
}

// One entry of a directory.
message DirectoryEntry {
  // Its name.
  string name = 1;
  // Its type.
  FileType type = 2;
  // The size of a regular file.
  uint64 size_bytes = 3;
  // When its content last changed.
  google.protobuf.Timestamp modified_at = 4;
  // The POSIX permission bits. Informational only.
  uint32 mode = 5;
  // Its media type (Shared MIME-info Database), as GIO's
  // standard::content-type gives it: that of the target for a symbolic link,
  // "inode/symlink" for one whose target is missing, "inode/directory" and the
  // other inode types by kind, "application/x-zerosize" for an empty file,
  // otherwise by name and, where the name leaves it open, by content.
  string mime_type = 6;
}

// The request of CreateDirectory.
message CreateDirectoryRequest {
  // The directory to create. Its parent must exist.
  string path = 1;
}

// The response of CreateDirectory.
message CreateDirectoryResponse {}

// The request of RenameFile.
message RenameFileRequest {
  // The file or directory.
  string source_path = 1;
  // Its new path. Fails with ALREADY_EXISTS when something is there.
  string destination_path = 2;
}

// The response of RenameFile.
message RenameFileResponse {}

// The request of RemoveFile.
message RemoveFileRequest {
  // The file, or the empty directory.
  string path = 1;
}

// The response of RemoveFile.
message RemoveFileResponse {}

// The request of CopyFile.
message CopyFileRequest {
  // The file, symbolic link or directory.
  string source_path = 1;
  // The path of the copy. Its parent must exist.
  string destination_path = 2;
}

// The response of CopyFile.
message CopyFileResponse {}

// The request of TrashFile.
message TrashFileRequest {
  // The file or directory.
  string path = 1;
}

// The response of TrashFile.
message TrashFileResponse {}

// The request of CreateFileOffer.
message CreateFileOfferRequest {
  // The files and directories to offer, with their contents.
  repeated string paths = 1;
}

// The response of CreateFileOffer.
message CreateFileOfferResponse {
  // The offer, also valid on the filetransfer channel.
  FileTransferOffer offer = 1;
}

// What a participant may do with files. Carried in the participant's signed
// authorization; without it the participant may do none of this.
message FileTransferPolicy {
  // The participant may send files to the session.
  bool upload_allowed = 1;
  // The participant may receive files from the session.
  bool download_allowed = 2;
  // The participant may use FileSystemService and choose where uploads go.
  bool file_system_allowed = 3;
  // 一份声明最多可含的条目数，包含目录。0 表示不限制；不能再按控制消息大小设置
  // 额外的条目数上限。清单通过受通道额度约束的 content 流读取。
  uint32 max_entries = 4;
}
