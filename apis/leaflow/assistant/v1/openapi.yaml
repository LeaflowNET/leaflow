          - logged_out
          - qr_pending
          - online
          - expired
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        platform:
          type: string
        runtimeState:
          description: The state of the long-lived connection right now. Always `stopped` for webhook platforms
          enum:
          - stopped
          - running
          type: string
        senderPolicy:
          enum:
          - bound_only
          - open
          type: string
        status:
          enum:
          - active
          - suspended
          - disabled
          type: string
        updatedAt:
          format: date-time
          type: string
        webhookPath:
          description: The webhook path, for gateway configuration and for diagnosis
          type: string
        webhookUrl:
          description: The webhook address to paste into that platform's console. Null when the deployment declares no public entry point
          type:
          - string
          - 'null'
      required:
