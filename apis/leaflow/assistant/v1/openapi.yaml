      additionalProperties: false
    AttachmentResource:
      type: object
      properties:
        byteSize:
          type: integer
          format: int64
        filename:
          type: string
        height:
          description: Null unless kind is image. Width and height are here so a client can hold the space before the image itself has loaded.
          type:
            - integer
            - "null"
          format: int64
