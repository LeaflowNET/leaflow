openapi: 3.1.0
info:
  title: Leaflow Assistant API
  version: 1.0.0
  description: |-
    The AI assistant inside the console: conversations, messages, tool calls and their approval, attachments, and connecting the assistant to instant messaging platforms such as WeChat, Feishu and Telegram.

    ## A conversation

    The path one conversation takes, end to end. It names the operations that path needs, not all of them — the full list is below, and it also covers folders, attachments, memories, skills and the instant messaging side.

    1. `POST /api/v1/threads` creates one;
    2. `POST /api/v1/threads/{thread}/messages` sends a message and returns a `turnId` at once; the assistant runs in the background;
    3. `GET /api/v1/threads/{thread}` returns the conversation document to render, whose `stream` is where live output arrives;
    4. When the assistant needs the user, the document's `wait` says which kind: approving a batch of tool calls (`POST /api/v1/threads/{thread}/approvals/{batch}`), or answering a few questions (`POST /api/v1/threads/{thread}/questions/{item}`). It continues on its own once that is handled.

    Sending a file takes two steps: `POST /api/v1/attachments` for an id, then put that id in `attachmentIds` when sending the message. Images, text and arbitrary binaries all go through the same two steps; what differs is how the assistant reads them afterwards, which the upload response's `kind` says.

    ## Live output

    ```
    GET /api/v1/turns/{turn}/stream?ticket=<ticket>&cursor=<cursor>
    ```

    This is a Server-Sent Events stream, which is why it is not in the operation list below and why generated clients have no method for it. Open it with `EventSource`, or any SSE client. It is how live output arrives; polling the document on a timer is not the intended way to follow a conversation.

    - `path` and `ticket` both come from the conversation document's `stream`. `path` is relative, resolved against the address the document was fetched from;
    - `cursor` is where to start, from the document's `cursor`. Omit it to start at the beginning of what is still available;
    - every event is one incremental edit to that same document, so the same rendering logic applies;
    - the connection has a lifetime and closes cleanly when it ends. With `EventSource` the browser reconnects with `Last-Event-ID` and resumes by itself, so nothing needs handling;
    - three terminal events: `done` this turn finished (carrying its final status), `paused` the assistant is waiting on the user (fetch the document again and read `wait`), `stalled` execution was interrupted and will not resume — do not reconnect.
servers:
  - url: https://assistant.leaflow.cloud
    description: Threads, messages and tool calls
security:
  - bearerAuth: []
paths:
  /api/v1/attachments:
    post:
      summary: Upload a file
      description: |-
        The body is the file bytes themselves, not multipart, one file per request. The kind is determined from the content, not from Content-Type or from the name. Put the returned id in attachmentIds when sending a message.

        An upload that no message ever references is a draft, and drafts are collected — `draftExpiresAt` in the response says when this one goes. Sending a message with the id makes it permanent.

        The returned `kind` says how the assistant will see it. An `image` is read directly, and only by models that accept image input. A small `text` file is placed inline in the message. A large `text` file, and anything `binary`, arrives as a reference the assistant reads on demand — for a binary that usually means downloading it onto one of the project's cloud instances.
      operationId: upload-attachment
      tags:
        - Attachment
      parameters:
        - name: filename
          in: query
          required: false
          description: The name to show and to give the assistant. Images do not need one; anything else does, because the name is most of what says what the file is. Falls back to a generated name.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/attachments/{attachment}:
    get:
      summary: Download a file
      description: |-
        Returns the original bytes for an attachment id. The response carries long-lived cache headers because the content never changes. Returns 404 when the attachment does not exist or does not belong to the current user.

        Only an attachment whose `kind` is `image` comes back with its own image type and is usable as the address of an `<img>`. Everything else is served as `application/octet-stream` with `Content-Disposition: attachment`, deliberately: an uploaded file is arbitrary bytes under a name its uploader chose, and serving it back inline would run it on this origin.
      operationId: download-attachment
      tags:
        - Attachment
      parameters:
        - name: attachment
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: "Private and long-lived: these bytes are addressed by an id that is never reused, so they never change; and they belong to one person, so they must not enter any shared cache."
              schema:
                type: string
            Content-Disposition:
              description: Present on everything that is not an image, carrying the original filename. Absent on images, which are meant to be rendered in place.
              schema:
                type: string
          content:
            "*/*":
              schema:
                type: string
                format: binary
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/bindings:
    get:
      summary: List bindings
      description: Filter by channelId to show, per channel, who is bound to it.
      operationId: list-bindings
      tags:
        - Onboarding
      parameters:
        - name: limit
          in: query
          description: How many entries this page returns at most
          explode: false
          schema:
            description: How many entries this page returns at most
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          description: How many to skip. To page deeper, use the cursor-paged operation instead
          explode: false
          schema:
            description: How many to skip. To page deeper, use the cursor-paged operation instead
            type: integer
            format: int64
            minimum: 0
            maximum: 10000
        - name: platform
          in: query
          explode: false
          schema:
            type: string
        - name: channelId
          in: query
          explode: false
          schema:
            type: string
            format: uuid
        - name: active
          in: query
          description: Return only bindings that are active
          explode: false
          schema:
            description: Return only bindings that are active
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageBindingResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/bindings/{binding}:
    get:
      summary: Get a binding
      operationId: get-binding
      tags:
        - Onboarding
      parameters:
        - name: binding
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove a binding
      operationId: delete-binding
      tags:
        - Onboarding
      parameters:
        - name: binding
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels:
    get:
      summary: List channels
      operationId: list-channels
      tags:
        - Onboarding
      parameters:
        - name: limit
          in: query
          description: How many entries this page returns at most
          explode: false
          schema:
            description: How many entries this page returns at most
            type: integer
            format: int64
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          description: How many to skip. To page deeper, use the cursor-paged operation instead
          explode: false
          schema:
            description: How many to skip. To page deeper, use the cursor-paged operation instead
            type: integer
            format: int64
            minimum: 0
            maximum: 10000
        - name: platform
          in: query
          explode: false
          schema:
            type: string
        - name: active
          in: query
          description: Return only channels that are enabled
          explode: false
          schema:
            description: Return only channels that are enabled
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LengthAwarePageChannelResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a channel
      description: Which side owns the webhook secret is decided by the platform; see secretSource on list-platforms. For a `generated` platform, do not send webhookSecret — the one we generate is returned exactly once in this response and cannot be retrieved again; miss it and the only way forward is rotating to a new one. For a `supplied` platform you must pass the secret from that platform's own console, and webhookSecret in the response is null.
      operationId: create-channel
      tags:
        - Onboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelWithSecretResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels/{channel}:
    get:
      summary: Get a channel
      operationId: get-channel
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a channel
      description: Only the fields present are changed. senderPolicy and allowFrom go together, and senderPolicy decides whether they are replaced. For platforms held open by a long-lived connection the change applies once that connection is rebuilt; for webhook platforms it applies at once.
      operationId: update-channel
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChannelRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a channel
      description: The channel stops accepting inbound messages and every binding on it stops working. This operation remains available while the project is suspended or being cleaned up.
      operationId: delete-channel
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels/{channel}/binding-codes:
    post:
      summary: Issue a binding code
      description: Produces a single-use code to hand to the person being bound. They send that code to the assistant from their own account on that platform, which completes the binding. A binding can only be established this way, by the person themselves — a platform account cannot be named directly. Codes expire and have to be reissued.
      operationId: create-binding-code
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindingCodeResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels/{channel}/rejections:
    get:
      summary: List recently rejected inbound messages
      description: For diagnosing "I sent a message and the assistant never answered". Returns the inbound messages this channel rejected most recently, newest first, each with its reason. The most common reason is that the sender is not bound yet.
      operationId: list-channel-rejections
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          explode: false
          schema:
            type: integer
            format: int64
            default: 50
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectionListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels/{channel}/secret:
    post:
      summary: Rotate the webhook secret
      description: Replaces the webhook secret. The old one stops working immediately and the channel drops back to awaiting confirmation from the platform. Which side owns the secret is decided by the platform; see secretSource on list-platforms. For a `generated` platform, send no body — the new secret is returned in this response only and cannot be retrieved again. For a `supplied` platform you must pass the new secret from that platform's own console.
      operationId: rotate-channel-secret
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotateSecretRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSecretResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels/{channel}/sender-check:
    get:
      summary: Test whether a sender would be let through
      description: "For checking a sender policy after changing it. Sends nothing and changes nothing: it runs exactly the same decision a real inbound message goes through, and says which rule produced the answer. The binding-code rule cannot be tested this way — whether something is a binding code depends on what the sender actually wrote."
      operationId: check-sender
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: peerId
          in: query
          required: true
          description: That person's id on the platform, the same value that appears in bindings and rejections
          explode: false
          schema:
            description: That person's id on the platform, the same value bindings and rejections carry
            type: string
        - name: username
          in: query
          description: Only platforms with usernames, such as Telegram, can supply this. Without the @. Leave it empty to mean there is no username
          explode: false
          schema:
            description: Only platforms with usernames, such as Telegram, can supply this. Without the @. Empty means there is no username
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderCheckResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/channels/{channel}/weixin-logins:
    post:
      summary: Begin a WeChat QR login
      description: A personal WeChat channel can only send and receive once its owner has signed in by scanning a QR code. This returns that code; poll `GET /v1/weixin-logins/{login}` for progress, and when the status asks for a verification code, submit it with `POST /v1/weixin-logins/{login}/verify-code`.
      operationId: begin-weixin-login
      tags:
        - Onboarding
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/platforms:
    get:
      summary: List platforms that can be connected
      description: "The instant messaging platforms that can currently be connected, along with the flow and the credential fields each one needs. The create-channel form is driven entirely by this response: setupMethod decides between a credential form and a QR flow, credentialFields is what to ask for, and secretSource decides whether there is a webhook secret field at all."
      operationId: list-platforms
      tags:
        - Onboarding
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/weixin-logins/{login}:
    get:
      summary: Get the state of a QR login
      description: Poll this until the status is success or failure. When the status asks for a verification code, submit it with the verification-code operation.
      operationId: get-weixin-login
      tags:
        - Onboarding
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/weixin-logins/{login}/verify-code:
    post:
      summary: Submit a login verification code
      description: For when WeChat asks for an SMS or device code after the scan. The person who started the login gets that code on their own phone.
      operationId: submit-weixin-verify-code
      tags:
        - Onboarding
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/dynamic-calls/{call}/result:
    post:
      summary: Report what an action produced
      description: |-
        The assistant asks the client to run an action by adding a tool call to the conversation
        with the namespace `dynamic`; the client acts when that entry turns in_progress and reports
        back here.

        The first result is the one that counts. A later one is refused rather than replacing it.
      operationId: submit-dynamic-call-result
      tags:
        - Thread
      parameters:
        - name: call
          in: path
          required: true
          description: The id of the tool call entry in the conversation.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicCallResultRequestBody"
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/folders:
    get:
      summary: List folders
      description: "The current account's folders in this project, oldest first. That order is fixed and does not react to what happens inside a folder: a folder is a place on the screen, and a place that moves whenever something is put into it is not one anybody can aim at. Not paginated — there is a cap on how many there can be, and all of them come back at once."
      operationId: list-folders
      tags:
        - Folder
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a folder
      description: |-
        A folder groups conversations in the sidebar and does nothing else. The assistant is never told which folder a conversation is in, and a conversation behaves exactly the same inside one as outside: no shared instructions, no shared files, no shared memory.

        Names are unique within an account's folders in this project, because the only way to aim at a folder is to read its name.
      operationId: create-folder
      tags:
        - Folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/folders/{folder}:
    get:
      summary: Fetch one folder
      description: "The list returns every folder at once, so this is for the case the list does not cover: a page opened straight at a folder, holding nothing but the id from the address bar. Its conversations are a separate request — `GET /api/v1/threads?folder=<id>`."
      operationId: get-folder
      tags:
        - Folder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename a folder
      description: The conversations in it are untouched, and none of them move in the list — a folder's name is not part of what any conversation is about.
      operationId: update-folder
      tags:
        - Folder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a folder
      description: |-
        The conversations inside are **not** deleted. They leave the folder and go back to the ungrouped list, where they can be filed again. Emptying a shelf is not the same as throwing out what was on it, and deleting a conversation is a different request.

        Idempotent: deleting a folder that is already gone succeeds and changes nothing.
      operationId: delete-folder
      tags:
        - Folder
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/memories:
    get:
      summary: List what the assistant remembers
      description: "Facts the assistant has written down for the current account in this project. They appear at the start of every later conversation. Members of the same project each have their own, and this returns only the current account's. Not paginated: there is a cap on how many there can be, and all of them come back at once."
      operationId: list-memories
      tags:
        - Thread
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/memories/{memory}:
    delete:
      summary: Delete one memory
      description: The assistant stops remembering this. It takes effect at once, so the next conversation will not carry it. The assistant may well learn the same thing again.
      operationId: delete-memory
      tags:
        - Thread
      parameters:
        - name: memory
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/skills:
    get:
      summary: List the skills this project can use
      description: |-
        Everything the assistant can reach in this project, including the ones that are turned off —
        an entry that disappeared once it was switched off could not be switched back on.

        `origin` says whether a skill can be edited here. Skills belonging to the project are
        visible to everyone in it, whoever wrote them.
      operationId: list-skills
      tags:
        - Skill
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Write a skill for this project
      description: |-
        Creates it, or replaces the project's skill of that name. The whole package goes in each
        time: files left out of a write are removed, so the stored skill is what was sent and not
        what accumulated.

        A project skill takes precedence over a built-in one of the same name for this project only.
        The built-in is untouched and reappears if the project's is deleted.
      operationId: put-skill
      tags:
        - Skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/skills/{skill}:
    get:
      summary: Read one skill, with its files
      description: Works for built-in skills too; they simply cannot be written.
      operationId: get-skill
      tags:
        - Skill
      parameters:
        - name: skill
          in: path
          required: true
          description: The skill's name, as `list-skills` returned it.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Turn a skill on or off
      description: |-
        Separate from writing it, because this is the frequent one: a skill that is off costs
        nothing and stays where it is.

        Only skills belonging to the project can be switched. To keep a built-in one out of the
        way, write a project skill of the same name and turn that off.
      operationId: set-skill-enabled
      tags:
        - Skill
      parameters:
        - name: skill
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillEnabledRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete this project's skill
      description: A built-in skill of the same name, if there was one, becomes visible again.
      operationId: delete-skill
      tags:
        - Skill
      parameters:
        - name: skill
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads:
    get:
      summary: List conversations
      description: "Ordered by most recent activity, limited to the current account's conversations in the current project. `archived` selects between two sets rather than widening one: archived conversations are absent from the default list, and turning the flag on shows those instead."
      operationId: list-threads
      tags:
        - Thread
      parameters:
        - name: q
          in: query
          description: Search titles, case-insensitively. Leave it empty for the most recent conversations
          explode: false
          schema:
            description: Search titles, case-insensitively. Empty returns the most recent conversations
            type: string
            maxLength: 100
        - name: archived
          in: query
          description: When true, returns **only** archived conversations; otherwise only unarchived ones
          explode: false
          schema:
            description: When true, returns **only** archived conversations; otherwise only unarchived ones
            type: boolean
        - name: folder
          in: query
          description: 'Narrow the list to one folder. Omitting it returns conversations from every folder and from none; a folder id returns that folder''s; the empty value (`?folder=`) returns the ones that are in no folder at all. Empty is not the same as omitted, and a sidebar needs both: "chats" is exactly the ungrouped set, and asking for everything would let filed conversations crowd it out of the limit.'
          explode: false
          schema:
            description: A folder id, or empty for the conversations in no folder
            type: string
            maxLength: 64
        - name: cursor
          in: query
          description: |-
            Where the previous page ended, from its `nextCursor`. Omit it for the first page.

            It is a position, not an offset, and that matters here: this list is ordered by recent activity, and the activity happens while it is being read. An offset would hand back a conversation twice when one moves up in between, and skip one when it moves down — silently, because a conversation that was skipped simply is not there.

            Pass the same `q`, `archived` and `folder` along with it. A cursor carries a position, not the question that produced it, so changing the filters mid-scroll walks a range nobody asked for.
          explode: false
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          explode: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 200
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a conversation
      operationId: create-thread
      tags:
        - Thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateThreadRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}:
    get:
      summary: Fetch the conversation document
      description: The complete current state of a conversation, for the first render. Its `stream` gives the address and admission ticket for live output, and what that stream pushes are incremental edits to this same document, so the same rendering logic applies.
      operationId: get-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update conversation settings
      description: |-
        Changes the title, the approval mode, and whether the conversation is archived. A change to the approval mode takes effect from the next turn; a turn already running keeps the settings it started with.

        Archiving makes a conversation read-only: it stays in the list under "archived", stays readable, and the assistant can still find it when it searches past conversations — it just takes no new input. Unarchive it to continue. Archiving fails while a turn is running; stop it first.
      operationId: update-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateThreadRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadSummaryResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a conversation
      description: |-
        Removes the conversation from every list and makes it unreachable by id. The assistant can no longer find it either — neither by searching past conversations nor by reading one back.

        Deleting is not the same as archiving, and the two are not degrees of the same thing. An archived conversation is still there and still readable, it just takes no new input; a deleted one is gone from view. Archiving can be undone; this cannot.

        What survives is the record itself, because a conversation with this assistant is an account of what was done to real infrastructure — which machine was changed, which disk was removed. That record is kept even though nobody can reach it here.

        Fails while a turn is running: stop it first. Deleting an already deleted conversation succeeds and changes nothing.
      operationId: delete-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/approvals/{batch}:
    post:
      summary: Approve or decline a batch of tool calls
      description: "The batch id comes from the conversation document's `wait`. This is idempotent: submitting the same batch again neither changes a decision already in effect nor reports an error. Returns 404 when the batch does not belong to that conversation."
      operationId: decide-approval
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: batch
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequestBody"
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/earlier:
    get:
      summary: Fetch earlier parts of a conversation
      description: The first render only carries the latest stretch of a conversation; anything above it is fetched here, one stretch at a time. Pass the document's earlier.before as `before`; the `earlier` in the response is the cursor for the stretch above that, and null means the top has been reached. The entries have the same shape and the same order (oldest first) as `items` in the document, so they can be prepended as they are.
      operationId: list-earlier-items
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: before
          in: query
          required: true
          description: From the document's earlier.before; returns entries before this ordinal
          explode: false
          schema:
            description: From the document's earlier.before; returns entries before this ordinal
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlierResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/interrupt:
    post:
      summary: Interrupt a running turn
      description: Calling this on a conversation with no running turn also returns 204 rather than an error — the user pressing stop races with the turn finishing on its own, and both outcomes are the same. This operation remains available while the project is suspended or being cleaned up.
      operationId: interrupt-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/messages:
    post:
      summary: Send a message and start a turn
      description: "Returns a turnId immediately without waiting for execution — a turn can run for tens of minutes. Progress arrives on the live stream the conversation document's `stream` points at, not in this response. Sending while the assistant is still working is allowed: the message is put in line and `queued` comes back true, to be read at the next step of the turn already running — so the editor should stay open rather than blocking on a busy conversation."
      operationId: send-message
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequestBody"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnIDResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/questions/{item}:
    post:
      summary: Answer the assistant's questions
      description: The question id comes from the conversation document's `wait`. An already-answered question also returns 204 — another tab may have submitted first, or the auto-answer window may have expired, and in both cases the turn has already continued with an answer.
      operationId: answer-question
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
        - name: item
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequestBody"
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/read:
    post:
      summary: Mark a conversation as read
      operationId: mark-thread-read
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/threads/{thread}/revert:
    post:
      summary: Revert from a given point
      description: Reverts the entry at `ordinal` and everything after it. Reverted entries stay in the transcript marked `reverted`, and ordinals are not renumbered. Returns how many were actually reverted.
      operationId: revert-thread
      tags:
        - Thread
      parameters:
        - name: thread
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertedCountResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    UploadedResource:
      type: object
      properties:
        byteSize:
          description: Size of what was stored. For an image that has been resized, this is the resized size, not what was uploaded.
          type: integer
          format: int64
        draftExpiresAt:
          description: |-
            When this upload gets cleared if no message ever references it. Sending a message with this id makes it permanent and this stops applying — a file that belongs to a conversation is kept as long as the conversation is.

            It is here so the editor can say so before it happens. An attachment chip that quietly stops working a week later reads as a bug, and the person who hits it has no way to tell that what they are seeing is a draft being collected.
          type: string
          format: date-time
        filename:
          type: string
        height:
          description: Null unless kind is image.
          type:
            - integer
            - "null"
          format: int64
        id:
          type: string
        kind:
          description: |-
            How the assistant will see this file.

            - `image` — read directly, and only by models that accept image input
            - `text` — placed inline in the message when small enough, otherwise read on demand
            - `binary` — never read directly; the assistant downloads it onto a cloud instance to work with it
          type: string
          enum:
            - image
            - text
            - binary
        width:
          description: Null unless kind is image.
          type:
            - integer
            - "null"
          format: int64
      required:
        - id
        - kind
        - filename
        - byteSize
        - width
        - height
        - draftExpiresAt
      additionalProperties: false
    BindingResource:
      type: object
      properties:
        channelId:
          type: string
          format: uuid
        connState:
          type: string
          enum:
            - logged_out
            - qr_pending
            - online
            - expired
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        peerName:
          type: string
        platform:
          type: string
        status:
          type: string
          enum:
            - pending
            - active
            - revoked
        verifiedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - channelId
        - platform
        - peerName
        - status
        - connState
        - verifiedAt
        - createdAt
      additionalProperties: false
    LengthAwarePageBindingResource:
      type: object
      properties:
        items:
          description: The entries on this page
          type: array
          items:
            $ref: "#/components/schemas/BindingResource"
        limit:
          description: The page size, echoing what was requested
          type: integer
          format: int64
        offset:
          description: How many were skipped, echoing what was requested
          type: integer
          format: int64
        total:
          description: How many match in total, not just on this page
          type: integer
          format: int64
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    ChannelResource:
      type: object
      properties:
        allowFrom:
          type:
            - array
            - "null"
          items:
            type: string
        connState:
          description: How far this channel is from working. Only `online` receives messages and can issue binding codes
          type: string
          enum:
            - logged_out
            - qr_pending
            - online
            - expired
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        runtimeState:
          description: The state of the long-lived connection right now. Always `stopped` for webhook platforms
          type: string
          enum:
            - stopped
            - running
        senderPolicy:
          type: string
          enum:
            - bound_only
            - open
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
        updatedAt:
          type: string
          format: date-time
        webhookPath:
          description: The webhook path, for gateway configuration and for diagnosis
          type: string
        webhookUrl:
          description: The webhook address to paste into that platform's console. Null when the deployment declares no public entry point
          type:
            - string
            - "null"
      required:
        - id
        - platform
        - name
        - status
        - connState
        - runtimeState
        - senderPolicy
        - allowFrom
        - webhookUrl
        - webhookPath
        - createdAt
        - updatedAt
      additionalProperties: false
    LengthAwarePageChannelResource:
      type: object
      properties:
        items:
          description: The entries on this page
          type: array
          items:
            $ref: "#/components/schemas/ChannelResource"
        limit:
          description: The page size, echoing what was requested
          type: integer
          format: int64
        offset:
          description: How many were skipped, echoing what was requested
          type: integer
          format: int64
        total:
          description: How many match in total, not just on this page
          type: integer
          format: int64
      required:
        - items
        - total
        - limit
        - offset
      additionalProperties: false
    CreateChannelRequestBody:
      type: object
      properties:
        allowFrom:
          type:
            - array
            - "null"
          items:
            type: string
        credentials:
          description: "Credentials for that platform. Write-only: they cannot be read back after creation"
          type: object
          additionalProperties:
            type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        platform:
          type: string
          minLength: 1
        senderPolicy:
          type: string
          enum:
            - bound_only
            - open
        webhookSecret:
          description: Required for platforms that generate the secret themselves (secretSource=supplied). Must be absent for `generated` ones, where the secret we make is returned once in webhookSecret on this response
          type: string
      required:
        - platform
        - name
      additionalProperties: false
    ChannelWithSecretResponseBody:
      type: object
      properties:
        allowFrom:
          type:
            - array
            - "null"
          items:
            type: string
        connState:
          description: How far this channel is from working. Only `online` receives messages and can issue binding codes
          type: string
          enum:
            - logged_out
            - qr_pending
            - online
            - expired
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        platform:
          type: string
        runtimeState:
          description: The state of the long-lived connection right now. Always `stopped` for webhook platforms
          type: string
          enum:
            - stopped
            - running
        senderPolicy:
          type: string
          enum:
            - bound_only
            - open
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
        updatedAt:
          type: string
          format: date-time
        webhookPath:
          description: The webhook path, for gateway configuration and for diagnosis
          type: string
        webhookSecret:
          description: The webhook secret we generated, to paste into that platform's console. **It cannot be retrieved again** — the only way forward is rotating to a new one. Null when the platform generates the secret (secretSource=supplied) or does not use webhooks at all
          type:
            - string
            - "null"
        webhookUrl:
          description: The webhook address to paste into that platform's console. Null when the deployment declares no public entry point
          type:
            - string
            - "null"
      required:
        - webhookSecret
        - id
        - platform
        - name
        - status
        - connState
        - runtimeState
        - senderPolicy
        - allowFrom
        - webhookUrl
        - webhookPath
        - createdAt
        - updatedAt
      additionalProperties: false
    UpdateChannelRequestBody:
      type: object
      properties:
        allowFrom:
          description: The allow list. Only applied when senderPolicy is sent as well
          type:
            - array
            - "null"
          items:
            type: string
        credentials:
          description: Replaced wholesale rather than merged key by key. Absent means unchanged
          type: object
          additionalProperties:
            type: string
        enabled:
          type: boolean
        name:
          type: string
          maxLength: 128
        senderPolicy:
          description: Only when this is sent is allowFrom replaced along with it
          type: string
          enum:
            - bound_only
            - open
      additionalProperties: false
    BindingCodeResponseBody:
      type: object
      properties:
        code:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - code
        - expiresAt
      additionalProperties: false
    PartResource:
      type: object
      properties:
        attachmentId:
          description: For `file` parts. Points at one of this entry's `attachments`.
          type:
            - string
            - "null"
        id:
          description: |-
            Addresses this part in the live stream — text arrives as `append` frames pointing at
            `/items/{item}/parts/{id}/text`.

            Not an array index. It looks like one today because parts are only ever appended, and a
            client that treats it as one keeps working right up until that stops being true.
          type: string
        text:
          description: For `text` parts. Grows as the answer is written.
          type:
            - string
            - "null"
        type:
          type: string
          enum:
            - text
            - file
      required:
        - id
        - type
      additionalProperties: false
    RejectionResource:
      type: object
      properties:
        at:
          type: string
          format: date-time
        peerId:
          type: string
        peerName:
          type: string
        peerUsername:
          type: string
        platform:
          type: string
        textLength:
          type: integer
          format: int64
        verdict:
          type: string
      required:
        - peerId
        - peerName
        - peerUsername
        - platform
        - verdict
        - textLength
        - at
      additionalProperties: false
    RejectionListResponseBody:
      type: object
      properties:
        rejections:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/RejectionResource"
      required:
        - rejections
      additionalProperties: false
    RotateSecretRequestBody:
      type: object
      properties:
        webhookSecret:
          description: Required for platforms that generate the secret themselves (secretSource=supplied). Must be absent for `generated` ones
          type: string
      additionalProperties: false
    WebhookSecretResponseBody:
      type: object
      properties:
        webhookSecret:
          type: string
      required:
        - webhookSecret
      additionalProperties: false
    SenderCheckResource:
      type: object
      properties:
        allowFrom:
          type:
            - array
            - "null"
          items:
            type: string
        allowed:
          type: boolean
        bindingId:
          type:
            - string
            - "null"
        senderPolicy:
          type: string
        verdict:
          type: string
          enum:
            - ALLOWED_BY_BINDING
            - ALLOWED_BY_ALLOW_FROM
            - ALLOWED_BY_POLICY
            - REJECTED_NOT_ALLOWED
      required:
        - allowed
        - verdict
        - senderPolicy
        - allowFrom
        - bindingId
      additionalProperties: false
    LoginResource:
      type: object
      properties:
        expiresAt:
          description: When this login flow expires. Past that, stop polling and start a new one
