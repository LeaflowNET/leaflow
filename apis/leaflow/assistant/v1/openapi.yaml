          type: string
        platform:
          type: string
        status:
          enum:
          - pending
          - active
          - revoked
          type: string
        verifiedAt:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - id
      - channelId
      - platform
      - peerName
      - status
      - connState
      - verifiedAt
      - createdAt
      type: object
    LengthAwarePageBindingResource:
      additionalProperties: false
      properties:
        items:
          description: The entries on this page
          items:
            $ref: '#/components/schemas/BindingResource'
          type: array
        limit:
          description: The page size, echoing what was requested
          format: int64
          type: integer
        offset:
          description: How many were skipped, echoing what was requested
          format: int64
          type: integer
        total:
          description: How many match in total, not just on this page
          format: int64
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      type: object
    ChannelResource:
      additionalProperties: false
