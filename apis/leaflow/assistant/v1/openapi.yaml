components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  parameters:
    ThreadId:
      name: thread
      in: path
      required: true
      description: A thread id. Subagents are threads as well.
      schema:
        type: string
        maxLength: 64
    ItemId:
      name: item
      in: path
      required: true
      description: A transcript item id.
      schema:
        type: string
        maxLength: 64
    FolderId:
      name: folder
      in: path
      required: true
      description: A folder id.
      schema:
        type: string
        maxLength: 64
    TaskId:
      name: task
      in: path
      required: true
      description: A task id.
      schema:
        type: string
        maxLength: 64
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    Usage:
      description: Tokens reported by Canopy. Cache hit rate is cachedInputTokens / inputTokens.
      type: object
      properties:
        inputTokens:
          description: Prompt tokens, including cached ones.
          type: integer
          format: int64
          minimum: 0
        cachedInputTokens:
          description: Prompt tokens read from the provider's cache.
          type: integer
          format: int64
          minimum: 0
        cacheWriteTokens:
          description:
            Prompt tokens written to the provider's cache. Zero for providers that do not report
            it.
          type: integer
          format: int64
          minimum: 0
        outputTokens:
          description: Output tokens, including reasoning.
          type: integer
          format: int64
          minimum: 0
        reasoningTokens:
          description: Output tokens spent on reasoning.
          type: integer
          format: int64
          minimum: 0
        totalTokens:
          type: integer
          format: int64
          minimum: 0
        requests:
          description: Model requests made.
          type: integer
          format: int64
          minimum: 0
        complete:
          description:
            False while a request has not reported its usage yet, so the numbers may still
            grow.
          type: boolean
      required:
        - inputTokens
        - cachedInputTokens
        - cacheWriteTokens
        - outputTokens
        - reasoningTokens
        - totalTokens
        - requests
        - complete
      additionalProperties: false
    ReasoningEffort:
      description: How much the model reasons before answering. Sent to the model unchanged.
      type: string
      enum:
        - low
        - medium
        - high
    ApprovalMode:
      description:
        "`manual` asks a person before tools that change something, `guardian` lets an automatic
        reviewer decide, `yolo` runs them without asking."
      type: string
      enum:
        - manual
        - guardian
        - yolo
    ThreadStatus:
      description:
        What the thread is doing. `waiting` is waiting for subagents or tasks it started; `awaiting_approval`
        and `awaiting_input` wait for a person.
      type: string
      enum:
        - idle
        - starting
        - running
        - waiting
        - awaiting_approval
        - awaiting_input
    TurnStatus:
      description: "`declined` ended because a person declined a tool call; `cancelled` was stopped."
      type: string
      enum:
        - running
        - completed
        - failed
        - declined
        - cancelled
