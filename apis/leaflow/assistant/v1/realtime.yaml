paths:
  /api/v1/realtime/tickets:
    post:
      summary: Issue a realtime ticket
      description: |-
        Returns the address and a short-lived ticket for the realtime WebSocket. Open
        `{url}?ticket={ticket}`; the ticket stands in for the bearer token, which a browser cannot set
        on a WebSocket. One connection carries every subscription of a client.

        Messages are JSON text frames. The client sends `RealtimeClientMessage` and receives
        `RealtimeServerMessage`. Subscribe to `workspace` for every conversation, folder and task of the
        caller in this project, and to `thread:{id}` for the transcript of one conversation. A
        transcript subscription takes the `streamCursor` from list-thread-items and replays what was
        written after it; when the cursor is too old the server sends `resync` and the client reads the
        items again.

        Reconnect with a new ticket after the connection closes. Ping at least every 30 seconds.
      operationId: create-realtime-ticket
      tags:
        - Realtime
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicketResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/realtime:
    get:
      summary: Open the realtime WebSocket
      description: |-
        Upgrades to a WebSocket. The ticket from create-realtime-ticket authenticates the connection;
        a missing, expired or foreign ticket closes it with code 4401. The 200 response documents the
        message a client receives on the socket; the endpoint never answers with a plain HTTP body.
      operationId: open-realtime
      tags:
        - Realtime
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: The messages sent over the WebSocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeExchange"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    RealtimeTicketResource:
      type: object
      properties:
        url:
          description: The WebSocket address, absolute or relative to the API origin.
          type: string
        ticket:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - url
        - ticket
        - expiresAt
      additionalProperties: false
    RealtimeExchange:
      description: Both directions of the WebSocket protocol, for code generation.
      type: object
      properties:
        client:
          $ref: "#/components/schemas/RealtimeClientMessage"
        server:
          $ref: "#/components/schemas/RealtimeServerMessage"
      required:
        - client
        - server
      additionalProperties: false
    RealtimeClientMessage:
      description: A message from the client. `type` determines which fields apply.
      type: object
      properties:
        type:
          type: string
          enum:
            - subscribe
            - unsubscribe
            - ping
        topic:
          description: "`workspace` or `thread:{id}`. For subscribe and unsubscribe."
          type: string
          maxLength: 128
        cursor:
          description: For a `thread:{id}` subscription, the `streamCursor` to replay from.
          type: string
          maxLength: 128
      required:
        - type
      additionalProperties: false
    RealtimeServerMessage:
      description: |-
        A message from the server. `type` determines which fields apply:

        - `subscribed` / `unsubscribed` — `topic`
        - `thread.updated` — `thread`; `thread.deleted` — `threadId`
        - `turn.updated` — `turn`, sent while a turn runs so its usage can be shown live
        - `folder.updated` — `folder`; `folder.deleted` — `folderId`
        - `task.updated` — `task`; `task.deleted` — `taskId`
        - `item.frame` — `threadId`, `cursor` and `frame`, an edit to the transcript
        - `resync` — `topic`; the client lost events and reads the current state again
        - `error` — `code` and `message`
        - `pong`
      type: object
      properties:
        type:
          type: string
          enum:
            - subscribed
            - unsubscribed
            - thread.updated
            - thread.deleted
            - turn.updated
            - folder.updated
            - folder.deleted
            - task.updated
            - task.deleted
            - item.frame
            - resync
            - error
            - pong
        topic:
          type: string
        thread:
          $ref: ./threads.yaml#/components/schemas/ThreadResource
        threadId:
          type: string
        turn:
          $ref: ./thread-turns.yaml#/components/schemas/ThreadTurnResource
        folder:
          $ref: ./folders.yaml#/components/schemas/FolderResource
        folderId:
          type: string
        task:
          $ref: ./tasks.yaml#/components/schemas/TaskResource
        taskId:
          type: string
        cursor:
          description: For `item.frame`. Resubscribe from this cursor to continue after a reconnect.
          type: string
        frame:
          $ref: "#/components/schemas/ItemFrame"
        code:
          type: string
        message:
          type: string
      required:
        - type
      additionalProperties: false
    ItemFrame:
      description: |-
        An edit to the transcript as returned by list-thread-items. `path` is a JSON Pointer under
        `/items`: `add` appends `value` to `/items` or replaces the item with the same id, `set`
        replaces the value at `path`, and `append` concatenates the string `value` to the string at
        `path`, which is how answer text streams in.
      type: object
      properties:
        path:
          type: string
        op:
          type: string
          enum:
            - add
            - set
            - append
        value: {}
      required:
        - path
        - op
        - value
      additionalProperties: false
