paths:
  /api/v1/skills:
    get:
      summary: List the skills this project can use
      description:
        "Everything the assistant can reach in this project, including the ones that are turned
        off —

        an entry that disappeared once it was switched off could not be switched back on.


        `origin` says whether a skill can be edited here. Skills belonging to the project are

        visible to everyone in it, whoever wrote them."
      operationId: list-skills
      tags:
        - Skill
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    post:
      summary: Write a skill for this project
      description:
        "Creates it, or replaces the project's skill of that name. The whole package goes
        in each

        time: files left out of a write are removed, so the stored skill is what was sent and not

        what accumulated.


        A project skill takes precedence over a built-in one of the same name for this project only.

        The built-in is untouched and reappears if the project's is deleted."
      operationId: put-skill
      tags:
        - Skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/skills/{skill}:
    get:
      summary: Read one skill, with its files
      description: Works for built-in skills too; they simply cannot be written.
      operationId: get-skill
      tags:
        - Skill
      parameters:
        - name: skill
          in: path
          required: true
          description: The skill's name, as `list-skills` returned it.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    patch:
      summary: Turn a skill on or off
      description:
        "Separate from writing it, because this is the frequent one: a skill that is off costs

        nothing and stays where it is.


        Only skills belonging to the project can be switched. To keep a built-in one out of the

        way, write a project skill of the same name and turn that off."
      operationId: set-skill-enabled
      tags:
        - Skill
      parameters:
        - name: skill
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillEnabledRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillResource"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
    delete:
      summary: Delete this project's skill
      description: A built-in skill of the same name, if there was one, becomes visible again.
      operationId: delete-skill
      tags:
        - Skill
      parameters:
        - name: skill
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    SkillResource:
      type: object
      properties:
        authoredByAssistant:
          description:
            "True when the assistant wrote this skill during a conversation rather than a person

            writing it here.


            Which conversation is deliberately not returned: skills are shared across the project

            while conversations belong to one person, so naming one would tell everybody in the

            project that a particular colleague had it."
          type: boolean
        description:
          description:
            Why the assistant would open this skill. It sits in every request, so it is the
            one field worth writing carefully.
          type: string
        enabled:
          type: boolean
        files:
          description:
            Path to contents, `SKILL.md` among them. Only returned by `get-skill`; the list
            leaves it out.
          type:
            - object
            - "null"
          additionalProperties:
            type: string
        name:
          type: string
        origin:
          description: "`builtin` — provided by the platform and read-only here.

            `project` — written for this project and editable by anyone in it."
          type: string
          enum:
            - builtin
            - project
        shortDescription:
          type:
            - string
            - "null"
        updatedAt:
          description: Null for built-in skills, which have no edit history here.
          type:
            - string
            - "null"
          format: date-time
      required:
        - name
        - description
        - shortDescription
        - origin
        - enabled
        - authoredByAssistant
        - updatedAt
      additionalProperties: false
    SkillListResponseBody:
      type: object
      properties:
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillResource"
      required:
        - skills
      additionalProperties: false
    SkillRequestBody:
      type: object
      properties:
        description:
          description:
            Why the assistant would open this skill. It sits in every request; write it as
            the answer to "when do I need this", not "what does it contain".
          type: string
          minLength: 1
          maxLength: 1024
        enabled:
          type: boolean
          default: true
        files:
          description:
            "Path to contents. `SKILL.md` is required; anything else it references goes alongside
            it.


            Paths are relative to the skill and cannot leave it. At most 32 files, 256 KiB each and

            1 MiB in total."
          type: object
          additionalProperties:
            type: string
        name:
          description: Also how the assistant refers to it, so renaming is deleting and writing again.
          type: string
          minLength: 1
          maxLength: 64
        shortDescription:
          type: string
          maxLength: 1024
      required:
        - name
        - description
        - files
      additionalProperties: false
    SkillEnabledRequestBody:
      type: object
      properties:
        enabled:
          type: boolean
      required:
        - enabled
      additionalProperties: false
