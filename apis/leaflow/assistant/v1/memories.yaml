paths:
  /api/v1/memories:
    get:
      summary: List what the assistant remembers
      description: |-
        Facts the assistant has written down in this project. Without `agentId`, returns the current
        account's private memories; with `agentId`, returns that project agent's memories.
      operationId: list-memories
      tags:
        - Memory
      parameters:
        - name: agentId
          in: query
          description: Return memories belonging to this project agent instead of the caller's personal assistant.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryListResponseBody"
        default:
          $ref: ./openapi.yaml#/components/responses/Error
  /api/v1/memories/{memory}:
    delete:
      summary: Delete one memory
      description: |-
        Removes a stored memory immediately. Pass `agentId` when deleting a memory belonging to a
        project agent.
      operationId: delete-memory
      tags:
        - Memory
      parameters:
        - name: memory
          in: path
          required: true
          schema:
            type: string
        - name: agentId
          in: query
          schema:
            type: string
            maxLength: 64
      responses:
        "204":
          description: No Content
        default:
          $ref: ./openapi.yaml#/components/responses/Error
components:
  schemas:
    MemoryListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MemoryResource"
      required:
        - items
      additionalProperties: false
    MemoryResource:
      type: object
      properties:
        agentId:
          description: The project agent this memory belongs to. Null for a person's private memory.
          type:
            - string
            - "null"
        body:
          description: The fact itself
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
        name:
          description: The name the assistant gave this fact; it overwrites or deletes its own entries by that name
          type: string
        sourceThreadId:
          description: Which conversation the assistant learned it in. That conversation may since have been deleted
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - body
        - createdAt
        - updatedAt
      additionalProperties: false
