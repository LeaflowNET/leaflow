components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  parameters:
    SecretId:
      name: secretId
      in: path
      required: true
      description: Secret identifier.
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      required: false
      description: Keyword search over slug, name, public locator fields (domains, URIs, server, username, fingerprint, field keys), tags, and description.
      schema:
        type: string
        maxLength: 200
    Tag:
      name: tag
      in: query
      required: false
      description: Filter by exact tag.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    SecretType:
      type: string
      enum:
        - login
        - basic_auth
        - api_key
        - kv_secret
        - ssh_key
        - tls_certificate
        - docker_registry
        - secure_note
    SecretStatus:
      type: string
      enum:
        - active
        - disabled
    SecretSummaryResource:
      description: Cross-type summary returned by unified search and lookup.
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          $ref: "#/components/schemas/SecretType"
        status:
          $ref: "#/components/schemas/SecretStatus"
        summary:
          description: Human-readable public summary (username, server, primary domain, fingerprint, or key count).
          type: string
        tags:
          type: array
          items:
            type: string
        has_totp:
          type: boolean
        revealable:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
        not_after:
          description: Certificate expiration timestamp for `tls_certificate` secrets; null for other types.
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        last_used_at:
          type:
            - string
            - "null"
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - slug
        - name
        - description
        - type
        - status
        - summary
        - tags
        - has_totp
        - revealable
        - version
        - not_after
        - expires_at
        - last_used_at
        - created_by
        - created_at
        - updated_at
      additionalProperties: false
    SecretSummaryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecretSummaryResource"
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          format: int64
          minimum: 1
        total_count:
          type: integer
          format: int64
          minimum: 0
      required:
        - items
