openapi: 3.2.1
info:
  title: Leaflow Vault API
  version: 1.0.0
  description: |-
    Store, search, rotate, and use project secrets across eight typed collections: logins with
    TOTP two-factor seeds, HTTP basic auth credentials, API keys, key-value secrets, SSH keys,
    SSL/TLS certificates, Docker registry credentials, and secure notes.

    ## Authentication

    Every request carries a scoped token; see the `bearerAuth` security scheme. Neither the path
    nor the headers carry a `project_id`: the current project is determined by the token.

    ## Typed collections and unified discovery

    - Each secret model has its own typed collection (`/api/v1/logins`, `/api/v1/basic-auths`,
      `/api/v1/api-keys`, `/api/v1/kv-secrets`, `/api/v1/ssh-keys`, `/api/v1/tls-certificates`,
      `/api/v1/docker-registries`, `/api/v1/secure-notes`) with exact request validation and public
      metadata fields.
    - All collections share one project-wide `id` and `slug` namespace. `GET /api/v1/secrets` and
      `GET /api/v1/secrets:lookup` search and resolve secrets across every type at once.
    - Public halves — such as SSH public keys, PEM certificate chains, certificate SANs and expiry
      timestamps, registry server addresses, usernames, and KV field names — are included directly
      on resource responses. Private keys, passwords, tokens, TOTP seeds, and note contents are
      never included on listings or metadata reads.
    - `vault:secret.use` permits platform injection and live TOTP code computation
      (`POST /api/v1/logins/{secretId}:generateTotp`). `vault:secret.reveal` permits human members
      to read stored secret material through `:reveal` while `revealable` is `true`. Service
      accounts cannot call `:reveal`, and sealing (`revealable: false`) is irreversible.
servers:
  - url: https://vault.leaflow.cloud
    description: Project secrets, certificates, and TOTP generation
security:
  - bearerAuth: []
tags:
  - name: Secrets
    description: Unified cross-type search, slug lookup, and deletion
  - name: Logins
    description: Account logins with optional RFC 6238 TOTP two-factor seeds
  - name: Basic Auths
    description: Username and password pairs
  - name: API Keys
    description: API keys, bearer tokens, and provider key fields
  - name: KV Secrets
    description: Key-value environment sets
  - name: SSH Keys
    description: SSH private keys with derived public keys and fingerprints
  - name: TLS Certificates
    description: SSL/TLS certificate chains and private keys
  - name: Docker Registries
    description: Container registry credentials and dockerconfigjson payloads
  - name: Secure Notes
    description: Encrypted free-form text notes
paths:
  /api/v1/secrets:
    get:
      summary: Search and list secrets across all types
      operationId: list-secrets
      tags:
        - Secrets
      parameters:
        - $ref: "#/components/parameters/Query"
        - name: type
          in: query
          required: false
          description: Narrow to a single credential type.
          schema:
            $ref: "#/components/schemas/SecretType"
        - $ref: "#/components/parameters/Tag"
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSummaryListResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/secrets:lookup:
    get:
      summary: Look up any secret by slug
      operationId: lookup-secret
      tags:
        - Secrets
      parameters:
        - name: slug
          in: query
          required: true
          description: Project-unique slug of the secret.
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[a-z0-9](?:[a-z0-9._-]{0,62}[a-z0-9])?$"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretSummaryResource"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/secrets/{secretId}:
    delete:
      summary: Delete a secret of any type
      operationId: delete-secret
      tags:
        - Secrets
      parameters:
        - $ref: "#/components/parameters/SecretId"
      responses:
        "204":
          description: No Content
        default:
          $ref: "#/components/responses/Error"

