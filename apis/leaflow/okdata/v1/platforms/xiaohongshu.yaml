paths:
  /api/v1/xiaohongshu/notes/{note_id}/comments/{comment_id}/replies:
    get:
      summary: Xiaohongshu comment replies
      description: |-
        The replies under a top-level comment, by the comment’s ID and its note’s ID: text, replier, likes and time posted. A comment that does not exist reads as one without replies.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-xiaohongshu-comment-replies
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: comment_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The top-level comment ID, from the note comments.
        - name: note_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The ID of the note the comment is under (the comment’s post_id).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/CommentPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/images:
    query:
      summary: Xiaohongshu image search
      description: |-
        Pictures matching keywords, each with the note it comes from: the picture at full size, the note’s title, text, author, likes, comments and saves. Shares are not given here; the note detail has them.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: search-xiaohongshu-images
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchXiaohongshuImagesRequest"
  /api/v1/xiaohongshu/keywords/{keyword}/related-keywords:
    get:
      summary: Xiaohongshu search suggestions
      description: |-
        What Xiaohongshu’s search box suggests as a keyword is typed, in its order, about 10 at a time. Words and places only, no index.

        Requires an active OKData enablement. Metered per request.
      operationId: list-xiaohongshu-related-keywords
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: keyword
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: One keyword.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/KeywordRelatedListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/notes/{note_id}/comments:
    get:
      summary: Xiaohongshu note comments
      description: |-
        Comments on a note with likes and reply counts.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-xiaohongshu-note-comments
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: note_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The note ID.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/CommentPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/notes/{note_id}:
    get:
      summary: Xiaohongshu note detail
      description: |-
        Full text, all images (a video note gives its cover, not the video file), likes, saves and comments count of one note. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-note
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: note_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The note ID. Give id or url.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/notes:lookup:
    get:
      summary: Xiaohongshu note detail by alternate identifier
      description: |-
        Full text, all images (a video note gives its cover, not the video file), likes, saves and comments count of one note. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: lookup-xiaohongshu-note
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: url
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: A share link or page URL; the ID is read from it.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/notes:
    query:
      summary: Xiaohongshu note search
      description: |-
        Notes matching keywords, newest or most popular first, with images and the author.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: search-xiaohongshu-notes
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchXiaohongshuNotesRequest"
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/audience:
    get:
      summary: Xiaohongshu PGY creator audience
      description: |-
        Who follows a Xiaohongshu creator, by PGY creator ID: the share of each gender, age group, province, city, interest and phone brand, and the day the figures are of.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator-audience
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/AudienceResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/costs/history:
    get:
      summary: Xiaohongshu PGY creator core figures history
      description: |-
        A creator’s core figures for each of the last 30 or 90 days, by PGY creator ID: CPM, cost per interaction, per read and per shop visitor, and the median impressions, reads, interactions and shop visitors of a note, with the same figures for the whole period. Of everyday or sponsored notes.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator-costs-history
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: window
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - 30d
              - 90d
            default: 30d
            description: "The period: the last 30 or 90 days."
        - name: tab
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - everyday
              - sponsored
            default: everyday
            description:
              "Whose figures: the creator’s everyday notes (the default) or sponsored notes,
              as the two tabs of the PGY creator page."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/PgyCreatorCostHistoryResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/costs/metrics:
    get:
      summary: Xiaohongshu PGY creator costs and summary
      description: |-
        What a creator is expected to cost, by PGY creator ID: the estimated CPM, cost per interaction, per read and per shop visitor of an image note and of a video note, each against comparable creators; median impressions, reads, interactions and shop visitors of a note; follower growth and notes over 30 days; invitation reply rate and the easy-to-reach and active marks; PGY’s highlight, the content mix and the industries worked with. Of everyday or sponsored notes.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator-costs-metrics
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: tab
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - everyday
              - sponsored
            default: everyday
            description:
              "Whose figures: the creator’s everyday notes (the default) or sponsored notes,
              as the two tabs of the PGY creator page."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/PgyCreatorCostsResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/followers/history:
    get:
      summary: Xiaohongshu PGY creator follower history
      description: |-
        A creator’s follower count for each of the last 30 or 60 days, by PGY creator ID, with the net gain over the period and the gain as a share. Shows steady growth, sudden drops or bought followers.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator-followers-history
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: window
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - 30d
              - 60d
            default: 30d
            description: "How many of the most recent days: 30 or 60."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/FollowerHistoryResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/followers/metrics:
    get:
      summary: Xiaohongshu PGY creator follower quality
      description: |-
        How much a creator’s followers are worth, by PGY creator ID: followers and the net gain over 30 days, and how many are active, engaged, reading and buying, each as a share of all followers and against comparable creators.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator-followers-metrics
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/PgyCreatorFollowersResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}:
    get:
      summary: Xiaohongshu PGY creator detail
      description: |-
        A Xiaohongshu creator's PGY profile: followers, likes and saves, median reads and engagements, content and feature tags, and what an image note and a video note cost (in yuan) and whether each is open.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/CreatorResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/metrics:
    get:
      summary: Xiaohongshu PGY creator note metrics
      description: |-
        How a creator’s everyday or sponsored notes did over the last 30 or 90 days, by PGY creator ID: notes and video notes, median impressions, reads, interactions and follows, engagement and completion rates, the share of notes past 100 and 1,000 likes, the standing among comparable creators, and where impressions and reads came from. The full view adds each note’s figures and long-term reads of notes from about half a year back.

        Requires an active OKData enablement. Metered per request.
      operationId: get-xiaohongshu-pgy-creator-metrics
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: window
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - 30d
              - 90d
            default: 30d
            description: "The period: the last 30 or 90 days."
        - name: tab
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - everyday
              - sponsored
            default: everyday
            description:
              "Whose figures: the creator’s everyday notes (the default) or sponsored notes,
              as the two tabs of the PGY creator page."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/PgyCreatorMetricsResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/xiaohongshu/pgy/creators/{creator_id}/notes:
    get:
      summary: Xiaohongshu PGY creator notes
      description: |-
        A page of a creator’s notes as PGY shows them (笔记案例), by PGY creator ID: reads, likes, saves, shop visitors, whether it was sponsored and for which brand. Sponsored or cross-domain sponsored notes alone, image or video notes alone, newest, most read or most engaged first, by content feature or category, with reads of organic traffic alone if wanted.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-xiaohongshu-pgy-creator-notes
      tags:
        - Xiaohongshu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: tab
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - all
              - sponsored
              - cross_domain
            default: all
            description:
              "Which notes: all (the default), sponsored notes alone, or cross-domain sponsored
              notes alone (those with shop visitors)."
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - image
              - video
            description: Image notes or video notes alone; both when left out. Only with tab=all.
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - latest
              - most_read
              - most_engaged
            default: latest
            description: "Order: newest first (the default), most read first or most interactions first."
        - name: traffic
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - all
              - organic
            default: all
            description:
              "Which traffic the reads count: all, promoted traffic included (the default), or
              organic traffic alone. Likes and saves stay the same."
        - name: feature_tag
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Only notes with this content feature tag, as written in the creator detail’s ext.feature_tags.
              A tag that does not exist finds nothing.
        - name: category
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Only notes of this content category, as written in the creator detail’s categories.
              A category that does not exist finds nothing.
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              PGY creator ID (24 hex characters, the same as the Xiaohongshu user ID), from the
              PGY creator search.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/PgyCreatorPostPageResponse
        default:
