  /api/v1/xiaohongshu/videos:lookup:
    get:
      summary: Xiaohongshu video note with its video by alternate identifier
      description: |-
        A video note by ID or link: title, text, author, likes, comments, saves and shares, plus the video file, its length and cover, the subtitles the platform made where it has them, and whether the note is a reported brand partnership. Video notes only; an image note is the note detail’s. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: lookup-xiaohongshu-video
