      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: video_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: "The video ID: the digits after /video/ in its toutiao.com link. Give id or url."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/toutiao/videos:lookup:
    get:
      summary: Toutiao video by alternate identifier
      description: |-
        One Toutiao video by ID or link: title, author and followers, time published, plays, likes, comments, shares, saves, length and cover. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: lookup-toutiao-video
      tags:
        - Toutiao
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: url
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "Its toutiao.com link (/video/…, /group/… or m.toutiao.com); the ID is read from
              it. Short m.toutiao.com/is/ share links are not read: open one and copy the full link."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
