    get:
      summary: Toutiao video
      description: |-
        One Toutiao video by ID or link: title, author and followers, time published, plays, likes, comments, shares, saves, length and cover. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: get-toutiao-video
