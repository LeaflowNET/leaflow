paths:
  /api/v1/twitch/live/users/{username}:
    get:
      summary: Twitch streamer live status
      description: |-
        Whether a Twitch streamer is live right now, by handle: people watching now, the stream's title, game (Twitch's category), tags and start time, and the streamer's name, avatar and followers. A streamer who is not live answers with status offline and the title and start time of the last stream.

        Requires an active OKData enablement. Metered per request.
      operationId: get-twitch-live-user
      tags:
        - Twitch
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: username
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: "The Twitch handle (login): the part after twitch.tv/, with or without @."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/live.yaml#/components/schemas/LiveRoomResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
components:
  schemas: {}
