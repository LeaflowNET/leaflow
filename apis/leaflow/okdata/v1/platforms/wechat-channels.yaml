        sort:
          type: string
          minLength: 1
          enum:
            - relevance
            - latest
            - popular
          default: relevance
          description: Result order.
        published_within:
          type: string
          minLength: 1
          enum:
            - day
            - week
            - half_year
          description: Only videos from the last day, week or half year.
        cursor:
          type: string
          minLength: 1
          description:
