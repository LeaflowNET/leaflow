  /api/v1/x/posts/{post_id}/quotes:
    get:
      summary: X post quotes
      description: |-
        Posts that quote a post, newest or most popular first, 20 a page: what people added, who they are and how far it went.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per returned item with per-request minimum and cap rules.
      operationId: list-x-post-quotes
      tags:
        - X
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - latest
              - popular
            default: latest
            description: Result order.
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: post_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The ID of the post that was quoted.
      responses:
        "200":
          description: OK
          content:
            application/json:
