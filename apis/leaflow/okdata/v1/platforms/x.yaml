paths:
  /api/v1/x/communities/{community_id}:
    get:
      summary: X community profile
      description: |-
        A community by ID: name, description, member count, when it was created, and under ext its moderators, how people join and its topic.

        Requires an active OKData enablement. Metered per request.
      operationId: get-x-community
      tags:
        - X
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: community_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The community ID (the digits after /i/communities/ in its link).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/CommunityResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/x/communities/{community_id}/members:
    get:
      summary: X community members
      description: |-
        The accounts that have joined a community, 20 a page: handle, name, bio, followers and verification.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per returned item with per-request minimum and cap rules.
      operationId: list-x-community-members
      tags:
        - X
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: community_id
