        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/comments/replies:lookup:
    get:
      summary: YouTube comment replies by alternate identifier
      description: |-
        The replies under a comment, by the comment's replies token, about 10 at a time: text, replier (handle, avatar, verification), likes, and roughly when it was posted (YouTube says "6 years ago"). post_id and parent_id are read from the token.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: lookup-youtube-comment-replies
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: replies_token
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "The comment's replies token (YouTube's continuation for its replies, starting
              Eg0S), not the comment ID: ext.replies_token of the comment in youtube.videos.comments.list
              with view=full."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/CommentPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/posts/{post_id}:
    get:
      summary: YouTube post detail
      description: |-
        One channel post (once a Community post) by ID or link: text, channel, pictures, likes, the video it shares (ext.video_id, its cover in images), and roughly when it was posted. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: get-youtube-post
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: post_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The post ID, starting with Ug (what follows /post/ in its link). Give id or url.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/posts:lookup:
    get:
      summary: YouTube post detail by alternate identifier
      description: |-
        One channel post (once a Community post) by ID or link: text, channel, pictures, likes, the video it shares (ext.video_id, its cover in images), and roughly when it was posted. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: lookup-youtube-post
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: url
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: A share link or page URL; the ID is read from it.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/videos/{video_id}/comments:
    get:
      summary: YouTube video comments
      description: |-
        Comments on a video, top or newest first.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-youtube-video-comments
