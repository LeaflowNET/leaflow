      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchYoutubeVideosRequest"
  /api/v1/youtube/videos/{video_id}/transcript:
    get:
      summary: YouTube video transcript
      description: |-
        The transcript of a video with timestamps, in the original or a chosen language.

        Requires an active OKData enablement. Metered per request.
      operationId: get-youtube-video-transcript
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: lang
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: Preferred transcript language. The result's lang is the track actually returned.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: video_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The video ID.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/TranscriptResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
components:
  schemas:
    SearchYoutubeChannelsRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        cursor:
          type: string
          minLength: 1
          description:
            Opaque cursor from pagination.next_cursor of the previous call. Each page is a
            separate metered query.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
    SearchYoutubeVideosRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        sort:
          type: string
          minLength: 1
          enum:
            - relevance
            - latest
            - most_viewed
          default: relevance
          description: Result order.
        cursor:
          type: string
          minLength: 1
          description:
            Opaque cursor from pagination.next_cursor of the previous call. Each page is a
            separate metered query.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
