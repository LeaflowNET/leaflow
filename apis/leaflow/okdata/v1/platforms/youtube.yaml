paths:
  /api/v1/youtube/channels/{channel_id}:
    get:
      summary: YouTube channel profile
      description: |-
        A channel by ID or handle: name, handle, description, avatar, verification, subscribers and video count, and under ext its total views, the day it joined, the links in its About section, country and banner. Subscribers are rounded as YouTube shows them (15.1M comes back as 15100000), and so is the video count now and then (6.2K); ext.followers_text and ext.posts_text keep the text as shown. Give id or username.

        Requires an active OKData enablement. Metered per request.
      operationId: get-youtube-channel
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: channel_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The channel ID, starting with UC. Give id or username.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/AccountResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/channels:lookup:
    get:
      summary: YouTube channel profile by alternate identifier
      description: |-
        A channel by ID or handle: name, handle, description, avatar, verification, subscribers and video count, and under ext its total views, the day it joined, the links in its About section, country and banner. Subscribers are rounded as YouTube shows them (15.1M comes back as 15100000), and so is the video count now and then (6.2K); ext.followers_text and ext.posts_text keep the text as shown. Give id or username.

        Requires an active OKData enablement. Metered per request.
      operationId: lookup-youtube-channel
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: username
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: The channel's handle, with or without @. Give id or username.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/AccountResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/channels/{channel_id}/posts:
    get:
      summary: YouTube channel posts
      description: |-
        The posts on a channel's Posts tab (once Community), newest first, about 10 a page, by channel ID or handle: text, pictures, likes, the video a post shares (ext.video_id, its cover in images), and roughly when it was posted (YouTube says "4 days ago"). A channel ID nobody has reads like a channel without posts: an empty page. Give id or username.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-youtube-channel-posts
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: channel_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The channel ID, starting with UC. Give id or username.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/channels/posts:lookup:
    get:
      summary: YouTube channel posts by alternate identifier
      description: |-
        The posts on a channel's Posts tab (once Community), newest first, about 10 a page, by channel ID or handle: text, pictures, likes, the video a post shares (ext.video_id, its cover in images), and roughly when it was posted (YouTube says "4 days ago"). A channel ID nobody has reads like a channel without posts: an empty page. Give id or username.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: lookup-youtube-channel-posts
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: username
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: The channel's handle, with or without @. Give id or username.
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/channels:
    query:
      summary: YouTube channel search
      description: |-
        Find channels by keywords, 20 a page in YouTube's order: channel ID, name, the start of the description, avatar and subscribers (rounded as YouTube shows them). No handle or badge here; youtube.channels.get gives the badge.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: search-youtube-channels
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/AccountPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchYoutubeChannelsRequest"
  /api/v1/youtube/channels/{channel_id}/videos:
    get:
      summary: YouTube channel videos
      description: |-
        A channel's videos or its Shorts, newest first, about 30 a page, by channel ID or handle: title, views, cover and, for videos, length and roughly when it was published. These are the channel list as YouTube shows it: views are rounded ("75K views" comes back as 75000, the text in ext.views_text) and times approximate (YouTube says "3 weeks ago"). For a video's exact views, likes and publish time, call youtube.videos.get. A channel ID nobody has reads like a channel without such videos: an empty page. Give id or username.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-youtube-channel-videos
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - video
              - short
            default: video
            description: Regular videos (the default) or Shorts.
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - latest
            default: latest
            description: Newest first; the only order this source has (no most-viewed order).
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: channel_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The channel ID, starting with UC. Give id or username.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/youtube/channels/videos:lookup:
    get:
      summary: YouTube channel videos by alternate identifier
      description: |-
        A channel's videos or its Shorts, newest first, about 30 a page, by channel ID or handle: title, views, cover and, for videos, length and roughly when it was published. These are the channel list as YouTube shows it: views are rounded ("75K views" comes back as 75000, the text in ext.views_text) and times approximate (YouTube says "3 weeks ago"). For a video's exact views, likes and publish time, call youtube.videos.get. A channel ID nobody has reads like a channel without such videos: an empty page. Give id or username.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: lookup-youtube-channel-videos
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: username
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: The channel's handle, with or without @. Give id or username.
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - video
              - short
            default: video
            description: Regular videos (the default) or Shorts.
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - latest
            default: latest
            description: Newest first; the only order this source has (no most-viewed order).
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
