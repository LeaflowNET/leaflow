  /api/v1/youtube/videos/{video_id}:
    get:
      summary: YouTube video detail
      description: |-
        One video by ID or link: title, description, views, likes, comments, publish time and channel, as exact numbers. A count YouTube does not show (comments turned off) or a part the source could not read this time comes back null and is named in meta.unavailable. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: get-youtube-video
      tags:
        - YouTube
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
