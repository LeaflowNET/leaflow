paths:
  /api/v1/all/trends:
    get:
      summary: All hot lists in one call
      description: |-
        The hot lists of Weibo, Zhihu, Baidu, Toutiao, Douyin, Bilibili, Xiaohongshu and Kuaishou in one call: rank, entry, heat and link, each marked with its platform. Ask for some platforms only, and cap how many entries each gives.

        Requires an active OKData enablement. Metered per request.
      operationId: list-all-trends
      tags:
        - Cross-Platform
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: platforms
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 8
            items:
              type: string
              enum:
                - weibo
                - zhihu
                - baidu
                - toutiao
                - douyin
                - bilibili
                - xiaohongshu
                - kuaishou
            description: Platforms to include; omit to include all supported platforms.
        - name: limit
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 50
            default: 10
            description: Entries per platform, from its top (1 to 50; 10 by default).
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/TrendListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
components:
  schemas: {}
