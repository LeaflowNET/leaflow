components:
  schemas:
    SearchDouyinBackupVideosRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        sort:
          type: string
          minLength: 1
          enum:
            - relevance
            - latest
            - popular
          default: relevance
          description:
            "Douyin's own order (the default), newest first, or most liked first. Douyin does
            not rank a day's videos by likes: with published_within=day, each page comes back sorted
            by likes."
        published_within:
          type: string
          minLength: 1
          enum:
            - day
            - week
            - half_year
          description: Only videos posted within the last day, week or half year; any time when left out.
        cursor:
          type: string
          minLength: 1
          description:
            Opaque cursor from pagination.next_cursor of the previous call. Each page is a
            separate metered query.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
    GetDouyinIndexKeywordsHistoryRequest:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            keywords:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
                pattern: ^[^,]+$
              maxItems: 5
              description: One to five keywords, each without a comma. Give keyword or keywords.
            since:
              type: string
              minLength: 1
              description:
                "The first day wanted, as an ISO date or time: the China-time (UTC+8) calendar
                day it falls on."
            until:
              type: string
              minLength: 1
              description:
                The last day wanted, read the same way. The index publishes a day or two late,
                so the latest days may be missing or have a null index.
            view:
              $ref: ../common.yaml#/components/schemas/View
            fields:
              $ref: ../common.yaml#/components/schemas/Fields
          required:
            - since
            - until
            - keywords
          description: Provide exactly one of `keywords` or `keyword`.
        - type: object
          additionalProperties: false
          properties:
            keyword:
              type: string
              minLength: 1
              description: One keyword (no comma). Give keyword or keywords.
              pattern: ^[^,]+$
            since:
              type: string
              minLength: 1
              description:
                "The first day wanted, as an ISO date or time: the China-time (UTC+8) calendar
                day it falls on."
            until:
              type: string
              minLength: 1
              description:
                The last day wanted, read the same way. The index publishes a day or two late,
                so the latest days may be missing or have a null index.
            view:
              $ref: ../common.yaml#/components/schemas/View
            fields:
              $ref: ../common.yaml#/components/schemas/Fields
          required:
            - since
            - until
            - keyword
          description: Provide exactly one of `keywords` or `keyword`.
    SearchDouyinIndexVideosRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
    SearchDouyinUsersRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        cursor:
          type: string
          minLength: 1
          description:
            Opaque cursor from pagination.next_cursor of the previous call. Each page is a
            separate metered query.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
    SearchDouyinVideosRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        sort:
          type: string
          minLength: 1
          enum:
            - relevance
            - latest
            - most_liked
          default: relevance
          description: Result order.
        cursor:
          type: string
          minLength: 1
          description:
            Opaque cursor from pagination.next_cursor of the previous call. Each page is a
            separate metered query.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
    SearchDouyinXingtuCreatorsRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        search_by:
          type: string
          minLength: 1
          enum:
            - content
            - name
          default: content
          description: Match the words against what creators post (the default) or against their names.
        followers_min:
          type: integer
          format: int64
          minimum: 0
          description: At least this many followers.
        followers_max:
          type: integer
          format: int64
          minimum: 0
          description: At most this many followers.
        engagement_min:
          type: integer
          format: int64
          minimum: 0
          description: "Engagement rate of the last 30 days at least this, in percent: 3 means 3%."
        gender:
          type: string
          minLength: 1
          enum:
            - female
            - male
          description: Only female or only male creators.
        cursor:
          type: string
          minLength: 1
          description:
            Opaque cursor from pagination.next_cursor of the previous call. Each page is a
            separate metered query.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
