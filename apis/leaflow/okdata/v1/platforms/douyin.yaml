paths:
  /api/v1/douyin/backup/users/{user_id}/videos:
    get:
      summary: Douyin account videos (backup)
      description: |-
        The backup of douyin.users.videos.list, for when it cannot serve: an account's videos, newest first, 20 a page,. Caption, author, likes, comments, shares, saves and time posted. An account that does not exist reads like one without videos: an empty page, not a 404. Give id or url.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request. Separately priced backup capability; not used for automatic failover.
      operationId: list-douyin-backup-user-videos
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: user_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              The account ID (the sec_uid, starting MS4w). With only the app’s short link, give
              it as url. Give id or url.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/backup/users/videos:lookup:
    get:
      summary: Douyin account videos (backup) by alternate identifier
      description: |-
        The backup of douyin.users.videos.list, for when it cannot serve: an account's videos, newest first, 20 a page,. Caption, author, likes, comments, shares, saves and time posted. An account that does not exist reads like one without videos: an empty page, not a 404. Give id or url.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request. Separately priced backup capability; not used for automatic failover.
      operationId: lookup-douyin-backup-user-videos
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: url
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "The profile link the app copies (v.douyin.com/…), as it is: it is opened once
              to find the account."
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/backup/videos:
    query:
      summary: Douyin video search (backup)
      description: |-
        The backup of douyin.videos.search, for when it cannot serve: videos matching keywords in Douyin's own order, newest or most liked first, optionally only from the last day, week or half year. Caption, author, likes, comments, shares, saves and time posted.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request. Separately priced backup capability; not used for automatic failover.
      operationId: search-douyin-backup-videos
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchDouyinBackupVideosRequest"
  /api/v1/douyin/videos/{video_id}/comments/{comment_id}/replies:
    get:
      summary: Douyin comment replies
      description: |-
        The replies under a top-level comment, by the comment's ID and its video's ID, a page at a time: text, replier, likes, time posted and IP location. A comment that does not exist reads like one without replies: an empty page, not a 404.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-douyin-comment-replies
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: comment_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The top-level comment ID (digits), from the video comments.
        - name: video_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The ID of the video the comment is under (the comment's post_id).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/CommentPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/hashtags/{hashtag_id}/videos:
    get:
      summary: Douyin hashtag videos
      description: |-
        Videos under a hashtag, by the hashtag's ID, in Douyin's own order, most liked first or newest first: caption, author, likes, comments, shares, saves and time posted.

        Requires an active OKData enablement. Returns one page per request; only a returned next_cursor permits continuation. Each page is a separate metered query (cursor TTL: 24 hours). Metered per request.
      operationId: list-douyin-hashtag-videos
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: sort
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - relevance
              - popular
              - latest
            default: relevance
            description: Douyin's own order (the default), most liked first, or newest first.
        - name: cursor
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              Opaque cursor from pagination.next_cursor of the previous call. Each page is a
              separate metered query.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: hashtag_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              "The hashtag ID (digits): a video's text_extra hashtag_id, or the number in a
              douyin.com/hashtag/… link."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostPageResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/brands/{brand}/history:
    get:
      summary: "Douyin index: brand trends"
      description: |-
        A brand's search, content and spread indexes on Douyin day by day over a date range, from 巨量算数 (the Douyin index), with the brand's industry. An index is the platform’s score, not a count. Days are China-time calendar days.

        Requires an active OKData enablement. Metered per request.
      operationId: get-douyin-index-brand-history
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: brand
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The brand name, spelled the way the Douyin index lists it.
        - name: since
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "The first day wanted, as an ISO date or time: the China-time (UTC+8) calendar
              day it falls on."
        - name: until
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              The last day wanted, read the same way. The index publishes a day or two late,
              so the latest days may be missing or have a null index.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/BrandHistoryResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/brands/{brand}/metrics:
    get:
      summary: "Douyin index: brand vs industry"
      description: |-
        A brand's daily average search, content and spread indexes on Douyin over a date range (巨量算数), next to the averages of its whole industry and of the industry's top 3, 5, 10, 15 and 30 brands. An index is the platform’s score, not a count.

        Requires an active OKData enablement. Metered per request.
      operationId: get-douyin-index-brand-metrics
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: brand
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: The brand name, spelled the way the Douyin index lists it.
        - name: since
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "The first day wanted, as an ISO date or time: the China-time (UTC+8) calendar
              day it falls on."
        - name: until
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              The last day wanted, read the same way. The index publishes a day or two late,
              so the latest days may be missing or have a null index.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/BrandMetricsResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/creators/{creator_id}/audience:
    get:
      summary: "Douyin index: account followers"
      description: |-
        Who follows a Douyin account, from 巨量算数, by its numeric ID: the share of followers by gender, age, province, city (all of them), city tier, phone brand and interest. Any account with enough followers, not only marketplace creators; shares only, no head counts.

        Requires an active OKData enablement. Metered per request.
      operationId: get-douyin-index-creator-audience
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              "The account's numeric Douyin ID (uid). Not the MS4w… sec_uid and not the Douyin
              handle: it is ext.uid in douyin.users.get with view=full. Accounts with only a few hundred
              followers have no index data."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/AudienceResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/creators/{creator_id}/metrics:
    get:
      summary: "Douyin index: account daily averages"
      description: |-
        A Douyin account's daily averages from 巨量算数 over the last week and the last month, by its numeric ID: new likes, shares, comments and follows a day, each with its change against the period before. Follows are the tool's own count, larger than the net follower gain. An account the tool has nothing on is not found.

        Requires an active OKData enablement. Metered per request.
      operationId: get-douyin-index-creator-metrics
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              "The account's numeric Douyin ID (uid). Not the MS4w… sec_uid and not the Douyin
              handle: it is ext.uid in douyin.users.get with view=full. Accounts with only a few hundred
              followers have no index data."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/IndexCreatorMetricsResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/creators/{creator_id}/videos:
    get:
      summary: "Douyin index: account top videos"
      description: |-
        The top videos 巨量算数 lists for a Douyin account over up to 30 days, by its numeric ID: up to 20, most liked first, with caption, link, day published, likes, comments, shares and the followers each brought. The tool mostly picks from the last day or two of the span, so end it on the day you want. One page; no plays.

        Requires an active OKData enablement. Metered per request.
      operationId: list-douyin-index-creator-videos
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: since
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "The first day wanted, as an ISO date or time: the China-time (UTC+8) calendar
              day it falls on."
        - name: until
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description: The last day wanted, read the same way; at most 30 days after since.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
        - name: creator_id
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description:
              "The account's numeric Douyin ID (uid). Not the MS4w… sec_uid and not the Douyin
              handle: it is ext.uid in douyin.users.get with view=full. Accounts with only a few hundred
              followers have no index data."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/keywords/{keyword}/audience:
    get:
      summary: "Douyin index: keyword audience"
      description: |-
        Who is behind a keyword on Douyin over a date range, from 巨量算数: the share and TGI of each age group, gender, province, city, city tier and interest.

        Requires an active OKData enablement. Metered per request.
      operationId: get-douyin-index-keyword-audience
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: keyword
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: One keyword; letter case does not matter.
        - name: since
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "The first day wanted, as an ISO date or time: the China-time (UTC+8) calendar
              day it falls on."
        - name: until
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              The last day wanted, read the same way. The index publishes a day or two late,
              so the latest days may be missing or have a null index.
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/creator.yaml#/components/schemas/KeywordAudienceResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/keywords/history:
    query:
      summary: "Douyin index: keyword trends"
      description: |-
        The search index and composite index of one keyword, or of up to five at once, day by day on Douyin over a date range, from 巨量算数 (the Douyin index), with the daily averages of the period, the one before and a year earlier in ext (view=full; null where the index has no figures for that period). Days the index has not published yet (usually the last one or two) are null. An index is the platform’s score, not a count. One item per keyword the index covers; others are left out. Give keywords or keyword.

        Requires an active OKData enablement. Metered per request.
      operationId: get-douyin-index-keywords-history
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/KeywordHistoryListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetDouyinIndexKeywordsHistoryRequest"
  /api/v1/douyin/index/keywords/{keyword}/related-keywords:
    get:
      summary: "Douyin index: related keywords"
      description: |-
        Keywords related to one keyword on Douyin in one week, from 巨量算数: those searched together with it and those that appear with it in videos, each with relevance, its place by relevance, search index and composite index. About 170 in one answer: the searched-together words first, then the in-video ones, each group by rank (1 is the most related; the platform's ranks can skip numbers). An index is the platform’s score, not a count.

        Requires an active OKData enablement. Metered per request.
      operationId: list-douyin-related-index-keywords
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: keyword
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
            minLength: 1
            description: One keyword; letter case does not matter.
        - name: until
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            description:
              "Which week: relations come by the week (Monday to Sunday, China time), and the
              answer is the last whole week ending on or before this day. A week is published early the
              next; before that the list is empty."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/KeywordRelatedListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/trends:
    get:
      summary: "Douyin index: live hot topics"
      description: |-
        巨量算数's live hot-topic board or its fastest-rising board, about 30 each: place, topic and topic index (the heat). The topic index is the platform's score, not a count.

        Requires an active OKData enablement. Metered per request.
      operationId: list-douyin-index-trends
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: board
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            minLength: 1
            enum:
              - topics
              - rising
            default: topics
            description: "Which board: the hottest topics now (the default) or the fastest rising."
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/TrendListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
  /api/v1/douyin/index/videos:
    query:
      summary: "Douyin index: top videos for a keyword"
      description: |-
        The 20 videos with the highest video index that 巨量算数 puts forward for a keyword: caption, link, the author's name, avatar and followers, likes, video index and time posted. One page; the author's ID is not given (douyin.videos.get has it).

        Requires an active OKData enablement. Metered per request.
      operationId: search-douyin-index-videos
      tags:
        - Douyin
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
