  /api/v1/xigua/videos:
    query:
      summary: Xigua Video search
      description: |-
        The top videos for keywords, up to 10 in one answer (no further pages), in Xigua's order: title, author, plays, comments, length, cover and time published.

        Requires an active OKData enablement. Metered per request.
      operationId: search-xigua-videos
      tags:
        - Xigua Video
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/PostListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchXiguaVideosRequest"
components:
  schemas:
    SearchXiguaVideosRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          description: Keywords, as a person would type them into the platform search box.
        view:
          $ref: ../common.yaml#/components/schemas/View
        fields:
          $ref: ../common.yaml#/components/schemas/Fields
      required:
        - query
