  /api/v1/weibo/posts/{post_id}/likers:
    get:
      summary: Weibo post likers
      description: |-
        The accounts that most recently liked a post, about 50, by ID or link: name, bio, avatar, verification and its kind, followers, following, posts, and the gender and region their profiles give. Give id or url.

        Requires an active OKData enablement. Metered per request.
      operationId: list-weibo-post-likers
      tags:
        - Weibo
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
