paths:
  /api/v1/baidu/trends:
    get:
      summary: Baidu hot search
      description: |-
        Baidu hot search: the 50 searches rising most across China right now, with rank and heat.

        Requires an active OKData enablement. Metered per request.
      operationId: list-baidu-trends
      tags:
        - Baidu
      parameters:
        - $ref: ../common.yaml#/components/parameters/IdempotencyKey
        - name: view
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/View
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: ../common.yaml#/components/schemas/Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ../models/social.yaml#/components/schemas/TrendListResponse
        default:
          $ref: ../common.yaml#/components/responses/Error
components:
  schemas: {}
