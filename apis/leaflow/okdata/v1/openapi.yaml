openapi: 3.2.1
info:
  title: Leaflow OKData API
  version: 1.0.0
  description: |-
    Public social, creator, advertising, and e-commerce data across 30 platforms supplied by OKData for Leaflow projects.

    Enable OKData once per project (`okdata:enablement.create`) before invoking metered queries (`okdata:query.invoke`). Project identity and billing ownership come solely from the verified IAM scoped token.

    Search and structured analytical queries use `QUERY` with JSON bodies. Resource reads use `GET` with path identifiers and query parameters; alternate identifiers use read-only `:lookup` operations. All data operations require an `Idempotency-Key` header (24-hour replay window) and use shared response models, optional `view` and `fields` projections, and cursor pagination where supported. Every page is a separate metered query. Retail prices and invoices are managed by Leaflow Billing.
x-leaflow-mcp-opt-in: true
servers:
  - url: https://okdata.leaflow.cloud
security:
  - bearerAuth: []
tags:
  - name: Enablement
    description: Project activation and enablement status
  - name: Capabilities
    description: Free discovery of available queries and billing metadata
  - name: Requests
    description: Project-scoped query history and 24-hour saved result replay
  - name: Alibaba 1688
    description: Alibaba 1688 wholesale products, reviews, and shops
  - name: AliExpress
    description: AliExpress products and customer reviews
  - name: Cross-Platform
    description: Cross-platform aggregated trend feeds
  - name: Amazon
    description: Amazon products, reviews, and bestseller lists
  - name: App Store
    description: Apple App Store applications and user reviews
  - name: Baidu
    description: Baidu hot search trends
  - name: Bilibili
    description: Bilibili videos, accounts, comments, trends, and live streams
  - name: Bluesky
    description: Bluesky posts, accounts, and comments
  - name: Douyin
    description: Douyin videos, accounts, comments, trends, live streams, Xingtu, and Douyin Index
  - name: Douyin Shop
    description: Douyin Shop products, reviews, and shops
  - name: Google Ads
    description: Google Ads Transparency advertisers and ads
  - name: Instagram
    description: Instagram posts, accounts, comments, hashtags, and transcripts
  - name: Kuaishou
    description: Kuaishou videos, accounts, comments, trends, and live streams
  - name: Meta Ads
    description: Meta Ad Library ads and advertisers
  - name: Reddit
    description: Reddit posts, comments, communities, trends, accounts, and transcripts
  - name: Taobao
    description: Taobao and Tmall products, reviews, and shops
  - name: Telegram
    description: Telegram public channels and messages
  - name: TikTok
    description: TikTok videos, accounts, comments, transcripts, ads, shop, and live streams
  - name: Toutiao
    description: Toutiao articles, videos, comments, accounts, and trends
  - name: Twitch
    description: Twitch live stream status
  - name: WeChat Search
    description: WeChat Search posts, accounts, keywords, index, and mini-programs
  - name: WeChat Channels
    description: WeChat Channels videos, accounts, comments, collections, and live streams
  - name: WeChat Official Accounts
    description: WeChat Official Accounts articles, comments, metrics, and owners
  - name: Weibo
    description: Weibo posts, accounts, comments, trends, and followers
  - name: X
    description: X (Twitter) posts, accounts, threads, lists, communities, and trends
  - name: Xianyu
    description: Xianyu second-hand product listings
  - name: Xiaohongshu
    description: Xiaohongshu notes, accounts, comments, trends, Pugongying, and shop
  - name: Xigua Video
    description: Xigua Video videos, accounts, and comments
  - name: YouTube
    description: YouTube videos, channels, comments, transcripts, and community posts
  - name: Zhihu
    description: Zhihu questions, answers, articles, pins, comments, trends, and accounts
paths:
  /api/v1/enablement:
    get:
      summary: Get OKData enablement
      description:
        Returns the current project's OKData enablement status. Metered queries require an
        active enablement.
      operationId: get-enablement
      tags:
        - Enablement
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/EnablementResource
        default:
          $ref: ./common.yaml#/components/responses/Error
    post:
      summary: Enable OKData
      description: |-
        Enables OKData for the current project. Start in the Console. Queries are billed under the resulting subscription.

        Returns pending with a Checkout Session. It becomes active once checkout completes and the order is settled.

        Returns 409 ENABLEMENT_ALREADY_EXISTS while an enablement is pending or active.
      operationId: create-enablement
      x-leaflow-console-only: true
      tags:
        - Enablement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./common.yaml#/components/schemas/CreateEnablementRequestBody
      responses:
        "202":
          description: The enablement and Checkout Session were created.
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/CreateEnablementResponseBody
        "409":
          $ref: ./common.yaml#/components/responses/Conflict
        default:
          $ref: ./common.yaml#/components/responses/Error
  /api/v1/capabilities:
    get:
      summary: List OKData capabilities
      description:
        Lists available data queries across all 30 platforms along with pagination, batching,
        and Billing meter references. Free and does not enable OKData or call the supplier.
      operationId: list-capabilities
      tags:
        - Capabilities
      parameters:
        - name: query
          in: query
          description:
            Search terms matching capability ID, display name, platform, resource type, action,
            or bilingual aliases.
          schema:
            type: string
            maxLength: 200
        - name: platform
          in: query
          description: Exact platform identifier, such as douyin, xiaohongshu, x, or wechat_channels.
          schema:
            type: string
            maxLength: 64
        - name: category
          in: query
          description: Capability category filter.
          schema:
            type: string
            enum:
              - social
              - creator
              - ads
              - commerce
        - name: resource_type
          in: query
          description: Resource type filter, such as video, account, comment, product, ad, or live_room.
          schema:
            type: string
            maxLength: 64
        - name: action
          in: query
          description: Action kind filter, such as search, get, batch_get, or list.
          schema:
            type: string
            maxLength: 64
        - name: billing_unit
          in: query
          description: Metering unit filter (call or item).
          schema:
            type: string
            enum:
              - call
              - item
        - name: include_backup
          in: query
          description: Whether to include separately priced backup capabilities. Defaults to true.
          schema:
            type: boolean
            default: true
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/CapabilityListResponseBody
        default:
          $ref: ./common.yaml#/components/responses/Error
  /api/v1/capabilities/{capabilityId}:
    get:
      summary: Get an OKData capability
      description:
        Returns metadata, cursor TTL, batch limit, Billing meter references, and cached source
        availability for a single capability. Does not execute paid data queries.
      operationId: get-capability
      tags:
        - Capabilities
      parameters:
        - name: capabilityId
          in: path
          required: true
          description: Capability identifier, such as douyin.videos.search or zhihu.questions.answers.list.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/CapabilityResource
        default:
          $ref: ./common.yaml#/components/responses/Error
  /api/v1/requests:
    get:
      summary: List OKData query requests
      description:
        Lists metered OKData query records for the current project, newest first. Can also
        look up a request by its Idempotency-Key. Free and does not expose supplier costs.
      operationId: list-requests
      tags:
        - Requests
      parameters:
        - name: from
          in: query
          description: Inclusive start timestamp (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Exclusive end timestamp (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: capability
          in: query
          description: Filter by exact capability identifier.
          schema:
            type: string
            maxLength: 128
        - name: platform
          in: query
          description: Filter by source platform identifier.
          schema:
            type: string
            maxLength: 64
        - name: status
          in: query
          description: Filter by request status.
          schema:
            type: string
            enum:
              - pending
              - succeeded
              - failed
              - reconciliation_required
        - name: idempotency_key
          in: query
          description:
            Optional Idempotency-Key to locate its current request record within the 24-hour
            window.
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/RequestListResponseBody
        default:
          $ref: ./common.yaml#/components/responses/Error
  /api/v1/requests/{requestId}:
    get:
      summary: Get an OKData query request
      description:
        Returns status, metering summary, and saved-result availability for a single project
        request.
      operationId: get-request
      tags:
        - Requests
      parameters:
        - name: requestId
          in: path
          required: true
          description: Leaflow request ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/RequestRecord
        default:
          $ref: ./common.yaml#/components/responses/Error
  /api/v1/requests/{requestId}/result:
    get:
      summary: Read a saved OKData query result
      description:
        Re-reads the saved normalized response of a completed project query within its 24-hour
        replay window at no extra charge. Returns 404 REQUEST_RESULT_NOT_FOUND if the request did not
        succeed or 410 RESULT_EXPIRED after retention ends.
      operationId: get-request-result
      tags:
        - Requests
      parameters:
        - name: requestId
          in: path
          required: true
          description: Leaflow request ID.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: ./common.yaml#/components/schemas/SavedRequestResult
        default:
          $ref: ./common.yaml#/components/responses/Error
