components:
  schemas:
    AccountOwner:
      type: object
      properties:
        name:
          description: "The owner's name: a company's or body's full name, or a person's name."
          type:
            - string
            - "null"
        type:
          description: What the owner is.
          type:
            - string
            - "null"
          enum:
            - company
            - government
            - media
            - individual
            - other
        registration_id:
          description:
            Registration number (unified social credit code, licence or organisation code);
            null where none is given.
          type:
            - string
            - "null"
        country:
          description: Country or region, in the platform's words.
          type:
            - string
            - "null"
        verification:
          description: Verification state of the account.
          type:
            - string
            - "null"
          enum:
            - verified
            - unverified
            - expired
        verification_type:
          description: Kind of verification, in the platform's words; null when not verified.
          type:
            - string
            - "null"
        verified_at:
          description: Date the verification was granted, as 00:00 UTC.
          type:
            - string
            - "null"
        account_id:
          description: ID of the account asked about.
          type: string
        account_created_at:
          description: Date the account was registered, as 00:00 UTC.
          type:
            - string
            - "null"
        authorized_services:
          description: Third-party services the account has authorised, in the platform's words.
          type:
            - array
            - "null"
          items:
            type: string
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    Audience:
      type: object
      properties:
        creator_id:
          description: The creator ID asked about.
          type: string
        measured_at:
          description: The day the figures are of, as 00:00 China time.
          type:
            - string
            - "null"
        gender:
          description: By gender.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        age:
          description: By age group.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        province:
          description: By province.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        city:
          description: By city, the largest only.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        interest:
          description: By interest.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        device:
          description: By phone brand.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        city_tier:
          description: By city tier.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        crowd:
          description: By the consumer groups the platform sorts people into.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        purchase_category:
          description: By the category of goods bought.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        purchase_amount:
          description: By the amount spent per order.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/AudienceSegment"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    AudienceSegment:
      type: object
      properties:
        name:
          description: The segment, in the platform's words (genders come as lower-case English).
          type: string
        share:
          description: The segment's share of the segments listed, 0 to 1.
          type:
            - number
            - "null"
          format: double
        count:
          description: Followers in the segment.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    Band:
      type: object
      properties:
        min:
          description: Low end of the band; null when open-ended ("< 400").
          type:
            - number
            - "null"
          format: double
        max:
          description: High end of the band; null when open-ended ("> 0.95").
          type:
            - number
            - "null"
          format: double
      additionalProperties: false
    BrandBenchmark:
      type: object
      properties:
        scope:
          description:
            "Which brands the average is over: the whole industry, or its top 3, 5, 10, 15
            or 30."
          type: string
          enum:
            - all
            - top3
            - top5
            - top10
            - top15
            - top30
        search_index:
          description: Their daily average search index.
          type:
            - integer
            - "null"
          format: int64
        content_index:
          description: Their daily average content index.
          type:
            - integer
            - "null"
          format: int64
        spread_index:
          description: Their daily average spread index.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    BrandHistory:
      type: object
      properties:
        brand:
          description: The brand's name.
          type: string
        category:
          description: The industry the platform files the brand under, in its words.
          type:
            - string
            - "null"
        points:
          description: One entry a day, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/BrandPoint"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    BrandMetrics:
      type: object
      properties:
        brand:
          description: The brand's name.
          type: string
        category:
          description: The industry the platform files the brand under, in its words.
          type:
            - string
            - "null"
        search_index:
          description: Daily average search index over the period.
          type:
            - integer
            - "null"
          format: int64
        content_index:
          description: Daily average content index over the period.
          type:
            - integer
            - "null"
          format: int64
        spread_index:
          description: Daily average spread index over the period.
          type:
            - integer
            - "null"
          format: int64
        benchmarks:
          description: The same averages for the whole industry and for its leading brands.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/BrandBenchmark"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    BrandPoint:
      type: object
      properties:
        date:
          description: "The day: a calendar day in China time (UTC+8), written as 00:00 UTC of that date."
          type: string
          format: date-time
        search_index:
          description: "Search index: search interest in the brand, not a count of searches."
          type:
            - integer
            - "null"
          format: int64
        content_index:
          description: "Content index: how much content there was about the brand, not a count of posts."
          type:
            - integer
            - "null"
          format: int64
        spread_index:
          description: "Spread index: how far that content travelled, not a count."
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    CategoryShare:
      type: object
      properties:
        category:
          description: The content category, in the platform's words.
          type: string
        share:
          description: The category's share of the creator's notes, 0 to 1.
          type:
            - number
            - "null"
          format: double
      additionalProperties: false
    ChannelsCollection:
      type: object
      properties:
        id:
          description: The collection's ID; pass it as is to the endpoint that lists its videos.
          type: string
        name:
          description: Name of the collection.
          type: string
        description:
          description: What the collection says it is about; null when nothing.
          type:
            - string
            - "null"
        cover_url:
          description: Cover image.
          type:
            - string
            - "null"
        updated_at:
          description: When the collection was last updated.
          type:
            - string
            - "null"
        metrics:
          anyOf:
            - $ref: "#/components/schemas/CollectionMetrics"
            - type: "null"
          description: Counts at fetch time.
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    ChannelsShareLink:
      type: object
      properties:
        id:
          description: The video's ID.
          type: string
        url:
          description: The share link (weixin.qq.com/sph/…).
          type: string
          format: uri
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    CollectionMetrics:
      type: object
      properties:
        videos:
          description: Videos in the collection.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    ContentShare:
      type: object
      properties:
        name:
          description: The content category, in the platform's words.
          type: string
        share:
          description: The category's share of the videos counted, 0 to 1.
          type:
            - number
            - "null"
          format: double
        videos:
          description: Videos in the category.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    Creator:
      type: object
      properties:
        id:
          description: The marketplace's creator ID; the other marketplace endpoints take it.
          type: string
        url:
          description: The creator's page on the marketplace.
          type: string
          format: uri
        account_id:
          description:
            "The creator's own account ID on the platform, where the marketplace gives it:
            on Douyin the sec_uid (MS4w…) that douyin.users.get takes, on Xiaohongshu the user ID."
          type:
            - string
            - "null"
        username:
          description: Handle on the platform, where given.
          type:
            - string
            - "null"
        name:
          description: Display name.
          type: string
        avatar_url:
          description: Avatar image URL.
          type:
            - string
            - "null"
        location:
          description: Where the creator says they are.
          type:
            - string
            - "null"
        gender:
          description: The creator's gender as the marketplace lists it.
          type:
            - string
            - "null"
          enum:
            - female
            - male
        followers:
          description: Followers.
          type:
            - integer
            - "null"
          format: int64
        categories:
          description: Content categories in the marketplace’s own words.
          type:
            - array
            - "null"
          items:
            type: string
        engagement_rate:
          description: Interactions per view of recent posts, 0 to 1 (0.038 is 3.8%).
          type:
            - number
            - "null"
          format: double
        median_views:
          description: Median views or reads of recent everyday posts.
          type:
            - integer
            - "null"
          format: int64
        median_engagements:
          description: Median interactions (likes, comments, saves, shares) of recent everyday posts.
          type:
            - integer
            - "null"
          format: int64
        rates:
          description: Published rates for sponsored work; null when the marketplace hides them.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/Rate"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    CreatorKeyword:
      type: object
      properties:
        keyword:
          description: The keyword.
          type: string
        mentions:
          description: How often the marketplace counted it; small numbers, good for ordering only.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    CreatorRate:
      type: object
      properties:
        creator_id:
          description: The marketplace creator ID.
          type: string
        url:
          description: The creator's page on the marketplace.
          type: string
          format: uri
        rates:
          description: Every offering on the rate card.
          type: array
          items:
            $ref: "#/components/schemas/Rate"
        industries:
          description: Industries the marketplace files the creator under.
          type:
            - array
            - "null"
          items:
            type: string
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    CreatorScore:
      type: object
      properties:
        score:
          description: The score, 0 to 100.
          type:
            - number
            - "null"
          format: double
        average:
          description: Average score of comparable creators.
          type:
            - number
            - "null"
          format: double
        rank:
          description: Rank on this score, 1 is the highest.
          type:
            - integer
            - "null"
          format: int64
        rank_share:
          description:
            How far from the top the rank is, 0 to 1 (0.05 is the top 5%); to four decimals,
            so the top hundred or so read 0.
          type:
            - number
            - "null"
          format: double
      additionalProperties: false
    FollowerHistory:
      type: object
      properties:
        creator_id:
          description: The creator ID asked about.
          type: string
        days:
          description: How many of the most recent days the figures cover.
          type: integer
          format: int64
        gained:
          description: Net followers gained over the period; negative when the creator lost followers.
          type:
            - integer
            - "null"
          format: int64
        growth:
          description: "The net gain as a share of the followers at the start: 0.01 is 1% more."
          type:
            - number
            - "null"
          format: double
        points:
          description: One entry a day, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/FollowerPoint"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    FollowerPoint:
      type: object
      properties:
        date:
          description: "The day: a calendar day in China time (UTC+8), written as 00:00 UTC of that date."
          type: string
          format: date-time
        followers:
          description: Followers that day.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    IndexCreatorMetrics:
      type: object
      properties:
        creator_id:
          description: The account's numeric ID (the one asked about).
          type: string
        average_7d:
          anyOf:
            - $ref: "#/components/schemas/IndexDailyAverages"
            - type: "null"
          description: Daily averages over the last 7 days.
        average_30d:
          anyOf:
            - $ref: "#/components/schemas/IndexDailyAverages"
            - type: "null"
          description: Daily averages over the last 30 days.
        change_7d:
          anyOf:
            - $ref: "#/components/schemas/IndexDailyChange"
            - type: "null"
          description: "The last 7 days against the 7 before, as a ratio: 0.3 is 30% more."
        change_30d:
          anyOf:
            - $ref: "#/components/schemas/IndexDailyChange"
            - type: "null"
          description: The last 30 days against the 30 before, as a ratio.
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    IndexDailyAverages:
      type: object
      properties:
        likes:
          description: New likes a day, on average.
          type:
            - number
            - "null"
          format: double
        follows:
          description:
            Follows a day, on average (the platform's own count of follows, not the net change
            in followers).
          type:
            - number
            - "null"
          format: double
        shares:
          description: New shares a day, on average.
          type:
            - number
            - "null"
          format: double
        comments:
          description: New comments a day, on average.
          type:
            - number
            - "null"
          format: double
      additionalProperties: false
    IndexDailyChange:
      type: object
      properties:
        likes:
          description: Change in new likes a day.
          type:
            - number
            - "null"
          format: double
        follows:
          description:
            Change in follows a day (the platform's own count of follows, not the net change
            in followers).
          type:
            - number
            - "null"
          format: double
        shares:
          description: Change in new shares a day.
          type:
            - number
            - "null"
          format: double
        comments:
          description: Change in new comments a day.
          type:
            - number
            - "null"
          format: double
      additionalProperties: false
    KeywordAudience:
      type: object
      properties:
        keyword:
          description: The keyword.
          type: string
        age:
          description: By age group.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/KeywordSegment"
        gender:
          description: By gender.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/KeywordSegment"
        province:
          description: By province.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/KeywordSegment"
        city:
          description: "By city: the largest only, so the shares need not add up to 1."
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/KeywordSegment"
        city_tier:
          description: By city tier.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/KeywordSegment"
        interest:
          description: By interest; the shares need not add up to 1.
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/KeywordSegment"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    KeywordSegment:
      type: object
      properties:
        label:
          description: The group, in the platform's words.
          type: string
        share:
          description: The group's share of the keyword's audience, 0 to 1.
          type:
            - number
            - "null"
          format: double
        tgi:
          description: "TGI: how strongly the group leans to the keyword; 100 is the platform average."
          type:
            - number
            - "null"
          format: double
      additionalProperties: false
    Miniprogram:
      type: object
      properties:
        id:
          description: Original ID (gh_…).
          type: string
        app_id:
          description: AppID (wx…), used to open or link to it; null where none is given.
          type:
            - string
            - "null"
        name:
          description: Name.
          type: string
        description:
          description: Description.
          type:
            - string
            - "null"
        icon_url:
          description: Icon.
          type:
            - string
            - "null"
        owner_name:
          description: The company or body that runs it.
          type:
            - string
            - "null"
        owner_verified:
          description: Whether the owner is verified.
          type:
            - boolean
            - "null"
        recent_users:
          description:
            Recent users as the platform shows them; a figure like 1万+ is a lower bound; null
            where none is shown.
          type:
            - integer
            - "null"
          format: int64
        is_game:
          description: Whether it is a mini game.
          type:
            - boolean
            - "null"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    PgyComponentClicks:
      type: object
      properties:
        comment_area:
          description:
            "Click-through band of the comment-area component: normal (under 2%), high (2-10%)
            or very_high (over 10%); null when the note has none."
          type:
            - string
            - "null"
          enum:
            - normal
            - high
            - very_high
        content:
          description:
            "Click-through band of the in-text component: normal (under 2%), high (2-10%) or
            very_high (over 10%); null when the note has none."
          type:
            - string
            - "null"
          enum:
            - normal
            - high
            - very_high
        note_bottom:
          description:
            "Click-through band of the component at the end of the note: normal (under 2%),
            high (2-10%) or very_high (over 10%); null when the note has none."
          type:
            - string
            - "null"
          enum:
            - normal
            - high
            - very_high
      additionalProperties: false
    PgyCostPoint:
      type: object
      properties:
        date:
          description: "The day: a calendar day in China time (UTC+8), written as 00:00 UTC of that date."
          type: string
          format: date-time
        cpm:
          description: Cost of a thousand impressions, in yuan; null where there is none.
          type:
            - number
            - "null"
          format: double
        cpe:
          description: Cost of one interaction, in yuan; null where there is none.
          type:
            - number
            - "null"
          format: double
        cpv:
          description:
            Cost of one read, in yuan, as the trend chart works it out; null where there is
            none.
          type:
            - number
            - "null"
          format: double
        shop_visit_cost:
          description: Cost per shop visitor a note brings, in yuan; null where there is none.
          type:
            - number
            - "null"
          format: double
        median_impressions:
          description: Median impressions of a note.
          type:
            - integer
            - "null"
          format: int64
        median_reads:
          description: Median reads of a note.
          type:
            - integer
            - "null"
          format: int64
        median_engagements:
          description: Median interactions of a note.
          type:
            - integer
            - "null"
          format: int64
        median_shop_visits:
          description: Median shop visitors a note brings; a note that brought none counts as 0.
          type:
            - integer
            - "null"
          format: int64
      additionalProperties: false
    PgyCreatorCostHistory:
      type: object
      properties:
        creator_id:
          description: PGY creator ID.
          type: string
        days:
          description: How many of the most recent days the figures cover.
          type: integer
          format: int64
        currency:
          description: Currency of the costs (ISO 4217).
          type:
            - string
            - "null"
        date:
          description:
            "The last day the figures run to: a calendar day in China time (UTC+8), written
            as 00:00 UTC of that date."
          type:
            - string
            - "null"
        cpm:
          description: Cost of a thousand impressions, in yuan; null where there is none.
          type:
            - number
            - "null"
          format: double
        cpe:
          description: Cost of one interaction, in yuan; null where there is none.
          type:
            - number
            - "null"
          format: double
        cpv:
          description:
            Cost of one read, in yuan, as the trend chart works it out; null where there is
            none.
          type:
            - number
            - "null"
          format: double
        shop_visit_cost:
          description: Cost per shop visitor a note brings, in yuan; null where there is none.
          type:
            - number
            - "null"
          format: double
        median_impressions:
          description: Median impressions of a note.
          type:
            - integer
            - "null"
          format: int64
        median_reads:
          description: Median reads of a note.
          type:
            - integer
            - "null"
          format: int64
        median_engagements:
          description: Median interactions of a note.
          type:
            - integer
            - "null"
          format: int64
        median_shop_visits:
          description: Median shop visitors a note brings; a note that brought none counts as 0.
          type:
            - integer
            - "null"
          format: int64
        points:
          description: The figures day by day, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/PgyCostPoint"
        ext:
          description: Platform-specific extras. Only returned with view=full.
          type: object
          additionalProperties: true
      additionalProperties: false
    PgyCreatorCosts:
      type: object
      properties:
        creator_id:
          description: PGY creator ID.
          type: string
        date:
          description:
            "The day the figures are of: a calendar day in China time (UTC+8), written as 00:00
            UTC of that date."
          type:
            - string
            - "null"
        currency:
          description: Currency of the costs (ISO 4217).
          type:
            - string
            - "null"
        image_cpm:
          description:
            Estimated CPM (cost of a thousand impressions) of a image note, in yuan; null where
            PGY has no estimate.
          type:
            - number
            - "null"
          format: double
        image_cpm_percentile:
          description:
            Share of comparable creators whose image note CPM (cost of a thousand impressions)
            is higher, 0 to 1.
          type:
            - number
            - "null"
          format: double
        video_cpm:
          description:
            Estimated CPM (cost of a thousand impressions) of a video note, in yuan; null where
            PGY has no estimate.
          type:
            - number
