          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
      required: []
    BackupResource:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        region_id:
          type: string
          format: uuid
        size_gb:
          description: Capacity of the source disk when the backup was created. A restored disk cannot be smaller
            than this
          type: integer
          format: int64
        source_disk_id:
          description: The disk this backup was taken from. The backup remains usable after that disk is deleted
          type: string
          format: uuid
        status:
          type: string
          enum:
          - provisioning
          - available
          - restoring
          - deleting
          - error
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        price_id:
          type:
          - string
          - 'null'
          format: uuid
        subscription_item_id:
          type:
          - string
          - 'null'
          format: uuid
        access_state:
          type:
          - string
          - 'null'
          enum:
          - pending
          - enabled
          - suspended
          - reclaimed
          - null
        task:
          anyOf:
          - $ref: '#/components/schemas/Task'
          - type: 'null'
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        source_availability_zone_id:
          description: Availability zone of the source disk. A restore may target another zone in the same region
          type: string
          format: uuid
      required:
      - id
      - source_disk_id
      - name
      - size_gb
      - status
      - region_id
      - source_availability_zone_id
      - created_at
      - order_id
      - price_id
      - subscription_item_id
      - access_state
      - task
      - generation
      - observed_at
      additionalProperties: false
    BackupListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BackupResource'
      required:
      - items
      additionalProperties: false
    CreateBackupRequestBody:
      type: object
      properties:
        disk_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
        price:
          $ref: '#/components/schemas/CatalogReference'
        order:
          $ref: '#/components/schemas/OrderOptions'
      required:
      - disk_id
      - name
      - price
      - order
      additionalProperties: false
    RenameBackupRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - name
      additionalProperties: false
    RestoreBackupRequestBody:
      type: object
      properties:
        disk_type_id:
          description: May differ from the availability zone of the source disk, but must be in the same region.
            It has to be on sale — restoring creates a new disk, so a withdrawn type is rejected here as well
          type: string
          format: uuid
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        size_gb:
          description: Matches the size of the backup when omitted. When given, it must not be smaller than the
            backup
          type: integer
          format: int64
          minimum: 0
        price:
          $ref: '#/components/schemas/CatalogReference'
        order:
          $ref: '#/components/schemas/OrderOptions'
      required:
      - disk_type_id
      - name
      - price
      - order
      additionalProperties: false
    DiskResource:
      type: object
      properties:
        availability_zone_id:
          description: Availability zone the disk actually resides in. An instance must be in the same zone to attach
            it
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        disk_type_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          type: string
        region_id:
          type: string
          format: uuid
        size_gb:
          type: integer
          format: int64
        iops:
          description: 'IOPS this disk is allowed. Null when its type is not rate-limited.


            Computed from the disk''s own capacity, so it grows when the disk is grown — but see the

            note on the resize endpoint: growing a disk that is attached is refused, precisely because

            the new figure would not take effect until it was attached again.'
          type:
          - integer
          - 'null'
          format: int64
        throughput_bytes_per_sec:
          description: Throughput this disk is allowed, in bytes per second. Null when its type is not rate-limited
          type:
          - integer
          - 'null'
          format: int64
        status:
          type: string
          enum:
          - provisioning
          - available
          - attaching
          - in_use
          - detaching
          - resizing
          - reverting
          - restoring
          - releasing
          - deleting
          - error
        order_id:
          type:
          - string
          - 'null'
          format: uuid
        price_id:
          type:
          - string
          - 'null'
          format: uuid
        subscription_item_id:
          type:
          - string
          - 'null'
          format: uuid
        access_state:
          type:
          - string
          - 'null'
          enum:
          - pending
          - enabled
          - suspended
          - reclaimed
          - null
        task:
          anyOf:
          - $ref: '#/components/schemas/Task'
          - type: 'null'
        attachment:
          anyOf:
          - $ref: '#/components/schemas/DiskAttachment'
          - type: 'null'
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - name
      - region_id
      - availability_zone_id
      - disk_type_id
      - size_gb
      - iops
      - throughput_bytes_per_sec
      - status
      - created_at
      - order_id
      - price_id
      - subscription_item_id
      - access_state
      - task
      - generation
      - observed_at
      additionalProperties: false
    DiskTypeResource:
      type: object
      properties:
        availability_zone_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        iops_at_min_size:
          description: 'IOPS a disk of `min_size_gb` gets. Null when this type is not rate-limited.


            Performance grows with capacity, so this and `iops_at_max_size` are the two ends of the

            range. The exact figure for the size actually bought appears on the disk itself once it

            exists.'
          type:
          - integer
          - 'null'
          format: int64
        iops_at_max_size:
          description: IOPS a disk of `max_size_gb` gets. Null when this type is not rate-limited
          type:
          - integer
          - 'null'
          format: int64
        max_size_gb:
          type: integer
          format: int64
        media:
          type: string
          enum:
          - ssd
          - hdd
          - nvme
        min_size_gb:
          type: integer
          format: int64
        name:
          type: string
        region_id:
          type: string
          format: uuid
        step_gb:
          type: integer
          format: int64
        throughput_at_min_size:
          description: 'Throughput a disk of `min_size_gb` gets, in **bytes per second**. Null when this type is

            not rate-limited.


            Bytes rather than MiB so the number needs no rounding on the way out; divide by 1048576

            for MiB/s at the point of display.'
          type:
          - integer
          - 'null'
          format: int64
        throughput_at_max_size:
          description: Throughput a disk of `max_size_gb` gets, in bytes per second. Null when this type is not
            rate-limited
          type:
          - integer
          - 'null'
          format: int64
        product_id:
          type:
          - string
          - 'null'
          format: uuid
        plan_id:
          type:
          - string
          - 'null'
          format: uuid
        lookup_key:
          type: string
        name_translations:
          type: object
          additionalProperties:
            type: string
        snapshot_plan_id:
          type:
          - string
          - 'null'
          format: uuid
        backup_plan_id:
          type:
          - string
          - 'null'
          format: uuid
        private_image_plan_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - id
      - name
      - media
      - region_id
      - availability_zone_id
      - min_size_gb
      - max_size_gb
      - step_gb
      - iops_at_min_size
      - iops_at_max_size
      - throughput_at_min_size
      - throughput_at_max_size
      - lookup_key
      - product_id
      - plan_id
      - name_translations
      - snapshot_plan_id
      - backup_plan_id
      - private_image_plan_id
      additionalProperties: false
    DiskTypeListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DiskTypeResource'
      required:
      - items
      additionalProperties: false
    ImageResource:
      type: object
      properties:
        architecture:
          type: string
        id:
          type: string
          format: uuid
        login_username:
          description: The account this image lets you log in as. The password set at creation belongs to this account
          type: string
          maxLength: 32
        min_disk_gb:
          type: integer
          format: int64
        min_ram_mb:
          type: integer
          format: int64
        name:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        region_id:
          type: string
          format: uuid
        supports_password_reset:
          description: False means a new password can only be set by rebuilding an instance created from this image
          type: boolean
        lookup_key:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - login_username
      - id
      - name
      - os_family
      - os_version
      - architecture
      - region_id
      - min_disk_gb
      - min_ram_mb
      - supports_password_reset
      additionalProperties: false
    ImageListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ImageResource'
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          format: int64
          minimum: 1
        total_count:
          type: integer
          format: int64
          minimum: 0
      required:
      - items
      - page
      - page_size
      additionalProperties: false
    InstanceTypeResource:
      type: object
      properties:
        availability_zone_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        max_bandwidth_mbps:
          description: 'The most public bandwidth a machine of this type may be given, in Mbps. Asking for more

            when creating a machine, or raising a bound address past it, is refused.


            A ceiling on what can be bought, not a speed. How fast the machine''s own interfaces run is

            `network_egress_kbps` / `network_ingress_kbps`.'
          type: integer
          format: int64
        network_egress_kbps:
          description: 'Outbound ceiling of **each** network interface, in kbps. Null when this type is not

            rate-limited.


            Per interface rather than per machine: a machine with two interfaces has this ceiling on

            each of them, not shared between them. `max_ports` says how many it may have.'
          type:
          - integer
          - 'null'
          format: int64
        network_ingress_kbps:
          description: Inbound ceiling of each network interface, in kbps. Null when this type is not rate-limited
          type:
          - integer
          - 'null'
          format: int64
        max_floating_ips:
          type: integer
          format: int64
        max_ports:
          type: integer
          format: int64
        name:
          type: string
        ram_mb:
          type: integer
          format: int64
        region_id:
          type: string
          format: uuid
        vcpus:
          type: integer
          format: int64
        product_id:
          type:
          - string
          - 'null'
          format: uuid
        plan_id:
          type:
          - string
          - 'null'
          format: uuid
        lookup_key:
          type: string
        name_translations:
          type: object
          additionalProperties:
            type: string
      required:
      - id
      - name
      - vcpus
      - ram_mb
      - region_id
      - availability_zone_id
      - max_ports
      - max_floating_ips
      - max_bandwidth_mbps
      - network_egress_kbps
      - network_ingress_kbps
      - plan_id
      - lookup_key
      - product_id
      - name_translations
      additionalProperties: false
    InstanceTypeListResponseBody:
      type: object
      properties:
