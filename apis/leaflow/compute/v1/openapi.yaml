openapi: 3.1.0
info:
  description: |-
    Leaflow 计算的用户接口，用于管理云服务器、云硬盘、快照、备份、自制镜像、私有网络、子网、路由、安全组、网卡与公网 IP。

    ## 身份与鉴权

    每个请求需携带 `Authorization: Bearer <项目令牌>`。先在 auth.leaflow.net 登录获取账号令牌，再用它向 IAM 换取项目令牌（`POST /api/v1/projects/{projectId}/token`）。一张项目令牌同时说明当前用户和当前项目。

    **路径和请求头上都没有 `project_id`**：当前项目由令牌决定。

    鉴权在网关完成，失败的请求不会到达这些接口。按错误码区分处理方式：`TOKEN_MISSING` 表示没带令牌；`TOKEN_EXPIRED` 表示令牌过期，用账号令牌重新换取即可，无需重新登录；`TOKEN_INVALID` 表示令牌验不过；`NOT_A_MEMBER` 表示当前账号不是该项目成员；`USER_SUSPENDED` / `USER_BANNED` 表示账号本身不能操作。

    ## 通用约定

    - **操作是异步的。** 创建云服务器、创建云硬盘、变更配置在返回时尚未完成，资源处于 `provisioning` 等中间状态，需轮询 GET 确认结果。查询单个资源时会同步一次当前状态。
    - **可用区。** 云硬盘与云服务器必须位于同一可用区才能挂载。机型和硬盘类型各自绑定在一个可用区上，选定类型即选定可用区。
    - **IPv6 不单独售卖。** 在私有网络上启用后，IPv6 地址会自动下发至该网络内的云服务器，无需也无法单独申领。
    - **公网 IP 有冷却期。** 释放后短时间内既不能重新申领，也不会分配给其他用户，以免仍指向该地址的 DNS 记录和访问白名单立即失效。
    - **密码只返回一次。** 创建或重装时若由平台生成密码，它仅出现在该次响应中，请及时保存。
  title: Leaflow 计算用户 API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/v1/backups:
    get:
      summary: 列出备份
      operationId: list-backups
      tags:
        - Backup
      parameters:
        - description: 只返回该云硬盘的备份
          explode: false
          in: query
          name: disk_id
          schema:
            description: 只返回该云硬盘的备份
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 创建备份
      description: |-
        备份是云硬盘在独立存储中的一份完整副本：**源云硬盘删除后仍可恢复，且可恢复到本地区的其他可用区。**快照不具备这两项能力，它与源云硬盘位于同一存储，且源云硬盘存在快照时无法删除。

        运行中云服务器上挂载的云硬盘、以及系统盘，均可创建备份。

        备份耗时取决于数据量。接口返回时尚未完成，请轮询查看接口。
      operationId: create-backup
      tags:
        - Backup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/backups/{backupId}:
    delete:
      summary: 删除备份
      description: 与源云硬盘无关，源云硬盘是否存在都不影响删除。
      operationId: delete-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: 查看备份
      description: 会实时查询备份的当前状态，因此比列表接口慢但更准确。轮询创建进度请使用本接口。
      operationId: get-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: 重命名备份
      operationId: rename-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBackupRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/backups/{backupId}/restore:
    post:
      summary: 由备份恢复
      description: |-
        恢复到一块**新建的**云硬盘上，源云硬盘不受影响，也不要求它仍然存在。

        目标硬盘类型可位于本地区的其他可用区，容量不能小于备份。恢复完成前该云硬盘不可挂载，请轮询云硬盘查看接口。
      operationId: restore-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disk-types:
    get:
      summary: 列出在售硬盘类型
      operationId: list-disk-types
      tags:
        - Catalog
      parameters:
        - explode: false
          in: query
          name: region_code
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskTypeListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/images:
    get:
      summary: 列出在售镜像
      description: min_ram_mb 超过所选机型内存的镜像无法启动，请据此过滤可选项。
      operationId: list-images
      tags:
        - Catalog
      parameters:
        - explode: false
          in: query
          name: region_code
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instance-types:
    get:
      summary: 列出在售机型
      operationId: list-instance-types
      tags:
        - Catalog
      parameters:
        - explode: false
          in: query
          name: region_code
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypeListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/regions:
    get:
      summary: 列出可用的地区
      operationId: list-regions
      tags:
        - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/regions/{regionCode}/availability-zones:
    get:
      summary: 列出一个地区的可用区
      description: 云硬盘与云服务器必须位于同一可用区才能挂载，创建前请确认所选可用区。
      operationId: list-availability-zones
      tags:
        - Catalog
      parameters:
        - in: path
          name: regionCode
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks:
    get:
      summary: 列出云硬盘
      description: 同时提供 region_code 与 availability_zone 时，只返回可挂载到该位置云服务器的云硬盘。
      operationId: list-disks
      tags:
        - Disk
      parameters:
        - explode: false
          in: query
          name: region_code
          schema:
            maxLength: 32
            type: string
        - description: 与 region_code 同时提供，用于筛选可挂载的云硬盘
          explode: false
          in: query
          name: availability_zone
          schema:
            description: 与 region_code 同时提供，用于筛选可挂载的云硬盘
            maxLength: 64
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 创建云硬盘
      description: 云硬盘创建在所选硬盘类型所属的可用区，云服务器必须位于同一可用区才能挂载。因此选定硬盘类型即确定了可用区。
      operationId: create-disk
      tags:
        - Disk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiskRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks/{diskId}:
    delete:
      summary: 删除云硬盘
      description: 云硬盘处于挂载状态，或仍存在基于它创建的快照时，删除会被拒绝。
      operationId: delete-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: 查看云硬盘
      description: 会实时查询云硬盘的当前状态，因此比列表接口慢但更准确。
      operationId: get-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: 重命名云硬盘
      description: 仅可修改名称。容量请使用扩容接口，类型与可用区不可修改。
      operationId: rename-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks/{diskId}/resize:
    post:
      summary: 扩容
      description: 容量只能增加，不支持缩容。扩容完成后需在云服务器内自行扩展文件系统。
      operationId: resize-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks/{diskId}/revert:
    post:
      summary: 回滚到快照
      description: |-
        将云硬盘的内容恢复到创建该快照的时刻。**该时刻之后写入的数据全部丢失，且无法撤销。**

        三项限制：只能回滚到该云硬盘最新的一个快照；云硬盘必须先从云服务器上卸载；创建快照后扩容过的云硬盘不能回滚。需要回到更早的时刻，或需要保留现有云硬盘时，请改用由快照创建一块新的云硬盘。

        接口返回时回滚尚未完成，请轮询查看接口。
      operationId: revert-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevertDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips:
    get:
      summary: 列出公网 IP
      operationId: list-floating-ips
      tags:
        - FloatingIP
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 申领公网 IP
      description: |-
        若该私有网络尚未连通外网，会一并为其接入外网。

        IPv6 不通过本接口申请。IPv6 地址由私有网络自动下发至云服务器，在私有网络上启用即可。
      operationId: allocate-floating-ip
      tags:
        - FloatingIP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateFloatingIPRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips/{floatingIpId}:
    delete:
      summary: 释放公网 IP
      description: 地址释放后进入冷却期才会重新分配，以免仍指向它的 DNS 记录和访问白名单立即失效。因此释放后的短时间内**无法重新申领同一个地址**，请谨慎操作。
      operationId: release-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: 查看公网 IP
      operationId: get-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips/{floatingIpId}/bandwidth:
    put:
      summary: 设带宽上限
      description: 出入两个方向同时限速。仅限制出方向无法防止入方向流量打满上联带宽。
      operationId: set-floating-ip-bandwidth
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBandwidthRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips/{floatingIpId}/binding:
    delete:
      summary: 解绑公网 IP
      description: 地址仍归本项目持有，只是不再指向任何网卡。
      operationId: unbind-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: 将公网 IP 绑定到网卡
      operationId: bind-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindFloatingIPRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances:
    get:
      summary: 列出云服务器
      operationId: list-instances
      tags:
        - Instance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 创建云服务器
      description: |-
        **必须在请求中设置密码**：不设置时请求会被拒绝，否则创建出的云服务器将无法登录。密码可由平台生成，此时仅在本次响应中返回一次。

        `count` 可一次创建多台（最多 20 台），名称自动加 `-1`、`-2` 编号，所有云服务器共用同一个密码。**响应中的 `instances` 始终是数组**，单台创建时也是。

        批量创建按顺序逐台进行。若中途失败（例如配额不足），**已创建的云服务器会保留**，响应中的 `failure` 给出中止原因；第一台就失败时视为整次请求失败，不会创建任何云服务器。

        镜像二选一：`image_id` 使用平台提供的镜像，`private_image_id` 使用自制镜像。两者都给或都不给都会被拒绝。

        云服务器创建在机型所属的可用区。后续要挂载的云硬盘必须位于同一可用区。

        接口返回时创建尚未完成（status 为 provisioning），请轮询 GET 确认结果。
      operationId: launch-instance
      tags:
        - Instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInstanceRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchInstanceResponseBody'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}:
    delete:
      summary: 释放云服务器
      description: |-
        系统盘随云服务器一并删除，**基于系统盘创建的快照也会一并删除**。数据盘会被卸载并保留，其快照与备份不受影响。主网卡随云服务器一并释放。

        正在制作镜像的云服务器无法释放，请等待制作完成或先删除该镜像。
      operationId: delete-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: 查看云服务器
      description: 会实时查询云服务器的当前状态，因此比列表接口慢但更准确。轮询创建进度请使用本接口。
      operationId: get-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: 重命名云服务器
      description: 仅修改显示名称。云服务器内的主机名不变，它等于云服务器 id。
      operationId: rename-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/actions:
    post:
      summary: 开机、关机、重启
      description: |-
        重启默认为软重启，由操作系统正常关闭后重新启动。

        系统已无响应时软重启不会生效，此时可设置 `force` 强制重启。强制重启不等待操作系统关闭，**未落盘的数据会丢失**。`force` 仅适用于 reboot。

        已被平台停服的云服务器需先解除停服。
      operationId: act-on-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActOnInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/console:
    post:
      summary: 打开远程控制台
      description: |-
        在浏览器中直接操作云服务器，无需网络可达，适用于网络配置失误导致无法登录的情况。

        返回的地址一次性使用，数分钟后失效。**请勿缓存**，每次使用前重新获取。
      operationId: open-instance-console
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/console-output:
    get:
      summary: 读取串口输出
      description: |-
        云服务器启动过程与内核输出的原始文本。无法登录或远程控制台无输出时，应首先查看本接口。其中可查看启动停止于哪一步、系统盘是否正常挂载、初始化过程是否报错。

        处于错误状态或已被平台停服的云服务器同样可以读取。
      operationId: get-instance-console-output
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - description: 返回末尾多少行，0 表示全部
          explode: false
          in: query
          name: lines
          schema:
            default: 200
            description: 返回末尾多少行，0 表示全部
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleOutputResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/password:
    post:
      summary: 重置登录密码
      description: |-
        在不重启的情况下改掉 root 的密码，云服务器必须处于运行中。

        **并非所有镜像都支持**：镜像列表中 `supports_password_reset` 为 false 的镜像做不到，此时只能通过重装系统设置新密码，而重装会清除系统盘上的全部数据。

        镜像标记为支持、但云服务器内相应组件已被卸载或停止时，本接口同样会被拒绝。
      operationId: reset-instance-password
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/rebuild:
    post:
      summary: 重装系统
      description: '**系统盘数据将被清除且无法恢复。** 已挂载的数据盘不受影响。'
      operationId: rebuild-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildInstanceResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/resize:
    post:
      summary: 变配
      description: |-
        只能变更为同一地区、同一可用区的机型，否则已挂载的云硬盘无法随之迁移。

        变配分两步：本接口下发后云服务器会在新规格上重新启动，状态变为 `resize_verifying`，此时**必须**调用确认或回滚接口。目标机型在确认前记在 `pending_instance_type_id` 上，`instance_type_id` 仍为当前生效并计费的机型。

        **未确认期间新旧两份规格同时占用资源。** 请在状态变为 `resize_verifying` 后尽快确认。
      operationId: resize-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/resize/confirm:
    post:
      summary: 确认变配
      description: 释放原规格占用的资源，`pending_instance_type_id` 成为生效机型并从此按它计费。
      operationId: confirm-instance-resize
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/resize/revert:
    post:
      summary: 回滚变配
      description: 云服务器回到原规格，`pending_instance_type_id` 被丢弃，计费不受本次变配影响。
      operationId: revert-instance-resize
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/disks:
    get:
      summary: 列出云服务器已挂载的云硬盘
      operationId: list-instance-disks
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 挂载云硬盘
      description: 云硬盘必须与云服务器位于同一地区和可用区。挂载后需在云服务器内自行分区并挂载文件系统。
      operationId: attach-disk
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/disks/{diskId}:
    delete:
      summary: 卸载云硬盘
      description: 请先在云服务器内卸载（umount）该设备再调用本接口，正在写入的文件系统被强制卸载会损坏数据。
      operationId: detach-disk
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/floating-ips:
    post:
      summary: 为云服务器绑定公网 IP
      description: 公网 IP 绑定在云服务器的主网卡上。
      operationId: attach-instance-floating-ip
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachFloatingIPRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/floating-ips/{floatingIpId}:
    delete:
      summary: 解绑云服务器的公网 IP
      operationId: detach-instance-floating-ip
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/ports:
    get:
      summary: 列出云服务器的网卡
      operationId: list-instance-ports
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 挂载网卡
      operationId: attach-port
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachPortRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/ports/{portId}:
    delete:
      summary: 卸载网卡
      description: 主网卡不可卸载，卸载后云服务器将失去网络地址。
      operationId: detach-port
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: portId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/operation-logs:
    get:
      summary: 列出本项目的操作记录
      description: |-
        记录本项目内的每一次写操作：谁、在什么时候、对什么做了什么、成功还是失败。读取操作不记录。

        **平台代为执行的操作也在其中，但不显示具体执行人**，`by_platform` 为 true。例如欠费停机、违规封禁：需要知道机器何时被平台停止，但执行人属于平台内部信息。

        密码一类的字段在写入时即被替换为占位符，不会出现在 `payload` 中。
      operationId: list-operation-logs
      tags:
        - OperationLog
      parameters:
        - description: 只看某一种操作，取值与接口的 operation id 一致
          explode: false
          in: query
          name: action
          schema:
            description: 只看某一种操作，取值与接口的 operation id 一致
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLogListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/ports:
    get:
      summary: 列出网卡
      operationId: list-ports
      tags:
        - Port
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 创建网卡
      description: 创建出的网卡尚未挂载到任何云服务器。主网卡不由本接口创建，它随云服务器一并创建。
      operationId: create-port
      tags:
        - Port
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/ports/{portId}:
    delete:
      summary: 删除网卡
      description: 主网卡不可单独删除，它随云服务器一并释放。仍挂载在云服务器上的网卡也无法删除。
      operationId: delete-port
      tags:
        - Port
      parameters:
        - in: path
          name: portId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-images:
    get:
      summary: 列出自制镜像
      operationId: list-private-images
      tags:
        - PrivateImage
      parameters:
        - description: 只返回该地区的镜像。镜像只能用于所在地区
          explode: false
          in: query
          name: region_code
          schema:
            description: 只返回该地区的镜像。镜像只能用于所在地区
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateImageListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 将云服务器制作为镜像
      description: |-
        依据云服务器的系统盘制作，数据盘不包含在内。制作出的镜像可用于创建云服务器或重装系统，并在源云服务器释放后继续可用。

        **镜像内容取自开始制作的那一刻，此后对云服务器的改动不会包含在内。**

        制作分两个阶段，请轮询查看接口：

        - `provisioning` 正在读取系统盘，通常数十秒。此阶段云服务器可以继续使用，但为保证一致性建议先关机。
        - `uploading` 已与系统盘无关，**此时即可开机，无需等待制作完成**。该阶段耗时与系统盘容量成正比，20 GB 约需 3 分钟。

        运行中的云服务器其文件系统可能处于写入中间状态，制作出的镜像等同于一次断电后的磁盘内容。对一致性有要求时，请在开始制作前关机，并在状态变为 `uploading` 后开机。

        制作期间该云服务器可以正常启停与使用，但无法释放。
      operationId: create-private-image
      tags:
        - PrivateImage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrivateImageRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateImageResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-images/{privateImageId}:
    delete:
      summary: 删除自制镜像
      description: |-
        仍有云服务器由该镜像创建时，删除会被拒绝：这些云服务器需要它才能重装系统。

        制作尚未完成的镜像也可以删除，制作会被终止。
      operationId: delete-private-image
      tags:
        - PrivateImage
      parameters:
        - in: path
          name: privateImageId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: 查看自制镜像
      description: 轮询制作进度请使用本接口。status 为 error 时，failure 给出失败原因。
      operationId: get-private-image
      tags:
        - PrivateImage
      parameters:
        - in: path
          name: privateImageId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateImageResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: 重命名自制镜像
      operationId: rename-private-image
      tags:
        - PrivateImage
      parameters:
        - in: path
          name: privateImageId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
