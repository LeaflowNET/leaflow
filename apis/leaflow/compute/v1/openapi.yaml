openapi: 3.1.0
info:
  title: Leaflow Compute API
  version: 1.0.0
  description: 'Leaflow Compute user API for managing instances, disks, snapshots, backups, private images, private
    networks, subnets, routes, security groups, network interfaces and floating IPs.


    ## Authentication


    Every request carries a scoped token; see the `bearerAuth` security scheme.


    ## Conventions


    - **Operations are asynchronous.** Creating an instance, creating a disk and resizing all return before the
    work completes, leaving the resource in an intermediate state such as `provisioning`. Use the returned task
    or order to track completion. Resource reads return the latest observed state.

    - **Availability zones.** A disk and an instance must reside in the same availability zone to be attached. Instance
    types and disk types are each bound to one availability zone, so choosing a type determines the zone.

    - **IPv6 is not sold separately.** Once enabled on a private network, IPv6 addresses are assigned to the instances
    in that network automatically; they can be neither requested nor released individually.

    - **Floating IPs have a cooldown period.** A released address is neither available for re-allocation nor handed
    to another user for some time, so that DNS records and allow-lists still pointing at it do not break immediately.

    - **Passwords are returned once.** A password generated by the platform during creation or rebuild appears only
    in that response. Store it immediately.'
servers:
- url: https://compute.leaflow.cloud
security:
- bearerAuth: []
paths:
  /api/v1/backups:
    get:
      summary: List backups
      operationId: list-backups
      tags:
      - Backup
      parameters:
      - name: disk_id
        in: query
        description: Return only the backups of this disk
        explode: false
        schema:
          description: Return only the backups of this disk
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a backup
      description: 'A backup is a complete copy of a disk held in separate storage: **it remains restorable after
        the source disk is deleted, and can be restored to another availability zone in the same region.** A snapshot
        offers neither capability, as it resides in the same storage as the source disk and prevents that disk from
        being deleted while it exists.


        Disks attached to a running instance, including system disks, can be backed up.


        The duration depends on the amount of data. The backup is not complete when this endpoint returns; poll
        the retrieve endpoint.'
      operationId: create-backup
      tags:
      - Backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/backups/{backupId}:
    get:
      summary: Retrieve a backup
      description: Queries the current state of the backup, which makes it slower but more accurate than the list
        endpoint. Use it to poll creation progress.
      operationId: get-backup
      tags:
      - Backup
      parameters:
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Rename a backup
      operationId: rename-backup
      tags:
      - Backup
      parameters:
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBackupRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a backup
      description: 'Independent of the source disk: deletion succeeds whether or not that disk still exists.'
      operationId: delete-backup
      tags:
      - Backup
      parameters:
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      responses:
        '202':
          description: The action was accepted. Wait for the returned task to finish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/backups/{backupId}/restore:
    post:
      summary: Restore from a backup
      description: 'Restores onto a **newly created** disk. The source disk is unaffected and need not still exist.


        The target disk type may belong to another availability zone of the same region, and its capacity must not
        be smaller than the backup. The disk cannot be attached until the restore completes; poll the disk retrieve
        endpoint.'
      operationId: restore-backup
      tags:
      - Backup
      parameters:
      - name: backupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/disk-types:
    get:
      summary: List disk types on sale
      description: Only disk types currently on sale are listed. A withdrawn one disappears from here and can no
        longer be bought, while the disks already on it keep working and can still be resized.
      operationId: list-disk-types
      tags:
      - Catalog
      parameters:
      - name: region_id
        in: query
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskTypeListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/disk-types/{diskTypeId}:
    get:
      summary: Get a disk type
      description: Retrieve capacity and performance constraints for an existing disk, including system disk types
        and types withdrawn from sale.
      operationId: get-disk-type
      tags:
      - Catalog
      parameters:
      - name: diskTypeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskTypeResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/images:
    get:
      summary: List images on sale
      description: 'An image whose `min_ram_mb` exceeds the memory of the selected instance type cannot boot. Filter
        the options accordingly.


        Only images currently on sale are listed. An image the platform withdraws disappears from here and can no
        longer install new instances, while the instances already running it keep running and can still be rebuilt
        onto it.'
      operationId: list-images
      tags:
      - Catalog
      parameters:
      - name: region_id
        in: query
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instance-types:
    get:
      summary: List instance types on sale
      description: Only instance types currently on sale are listed. A withdrawn one disappears from here and can
        no longer be ordered, while the instances already running it keep running.
      operationId: list-instance-types
      tags:
      - Catalog
      parameters:
      - name: region_id
        in: query
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          default: 1
      - name: page_size
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypeListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/regions:
    get:
      summary: List available regions
      operationId: list-regions
      tags:
      - Catalog
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/regions/{regionId}/availability-zones:
    get:
      summary: List the availability zones of a region
      description: A disk and an instance must reside in the same availability zone to be attached. Confirm the
        zone before creating either.
      operationId: list-availability-zones
      tags:
      - Catalog
      parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/disks:
    get:
      summary: List disks
      description: When both `region_code` and `availability_zone` are supplied, only disks attachable to an instance
        at that location are returned.
      operationId: list-disks
      tags:
      - Disk
      parameters:
      - name: region_id
        in: query
        explode: false
        schema:
          type: string
          format: uuid
      - name: availability_zone_id
        in: query
        description: Supplied together with `region_code` to filter attachable disks
        explode: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a disk
      description: 'The disk is created in the availability zone of the selected disk type, and an instance must
        reside in the same zone to attach it. Choosing the disk type therefore determines the zone.


        A disk type that has been withdrawn is rejected with `DISK_TYPE_RETIRED`, even though its identifier still
        resolves. Withdrawn types stop appearing in the disk type listing; disks already bought on one keep working
        and can still be resized.'
      operationId: create-disk
      tags:
      - Disk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiskRequestBody'
      responses:
        '402':
          description: 'Payment required: **nothing was created.**


            Returned when `payment_method` is `online`. `meta.checkout_url` is where to send the

            customer; `meta.order_id` is the order waiting on it.


            ## Why this is a status and not a field on a 200


            A field on a success response is something a client can forget to read, and forgetting it

            means treating "we created nothing and are waiting for money" as "created" — which looks

            identical from the outside until the bill does not add up. A 402 fails loudly in any

            client that handles errors at all.


            ## What happens after they pay


            The money lands in the balance and the order is settled from it. The resource is **not**

            created automatically: placing it again is the customer''s move, because between paying

            and coming back they may have changed their mind. The balance is theirs either way.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/disks/{diskId}:
    get:
      summary: Retrieve a disk
      description: Queries the current state of the disk, which makes it slower but more accurate than the list
        endpoint.
      operationId: get-disk
      tags:
      - Disk
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Rename a disk
      description: Changes the name only. Use the resize endpoint for capacity; type and availability zone are immutable.
      operationId: rename-disk
      tags:
      - Disk
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameDiskRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a disk
      description: Deletion is rejected while the disk is attached, or while snapshots created from it still exist.
      operationId: delete-disk
      tags:
      - Disk
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      responses:
        '202':
          description: The action was accepted. Wait for the returned task to finish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/disks/{diskId}/resize:
    post:
      summary: Resize a disk
      description: 'Capacity can only be increased; shrinking is not supported. Extend the file system inside the
        instance once the resize completes.


        **A data disk whose performance grows with its size has to be detached first.** The storage backend decides
        a volume''s limit when the volume is attached and never revisits it, so growing one that is attached would
        give you the capacity immediately and leave the speed at the old size''s figure — indefinitely, and stopping
        the instance does not help. Rather than take the money for performance that does not arrive, this is refused
        with `DISK_RESIZE_NEEDS_DETACH`; detach the disk, resize it, and attach it again.


        It is only refused when the two sizes really would differ in speed. A disk whose type has no QoS level,
        or whose performance has already reached the type''s ceiling, grows online as before.


        **A system disk is the exception and grows online**, because a root volume cannot be detached at all. Its
        performance does not change with size for exactly that reason — system disk types are required to carry
        a level that does not scale.'
      operationId: resize-disk
      tags:
      - Disk
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeDiskRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/disks/{diskId}/revert:
    post:
      summary: Revert to a snapshot
      description: 'Restores the contents of the disk to the moment the snapshot was taken. **All data written after
        that moment is lost and cannot be recovered.**


        Three restrictions apply: only the most recent snapshot of the disk can be reverted to; the disk must be
        detached from its instance first; and a disk resized since the snapshot was taken cannot be reverted. To
        return to an earlier point in time, or to keep the existing disk, create a new disk from the snapshot instead.


        The revert is not complete when this endpoint returns; poll the retrieve endpoint.'
      operationId: revert-disk
      tags:
      - Disk
      parameters:
      - name: diskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevertDiskRequestBody'
      responses:
        '202':
          description: The action was accepted. Wait for the returned task to finish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/floating-ips:
    get:
      summary: List floating IPs
      operationId: list-floating-ips
      tags:
      - FloatingIP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Allocate a floating IP
      description: 'If the private network is not yet connected to the internet, connectivity is established as
        part of this call.


        IPv6 is not requested through this endpoint. IPv6 addresses are assigned to instances by the private network;
        enable IPv6 on that network instead.'
      operationId: allocate-floating-ip
      tags:
      - FloatingIP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateFloatingIPRequestBody'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/floating-ips/{floatingIpId}:
    get:
      summary: Retrieve a floating IP
      operationId: get-floating-ip
      tags:
      - FloatingIP
      parameters:
      - name: floatingIpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Release a floating IP
      description: Releases the floating IP after unbinding it. Completion is reported by the returned task.
      operationId: release-floating-ip
      tags:
      - FloatingIP
      parameters:
      - name: floatingIpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      responses:
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: The release has been accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
  /api/v1/floating-ips/{floatingIpId}/bandwidth:
    put:
      summary: Set the bandwidth limit
      description: 'Limits both directions at once. Limiting egress alone does not prevent ingress traffic from
        saturating the uplink.


        While the address is bound to an instance, the ceiling has to fit that instance type''s `max_bandwidth_mbps`;
        asking for more is refused with `INSTANCE_BANDWIDTH_CEILING`. An address bound to nothing is not checked
        against any type — there is none to check against — and is checked again when it is attached.'
      operationId: set-floating-ip-bandwidth
      tags:
      - FloatingIP
      parameters:
      - name: floatingIpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBandwidthRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacedOrder'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/floating-ips/{floatingIpId}/binding:
    put:
      summary: Bind a floating IP to a network interface
      operationId: bind-floating-ip
      tags:
      - FloatingIP
      parameters:
      - name: floatingIpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindFloatingIPRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Unbind a floating IP
      description: The address remains held by the project and simply no longer points at any network interface.
      operationId: unbind-floating-ip
      tags:
      - FloatingIP
      parameters:
      - name: floatingIpId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances:
    get:
      summary: List instances
      description: Every instance in the project, newest first. This endpoint does not query backend state; for
        the accurate state of one instance, use the retrieve endpoint.
      operationId: list-instances
      tags:
      - Instance
      parameters:
      - name: label
        in: query
        description: Only instances carrying this label, written as `key:value` — for example `env:prod`. Both halves
          are matched exactly
        explode: false
        schema:
          description: A label to filter by, written as `key:value`
          type: string
          maxLength: 128
