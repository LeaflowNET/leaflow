      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateNetworkResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}:
    delete:
      summary: 释放私有网络
