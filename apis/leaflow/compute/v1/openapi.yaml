  /api/v1/instances/{instanceId}/password:
    post:
      summary: Reset the login password
      description: 'Changes the root password without a reboot. The instance must be running.


        **Not every image supports this.** Images whose `supports_password_reset` is false cannot, and a new password
        can then only be set by rebuilding the instance, which erases all data on the system disk.


        The request is also rejected when the image is marked as supported but the corresponding component has been
        removed or stopped inside the instance.'
      operationId: reset-instance-password
      tags:
      - Instance
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
