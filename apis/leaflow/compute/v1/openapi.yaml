          $ref: "#/components/schemas/CheckoutOptions"
        boot_disk:
          $ref: "#/components/schemas/BootDisk"
        floating_ip:
          $ref: "#/components/schemas/NewFloatingIP"
      required:
        - name
        - compute
        - boot_disk
      additionalProperties: false
