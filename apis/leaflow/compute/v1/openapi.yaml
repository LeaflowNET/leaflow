    FloatingIPResource:
      description: |-
        One purchased public IP resource, including its bandwidth configuration. Bandwidth has no
        separate Compute resource ID; one subscription pays for the address and its bandwidth.
        Changing bandwidth updates this same resource, not another allocation.
      type: object
      properties:
        address:
          description: The allocated public address. Null until the address is allocated.
          type:
            - string
            - "null"
        bandwidth_mbps:
          type:
            - integer
            - "null"
          format: int64
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        region_id:
          type: string
          format: uuid
        status:
          description: "`pending` until the order is accepted, with no address allocated; `provisioning` while the address is allocated; then `available`. `failed` means no address was allocated; `failure_reason` states why. `missing` means the address no longer exists in the cloud."
          type: string
          enum:
            - pending
            - provisioning
            - available
            - deleted
            - failed
            - error
            - unknown
            - missing
        order_id:
          type:
            - string
            - "null"
          format: uuid
        order_item_id:
          description: The Billing order item for this resource.
          type:
            - string
            - "null"
          format: uuid
        subscription_id:
          description: |-
            The Billing subscription associated with this resource. It may still be pending; its
            presence does not imply delivery or metering. Null when no subscription is associated.
          type:
            - string
            - "null"
          format: uuid
        release_subscription_ids:
          description: The subscription a cancellation through Billing has to cover to release this floating IP. A subscription that has ended is not listed, and the list is empty when no subscription pays for the floating IP.
          type: array
          items:
            type: string
            format: uuid
        release_set:
          description: The subscriptions of `release_subscription_ids`, in the same order, each with the resource it pays for, so that each line of a cancellation can name what it releases.
          type: array
          items:
            $ref: "#/components/schemas/ReleaseSetItem"
        access_state:
          type:
            - string
            - "null"
          enum:
            - pending
            - enabled
            - suspended
            - reclaimed
            - null
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `provisioning_failed` means creation failed after the order was accepted, and the charge for this floating IP is refunded.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - provisioning_failed
            - null
        operation:
          description: The operation in progress on this floating IP, or null when none is.
          anyOf:
            - $ref: "#/components/schemas/FloatingIPOperation"
            - type: "null"
          readOnly: true
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
            - string
            - "null"
          format: date-time
        binding:
          anyOf:
            - $ref: "#/components/schemas/IPv4Binding"
            - type: "null"
      required:
        - id
        - region_id
        - address
        - status
        - bandwidth_mbps
        - created_at
        - order_id
        - order_item_id
        - subscription_id
        - release_subscription_ids
        - release_set
        - access_state
        - failure_reason
        - operation
        - generation
        - observed_at
        - binding
      additionalProperties: false
    FloatingIPListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/FloatingIPResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    AllocateFloatingIPRequestBody:
      type: object
      properties:
        address:
          description: The address to allocate. Allocated by the platform when omitted
          type: string
          maxLength: 64
        bandwidth_mbps:
          description: |-
            The bandwidth ceiling of this address, in Mbit/s, applied to both directions.

            Required, and there is no "unlimited": an address with no ceiling runs at line rate and is
            charged nothing for the traffic, while the address itself bills normally — so the invoice
            looks correct and nothing anywhere reports it.

            It is part of this floating IP purchase and is billed as the pool's `bandwidth_pricing` shows,
            with the purchase's billing choice. Changing it later updates the
            same floating IP through its bandwidth endpoint, not an independent bandwidth resource.
          type: integer
          format: int64
          minimum: 1
          maximum: 1000
        private_network_id:
          type: string
          format: uuid
        ipv4_pool_id:
          type: string
          format: uuid
        billing:
          $ref: "#/components/schemas/BillingChoice"
        checkout:
          $ref: "#/components/schemas/CheckoutOptions"
      required:
        - private_network_id
        - bandwidth_mbps
        - ipv4_pool_id
        - billing
      additionalProperties: false
    SetFloatingIPBandwidthRequestBody:
      description: |-
        Change bandwidth on the floating IP identified by the path. This is a configuration change
        of that purchase, not an independent bandwidth purchase. Checkout is handled by Billing.
      type: object
      properties:
        bandwidth_mbps:
          description: Applied to both directions
          type: integer
          format: int64
          minimum: 1
        checkout:
          $ref: "#/components/schemas/CheckoutOptions"
        proration_date:
          description: The `proration_date` of this change's quote, so that the order is priced from the same instant. Defaults to the time of the request; it must be a whole second, not in the future and at most 10 minutes old, otherwise the request is refused with `BILLING_CHANGE_INVALID`.
          type: string
          format: date-time
      required:
        - bandwidth_mbps
      additionalProperties: false
    BindFloatingIPRequestBody:
      type: object
      properties:
        port_address_id:
          type: string
          format: uuid
      required:
        - port_address_id
      additionalProperties: false
