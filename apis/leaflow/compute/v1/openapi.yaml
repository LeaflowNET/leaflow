    post:
      summary: Create instances
      description: Creates a Billing order, including for metered pricing. The price must belong to the resource’s
        Billing Plan; applicable contract pricing is resolved by Billing. Technical capacity is checked before sellable
        quota is reserved. Provisioning continues automatically after payment; do not submit a new purchase after
        paying. Reuse the original idempotency key after an uncertain response. Exactly one of image_id, private_image_id
        or boot_disk_id is required, and exactly one of port_id or subnet_id. Existing ports, boot disks or floating
        IPs require count=1. Image boots require boot_disk; existing disks retain their own subscription. Instances,
        disks and public IPs keep their own subscription items on the same order.
      operationId: launch-instance
      tags:
      - Instance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInstanceRequestBody'
      responses:
        '202':
          description: Accepted
          content:
