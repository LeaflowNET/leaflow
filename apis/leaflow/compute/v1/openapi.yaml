                $ref: '#/components/schemas/PrivateImageListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Capture an instance as a private image
      description: 'Captured from the system disk of the instance; data disks are not included. The resulting image
        can create instances and rebuild them, and remains usable after the source instance is released.


        **The image reflects the moment the capture started. Later changes to the instance are not included.**


        The capture has two phases. Poll the retrieve endpoint:


        - `provisioning` — the system disk is being read, usually for tens of seconds. The instance remains usable
        during this phase, although stopping it first is recommended for consistency.

        - `uploading` — no longer tied to the system disk. **The instance may be started at this point; there is
        no need to wait for the capture to finish.** The duration of this phase is proportional to the size of the
        system disk, roughly 3 minutes for 20 GB.


        The file system of a running instance may be captured mid-write, in which case the image is equivalent to
        the disk contents after a power loss. Where consistency matters, stop the instance before starting the capture
        and start it again once the status becomes `uploading`.


        The instance can be started, stopped and used normally during the capture, but cannot be released.'
