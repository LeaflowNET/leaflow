            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: 重命名快照
      operationId: rename-snapshot
      tags:
        - Snapshot
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSnapshotRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 项目令牌。先在 auth.leaflow.net 登录拿到账号令牌，再用它向 IAM 换取项目令牌（POST /account/v1/projects/{projectId}/token）——一张项目令牌同时说明当前用户和当前项目。
      scheme: bearer
      type: http
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    BackupResource:
      additionalProperties: false
      properties:
        availability_zone:
          description: 源云硬盘所在的可用区。恢复时可选择本地区的其他可用区
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        region_code:
          type: string
        size_gb:
          description: 创建备份时源云硬盘的容量。恢复出的云硬盘不能小于此容量
          format: int64
          type: integer
        source_disk_id:
          description: 备份来源。该云硬盘删除后本备份仍然可用
          format: uuid
          type: string
        status:
          enum:
            - provisioning
            - available
            - restoring
            - deleting
            - error
          type: string
      required:
        - id
        - source_disk_id
        - name
        - size_gb
        - status
        - region_code
        - availability_zone
        - created_at
      type: object
    BackupListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/BackupResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    CreateBackupRequestBody:
      additionalProperties: false
      properties:
        disk_id:
          format: uuid
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - disk_id
        - name
      type: object
    RenameBackupRequestBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    RestoreBackupRequestBody:
      additionalProperties: false
      properties:
        disk_type_id:
          description: 可选择与源云硬盘不同的可用区，但必须在同一地区
          format: uuid
          maxLength: 64
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
        size_gb:
          description: 留空时与备份等大。给出时不能小于备份
          format: int64
          minimum: 0
          type: integer
      required:
        - disk_type_id
        - name
      type: object
    DiskResource:
      additionalProperties: false
      properties:
        attached_instance_id:
          type:
            - string
            - 'null'
        availability_zone:
          description: 云硬盘实际所在的可用区。挂载时云服务器必须位于同一可用区
          type: string
        created_at:
          format: date-time
          type: string
        device:
          description: 系统分配的设备名，在云服务器内看到的即为该名称
          type:
            - string
            - 'null'
        disk_type_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        is_system:
          description: 系统盘随云服务器一并释放，不能卸载也不能单独删除
          type: boolean
        name:
          type: string
        region_code:
          type: string
        size_gb:
          format: int64
          type: integer
        status:
          enum:
