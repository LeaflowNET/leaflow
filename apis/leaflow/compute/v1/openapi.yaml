      properties:
        description:
          maxLength: 255
          type: string
        direction:
          enum:
            - ingress
            - egress
          type: string
        ethertype:
          enum:
            - IPv4
            - IPv6
          type: string
        port_range_max:
          description: Denotes the ICMP code (0–255) rather than a port when the protocol is ICMP
          format: int64
          type:
            - integer
            - 'null'
        port_range_min:
          description: Denotes the ICMP type (0–255) rather than a port when the protocol is ICMP
          format: int64
          type:
            - integer
            - 'null'
        protocol:
          description: For example `tcp`, `udp`, `icmp` or `ipv6-icmp`. All protocols when omitted
          maxLength: 16
          type: string
        remote_ip_prefix:
          description: Equivalent to `0.0.0.0/0` or `::/0` when omitted
          maxLength: 64
          type: string
      required:
        - direction
        - ethertype
      type: object
    SnapshotResource:
      additionalProperties: false
      properties:
        availability_zone:
          description: A disk restored from this snapshot must reside in this availability zone
          type: string
        created_at:
          format: date-time
          type: string
        disk_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        region_code:
          type: string
        size_gb:
          description: Capacity of the source disk when the snapshot was created. A disk restored from it cannot be smaller
          format: int64
          type: integer
        status:
          enum:
            - provisioning
            - available
            - restoring
            - deleting
            - error
          type: string
      required:
        - id
        - disk_id
        - name
        - size_gb
        - status
        - availability_zone
        - region_code
        - created_at
      type: object
    SnapshotListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SnapshotResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    CreateSnapshotRequestBody:
      additionalProperties: false
      properties:
        disk_id:
          format: uuid
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - disk_id
        - name
      type: object
    RenameSecurityGroupRequestBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    RenameSnapshotRequestBody:
