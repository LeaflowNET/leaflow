          description: |-
            Only `running` and `stopped` accept commands. Every other value means the instance is changing, and start, stop, reboot, resize, rebuild and password reset are all rejected.

            `transitioning` is the fallback for a change that falls into none of the categories above. It does not indicate an error; keep polling.

            `resize_verifying` is not transient: the instance is running on the new size and stays there until the resize is confirmed or reverted, with both sizes billed in the meantime.
          type: string
          enum:
            - provisioning
            - running
            - stopped
            - starting
            - stopping
            - rebooting
            - transitioning
            - resizing
            - resize_verifying
            - error
            - deleting
            - suspended
        subnet_id:
