        order:
          $ref: "#/components/schemas/PlacedOrder"
      required:
        - backup_service
        - order
      additionalProperties: false
    BackupCapacityPack:
      description: Prepaid backup capacity for one region, sold by Compute and bought for a term through its own Billing subscription. Compute applies its coverage to backup usage; it is not a Billing allowance or credit.
      type: object
      properties:
        id:
          type: string
          format: uuid
        region_id:
          type: string
          format: uuid
        capacity_gib:
          type: integer
          format: int64
          minimum: 1
        status:
          description: "`pending` awaits acceptance of its order; `provisioning` is being applied; `active` covers backup capacity; `ended` no longer does because its subscription has ended; `failed` means the purchase failed, as `failure_reason` states."
          type: string
          enum:
            - pending
            - provisioning
            - active
            - ended
            - failed
        failure_reason:
          description: Why the purchase failed; null unless `status` is `failed`. `provisioning_failed` means it failed after the order was accepted, and its charge is refunded.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - provisioning_failed
            - null
        order_id:
          type: string
          format: uuid
        subscription_id:
          description: The pack's Billing subscription, through which it is renewed or canceled.
          type:
            - string
            - "null"
          format: uuid
        release_subscription_ids:
          description: The subscription a cancellation through Billing has to cover to release this capacity pack. A subscription that has ended is not listed, and the list is empty when no subscription pays for the pack.
          type: array
          items:
            type: string
            format: uuid
        created_at:
          type: string
          format: date-time
      required:
