    delete:
      summary: Release an instance
      description: 'The system disk is deleted with the instance, and **snapshots created from the system disk are
        deleted with it**. Data disks are detached and kept, and their snapshots and backups are unaffected. The
        primary network interface is released with the instance.


        An instance being captured as a private image cannot be released. Wait for the capture to finish, or delete
        that image first.'
      operationId: delete-instance
      tags:
      - Instance
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      responses:
        '202':
          description: The action was accepted. Wait for the returned task to finish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{instanceId}/commands:
    post:
      summary: Run a command on an instance
      description: 'Runs one command over SSH and returns what it wrote. **This is not a shell.** There is no terminal,
        no standard input and no way to answer a prompt: a command that waits for input produces nothing and is
        killed at the timeout. Chain steps with `&&`, or write a script and run that.


        **A command that fails is still a 200.** Its failure is its own result, not this endpoint''s: read `exit_code`
        for what it exited with and `stderr` for what it said, and decide from those. A `grep` that matches nothing
        exits 1 and is a perfectly successful call.


        The status therefore answers a different question — did the command run at all. A non-2xx means it did not,
        and nothing about the instance was changed by this request: it was suspended, not running or had no floating
        IP; or it refused the platform key; or the connection could not be opened. Retrying is meaningful in those
        cases and is not for a non-zero `exit_code`.


        Three conditions must hold; the instance is unreachable otherwise:


        - it is `running`

        - a floating IP is bound to it, since this endpoint connects over the public internet

        - its security group permits inbound TCP 22


        Authentication uses the key the platform attaches to every instance at creation, so nothing has to be set
        up first. The instance must have applied that key at first boot, which images without a full cloud-init
        do not do.


        **Do not pass secrets in the command.** Read them from a file on the instance instead: neither the command
        nor its output is a confidential channel.


        Each stream is capped at 1 MiB. Beyond that the rest is discarded and `truncated` is true.'
      operationId: run-instance-command
      tags:
      - Instance
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCommandRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{instanceId}/console:
    post:
      summary: Open a remote console
      description: 'Operates the instance directly from a browser and does not require the instance to be reachable
        over the network, which makes it usable when a network misconfiguration prevents login.


        The returned address is single-use and expires within minutes. **Do not cache it**; request a new one before
        each use.'
      operationId: open-instance-console
      tags:
      - Instance
      parameters:
      - name: instanceId
        in: path
        required: true
