  /api/v1/regions/{regionId}/snapshot-quota:
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get regional snapshot quota
      description: |-
        The snapshot count quota for the authenticated project in this region. Counts simultaneous
        snapshot holdings, not lifetime create calls or storage bytes. Without an active purchase,
        limit and available are zero; existing holdings, if any, still appear in used.

        pending and provisioning creations reserve a slot. Snapshots being deleted or whose cleanup
        is uncertain retain their slots until absence or deletion is confirmed. available is
        max(limit - used, 0) while active, and zero when creation is not permitted; additional
        creation is refused while the quota is inactive, suspended or exhausted.

        Canceling the quota's subscription through Billing is refused while any snapshot exists in
        the region: the cancellation fails with SNAPSHOT_QUOTA_IN_USE. Reclaiming the quota for
        non-payment deletes its snapshots, as for other reclaimed resources.
      operationId: get-snapshot-quota
      tags:
        - Snapshot
      responses:
        "200":
          description: Current effective quota, occupied slots and any pending purchase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotQuota"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Set regional snapshot quota
      description: |-
        Purchases or changes the maximum number of snapshots this project may hold in this region.
        limit is the target total, not an additional number of slots or a consumable create allowance.
        billing chooses one of the quota's pricing options; a change of an existing purchase keeps its
        billing mode and period, and billing must name that option. The purchased quantity is this count.

        Returns the quota with the order. pending_limit records the target while the current limit stays
        in force; the new limit applies once the order is accepted and the quota is activated. Snapshots
        create no further orders or subscriptions, and deleting one frees a slot without refunding the
        quota purchase.

        Repeating the same target and billing choice while its purchase is pending returns the same order. A
        conflicting pending purchase is refused with SNAPSHOT_QUOTA_CHANGE_PENDING. An already effective
        identical target and billing choice returns its existing purchase without charging again; renewing its
        term is a separate Billing renewal operation. A requested limit below used is refused with
        409 SNAPSHOT_QUOTA_IN_USE, with meta.used and meta.limit. A change never deletes snapshots.
      operationId: set-snapshot-quota
      tags:
        - Snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSnapshotQuotaRequestBody"
            example:
              limit: 20
              billing:
                mode: prepaid
                period:
                  unit: month
                  count: 1
              checkout:
                mode: deferred
      responses:
        "202":
          description: The quota purchase was recorded; the requested limit may not yet be effective.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetSnapshotQuotaResponseBody"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/regions/{regionId}/snapshot-quota/quote:
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Quote setting the regional snapshot quota
      description: Prices what `set-snapshot-quota` would order, including a change of an existing purchase as of now, for the same request, without ordering or creating anything; nothing is reserved or recorded. Billing evaluates applicable account discounts and tax as for automatic checkout. `total` is what automatic checkout would collect before credit grants and balance; give it as `checkout.expected_amount` to be refused rather than charged a different amount. `estimated_usage_amount` projects postpaid usage over one month of 730 hours and is not collected at checkout. A request the purchase would refuse is refused the same way. Prices may change, so quote again before final confirmation.
      operationId: create-snapshot-quota-quote
      tags:
        - Snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSnapshotQuotaQuoteRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/regions/{regionId}/backup-service:
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get the backup service of a region
      description: |-
        The backup service of the authenticated project in this region. Backups can be created only while it is `active`. Each hour, Compute covers retained backup capacity up to the total `capacity_gib` of the capacity packs active in the region and meters only the excess on this service's subscription, per GiB-hour.

        Canceling the service's subscription through Billing is refused while any backup is retained in the region: the cancellation fails with `BACKUP_SERVICE_IN_USE`. Delete the backups first. Capacity packs are canceled separately, under their own refund terms. Reclaiming the service for non-payment deletes its backups.
      operationId: get-backup-service
      tags:
        - Backup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupService"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Activate the backup service in a region
      description: |-
        Purchases the backup service for this project and region. The service itself has no charge; backups are billed under it postpaid, by retained capacity. It takes no billing choice. Returns the service as `pending` with its order; it becomes `active` once the order is accepted.

        Refused with 409 `BACKUP_SERVICE_EXISTS` while an activation is pending or the service is active or suspended.
      operationId: create-backup-service
      tags:
        - Backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupServiceRequestBody"
      responses:
        "202":
          description: The backup service and its order were created; the service is not active yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBackupServiceResponseBody"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/regions/{regionId}/backup-service/quote:
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Quote activating the backup service
      description: Prices what `create-backup-service` would order for the same request, without ordering or creating anything; nothing is reserved or recorded. Billing evaluates applicable account discounts and tax as for automatic checkout. `total` is what automatic checkout would collect before credit grants and balance; give it as `checkout.expected_amount` to be refused rather than charged a different amount. `estimated_usage_amount` projects postpaid usage over one month of 730 hours and is not collected at checkout. A request the purchase would refuse is refused the same way. Prices may change, so quote again before final confirmation.
      operationId: create-backup-service-quote
      tags:
        - Backup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/regions/{regionId}/backup-capacity-packs:
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: List backup capacity packs
      description: The capacity packs of the authenticated project in this region, newest first, including ended ones.
      operationId: list-backup-capacity-packs
      tags:
        - Backup
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCapacityPackListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Buy a backup capacity pack
      description: |-
        Purchases a capacity pack, prepaid backup capacity for this project and region bought by month or year: `billing` must be prepaid with a period, as offered in the backup service's `capacity_pack_pricing`. Compute applies the coverage: each hour, retained backup capacity up to the total `capacity_gib` of the packs active in the region is covered, and Compute meters only the excess on the backup service's subscription. A pack is not a Billing allowance or credit; Billing takes its order and payment and handles its renewal and cancellation through the pack's subscription.

        Returns the pack as `pending` with its order; it applies once the order is accepted. Refused with 409 `BACKUP_SERVICE_NOT_ACTIVE` and `meta.region_id` when the region's backup service is not active.
      operationId: create-backup-capacity-pack
      tags:
        - Backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupCapacityPackRequestBody"
      responses:
        "202":
          description: The pack and its order were created; the pack does not apply yet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBackupCapacityPackResponseBody"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/regions/{regionId}/backup-capacity-packs/quote:
    parameters:
      - name: regionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Quote buying a backup capacity pack
      description: Prices what `create-backup-capacity-pack` would order for the same request, without ordering or creating anything; nothing is reserved or recorded. Billing evaluates applicable account discounts and tax as for automatic checkout. `total` is what automatic checkout would collect before credit grants and balance; give it as `checkout.expected_amount` to be refused rather than charged a different amount. `estimated_usage_amount` projects postpaid usage over one month of 730 hours and is not collected at checkout. A request the purchase would refuse is refused the same way. Prices may change, so quote again before final confirmation.
      operationId: create-backup-capacity-pack-quote
      tags:
        - Backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBackupCapacityPackQuoteRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/snapshots:
    get:
      summary: List snapshots
      operationId: list-snapshots
      tags:
        - Snapshot
      parameters:
        - name: disk_id
          in: query
          description: Return only the snapshots of this disk
          explode: false
          schema:
            description: Return only the snapshots of this disk
            type: string
            format: uuid
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a snapshot
      description: |-
        Disks attached to a running instance can be snapshotted. A snapshot records the state of the block device at a point in time and may be inconsistent at the file-system level, so run `sync` inside the instance first where the data matters.

        **A snapshot of a system disk cannot be used to revert that system disk**: reverting requires the disk to be detached, and a system disk cannot be detached. It can be used to create a new data disk. To preserve and restore an entire system, use a private image; for a copy that crosses availability zones and survives deletion of the disk, use a backup.

        Snapshot slots are purchased separately for this project and the source disk's region. This operation reserves one available slot and returns the snapshot as `pending`; it places no order and charges nothing. `pending` and `provisioning` snapshots occupy slots, so concurrent requests cannot exceed the purchased limit. Read the snapshot until it is `available` or `failed`.

        Refused with SNAPSHOT_QUOTA_EXCEEDED when no slot is available. meta.region_id, meta.limit and meta.used identify the applicable quota. A failed creation releases its slot only after any snapshot data has been confirmed absent or removed.
      operationId: create-snapshot
      tags:
        - Snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequestBody"
      responses:
        "202":
          description: The snapshot record was created within the existing quota; snapshot data may not yet exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/snapshots/{snapshotId}:
    get:
      summary: Retrieve a snapshot
      operationId: get-snapshot
      tags:
        - Snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename a snapshot
      operationId: rename-snapshot
      tags:
        - Snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSnapshotRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a snapshot
      description: Deletes this snapshot without canceling the project's snapshot quota purchase. A snapshot has no individual Billing subscription. Its slot stays occupied until the deletion is confirmed.
      operationId: delete-snapshot
      tags:
        - Snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "409":
          $ref: "#/components/responses/Conflict"
        "202":
          description: Deletion was accepted. The snapshot shows the `delete` operation until it is deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/ipv4-pools:
    get:
      summary: List public IP pools
      description: Lists the public IP pools available for new allocations in this region.
      operationId: list-ipv4-pools
      tags:
        - Catalog
      parameters:
        - name: region_id
          in: query
          required: false
          explode: false
          schema:
            type: string
            format: uuid
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IPv4PoolListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/peerings:
    get:
      summary: List peerings
      operationId: list-peerings
      tags:
        - Peering
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeeringListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create peering
      description: Request IPv4 peering between non-overlapping VPCs in the same Region. The target project must accept before any connectivity is created. Does not change security groups or provide transitive routing.
      operationId: create-peering
      tags:
        - Peering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePeeringRequestBody"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeeringResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/peerings/{peeringId}:
    get:
      summary: Get peering
      operationId: get-peering
      tags:
        - Peering
      parameters:
        - &id001
          name: peeringId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeeringResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete peering
      operationId: delete-peering
      tags:
        - Peering
      parameters:
        - *id001
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeeringResource"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/peerings/{peeringId}/accept:
    post:
      summary: Accept peering
      operationId: accept-peering
      tags:
        - Peering
      parameters:
        - *id001
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeeringResource"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/peerings/{peeringId}/reject:
    post:
      summary: Reject peering
      operationId: reject-peering
      tags:
        - Peering
      parameters:
        - *id001
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeeringResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    scopedTokenAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  schemas:
    PeeringResource:
      type: object
      properties:
        id: &id002
          type: string
          format: uuid
        name:
          type: string
        region_id: *id002
        requester_project_id: *id002
        accepter_project_id: *id002
        requester_network_id: *id002
        accepter_network_id: *id002
        status:
          type: string
          enum:
            - pending_acceptance
            - provisioning
            - active
            - deleted
            - rejected
            - error
        created_at:
          type: string
          format: date-time
        failure_code:
          type: string
        operation:
          description: The operation in progress on this peering, or null when none is.
          anyOf:
            - $ref: "#/components/schemas/PeeringOperation"
            - type: "null"
          readOnly: true
      required:
        - id
        - name
        - region_id
        - requester_project_id
        - accepter_project_id
        - requester_network_id
        - accepter_network_id
        - status
        - created_at
        - operation
      additionalProperties: false
    PeeringListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PeeringResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    CreatePeeringRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        requester_network_id: *id002
        accepter_project_id: *id002
        accepter_network_id: *id002
      required:
        - name
        - requester_network_id
        - accepter_project_id
        - accepter_network_id
      additionalProperties: false
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
      required: []
    BackupResource:
      description: A copy of a disk, metered on the backup service of its region by `capacity_gib` for as long as it is retained. It has no order or subscription of its own.
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        region_id:
          type: string
          format: uuid
        size_gb:
          description: Capacity of the source disk when the backup was created. A restored disk cannot be smaller than this
          type: integer
          format: int64
        capacity_gib:
          description: "The capacity metered for this backup, in GiB: the size of the source disk when the backup was taken. Usage is this capacity multiplied by the time the backup is retained."
          type: integer
          format: int64
        source_disk_id:
          description: The disk this backup was taken from. The backup remains usable after that disk is deleted
          type: string
          format: uuid
        status:
          description: "`provisioning` while the backup is taken, then `available`. `failed` means the backup was not created. `missing` means the backup no longer exists in the cloud."
          type: string
          enum:
            - provisioning
            - available
            - deleted
            - failed
            - error
            - missing
        operation:
          description: The operation in progress on this backup, or null when none is.
          anyOf:
            - $ref: "#/components/schemas/BackupOperation"
            - type: "null"
          readOnly: true
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
            - string
            - "null"
          format: date-time
        source_availability_zone_id:
          description: Availability zone of the source disk. A restore may target another zone in the same region
          type: string
          format: uuid
      required:
        - id
        - source_disk_id
        - name
        - size_gb
        - capacity_gib
        - status
        - region_id
        - source_availability_zone_id
        - created_at
        - operation
        - generation
        - observed_at
      additionalProperties: false
    BackupListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/BackupResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    CreateBackupRequestBody:
      type: object
      properties:
        disk_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - disk_id
        - name
      additionalProperties: false
    RenameBackupRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - name
      additionalProperties: false
    RestoreBackupRequestBody:
      type: object
      properties:
        disk_type_id:
          description: May differ from the availability zone of the source disk, but must be in the same region. It has to be a data disk type on sale — restoring creates a new data disk, so a withdrawn type or a system disk type is rejected here as well
          type: string
          format: uuid
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        size_gb:
          description: Matches the size of the backup when omitted. When given, it must not be smaller than the backup
          type: integer
          format: int64
          minimum: 0
        billing:
          $ref: "#/components/schemas/BillingChoice"
        checkout:
          $ref: "#/components/schemas/CheckoutOptions"
      required:
        - disk_type_id
        - name
        - billing
      additionalProperties: false
    DiskResource:
      type: object
      properties:
        availability_zone_id:
          description: Availability zone the disk actually resides in. An instance must be in the same zone to attach it
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        disk_type_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          type: string
        region_id:
          type: string
          format: uuid
        size_gb:
          type: integer
          format: int64
        iops:
          description: |-
            IOPS this disk is allowed. Null when its type is not rate-limited.

            Computed from the disk's own capacity, so it grows when the disk is grown — but see the
            note on the resize endpoint: growing a disk that is attached is refused, precisely because
            the new figure would not take effect until it was attached again.
          type:
            - integer
            - "null"
          format: int64
        throughput_bytes_per_sec:
          description: Throughput this disk is allowed, in bytes per second. Null when its type is not rate-limited
          type:
            - integer
            - "null"
          format: int64
        status:
          description: "`pending` until the order is accepted, with no storage allocated; `provisioning` while the disk is created; then `available`, or `in_use` once attached. `failed` means the disk was not created; `failure_reason` states why. `missing` means the disk no longer exists in the cloud."
          type: string
          enum:
            - pending
            - provisioning
            - available
            - in_use
            - deleted
            - failed
            - error
            - missing
        order_id:
          type:
            - string
            - "null"
          format: uuid
        order_item_id:
          description: The Billing order item for this resource.
          type:
            - string
            - "null"
          format: uuid
        subscription_id:
          description: |-
            The Billing subscription associated with this resource. It may still be pending; its
            presence does not imply delivery or metering. Null when no subscription is associated.
          type:
            - string
            - "null"
          format: uuid
        release_subscription_ids:
          description: "The subscriptions a cancellation through Billing has to cover to release this disk: its own. Snapshots have no individual subscriptions. A system disk is released only with its instance, so for a system disk the list is that of the instance. Subscriptions that have ended are not listed, and the list is empty when no subscription pays for any of them."
          type: array
          items:
            type: string
            format: uuid
        release_set:
          description: The subscriptions of `release_subscription_ids`, in the same order, each with the resource it pays for, so that each line of a cancellation can name what it releases.
          type: array
          items:
            $ref: "#/components/schemas/ReleaseSetItem"
        access_state:
          type:
            - string
            - "null"
          enum:
            - pending
            - enabled
            - suspended
            - reclaimed
            - null
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `provisioning_failed` means creation failed after the order was accepted, and the charge for this disk is refunded.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - provisioning_failed
            - null
        operation:
          description: The operation in progress on this disk, or null when none is.
          anyOf:
            - $ref: "#/components/schemas/DiskOperation"
            - type: "null"
          readOnly: true
        attachment:
          anyOf:
            - $ref: "#/components/schemas/DiskAttachment"
            - type: "null"
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - name
        - region_id
        - availability_zone_id
        - disk_type_id
        - size_gb
        - iops
        - throughput_bytes_per_sec
        - status
        - created_at
        - order_id
        - order_item_id
        - subscription_id
        - release_subscription_ids
        - release_set
        - access_state
        - failure_reason
        - operation
        - generation
        - observed_at
      additionalProperties: false
    DiskTypePurpose:
      description: The intended purchase use of a disk type, not the current boot role or deletion policy of an individual disk.
      type: string
      enum:
        - system
        - data
    DiskTypeResource:
      type: object
      properties:
        availability_zone_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/DiskTypePurpose"
        iops_at_min_size:
          description: |-
            IOPS a disk of `min_size_gb` gets. Null when this type is not rate-limited.

            Performance grows with capacity, so this and `iops_at_max_size` are the two ends of the
            range. The exact figure for the size actually bought appears on the disk itself once it
            exists.
          type:
            - integer
            - "null"
          format: int64
        iops_at_max_size:
          description: IOPS a disk of `max_size_gb` gets. Null when this type is not rate-limited
          type:
            - integer
            - "null"
          format: int64
        max_size_gb:
          type: integer
          format: int64
        media:
          type: string
          enum:
            - ssd
            - hdd
            - nvme
        min_size_gb:
          type: integer
          format: int64
        name:
          type: string
        region_id:
          type: string
          format: uuid
        step_gb:
          type: integer
          format: int64
        throughput_at_min_size:
          description: |-
            Throughput a disk of `min_size_gb` gets, in **bytes per second**. Null when this type is
            not rate-limited.

            Bytes rather than MiB so the number needs no rounding on the way out; divide by 1048576
            for MiB/s at the point of display.
          type:
            - integer
            - "null"
          format: int64
        throughput_at_max_size:
          description: Throughput a disk of `max_size_gb` gets, in bytes per second. Null when this type is not rate-limited
          type:
            - integer
            - "null"
          format: int64
        pricing:
          description: How a disk of this type can be bought, per GiB. Null when the project has no billing account.
          anyOf:
            - $ref: "#/components/schemas/Pricing"
            - type: "null"
          readOnly: true
      required:
        - id
        - name
        - media
        - purpose
        - region_id
        - availability_zone_id
        - min_size_gb
        - max_size_gb
        - step_gb
        - iops_at_min_size
        - iops_at_max_size
        - throughput_at_min_size
        - throughput_at_max_size
        - pricing
      additionalProperties: false
    DiskTypeListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/DiskTypeResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    ImageVisibility:
      description: Who can see and use an image. `public` — offered to every project by the platform. `private` — usable only by the project that owns it.
      type: string
      enum:
        - public
        - private
    ImageResource:
      description: An image that installs the system of an instance. Fields that describe a capture or its billing apply only to private images and are null, zero or empty for public ones.
      type: object
      properties:
        id:
          type: string
          format: uuid
        region_id:
          type: string
          format: uuid
        visibility:
          $ref: "#/components/schemas/ImageVisibility"
        name:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        architecture:
          type: string
        login_username:
          description: The account this image lets you log in as. The password set at creation belongs to this account
          type: string
          maxLength: 32
        min_disk_gb:
          description: The system disk of an instance created from this image cannot be smaller than this
          type: integer
          format: int64
        min_ram_mb:
          description: The instance type of an instance created from this image must have at least this much memory
          type: integer
          format: int64
        supports_password_reset:
          description: False means a new password can only be set by rebuilding an instance created from this image
          type: boolean
        status:
          description: Only `available` images can install instances. A public image is always `available`; a private image is `pending` until its order is accepted, then goes through `provisioning` and `uploading` while it is captured. `failed` means the capture produced no image; `failure_reason` states why. `missing` means a private image no longer exists in the cloud.
          type: string
          enum:
            - pending
            - provisioning
            - uploading
            - available
            - deleted
            - failed
            - error
            - missing
        failure:
          description: Details of why the capture failed; non-empty only when `status` is `failed`
          type:
            - string
            - "null"
        size_bytes:
          description: Storage occupied by a private image, which is what it is billed for; 0 until its capture completes, and 0 for public images
          type: integer
          format: int64
        source_instance_id:
          description: The instance a private image was captured from. The image remains usable after that instance is released. Null for public images
          type:
            - string
            - "null"
          format: uuid
        created_at:
          type: string
          format: date-time
        order_id:
          type:
            - string
            - "null"
          format: uuid
        order_item_id:
          description: The Billing order item for this resource.
          type:
            - string
            - "null"
          format: uuid
        subscription_id:
          description: |-
            The Billing subscription associated with this resource. It may still be pending; its
            presence does not imply delivery or metering. Null when no subscription is associated.
          type:
            - string
            - "null"
          format: uuid
        release_subscription_ids:
          description: "The subscriptions a cancellation through Billing has to cover to release this private image: its own. Subscriptions that have ended are not listed, and the list is empty when no subscription pays for it, and for public images."
          type: array
          items:
            type: string
            format: uuid
        release_set:
          description: The subscriptions of `release_subscription_ids`, in the same order, each with the resource it pays for, so that each line of a cancellation can name what it releases.
          type: array
          items:
            $ref: "#/components/schemas/ReleaseSetItem"
        access_state:
          type:
            - string
            - "null"
          enum:
            - pending
            - enabled
            - suspended
            - reclaimed
            - null
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `provisioning_failed` means creation failed after the order was accepted, and the charge for this image is refunded.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - provisioning_failed
            - null
        operation:
          description: The operation in progress on this image, or null when none is.
          anyOf:
            - $ref: "#/components/schemas/ImageOperation"
            - type: "null"
          readOnly: true
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - region_id
        - visibility
        - name
        - os_family
        - os_version
        - architecture
        - login_username
        - min_disk_gb
        - min_ram_mb
        - supports_password_reset
        - status
        - failure
        - size_bytes
        - source_instance_id
        - created_at
        - order_id
        - order_item_id
        - subscription_id
        - release_subscription_ids
        - release_set
        - access_state
        - failure_reason
        - operation
        - generation
        - observed_at
      additionalProperties: false
    ImageListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImageResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    InstanceTypeResource:
      type: object
      properties:
        availability_zone_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        max_bandwidth_mbps:
          description: |-
            The most public bandwidth a machine of this type may be given, in Mbps. Asking for more
            when creating a machine, or raising a bound address past it, is refused.

            A ceiling on what can be bought, not a speed. How fast the machine's own interfaces run is
            `network_egress_kbps` / `network_ingress_kbps`.
          type: integer
          format: int64
        network_egress_kbps:
          description: |-
            Outbound ceiling of **each** network interface, in kbps. Null when this type is not
            rate-limited.

            Per interface rather than per machine: a machine with two interfaces has this ceiling on
            each of them, not shared between them. `max_ports` says how many it may have.
          type:
            - integer
            - "null"
          format: int64
        network_ingress_kbps:
          description: Inbound ceiling of each network interface, in kbps. Null when this type is not rate-limited
          type:
            - integer
            - "null"
          format: int64
        max_floating_ips:
          type: integer
          format: int64
        max_ports:
          type: integer
          format: int64
        name:
          type: string
        ram_mb:
          type: integer
          format: int64
