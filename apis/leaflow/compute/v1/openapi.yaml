    SnapshotQuota:
      description: |-
        Snapshot count capacity for the authenticated project and one region, projected from its
        effective quota purchase and Compute's actual holdings. This is not a Billing Allowance:
        creation occupies capacity and confirmed deletion releases it rather than consuming a grant.
        Pending purchases never increase effective capacity before commercial acceptance and activation.
      type: object
      properties:
        region_id:
          type: string
          format: uuid
        status:
          description: |-
            inactive has no purchase; pending is a first purchase whose order has not been accepted;
            provisioning is a first purchase being activated; active permits creation within available
            capacity; suspended refuses new creation; failed means the first purchase failed, as
            failure_reason states. A pending change keeps the current status and limit until it is applied.
          type: string
          enum:
            - inactive
            - pending
            - provisioning
            - active
            - suspended
            - failed
        limit:
          description: Effective maximum concurrent snapshot count. Zero until the first purchase is activated.
          type: integer
          format: int64
          minimum: 0
        used:
          description: Held and reserved snapshot slots, including pending creation and unconfirmed cleanup.
          type: integer
          format: int64
          minimum: 0
        available:
          description: max(limit - used, 0), or zero while creation is not permitted.
          type: integer
          format: int64
          minimum: 0
        order_id:
          description: The order establishing the currently associated quota purchase, including an initial pending purchase.
          type:
            - string
            - "null"
          format: uuid
        subscription_id:
          description: |-
            The quota purchase's Billing subscription, not an individual snapshot subscription.
            May still be pending on an initial purchase; an existing subscription remains associated
            until a replacement quota is activated. Null when no purchase has been recorded.
          type:
            - string
            - "null"
          format: uuid
        billing:
          description: The billing choice of the associated quota purchase, as given when it was bought. A change of an existing purchase has to give the same choice. Null when no purchase has been recorded.
          anyOf:
            - $ref: "#/components/schemas/BillingChoice"
            - type: "null"
        release_subscription_ids:
          description: The subscription a cancellation through Billing has to cover to release this snapshot quota. A subscription that has ended is not listed, and the list is empty when no subscription pays for the quota.
          type: array
          items:
            type: string
            format: uuid
        pending_limit:
          description: Target count awaiting checkout or activation; null when no purchase is pending.
          type:
            - integer
            - "null"
          format: int64
          minimum: 1
        pending_order_id:
          description: Order for the pending initial purchase or change; null when none is pending.
          type:
            - string
            - "null"
          format: uuid
        failure_reason:
          description: |-
            Why the first purchase failed; null unless status is failed. A failed change leaves the current
            limit in force and clears pending_limit; its order shows the outcome.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - provisioning_failed
            - null
        pricing:
          description: How snapshot quota in this region can be bought, per snapshot slot. Null when the project has no billing account.
          anyOf:
            - $ref: "#/components/schemas/Pricing"
            - type: "null"
          readOnly: true
      required:
        - region_id
        - status
        - limit
        - used
        - available
        - order_id
        - subscription_id
        - billing
        - release_subscription_ids
        - pending_limit
        - pending_order_id
        - failure_reason
        - pricing
      additionalProperties: false
    SetSnapshotQuotaRequestBody:
      type: object
      properties:
        limit:
          description: Desired total concurrent snapshot count for this project and region, not additional slots.
          type: integer
          format: int64
          minimum: 1
        billing:
          $ref: "#/components/schemas/BillingChoice"
        checkout:
          $ref: "#/components/schemas/CheckoutOptions"
        proration_date:
          description: The `proration_date` of this change's quote, so that the order is priced from the same instant. Defaults to the time of the request; it must be a whole second, not in the future and at most 10 minutes old, otherwise the request is refused with `BILLING_CHANGE_INVALID`.
          type: string
          format: date-time
      required:
        - limit
        - billing
      additionalProperties: false
    SetSnapshotQuotaResponseBody:
      type: object
      properties:
        snapshot_quota:
          $ref: "#/components/schemas/SnapshotQuota"
        order:
          $ref: "#/components/schemas/PlacedOrder"
      required:
        - snapshot_quota
        - order
      additionalProperties: false
    SnapshotResource:
      description: A snapshot, created within this project's purchased regional snapshot quota. It has no order, price or Billing subscription of its own.
      type: object
      properties:
        availability_zone_id:
          description: A disk restored from this snapshot must reside in this availability zone
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        disk_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        name:
          type: string
        region_id:
          type: string
          format: uuid
        size_gb:
          description: Capacity of the source disk when the snapshot was created. A disk restored from it cannot be smaller
          type: integer
          format: int64
        status:
          description: "`pending` once a quota slot is reserved, `provisioning` while the snapshot is taken, then `available`. `failed` means the snapshot was not created; its slot is released once no snapshot data remains. `missing` means the snapshot no longer exists in the cloud."
          type: string
          enum:
            - pending
            - provisioning
            - available
            - deleted
            - failed
            - error
            - missing
        operation:
          description: The operation in progress on this snapshot, or null when none is.
          anyOf:
            - $ref: "#/components/schemas/SnapshotOperation"
            - type: "null"
          readOnly: true
        generation:
          type: integer
          format: int64
          minimum: 1
        observed_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - disk_id
        - name
        - size_gb
        - status
        - availability_zone_id
        - region_id
        - created_at
        - operation
        - generation
        - observed_at
      additionalProperties: false
    SnapshotListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/SnapshotResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    CreateSnapshotRequestBody:
      description: |-
        Create one snapshot using existing project-and-region count quota. The region is taken from
        disk_id. Purchase or adjust quota separately; this request has no checkout or price selection.
      type: object
      properties:
        disk_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - disk_id
        - name
      additionalProperties: false
    RenameSecurityGroupRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - name
      additionalProperties: false
    RenameSnapshotRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - name
      additionalProperties: false
    Pricing:
      description: How a catalog item can be bought, calculated by Billing in the currency of the project's current billing account. These are list amounts before promotion codes, not a checkout guarantee; quote a purchase for its exact total.
      type: object
      properties:
        currency:
          type: string
        options:
          description: One entry per way the item can be bought. Empty when it cannot be bought in this currency.
          type: array
          items:
            $ref: "#/components/schemas/PricingOption"
      required:
        - currency
        - options
      additionalProperties: false
    PricingOption:
      description: One way to buy an item. Choose it by giving its mode, period and explicit prepaid termination_policy as billing.
      type: object
      properties:
        mode:
          type: string
          enum:
            - prepaid
            - postpaid
        period:
          description: The term of a prepaid option; null for postpaid.
          anyOf:
            - $ref: "#/components/schemas/BillingPeriod"
            - type: "null"
        quantity_unit:
          description: "What the amounts are for: one `item`, such as an instance or an address; one `gib` of size or capacity; one `mbps` of bandwidth; or one `snapshot` slot."
          type: string
          enum:
            - item
            - gib
            - mbps
            - snapshot
        amount:
          description: Prepaid only; null for postpaid. The amount for one period, per quantity unit.
          type:
            - string
            - "null"
        monthly_amount:
          description: Prepaid only; null for postpaid. `amount` spread over the months of the period.
          type:
            - string
            - "null"
        saving_percent:
          description: Prepaid only. How much lower `monthly_amount` is than that of the shortest prepaid period of the same item, as a decimal percentage. Null for that shortest period and for postpaid.
          type:
            - string
            - "null"
        unit_amount:
          description: Postpaid only; null for prepaid. The amount for one `unit` of time, per quantity unit.
          type:
            - string
            - "null"
        unit:
          description: Postpaid only; null for prepaid. The time unit of `unit_amount`.
          type:
            - string
            - "null"
          enum:
            - hour
            - null
        termination_policy:
          description: "What canceling does under this option: `immediate` ends the service at once, with any refund following the option's terms; `period_end` ends it at the end of the paid period. Null means no explicit policy was recorded; it must not be interpreted as immediate."
          type:
            - string
            - "null"
          enum:
            - immediate
            - period_end
            - null
      required:
        - mode
        - period
        - quantity_unit
        - amount
        - monthly_amount
        - saving_percent
        - unit_amount
        - unit
        - termination_policy
      additionalProperties: false
    BillingPeriod:
      type: object
      properties:
        unit:
          type: string
          enum:
            - month
            - year
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
      required:
        - unit
        - count
      additionalProperties: false
    BillingChoice:
      description: The commercial terms for one newly purchased component. Prepaid requires period and termination_policy; postpaid refuses both. Components in one instance order must use the same mode and period, while their termination policies may differ.
      type: object
      properties:
        mode:
          type: string
          enum:
            - prepaid
            - postpaid
        period:
          $ref: "#/components/schemas/BillingPeriod"
        termination_policy:
          $ref: "#/components/schemas/TerminationPolicy"
      required:
        - mode
      additionalProperties: false
    TerminationPolicy:
      description: Immediate ends service when cancellation takes effect, with refunds governed by the purchased terms. Period-end keeps service until the paid period ends.
      type: string
      enum:
        - immediate
        - period_end
    NewCompute:
      description: The compute capacity purchased for each instance in this order.
      type: object
      properties:
        instance_type_id:
          description: An instance type currently on sale.
          type: string
          format: uuid
          maxLength: 64
        billing:
          $ref: "#/components/schemas/BillingChoice"
      required:
        - instance_type_id
        - billing
      additionalProperties: false
    BootDisk:
      description: Create a boot disk from an image, or use a prepared disk already held by this project. Using an existing disk does not buy it again and always keeps it when the instance is released.
      oneOf:
        - $ref: "#/components/schemas/NewBootDisk"
        - $ref: "#/components/schemas/ExistingBootDisk"
      discriminator:
        propertyName: type
        mapping:
          image: "#/components/schemas/NewBootDisk"
          disk: "#/components/schemas/ExistingBootDisk"
    ExistingBootDisk:
      type: object
      properties:
        type:
          type: string
          enum:
            - disk
        disk_id:
          description: A prepared boot disk owned by this project, available and unattached in the same availability zone as the instance type. Only one instance may be created when used.
          type: string
          format: uuid
        login_username:
          description: The existing account used to log in to this disk's operating system.
          type: string
          minLength: 1
          maxLength: 32
      required:
        - type
        - disk_id
        - login_username
      additionalProperties: false
    BackupService:
      description: The backup service of a project in one region. Retained backup capacity beyond what active capacity packs cover is metered on it.
      type: object
      properties:
        region_id:
          type: string
          format: uuid
        status:
          description: "`inactive` has never been activated or its subscription has ended; `pending` awaits acceptance of its order; `provisioning` is being activated; `active` accepts new backups; `suspended` refuses new backups and keeps existing ones; `failed` means the activation failed, as `failure_reason` states."
          type: string
          enum:
            - inactive
            - pending
            - provisioning
            - active
            - suspended
            - failed
        failure_reason:
          description: Why the purchase failed; null unless `status` is `failed`. `provisioning_failed` means it failed after the order was accepted, and its charge is refunded.
          type:
            - string
            - "null"
          enum:
            - order_declined
            - order_canceled
            - order_expired
            - provisioning_failed
            - null
        order_id:
          description: The order that activated the service; null before an activation is requested.
          type:
            - string
            - "null"
          format: uuid
        subscription_id:
          description: The Billing subscription that backup usage is billed under; null before an activation is requested.
          type:
            - string
            - "null"
          format: uuid
        release_subscription_ids:
          description: The subscription a cancellation through Billing has to cover to release this backup service. A subscription that has ended is not listed, and the list is empty when no subscription pays for the service.
          type: array
          items:
            type: string
            format: uuid
        retained_capacity_gib:
          description: The total `capacity_gib` of the backups retained in this region.
          type: integer
          format: int64
          minimum: 0
        prepaid_capacity_gib:
          description: The total `capacity_gib` of the active capacity packs in this region; this much retained capacity is covered each hour.
          type: integer
          format: int64
          minimum: 0
        pricing:
          description: The postpaid usage price of backups in this region. Null when the project has no billing account.
          anyOf:
            - $ref: "#/components/schemas/Pricing"
            - type: "null"
          readOnly: true
        capacity_pack_pricing:
          description: The prepaid options of capacity packs in this region, per GiB. Null when the project has no billing account.
          anyOf:
            - $ref: "#/components/schemas/Pricing"
            - type: "null"
          readOnly: true
      required:
        - region_id
        - status
        - failure_reason
        - order_id
        - subscription_id
        - release_subscription_ids
        - retained_capacity_gib
        - prepaid_capacity_gib
        - pricing
        - capacity_pack_pricing
      additionalProperties: false
    CreateBackupServiceRequestBody:
      type: object
