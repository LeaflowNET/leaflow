    LaunchInstanceRequestBody:
      type: object
      properties:
        floating_ip_id:
          description: 'Bind a floating IP you already hold, instead of allocating a new one. It must be idle and
            in

            the same region.


            Mutually exclusive with `bandwidth_mbps`: an address you already hold has its own bandwidth

            ceiling, set when it was allocated, and changing it is a separate operation.


            Like `bandwidth_mbps`, this happens **inside the creation**: if binding fails, no instance is

            created. Binding afterwards is still possible from the instance page, but then it is two

            operations and a failure in between leaves an instance you cannot reach.


            Only one instance can be created when it is used — one address binds to one interface.'
          type: string
          format: uuid
        count:
          description: Number of instances to create; 1 when omitted. Names are numbered automatically for several
          type: integer
          format: int64
          minimum: 1
          maximum: 20
          default: 1
        generate_password:
          description: Have the platform generate a random password, returned only in this response
          type: boolean
        boot_disk_id:
          description: Boot a disk you already have instead of installing an image. The disk must be available,
            unattached, and in the same availability zone as the instance type. Exactly one of this, `image_id`
            and `private_image_id`
          type: string
          format: uuid
        image_id:
          description: A platform image, and it must be one currently on sale. Exactly one of this, `private_image_id`
            and `boot_disk_id`
          type: string
          format: uuid
          maxLength: 64
        instance_type_id:
          description: An instance type currently on sale. A withdrawn one is rejected even though its identifier
            still resolves
          type: string
          format: uuid
          maxLength: 64
        login_username:
          description: The account the disk lets you log in as. Required with `boot_disk_id`, and rejected without
            it since an image states its own
          type: string
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 128
        password:
          description: The password to set, on the login account and on root. Only the SSH public keys of the project
            are used when omitted
          type: string
          maxLength: 128
        port_id:
          description: Use an existing network interface, which may already have a floating IP bound. Exactly one
            of this and `subnet_id`; only one instance can be created when it is used
          type: string
          format: uuid
        private_image_id:
          description: A private image. Exactly one of this, `image_id` and `boot_disk_id`
          type: string
          format: uuid
        security_group_ids:
          description: Required when a primary network interface is created, at least one; the default security
            group is not applied automatically. Ignored together with `port_id`, as the security groups of that
            interface were fixed when it was created
          type:
          - array
          - 'null'
          minItems: 1
          items:
            type: string
            format: uuid
        subnet_id:
          description: Create the primary network interface in this subnet. Exactly one of this and `port_id`
          type: string
          format: uuid
        order:
          $ref: '#/components/schemas/OrderOptions'
        price:
          $ref: '#/components/schemas/CatalogReference'
        boot_disk:
          $ref: '#/components/schemas/NewBootDisk'
        floating_ip:
          $ref: '#/components/schemas/NewFloatingIP'
      required:
      - name
      - instance_type_id
      - order
      - price
      additionalProperties: false
