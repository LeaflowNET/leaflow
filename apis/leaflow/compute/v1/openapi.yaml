      operationId: delete-subnet
      tags:
        - Subnet
      parameters:
        - name: privateNetworkId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: subnetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/security-groups:
    get:
      summary: List security groups
      operationId: list-security-groups
      tags:
        - SecurityGroup
      parameters:
        - name: region_code
          in: query
          explode: false
          schema:
            type: string
            maxLength: 32
        - name: private_network_id
          in: query
          description: Return only the security groups of this private network
          explode: false
          schema:
            description: Return only the security groups of this private network
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGroupListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a security group
      description: A new security group carries one rule, permitting ICMP fragmentation-needed messages (type 3, code 4). Without it path MTU discovery fails, which presents as connections that establish and then stall on large packets.
      operationId: create-security-group
      tags:
        - SecurityGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityGroupRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGroupResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/security-groups/{securityGroupId}:
    get:
      summary: Retrieve a security group
      operationId: get-security-group
      tags:
        - SecurityGroup
      parameters:
        - name: securityGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGroupResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename a security group
      description: Changes the name only. Use the rule endpoints to change rules.
      operationId: rename-security-group
      tags:
        - SecurityGroup
      parameters:
        - name: securityGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSecurityGroupRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityGroupResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a security group
      description: The default security group cannot be deleted, as it is released with the private network. A security group still referenced by a network interface cannot be deleted either.
      operationId: delete-security-group
      tags:
        - SecurityGroup
      parameters:
        - name: securityGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/security-groups/{securityGroupId}/rules:
    get:
      summary: List security group rules
      operationId: list-security-group-rules
      tags:
        - SecurityGroup
      parameters:
        - name: securityGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityRuleListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a security group rule
      description: Adding an identical rule twice is rejected. For that comparison `0.0.0.0/0`, `::/0` and an omitted value are treated as equivalent.
      operationId: create-security-group-rule
      tags:
        - SecurityGroup
      parameters:
        - name: securityGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityRuleRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityRuleResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/security-groups/{securityGroupId}/rules/{ruleId}:
    delete:
      summary: Delete a security group rule
      operationId: delete-security-group-rule
      tags:
        - SecurityGroup
      parameters:
        - name: securityGroupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/snapshots:
    get:
      summary: List snapshots
      operationId: list-snapshots
      tags:
        - Snapshot
      parameters:
        - name: disk_id
          in: query
          description: Return only the snapshots of this disk
          explode: false
          schema:
            description: Return only the snapshots of this disk
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a snapshot
      description: |-
        Disks attached to a running instance can be snapshotted. A snapshot records the state of the block device at a point in time and may be inconsistent at the file-system level, so run `sync` inside the instance first where the data matters.

        **A snapshot of a system disk cannot be used to revert that system disk**: reverting requires the disk to be detached, and a system disk cannot be detached. It can be used to create a new data disk. To preserve and restore an entire system, use a private image; for a copy that crosses availability zones and survives deletion of the disk, use a backup.
      operationId: create-snapshot
      tags:
        - Snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/snapshots/{snapshotId}:
    get:
      summary: Retrieve a snapshot
      operationId: get-snapshot
      tags:
        - Snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Rename a snapshot
      operationId: rename-snapshot
      tags:
        - Snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSnapshotRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a snapshot
      operationId: delete-snapshot
      tags:
        - Snapshot
      parameters:
        - name: snapshotId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    BackupResource:
      type: object
      properties:
        availability_zone:
          description: Availability zone of the source disk. A restore may target another zone in the same region
          type: string
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        region_code:
          type: string
        size_gb:
          description: Capacity of the source disk when the backup was created. A restored disk cannot be smaller than this
          type: integer
          format: int64
        source_disk_id:
          description: The disk this backup was taken from. The backup remains usable after that disk is deleted
          type: string
          format: uuid
        status:
          type: string
          enum:
            - provisioning
            - available
            - restoring
            - deleting
            - error
      required:
        - id
        - source_disk_id
        - name
        - size_gb
        - status
        - region_code
        - availability_zone
        - created_at
      additionalProperties: false
    BackupListResponseBody:
      type: object
      properties:
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/BackupResource"
      required:
        - items
      additionalProperties: false
    CreateBackupRequestBody:
      type: object
      properties:
        disk_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - disk_id
        - name
      additionalProperties: false
    RenameBackupRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - name
      additionalProperties: false
    RestoreBackupRequestBody:
      type: object
      properties:
        disk_type_id:
          description: May differ from the availability zone of the source disk, but must be in the same region. It has to be on sale — restoring creates a new disk, so a withdrawn type is rejected here as well
          type: string
          format: uuid
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 128
        size_gb:
          description: Matches the size of the backup when omitted. When given, it must not be smaller than the backup
          type: integer
          format: int64
          minimum: 0
      required:
        - disk_type_id
        - name
      additionalProperties: false
    DiskResource:
      type: object
      properties:
        attached_instance_id:
          type:
            - string
            - "null"
        availability_zone:
          description: Availability zone the disk actually resides in. An instance must be in the same zone to attach it
          type: string
        created_at:
          type: string
          format: date-time
        device:
          description: Device name assigned by the system, as seen inside the instance
          type:
            - string
            - "null"
        disk_type_id:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        is_system:
          description: A system disk is released with its instance and can be neither detached nor deleted individually
          type: boolean
        name:
          type: string
        region_code:
          type: string
        size_gb:
          type: integer
          format: int64
        iops:
          description: |-
            IOPS this disk is allowed. Null when its type is not rate-limited.

            Computed from the disk's own capacity, so it grows when the disk is grown — but see the
            note on the resize endpoint: growing a disk that is attached is refused, precisely because
            the new figure would not take effect until it was attached again.
          type:
            - integer
            - "null"
          format: int64
        throughput_bytes_per_sec:
          description: Throughput this disk is allowed, in bytes per second. Null when its type is not rate-limited
          type:
            - integer
            - "null"
          format: int64
        status:
          type: string
          enum:
            - provisioning
            - available
            - attaching
            - in_use
            - detaching
            - resizing
            - reverting
            - restoring
            - releasing
            - deleting
            - error
        charge_type:
          description: |-
            How this disk is paid for. `postpaid` is billed by the hour for as long as it exists;
            `prepaid` was bought outright for a term.

            **Not the term.** How long it was bought for belongs to the order, not to the disk:
            renewing can change it, and a machine bought for a year and then renewed for a month is
            still a prepaid machine. Ask billing for the term and the expiry — they live there, and
            they are the only two values a renewal moves.
          type: string
          enum:
            - postpaid
            - prepaid
      required:
