          type: integer
          format: int64
          minimum: 1
          maximum: 1000
      required:
        - price
        - bandwidth_price
        - bandwidth_mbps
      additionalProperties: false
      description: Fabric creates an address and bandwidth subscription in the same purchase. Mutually exclusive
        with floating_ip_id. Fabric owns the address and its retention policy.
