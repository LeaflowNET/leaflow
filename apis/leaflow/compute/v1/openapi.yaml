    OperationLogResource:
      type: object
      properties:
        action:
          description: Name of the operation; matches the operation id of the endpoint
          type: string
        actor:
          description: The user who initiated the operation. Empty when the platform performed it
          type:
            - string
            - 'null'
        actor_name:
          description: 'The name this user went by at the time of the operation, recorded alongside the operation
            itself. It is not refreshed afterwards: the record states who acted then, and a name read today is a
            statement about a different moment.


            Null on entries recorded before this field existed, and on entries performed by the platform. An empty
            string means the account had no name recorded.'
          type:
            - string
            - 'null'
        by_platform:
          description: True when the operation was performed by the platform
          type: boolean
        created_at:
          type: string
          format: date-time
        failure:
          description: Brief reason for the failure
          type:
            - string
            - 'null'
        id:
          type: string
          format: uuid
        payload:
          description: Path and query parameters of the request. Fields such as passwords are redacted
          type: object
          additionalProperties: {}
        region_id:
          type:
            - string
            - 'null'
          format: uuid
        subject_id:
          description: 'Empty for create operations: the id of the new resource is in the response, not in the request
            path'
          type: string
        subject_type:
          type: string
        succeeded:
          type: boolean
      required:
        - id
        - action
        - by_platform
        - actor
        - actor_name
        - subject_type
        - subject_id
        - region_id
        - payload
        - succeeded
        - failure
        - created_at
      additionalProperties: false
