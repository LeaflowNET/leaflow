      operationId: delete-private-network
      tags:
        - PrivateNetwork
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve a private network
      operationId: get-private-network
      tags:
        - PrivateNetwork
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateNetworkResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Rename a private network
      description: Changes the display name only. The CIDR, the routes and the internet gateway are immutable.
      operationId: rename-private-network
      tags:
        - PrivateNetwork
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenamePrivateNetworkRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateNetworkResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}/ipv6:
    delete:
      summary: Disable IPv6 on a private network
      description: A released prefix is not re-allocated immediately.
      operationId: disable-private-network-ipv6
      tags:
        - PrivateNetwork
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve the IPv6 configuration of a private network
      operationId: get-private-network-ipv6
      tags:
        - PrivateNetwork
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPv6ResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Enable IPv6 on a private network
      description: |-
        Allocates an IPv6 prefix to the private network. Addresses are assigned to instances by the network itself, can be neither requested nor released individually, and consume no public IPv4 address.

        If the private network is not yet connected to the internet, connectivity is established as part of this call.
      operationId: enable-private-network-ipv6
      tags:
        - PrivateNetwork
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IPv6ResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}/routes:
    get:
      summary: List static routes
      operationId: list-routes
      tags:
        - Route
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a static route
      description: 'Three forms that would sever connectivity are rejected: a destination of `0.0.0.0/0`, which overrides the default route and takes every floating IP offline immediately; a destination equal to the CIDR of a subnet, which overrides its directly connected route; and a next hop equal to the gateway of a subnet, which points back at the router itself.'
      operationId: create-route
      tags:
        - Route
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRouteRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}/routes/{routeId}:
    delete:
      summary: Delete a static route
      operationId: delete-route
      tags:
        - Route
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: routeId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}/subnets:
    get:
      summary: List subnets
      description: IPv6 subnets are included, with `ip_version` 6. They are created when IPv6 is enabled and cannot be deleted individually.
      operationId: list-subnets
      tags:
        - Subnet
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a subnet
      operationId: create-subnet
      tags:
        - Subnet
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubnetRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}/subnets/next-free-cidr:
    get:
      summary: Suggest the next free CIDR
      description: The returned value is a suggestion and is validated again when the subnet is created. It exists to avoid errors when computing the next free CIDR by hand.
      operationId: suggest-subnet-cidr
      tags:
        - Subnet
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: prefix_length
          schema:
            default: 24
            format: int64
            maximum: 30
            minimum: 16
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NextFreeCidrResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/private-networks/{privateNetworkId}/subnets/{subnetId}:
    delete:
      summary: Delete a subnet
      description: Deletion is rejected while network interfaces remain in the subnet, or while a static route has a next hop inside its CIDR.
      operationId: delete-subnet
      tags:
        - Subnet
      parameters:
        - in: path
          name: privateNetworkId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: subnetId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/security-groups:
    get:
      summary: List security groups
      operationId: list-security-groups
      tags:
        - SecurityGroup
      parameters:
        - explode: false
          in: query
          name: region_code
          schema:
            maxLength: 32
            type: string
        - description: Return only the security groups of this private network
          explode: false
          in: query
          name: private_network_id
          schema:
            description: Return only the security groups of this private network
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a security group
      description: A new security group carries one rule, permitting ICMP fragmentation-needed messages (type 3, code 4). Without it path MTU discovery fails, which presents as connections that establish and then stall on large packets.
      operationId: create-security-group
      tags:
        - SecurityGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityGroupRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/security-groups/{securityGroupId}:
    delete:
      summary: Delete a security group
      description: The default security group cannot be deleted, as it is released with the private network. A security group still referenced by a network interface cannot be deleted either.
      operationId: delete-security-group
      tags:
        - SecurityGroup
      parameters:
        - in: path
          name: securityGroupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve a security group
      operationId: get-security-group
      tags:
        - SecurityGroup
      parameters:
        - in: path
          name: securityGroupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Rename a security group
      description: Changes the name only. Use the rule endpoints to change rules.
      operationId: rename-security-group
      tags:
        - SecurityGroup
      parameters:
        - in: path
          name: securityGroupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSecurityGroupRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityGroupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/security-groups/{securityGroupId}/rules:
    get:
      summary: List security group rules
      operationId: list-security-group-rules
      tags:
        - SecurityGroup
      parameters:
        - in: path
          name: securityGroupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityRuleListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a security group rule
      description: Adding an identical rule twice is rejected. For that comparison `0.0.0.0/0`, `::/0` and an omitted value are treated as equivalent.
      operationId: create-security-group-rule
      tags:
        - SecurityGroup
      parameters:
        - in: path
          name: securityGroupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSecurityRuleRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityRuleResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/security-groups/{securityGroupId}/rules/{ruleId}:
    delete:
      summary: Delete a security group rule
      operationId: delete-security-group-rule
      tags:
        - SecurityGroup
      parameters:
        - in: path
          name: securityGroupId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: ruleId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/snapshots:
    get:
      summary: List snapshots
      operationId: list-snapshots
      tags:
        - Snapshot
      parameters:
        - description: Return only the snapshots of this disk
          explode: false
          in: query
          name: disk_id
          schema:
            description: Return only the snapshots of this disk
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a snapshot
      description: |-
        Disks attached to a running instance can be snapshotted. A snapshot records the state of the block device at a point in time and may be inconsistent at the file-system level, so run `sync` inside the instance first where the data matters.

        **A snapshot of a system disk cannot be used to revert that system disk**: reverting requires the disk to be detached, and a system disk cannot be detached. It can be used to create a new data disk. To preserve and restore an entire system, use a private image; for a copy that crosses availability zones and survives deletion of the disk, use a backup.
      operationId: create-snapshot
      tags:
        - Snapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/snapshots/{snapshotId}:
    delete:
      summary: Delete a snapshot
      operationId: delete-snapshot
      tags:
        - Snapshot
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve a snapshot
      operationId: get-snapshot
      tags:
        - Snapshot
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Rename a snapshot
      operationId: rename-snapshot
      tags:
        - Snapshot
      parameters:
        - in: path
          name: snapshotId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameSnapshotRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Project token. Sign in at auth.leaflow.net to obtain an account token, then exchange it with IAM for a project token (POST /account/v1/projects/{projectId}/token). A project token identifies both the current user and the current project.
      scheme: bearer
      type: http
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    BackupResource:
      additionalProperties: false
      properties:
        availability_zone:
          description: Availability zone of the source disk. A restore may target another zone in the same region
          type: string
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        region_code:
          type: string
        size_gb:
          description: Capacity of the source disk when the backup was created. A restored disk cannot be smaller than this
          format: int64
          type: integer
        source_disk_id:
          description: The disk this backup was taken from. The backup remains usable after that disk is deleted
          format: uuid
          type: string
        status:
          enum:
            - provisioning
            - available
            - restoring
            - deleting
            - error
          type: string
      required:
        - id
        - source_disk_id
        - name
        - size_gb
        - status
        - region_code
        - availability_zone
        - created_at
      type: object
    BackupListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/BackupResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    CreateBackupRequestBody:
      additionalProperties: false
      properties:
        disk_id:
          format: uuid
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - disk_id
        - name
      type: object
    RenameBackupRequestBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    RestoreBackupRequestBody:
      additionalProperties: false
      properties:
        disk_type_id:
          description: May differ from the availability zone of the source disk, but must be in the same region
          format: uuid
          maxLength: 64
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
        size_gb:
          description: Matches the size of the backup when omitted. When given, it must not be smaller than the backup
          format: int64
          minimum: 0
          type: integer
      required:
        - disk_type_id
        - name
      type: object
    DiskResource:
      additionalProperties: false
      properties:
        attached_instance_id:
          type:
            - string
            - 'null'
        availability_zone:
          description: Availability zone the disk actually resides in. An instance must be in the same zone to attach it
          type: string
        created_at:
          format: date-time
          type: string
        device:
          description: Device name assigned by the system, as seen inside the instance
          type:
            - string
            - 'null'
        disk_type_id:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        is_system:
          description: A system disk is released with its instance and can be neither detached nor deleted individually
          type: boolean
        name:
          type: string
        region_code:
          type: string
        size_gb:
          format: int64
          type: integer
        status:
          enum:
            - provisioning
            - available
            - attaching
            - in_use
            - detaching
            - resizing
            - reverting
            - restoring
            - releasing
            - deleting
            - error
          type: string
      required:
        - id
        - name
        - region_code
        - availability_zone
        - disk_type_id
        - size_gb
        - status
        - is_system
        - attached_instance_id
        - device
        - created_at
      type: object
    DiskTypeResource:
      additionalProperties: false
      properties:
        availability_zone_code:
          type: string
        id:
          format: uuid
          type: string
        iops_display:
          type: string
        max_size_gb:
          format: int64
          type: integer
        media:
          enum:
            - ssd
            - hdd
            - nvme
          type: string
        min_size_gb:
          format: int64
          type: integer
        name:
          type: string
        region_code:
          type: string
        step_gb:
          format: int64
          type: integer
        throughput_display:
          type: string
      required:
        - id
        - name
        - media
        - region_code
        - availability_zone_code
        - min_size_gb
        - max_size_gb
        - step_gb
        - iops_display
        - throughput_display
      type: object
    DiskTypeListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/DiskTypeResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    ImageResource:
      additionalProperties: false
      properties:
        architecture:
          type: string
        id:
          format: uuid
          type: string
        min_disk_gb:
          format: int64
          type: integer
        min_ram_mb:
          format: int64
          type: integer
        name:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        region_code:
          type: string
        supports_password_reset:
          description: False means a new password can only be set by rebuilding an instance created from this image
          type: boolean
      required:
        - id
        - name
        - os_family
        - os_version
        - architecture
        - region_code
        - min_disk_gb
        - min_ram_mb
        - supports_password_reset
      type: object
    ImageListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ImageResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    InstanceTypeResource:
      additionalProperties: false
      properties:
        availability_zone_code:
          description: Availability zone of this instance type. A disk must be in the same zone to be attached
          type: string
        id:
          format: uuid
          type: string
        max_bandwidth_mbps:
          format: int64
          type: integer
        max_floating_ips:
          format: int64
          type: integer
        max_ports:
          format: int64
          type: integer
        name:
          type: string
        ram_mb:
          format: int64
          type: integer
        region_code:
          type: string
        vcpus:
          format: int64
          type: integer
      required:
        - id
        - name
        - vcpus
        - ram_mb
        - region_code
        - availability_zone_code
        - max_ports
        - max_floating_ips
        - max_bandwidth_mbps
      type: object
    InstanceTypeListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/InstanceTypeResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    RegionResource:
      additionalProperties: false
      properties:
        code:
          type: string
        country_code:
          type: string
        name:
          type: string
      required:
        - code
        - name
        - country_code
      type: object
    RegionListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/RegionResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    ZoneResource:
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
      required:
        - code
        - name
      type: object
    ZoneListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/ZoneResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    DiskListResponseBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/DiskResource'
          type:
            - array
            - 'null'
      required:
        - items
      type: object
    CreateDiskRequestBody:
      additionalProperties: false
      properties:
        disk_type_id:
          format: uuid
          maxLength: 64
          type: string
        name:
          maxLength: 128
          minLength: 1
          type: string
        size_gb:
          format: int64
          minimum: 1
          type: integer
        snapshot_id:
          description: Restore from this snapshot. When given, the capacity need only be no smaller than the snapshot
          format: uuid
          type: string
      required:
        - disk_type_id
        - name
        - size_gb
      type: object
    RenameDiskRequestBody:
      additionalProperties: false
      properties:
        name:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - name
      type: object
    ResizeDiskRequestBody:
      additionalProperties: false
      properties:
        size_gb:
          description: Must be larger than the current capacity
          format: int64
          minimum: 1
          type: integer
      required:
        - size_gb
      type: object
    RevertDiskRequestBody:
