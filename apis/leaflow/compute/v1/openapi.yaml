openapi: 3.1.0
info:
  description: |-
    Leaflow Compute user API for managing instances, disks, snapshots, backups, private images, private networks, subnets, routes, security groups, network interfaces and floating IPs.

    ## Authentication

    Every request must carry `Authorization: Bearer <project token>`. Sign in at auth.leaflow.net to obtain an account token, then exchange it with IAM for a project token (`POST /api/v1/projects/{projectId}/token`). A project token identifies both the current user and the current project.

    **Neither the path nor the headers carry a `project_id`**: the current project is determined by the token.

    Authentication is performed at the gateway and rejected requests never reach these endpoints. Handle the error codes as follows: `TOKEN_MISSING` — no token was supplied; `TOKEN_EXPIRED` — the token has expired, exchange the account token for a new one without signing in again; `TOKEN_INVALID` — the token failed verification; `NOT_A_MEMBER` — the account is not a member of the project; `USER_SUSPENDED` / `USER_BANNED` — the account itself is barred from operating.

    ## Conventions

    - **Operations are asynchronous.** Creating an instance, creating a disk and resizing all return before the work completes, leaving the resource in an intermediate state such as `provisioning`. Poll the GET endpoint to observe the outcome. Retrieving a single resource synchronises its current state.
    - **Availability zones.** A disk and an instance must reside in the same availability zone to be attached. Instance types and disk types are each bound to one availability zone, so choosing a type determines the zone.
    - **IPv6 is not sold separately.** Once enabled on a private network, IPv6 addresses are assigned to the instances in that network automatically; they can be neither requested nor released individually.
    - **Floating IPs have a cooldown period.** A released address is neither available for re-allocation nor handed to another user for some time, so that DNS records and allow-lists still pointing at it do not break immediately.
    - **Passwords are returned once.** A password generated by the platform during creation or rebuild appears only in that response. Store it immediately.
  title: Leaflow Compute User API
  version: 1.0.0
servers:
  - url: https://compute.leaflow.cloud
    description: Servers, volumes, images, networks and floating IPs
security:
  - bearerAuth: []
paths:
  /api/v1/backups:
    get:
      summary: List backups
      operationId: list-backups
      tags:
        - Backup
      parameters:
        - description: Return only the backups of this disk
          explode: false
          in: query
          name: disk_id
          schema:
            description: Return only the backups of this disk
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a backup
      description: |-
        A backup is a complete copy of a disk held in separate storage: **it remains restorable after the source disk is deleted, and can be restored to another availability zone in the same region.** A snapshot offers neither capability, as it resides in the same storage as the source disk and prevents that disk from being deleted while it exists.

        Disks attached to a running instance, including system disks, can be backed up.

        The duration depends on the amount of data. The backup is not complete when this endpoint returns; poll the retrieve endpoint.
      operationId: create-backup
      tags:
        - Backup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBackupRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/backups/{backupId}:
    delete:
      summary: Delete a backup
      description: 'Independent of the source disk: deletion succeeds whether or not that disk still exists.'
      operationId: delete-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve a backup
      description: Queries the current state of the backup, which makes it slower but more accurate than the list endpoint. Use it to poll creation progress.
      operationId: get-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Rename a backup
      operationId: rename-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameBackupRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/backups/{backupId}/restore:
    post:
      summary: Restore from a backup
      description: |-
        Restores onto a **newly created** disk. The source disk is unaffected and need not still exist.

        The target disk type may belong to another availability zone of the same region, and its capacity must not be smaller than the backup. The disk cannot be attached until the restore completes; poll the disk retrieve endpoint.
      operationId: restore-backup
      tags:
        - Backup
      parameters:
        - in: path
          name: backupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreBackupRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disk-types:
    get:
      summary: List disk types on sale
      operationId: list-disk-types
      tags:
        - Catalog
      parameters:
        - explode: false
          in: query
          name: region_code
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskTypeListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/images:
    get:
      summary: List images on sale
      description: An image whose `min_ram_mb` exceeds the memory of the selected instance type cannot boot. Filter the options accordingly.
      operationId: list-images
      tags:
        - Catalog
      parameters:
        - explode: false
          in: query
          name: region_code
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instance-types:
    get:
      summary: List instance types on sale
      operationId: list-instance-types
      tags:
        - Catalog
      parameters:
        - explode: false
          in: query
          name: region_code
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceTypeListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/regions:
    get:
      summary: List available regions
      operationId: list-regions
      tags:
        - Catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/regions/{regionCode}/availability-zones:
    get:
      summary: List the availability zones of a region
      description: A disk and an instance must reside in the same availability zone to be attached. Confirm the zone before creating either.
      operationId: list-availability-zones
      tags:
        - Catalog
      parameters:
        - in: path
          name: regionCode
          required: true
          schema:
            maxLength: 32
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks:
    get:
      summary: List disks
      description: When both `region_code` and `availability_zone` are supplied, only disks attachable to an instance at that location are returned.
      operationId: list-disks
      tags:
        - Disk
      parameters:
        - explode: false
          in: query
          name: region_code
          schema:
            maxLength: 32
            type: string
        - description: Supplied together with `region_code` to filter attachable disks
          explode: false
          in: query
          name: availability_zone
          schema:
            description: Supplied together with `region_code` to filter attachable disks
            maxLength: 64
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a disk
      description: The disk is created in the availability zone of the selected disk type, and an instance must reside in the same zone to attach it. Choosing the disk type therefore determines the zone.
      operationId: create-disk
      tags:
        - Disk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDiskRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks/{diskId}:
    delete:
      summary: Delete a disk
      description: Deletion is rejected while the disk is attached, or while snapshots created from it still exist.
      operationId: delete-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve a disk
      description: Queries the current state of the disk, which makes it slower but more accurate than the list endpoint.
      operationId: get-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Rename a disk
      description: Changes the name only. Use the resize endpoint for capacity; type and availability zone are immutable.
      operationId: rename-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks/{diskId}/resize:
    post:
      summary: Resize a disk
      description: Capacity can only be increased; shrinking is not supported. Extend the file system inside the instance once the resize completes.
      operationId: resize-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/disks/{diskId}/revert:
    post:
      summary: Revert to a snapshot
      description: |-
        Restores the contents of the disk to the moment the snapshot was taken. **All data written after that moment is lost and cannot be recovered.**

        Three restrictions apply: only the most recent snapshot of the disk can be reverted to; the disk must be detached from its instance first; and a disk resized since the snapshot was taken cannot be reverted. To return to an earlier point in time, or to keep the existing disk, create a new disk from the snapshot instead.

        The revert is not complete when this endpoint returns; poll the retrieve endpoint.
      operationId: revert-disk
      tags:
        - Disk
      parameters:
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevertDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips:
    get:
      summary: List floating IPs
      operationId: list-floating-ips
      tags:
        - FloatingIP
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Allocate a floating IP
      description: |-
        If the private network is not yet connected to the internet, connectivity is established as part of this call.

        IPv6 is not requested through this endpoint. IPv6 addresses are assigned to instances by the private network; enable IPv6 on that network instead.
      operationId: allocate-floating-ip
      tags:
        - FloatingIP
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateFloatingIPRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips/{floatingIpId}:
    delete:
      summary: Release a floating IP
      description: A released address enters a cooldown period before it is allocated again, so that DNS records and allow-lists still pointing at it do not break immediately. **The same address therefore cannot be re-allocated** for some time after release. Proceed with care.
      operationId: release-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve a floating IP
      operationId: get-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips/{floatingIpId}/bandwidth:
    put:
      summary: Set the bandwidth limit
      description: Limits both directions at once. Limiting egress alone does not prevent ingress traffic from saturating the uplink.
      operationId: set-floating-ip-bandwidth
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBandwidthRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/floating-ips/{floatingIpId}/binding:
    delete:
      summary: Unbind a floating IP
      description: The address remains held by the project and simply no longer points at any network interface.
      operationId: unbind-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Bind a floating IP to a network interface
      operationId: bind-floating-ip
      tags:
        - FloatingIP
      parameters:
        - in: path
          name: floatingIpId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindFloatingIPRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FloatingIPResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances:
    get:
      summary: List instances
      operationId: list-instances
      tags:
        - Instance
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create instances
      description: |-
        **A password must be set in the request.** The request is rejected otherwise, since the resulting instance would be unreachable. The platform can generate one, in which case it is returned only in this response.

        `count` creates several instances at once, 20 at most. Names are numbered `-1`, `-2` automatically and all instances share one password. **`instances` in the response is always an array**, including for a single instance.

        Instances are created one by one in order. If the sequence stops part way through, because of a quota limit for example, **the instances already created are kept** and `failure` states why it stopped. A failure on the first instance is treated as a failure of the whole request and no instance is created.

        Exactly one image source must be given: `image_id` for a platform image, `private_image_id` for a private image. Supplying both or neither is rejected.

        Instances are created in the availability zone of the instance type. Disks to be attached later must reside in the same zone.

        Creation is not complete when this endpoint returns and `status` is `provisioning`. Poll GET to observe the outcome.
      operationId: launch-instance
      tags:
        - Instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchInstanceRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchInstanceResponseBody'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}:
    delete:
      summary: Release an instance
      description: |-
        The system disk is deleted with the instance, and **snapshots created from the system disk are deleted with it**. Data disks are detached and kept, and their snapshots and backups are unaffected. The primary network interface is released with the instance.

        An instance being captured as a private image cannot be released. Wait for the capture to finish, or delete that image first.
      operationId: delete-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Retrieve an instance
      description: Queries the current state of the instance, which makes it slower but more accurate than the list endpoint. Use it to poll creation progress.
      operationId: get-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Rename an instance
      description: Changes the display name only. The hostname inside the instance is unchanged; it equals the instance id.
      operationId: rename-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/commands:
    post:
      summary: Run a command on an instance
      description: |-
        Runs one command over SSH and returns what it wrote. **This is not a shell.** There is no terminal, no standard input and no way to answer a prompt: a command that waits for input produces nothing and is killed at the timeout. Chain steps with `&&`, or write a script and run that.

        **A command that fails is still a 200.** Its failure is its own result, not this endpoint's: read `exit_code` for what it exited with and `stderr` for what it said, and decide from those. A `grep` that matches nothing exits 1 and is a perfectly successful call.

        The status therefore answers a different question — did the command run at all. A non-2xx means it did not, and nothing about the instance was changed by this request: it was suspended, not running or had no floating IP; or it refused the platform key; or the connection could not be opened. Retrying is meaningful in those cases and is not for a non-zero `exit_code`.

        Three conditions must hold; the instance is unreachable otherwise:

        - it is `running`
        - a floating IP is bound to it, since this endpoint connects over the public internet
        - its security group permits inbound TCP 22

        Authentication uses the key the platform attaches to every instance at creation, so nothing has to be set up first. The instance must have applied that key at first boot, which images without a full cloud-init do not do.

        **Do not pass secrets in the command.** Read them from a file on the instance instead: neither the command nor its output is a confidential channel.

        Each stream is capped at 1 MiB. Beyond that the rest is discarded and `truncated` is true.
      operationId: run-instance-command
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCommandRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResultResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/console:
    post:
      summary: Open a remote console
      description: |-
        Operates the instance directly from a browser and does not require the instance to be reachable over the network, which makes it usable when a network misconfiguration prevents login.

        The returned address is single-use and expires within minutes. **Do not cache it**; request a new one before each use.
      operationId: open-instance-console
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/console-output:
    get:
      summary: Read the console output
      description: |-
        The raw text produced by the instance during boot and by the kernel. Consult it first when login fails or the remote console shows no output: it reveals where boot stopped, whether the system disk was mounted, and whether initialisation reported errors.

        Instances in an error state, and instances suspended by the platform, can be read as well.
      operationId: get-instance-console-output
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - description: Number of trailing lines to return; 0 returns the entire output
          explode: false
          in: query
          name: lines
          schema:
            default: 200
            description: Number of trailing lines to return; 0 returns the entire output
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleOutputResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/password:
    post:
      summary: Reset the login password
      description: |-
        Changes the root password without a reboot. The instance must be running.

        **Not every image supports this.** Images whose `supports_password_reset` is false cannot, and a new password can then only be set by rebuilding the instance, which erases all data on the system disk.

        The request is also rejected when the image is marked as supported but the corresponding component has been removed or stopped inside the instance.
      operationId: reset-instance-password
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/reboot:
    post:
      summary: Reboot an instance
      description: |-
        A reboot defaults to soft, in which the operating system shuts down normally before starting again.

        A soft reboot has no effect once the system is unresponsive. Set `force` to reboot forcibly: a forced reboot does not wait for the operating system to shut down, so **unwritten data is lost**.

        A forced reboot is accepted while the instance is already `rebooting`, which is the way out of a soft reboot the instance never carried out. Every other endpoint refuses an instance in a transient state, and a second soft reboot is refused as well.

        An instance suspended by the platform must be unsuspended first.

        This endpoint returns immediately and the `status` it returns is the transient `rebooting`. Poll the instance until it settles at `running`.
      operationId: reboot-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebootInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/rebuild:
    post:
      summary: Rebuild an instance
      description: '**All data on the system disk is erased and cannot be recovered.** Attached data disks are unaffected.'
      operationId: rebuild-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebuildInstanceResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/resize:
    post:
      summary: Resize an instance
      description: |-
        Only an instance type in the same region and availability zone can be selected, as attached disks cannot follow the instance elsewhere.

        A resize has two steps. This endpoint restarts the instance on the new size and the status becomes `resize_verifying`, at which point the confirm or revert endpoint **must** be called. Until confirmation the target type is recorded in `pending_instance_type_id`, while `instance_type_id` remains the type in effect and billed.

        **Both sizes hold resources while the resize is unconfirmed.** Confirm promptly once the status becomes `resize_verifying`.
      operationId: resize-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeInstanceRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/resize/confirm:
    post:
      summary: Confirm a resize
      description: Releases the resources held by the previous size. `pending_instance_type_id` becomes the type in effect and is billed from then on.
      operationId: confirm-instance-resize
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/resize/revert:
    post:
      summary: Revert a resize
      description: The instance returns to its previous size, `pending_instance_type_id` is discarded, and billing is unaffected by the resize.
      operationId: revert-instance-resize
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/start:
    post:
      summary: Start an instance
      description: |-
        An instance suspended by the platform must be unsuspended first.

        This endpoint returns immediately and the `status` it returns is the transient `starting`. Poll the instance until it settles at `running`.
      operationId: start-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/stop:
    post:
      summary: Stop an instance
      description: |-
        The operating system is asked to shut down and is powered off once it does, or once it stops responding for long enough. Stopping does not release the instance: it keeps its disks, its addresses and its name, and starts again where it left off.

        An instance suspended by the platform must be unsuspended first.

        This endpoint returns immediately and the `status` it returns is the transient `stopping`. Poll the instance until it settles at `stopped`.
      operationId: stop-instance
      tags:
        - Instance
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/disks:
    get:
      summary: List the disks attached to an instance
      operationId: list-instance-disks
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Attach a disk
      description: The disk must be in the same region and availability zone as the instance. Partition it and mount the file system inside the instance once it is attached.
      operationId: attach-disk
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachDiskRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/disks/{diskId}:
    delete:
      summary: Detach a disk
      description: Unmount the device inside the instance before calling this endpoint. Forcibly detaching a file system that is being written to corrupts data.
      operationId: detach-disk
      tags:
        - Attachment
      parameters:
        - in: path
          name: instanceId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: diskId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiskResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/instances/{instanceId}/floating-ips:
    post:
      summary: Bind a floating IP to an instance
      description: The floating IP is bound to the primary network interface of the instance.
      operationId: attach-instance-floating-ip
