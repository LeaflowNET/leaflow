      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{instanceId}/reboot:
    post:
      summary: Reboot an instance
      description: 'A reboot defaults to soft, in which the operating system shuts down normally before starting
        again.


        A soft reboot has no effect once the system is unresponsive. Set `force` to reboot forcibly: a forced reboot
        does not wait for the operating system to shut down, so **unwritten data is lost**.


        A forced reboot is accepted while the instance is already `rebooting`, which is the way out of a soft reboot
        the instance never carried out. Every other endpoint refuses an instance in a transient state, and a second
        soft reboot is refused as well.


        An instance suspended by the platform must be unsuspended first.


        This endpoint returns immediately and the `status` it returns is the transient `rebooting`. Poll the instance
        until it settles at `running`.'
      operationId: reboot-instance
      tags:
      - Instance
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
          rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebootInstanceRequestBody'
      responses:
        '202':
          description: The action was accepted. Wait for the returned task to finish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/instances/{instanceId}/rebuild:
    post:
      summary: Rebuild an instance
      description: '**All data on the system disk is erased and cannot be recovered.** Attached data disks are unaffected.


        The image this instance already runs is accepted even after the platform has withdrawn it, since rebuilding
        is the only way back into an instance broken from the inside. Any *other* withdrawn image is rejected with
        `IMAGE_RETIRED`, which is a change of image and therefore a new order.'
      operationId: rebuild-instance
      tags:
      - Instance
      parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
        description: Reuse the same key for retries of the same action. A different request with the same key is
