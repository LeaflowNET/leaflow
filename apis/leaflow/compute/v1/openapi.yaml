    PrivateImageResource:
      type: object
      properties:
        architecture:
          type: string
        created_at:
          type: string
          format: date-time
        failure:
          description: Reason the capture failed; non-empty only when `status` is `error`
          type:
            - string
            - 'null'
        id:
          type: string
          format: uuid
        login_username:
          description: The account this image lets you log in as. The password set at creation belongs to this account
          type: string
          maxLength: 32
        min_disk_gb:
          description: The system disk of an instance created from this image cannot be smaller than this
          type: integer
          format: int64
        min_ram_mb:
          description: The instance type of an instance created from this image must have at least this much memory
          type: integer
          format: int64
        name:
          type: string
        os_family:
          type: string
        os_version:
          type: string
        region_id:
          type: string
          format: uuid
        size_bytes:
          description: Storage occupied by the image; 0 until the capture completes
          type: integer
          format: int64
        source_instance_id:
          description: The instance this image was captured from. The image remains usable after that instance is
            released
          type:
            - string
            - 'null'
          format: uuid
        status:
          type: string
          enum:
            - provisioning
            - uploading
            - available
            - deleting
            - error
        supports_password_reset:
          description: False means a new password can only be set by rebuilding an instance created from this image
          type: boolean
      required:
        - login_username
        - id
        - name
        - source_instance_id
        - region_id
        - status
        - failure
        - min_disk_gb
