paths:
  /api/v2/instance-types:
    get:
      summary: List instance types on sale
      description:
        Instance types on sale are listed, and sold-out ones with `sale_status` `sold_out`. A withdrawn
        one disappears from here and can no longer be ordered, while the instances already running it keep
        running.
      operationId: list-instance-types
      security:
        - {}
        - scopedTokenAuth: []
      tags:
        - instance-types
      parameters:
        - name: region_id
          in: query
          required: false
          explode: false
          schema:
            $ref: ./identifiers.yaml#/components/schemas/RegionId
        - name: instance_family_id
          in: query
          required: false
          description: Return only the types of this instance family.
          explode: false
          schema:
            $ref: ./identifiers.yaml#/components/schemas/InstanceFamilyId
        - name: availability_zone_id
          in: query
          required: false
          description: Return only the types of this availability zone, sold out or not.
          explode: false
          schema:
            $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneId
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceTypeListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/instance-types/{instanceTypeId}:
    get:
      summary: Get an instance type
      description:
        Returns an instance type, including retired types (`sale_status` is `off_sale`) that existing instances
        still run. Retired types cannot be ordered for new instances or resizes.
      operationId: get-instance-type
      security:
        - {}
        - scopedTokenAuth: []
      tags:
        - instance-types
      parameters:
        - name: instanceTypeId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/InstanceTypeId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceType"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    InstanceType:
      type: object
      properties:
        availability_zone_id:
          description:
            The availability zone the type belongs to, where an instance of it is created. A resize stays in the instance's
            zone, so the target type has to be one of the same zone.
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneId
        sale_status:
          description:
            "`on_sale` accepts new orders. `sold_out` takes no new orders for now while the type stays listed.
            `off_sale` means the type was withdrawn: it is hidden from listing and takes no new orders, while
            instances already running it keep working."
          type: string
          enum:
            - on_sale
            - sold_out
            - off_sale
        id:
          $ref: ./identifiers.yaml#/components/schemas/InstanceTypeId
        instance_family_id:
          description: The instance family the type is a size of, in the same region. It cannot change.
          $ref: ./identifiers.yaml#/components/schemas/InstanceFamilyId
        max_bandwidth_mbps:
          description: |-
            The machine's network rate, in Mbps. **Each** network interface of the machine is limited to it in both directions — per interface rather than shared, so a machine with two interfaces has this rate on each of them; `max_network_interfaces` says how many it may have. Zero is no limit.

            An elastic IP associated with the machine cannot be bought faster than this rate; asking for more is refused with `INSTANCE_BANDWIDTH_CEILING`.
          type: integer
          format: int64
        max_elastic_ips:
          type: integer
          format: int64
        max_ipv4_per_network_interface:
          description: Maximum IPv4 addresses (primary and secondary) each attached network interface may hold.
          type: integer
          format: int64
        max_network_interfaces:
          type: integer
          format: int64
        name:
          type: string
        memory_mib:
          type: integer
          format: int64
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionId
        vcpus:
          type: integer
          format: int64
        billing:
          description:
            The order line an instance of this type is. The boot volume and data volumes bought with it are order
            lines of their volume types, and a new elastic IP is the two order lines of its internet line.
          allOf:
            - $ref: ./billing-terms.yaml#/components/schemas/BillingComponent
      required:
        - id
        - instance_family_id
        - name
        - vcpus
        - memory_mib
        - region_id
        - availability_zone_id
        - sale_status
        - max_network_interfaces
        - max_ipv4_per_network_interface
        - max_elastic_ips
        - max_bandwidth_mbps
        - billing
      additionalProperties: false
    InstanceTypeListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceType"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
