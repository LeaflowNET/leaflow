components:
  schemas:
    LatestOperation:
      description: The most recent operation started on a resource and how it stands. It is replaced when the next
        operation starts.
      type: object
      properties:
        name:
          description: The operation, named as the request that started it, for example `resize` or `attach_volume`.
            While `state` is `operating`, the resource's `status` names the same operation in progress.
          type: string
        state:
          description: '`operating` while the operation runs; `succeeded` or `failed` once it has ended.'
          type: string
          enum:
          - operating
          - succeeded
          - failed
        started_at:
          type: string
          format: date-time
      required:
      - name
      - state
      - started_at
      additionalProperties: false
