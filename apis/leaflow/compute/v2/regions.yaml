paths:
  /api/v2/regions:
    get:
      summary: List available regions
      operationId: list-regions
      security:
      - {}
      - scopedTokenAuth: []
      tags:
      - regions
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/regions/{regionId}:
    get:
      summary: Retrieve a region
      description: The availability zones of a region are listed by `list-availability-zones` with `region_id`.
      operationId: get-region
      security:
      - {}
      - scopedTokenAuth: []
      tags:
      - regions
      parameters:
      - name: regionId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    RegionResource:
      type: object
      properties:
        country_code:
          description: ISO 3166-1 alpha-2 country this region sits in. Two letters, uppercase.
          type: string
        name:
          description: Display name for this place, shown to tenants (Hong Kong). The stable handle is code.
          type: string
        code:
          description: The region's code, the way the outside world names this place (hk-1). Stable and human-written;
            addressing is by id.
          type: string
        id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        volume_snapshot_billing:
          description: The line every snapshot in this region is, metered on the size it stores.
          allOf:
          - $ref: ./billing-terms.yaml#/components/schemas/BillingComponent
        volume_backup_billing:
          description: The line every volume backup in this region is, metered on the size it stores.
          allOf:
          - $ref: ./billing-terms.yaml#/components/schemas/BillingComponent
        private_image_billing:
          description: The line every private image in this region is, metered each second it is stored under its `billing_position`.
          allOf:
          - $ref: ./billing-terms.yaml#/components/schemas/BillingComponent
      required:
      - code
      - name
      - country_code
      - id
      - volume_snapshot_billing
      - volume_backup_billing
      - private_image_billing
      additionalProperties: false
    RegionListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RegionResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
