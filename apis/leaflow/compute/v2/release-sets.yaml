components:
  schemas:
    ReleaseSetItem:
      description: One subscription of a release set and the resource it pays for.
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        resource:
          $ref: '#/components/schemas/ReleaseResource'
      required:
      - subscription_id
      - resource
      additionalProperties: false
    ReleaseResource:
      description: A resource a release set releases.
      oneOf:
      - $ref: '#/components/schemas/InstanceReleaseResource'
      - $ref: '#/components/schemas/VolumeReleaseResource'
      - $ref: '#/components/schemas/ElasticIPReleaseResource'
      - $ref: '#/components/schemas/VolumeSnapshotReleaseResource'
      - $ref: '#/components/schemas/VolumeBackupReleaseResource'
      - $ref: '#/components/schemas/PrivateImageReleaseResource'
      discriminator:
        propertyName: type
        mapping:
          instance: '#/components/schemas/InstanceReleaseResource'
          volume: '#/components/schemas/VolumeReleaseResource'
          elastic_ip: '#/components/schemas/ElasticIPReleaseResource'
          snapshot: '#/components/schemas/VolumeSnapshotReleaseResource'
          volume_backup: '#/components/schemas/VolumeBackupReleaseResource'
          private_image: '#/components/schemas/PrivateImageReleaseResource'
    InstanceReleaseResource:
      description: A resource a release set releases.
      type: object
      properties:
        type:
          type: string
          enum:
          - instance
        id:
          $ref: ./identifiers.yaml#/components/schemas/InstanceID
          description: The identifier of the resource selected by type.
        name:
          description: The current display name of the selected resource.
          type: string
      required:
      - type
      - id
      - name
      additionalProperties: false
    VolumeReleaseResource:
      description: A resource a release set releases.
      type: object
      properties:
        type:
          type: string
          enum:
          - volume
        id:
          description: The identifier of the resource selected by type.
          $ref: ./identifiers.yaml#/components/schemas/VolumeID
        name:
          description: The current display name of the selected resource.
          type: string
      required:
      - type
      - id
      - name
      additionalProperties: false
    ElasticIPReleaseResource:
      description: A resource a release set releases.
      type: object
      properties:
        type:
          type: string
          enum:
          - elastic_ip
        id:
          $ref: ./identifiers.yaml#/components/schemas/ElasticIPID
          description: The identifier of the resource selected by type.
        name:
          description: The current display name of the selected resource.
          type: string
      required:
      - type
      - id
      - name
      additionalProperties: false
    VolumeSnapshotReleaseResource:
      description: A resource a release set releases.
      type: object
      properties:
        type:
          type: string
          enum:
          - volume_snapshot
        id:
          $ref: ./identifiers.yaml#/components/schemas/VolumeSnapshotID
          description: The identifier of the resource selected by type.
        name:
          description: The current display name of the selected resource.
          type: string
      required:
      - type
      - id
      - name
      additionalProperties: false
    VolumeBackupReleaseResource:
      description: A resource a release set releases.
      type: object
      properties:
        type:
          type: string
          enum:
          - volume_backup
        id:
          $ref: ./identifiers.yaml#/components/schemas/VolumeBackupID
          description: The identifier of the resource selected by type.
        name:
          description: The current display name of the selected resource.
          type: string
      required:
      - type
      - id
      - name
      additionalProperties: false
    PrivateImageReleaseResource:
      description: A resource a release set releases.
      type: object
      properties:
        type:
          type: string
          enum:
          - private_image
        id:
          $ref: ./identifiers.yaml#/components/schemas/ImageID
          description: The identifier of the resource selected by type.
        name:
          description: The current display name of the selected resource.
          type: string
      required:
      - type
      - id
      - name
      additionalProperties: false
