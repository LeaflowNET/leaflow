paths:
  /api/v2/volume-snapshots:
    get:
      summary: List snapshots
      operationId: list-volume-snapshots
      tags:
      - volume-snapshots
      parameters:
      - name: volume_id
        in: query
        description: Return only the snapshots of this volume
        explode: false
        schema:
          description: Return only the snapshots of this volume
          $ref: ./identifiers.yaml#/components/schemas/VolumeID
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSnapshotListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      summary: Create a snapshot
      description: "Creates a snapshot of the volume. A running instance may produce a file-system-inconsistent
        snapshot; flush pending writes first. A boot volume cannot be reverted while attached. Pending snapshots count
        toward Compute project quotas until creation fails and cleanup is confirmed.\n\nIt is metered by the hour on a subscription of its own and takes no billing choice. It is bought through a
        Billing Checkout Session: automatic checkout completes at once for metered pricing and the snapshot is taken as soon
        as the order is accepted; with deferred checkout it stays `pending` until the customer completes checkout in
        Billing. The source and project quotas are checked before the Checkout Session is created, and a refused
        request creates nothing.\n\nThe snapshot is `pending` from the moment its Checkout Session is created until it is delivered or its checkout or order ends. Every other operation on it is refused with `COMPUTE_RESOURCE_BUSY` meanwhile, and its deletion with `COMPUTE_PURCHASE_PENDING` while its purchase awaits checkout or payment."
      operationId: create-volume-snapshot
      tags:
      - volume-snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVolumeSnapshotRequestBody'
      responses:
        '202':
          description: The snapshot and its Checkout Session were created; the snapshot is not taken yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVolumeSnapshotResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
  /api/v2/volume-snapshots/{volumeSnapshotId}:
    get:
      summary: Retrieve a snapshot
      operationId: get-volume-snapshot
      tags:
      - volume-snapshots
      parameters:
      - name: volumeSnapshotId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VolumeSnapshotID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSnapshotResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    patch:
      summary: Update a snapshot
      description: Changes the name only. A snapshot's source volume and capacity cannot be changed.
      operationId: update-volume-snapshot
      tags:
      - volume-snapshots
      parameters:
      - name: volumeSnapshotId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VolumeSnapshotID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVolumeSnapshotRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeSnapshotResource'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    delete:
      summary: Delete a snapshot
      description: "Deletes this resource. Quota capacity and storage metering are released only after cleanup is confirmed.\n\
        \nA resource whose purchase still awaits checkout or payment is refused with `COMPUTE_PURCHASE_PENDING`; `meta.checkout_session_id` names its Checkout Session and `meta.order_id` its order once checkout created one. Expire the session or cancel the order in Billing instead. A subscribed resource
        is released through its subscription cancellation. Cleanup must be confirmed before metering is stopped; unknown
        cleanup is not proof of release.\n\nWhile subscriptions pay for the snapshot (those in its `release_set`), deleting it cancels them rather than being refused: Compute creates one Billing cancellation for the whole set and answers with it in `cancellation`. `cancellation_mode` chooses when: `immediate` cancels the set now, a licensed subscription being refunded under its terms, and `period_end` keeps the snapshot working until `scheduled_at` and releases it then. Asking again while that cancellation is pending answers with it again, whatever mode is asked for."
      operationId: delete-volume-snapshot
      tags:
      - volume-snapshots
      parameters:
      - name: volumeSnapshotId
        in: path
        required: true
        schema:
          $ref: ./identifiers.yaml#/components/schemas/VolumeSnapshotID
      - $ref: ./openapi.yaml#/components/parameters/CancellationMode
      responses:
        '409':
          $ref: ./openapi.yaml#/components/responses/Conflict
        '202':
          description: Deletion was accepted. Without a subscription the snapshot is `deleting` until it is deleted, and `cancellation` is null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVolumeSnapshotResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    DeleteVolumeSnapshotResponseBody:
      description: The snapshot as it is when the deletion is accepted, and the Billing cancellation that releases it when
        subscriptions pay for it.
      type: object
      properties:
        volume_snapshot:
          $ref: '#/components/schemas/VolumeSnapshotResource'
        cancellation:
          description: The cancellation Compute created for the snapshot's subscriptions; null when none pays for it.
          oneOf:
          - type: 'null'
          - $ref: ./billing-terms.yaml#/components/schemas/BillingCancellation
      required:
      - volume_snapshot
      - cancellation
      additionalProperties: false
    VolumeSnapshotResource:
      description: "A snapshot of a volume. Compute project quotas constrain its count; retained storage is metered independently
        of that quota."
      type: object
      properties:
        availability_zone_id:
          description: A volume restored from this snapshot must reside in this availability zone
          $ref: ./identifiers.yaml#/components/schemas/AvailabilityZoneID
        created_at:
          type: string
          format: date-time
        volume_id:
          $ref: ./identifiers.yaml#/components/schemas/VolumeID
        id:
          $ref: ./identifiers.yaml#/components/schemas/VolumeSnapshotID
        name:
          type: string
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
        size_gib:
          description: Capacity of the source volume when the snapshot was created. A volume restored from it cannot be
            smaller
          type: integer
          format: int64
        status:
          description: '`pending` once a quota slot is reserved and until the snapshot is taken; then `available`.
            `failed` means the snapshot was not created; its slot is released once no snapshot data remains. `error`
            means the cloud reports the snapshot broken. A value naming an operation in progress (`restoring`,
            `deleting`) is shown while that operation runs; the snapshot refuses another operation until it ends.'
          type: string
          enum:
          - pending
          - available
          - deleted
          - failed
          - error
          - restoring
          - deleting
        failure_reason:
          description: Why creation failed; null unless `status` is `failed`. `checkout_expired` means checkout was
            not completed before its Checkout Session expired. `provisioning_failed` means creation failed after the
            order was accepted, and the charge for this snapshot is refunded.
          type:
          - string
          - 'null'
          enum:
          - order_declined
          - order_canceled
          - order_expired
          - checkout_expired
          - provisioning_failed
          - null
        checkout_session_id:
          description: The Billing Checkout Session that bought this resource; `order_id` and `order_item_id` stay null
            until its checkout completes. Null when the resource was not bought through one.
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        order_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order that bought this resource; null until checkout completes.
        order_item_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The Billing order item for this resource.
        subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
          description: The subscription for this resource; its presence alone does not imply delivery.
        release_set:
          description: The subscription that pays for this snapshot, with the resource it pays for, so that a
            cancellation through Billing can name what it releases. Empty when no subscription pays for it, and
            once it is released.
          type: array
          items:
            $ref: ./release-sets.yaml#/components/schemas/ReleaseSetItem
      required:
      - id
      - volume_id
      - name
      - size_gib
      - status
      - availability_zone_id
      - region_id
      - created_at
      - failure_reason
      - checkout_session_id
      - order_id
      - order_item_id
      - subscription_id
      - release_set
      additionalProperties: false
    VolumeSnapshotListResponseBody:
      type: object
      properties:
        items:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VolumeSnapshotResource'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
    CreateVolumeSnapshotRequestBody:
      description: "Creation configuration for this resource. Compute project quotas and Billing authorization are checked
        independently."
      type: object
      properties:
        volume_id:
          $ref: ./identifiers.yaml#/components/schemas/VolumeID
        name:
          type: string
          minLength: 1
          maxLength: 128
        checkout:
          $ref: ./billing-terms.yaml#/components/schemas/CheckoutOptions
      required:
      - volume_id
      - name
      additionalProperties: false
    UpdateVolumeSnapshotRequestBody:
      description: The mutable fields of a snapshot. At least one must be given.
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
      minProperties: 1
      additionalProperties: false
    CreateVolumeSnapshotResponseBody:
      type: object
      description: The new snapshot, `pending` until its order is accepted, and its Checkout Session.
      properties:
        volume_snapshot:
          $ref: '#/components/schemas/VolumeSnapshotResource'
        checkout_session_id:
          description: The Billing Checkout Session of this purchase. With deferred checkout, the customer completes it
            in Billing.
          type: string
          format: uuid
        order_id:
          description: The order created when checkout completes, at once for automatic checkout; null until then.
          type:
          - string
          - 'null'
          format: uuid
      required:
      - volume_snapshot
      - checkout_session_id
      - order_id
      additionalProperties: false
