paths:
  /api/v2/operation-logs:
    get:
      summary: List the operation log of the project
      description: |-
        Records every write operation in the project: who performed it, when, on what, and its outcome. Read operations are not recorded.

        Operations performed by the platform have `actor_type` set to `platform`, with `user_id` and `user_name` set to null.

        Fields such as passwords are replaced with a placeholder as the record is written and never appear in `payload`.
      operationId: list-operation-logs
      tags:
        - operation-logs
      parameters:
        - name: action
          in: query
          description: Return a single kind of operation; the value matches the operation id of the endpoint
          explode: false
          schema:
            description: Return a single kind of operation; the value matches the operation id of the endpoint
            type: string
            maxLength: 64
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationLogListResponseBody"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/operation-logs/{operationLogId}:
    get:
      summary: Retrieve an operation log entry
      description: Returns one entry of the project's operation log.
      operationId: get-operation-log
      tags:
        - operation-logs
      parameters:
        - name: operationLogId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/OperationLogId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationLogResource"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    OperationLogResource:
      type: object
      properties:
        action:
          description: Name of the operation; matches the operation id of the endpoint
          type: string
        user_id:
          description: The user who initiated the operation. Null when `actor_type` is `platform`
          type:
            - string
            - "null"
          format: uuid
        user_name:
          description: |-
            Display name of the user recorded when the operation occurred. Null when `actor_type` is `platform` or when no name was recorded; empty string when the account had no display name.
          type:
            - string
            - "null"
        actor_type:
          description:
            "`user` when a user of the project initiated the operation, `platform` when the platform
            performed it."
          type: string
          enum:
            - user
            - platform
        created_at:
          type: string
          format: date-time
        failure:
          description: Brief reason for the failure; null when `outcome` is `succeeded`
          type:
            - string
            - "null"
        id:
          $ref: ./identifiers.yaml#/components/schemas/OperationLogId
        payload:
          description: Path and query parameters of the request. Fields such as passwords are redacted
          type: object
          additionalProperties: {}
        region_id:
          anyOf:
            - $ref: ./identifiers.yaml#/components/schemas/RegionId
            - type: "null"
        subject_id:
          description:
            "Empty for create operations: the id of the new resource is in the response, not in the request
            path"
          type: string
        subject_type:
          type: string
        outcome:
          description:
            "`succeeded` means the operation took effect. `rejected` means it was refused with a 4xx
            the caller can act on, such as a validation failure, a conflict or an exhausted quota. `failed` means
            the platform failed to carry it out (5xx)."
          type: string
          enum:
            - succeeded
            - rejected
            - failed
      required:
        - id
        - action
        - actor_type
        - user_id
        - user_name
        - subject_type
        - subject_id
        - region_id
        - payload
        - outcome
        - failure
        - created_at
      additionalProperties: false
    OperationLogListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OperationLogResource"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
