openapi: 3.2.1
info:
  title: Leaflow Compute API
  version: 2.0.0
  description:
    "Instances, volumes, snapshots, volume backups, images, virtual private clouds with their subnets, routes,
    peerings, security groups and network interfaces, and elastic IPs.


    ## Authentication


    Every request carries a scoped token; see the `scopedTokenAuth` security scheme. The catalog reads of regions,
    availability zones, instance types, volume types, public images and internet lines also answer without a token,
    so a visitor can configure a purchase and price it with Billing before signing in.


    ## Conventions


    - **Purchases.** A purchase returns the new resources `pending`, with the `checkout_session_id` of its Billing
    Checkout Session and, once checkout completes, its `order_id`. Compute returns no prices or amounts; read them
    from Billing with the `BillingComponent` the catalogs declare. Omit `checkout` to pay within the request; with
    `checkout.mode` set to `deferred`, nothing is created until the customer completes checkout in Billing. A
    resource whose purchase fails ends `failed` with `failure_reason`, and a charge already taken is refunded.

    - **Quotas.** A request that adds to what a project holds in a region is refused with 409
    `COMPUTE_PROJECT_QUOTA_EXCEEDED` when it would exceed the project's quota; read the limits with `list-quotas`.

    - **Operations.** Custom methods are `POST` on the resource path followed by `:` and the verb. A request that
    takes time answers 202, and the resource's `status` names the operation until it ends. A resource with an
    operation in progress refuses another with 409 `COMPUTE_RESOURCE_BUSY`. `PATCH` changes descriptive fields only.

    - **Passwords.** A password the platform generates appears only in the response that creates it.


    ## Identifiers


    Compute resource IDs, also those in error `meta`, use the TypeID prefix declared in their schema; UUID text is
    not accepted for them. Project, order, subscription and Billing Plan identifiers are UUIDs."
servers:
  - url: https://compute.leaflow.cloud
security:
  - scopedTokenAuth: []
tags:
