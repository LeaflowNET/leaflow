  responses:
    Conflict:
      description:
        "The request conflicts with the current state of a resource or offering it involves. `COMPUTE_RESOURCE_BUSY`

        means a resource has an operation in progress: `meta.resource_type`, such as `instance` or `elastic_ip`,
        and

        `meta.resource_id` name it, and `meta.operation` is the type of that operation, which the resource's `status`
        also names while it runs.

        Retry once it has finished. Other codes, such as `BILLING_OPTION_UNAVAILABLE`, are described where they

        apply."
      content:
        application/json:
          schema:
            $ref: ../../type/v1/error.yaml#/components/schemas/Error
