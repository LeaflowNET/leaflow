components:
  securitySchemes:
    scopedTokenAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  parameters:
    CancellationMode:
      name: cancellation_mode
      in: query
      description:
        "When the subscription items that pay for what is deleted end. `immediate` cancels them now and
        refunds a licensed one under its terms; `period_end` cancels them at the end of their subscription's paid
        period and keeps what is deleted working until then. Omitted, they are canceled now where the terms of every
        one of them allow it, and otherwise all at the end of the paid period, since one cancellation releases the
        whole set at one instant.


        Billing alone judges the mode against the terms each item was bought with. It refuses with 422 `BILLING_CANCELLATION_MODE_FIXED`
        a mode those terms do not allow: a prepaid item whose terms allow only the end of its period ends only then,
        and a set with no prepaid item ends only now; pay-as-you-go items canceled with prepaid ones end with them at
        the end of the paid period. It refuses `period_end` with 409 `BILLING_CANCELLATION_SCHEDULES_DIFFER`
        when the paid periods end at different times. Ignored when nothing is subscribed, and when a cancellation
        is already open: deleting again answers with that one as it is."
      schema:
        $ref: ../../billing/type/v1/cancellation.yaml#/components/schemas/CancellationMode
