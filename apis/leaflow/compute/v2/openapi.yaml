  - name: internet-lines
    description: Public network products; prices and checkout belong to Billing.
  - name: elastic-ips
    description: Elastic IP resources, bandwidth and associations.
  - name: instance-families
    description: Instance families.
  - name: instance-types
    description: Instance specifications and their Billing Plan references.
  - name: instances
    description: Instances, their power state, size and attachments.
  - name: launch-templates
    description: Launch templates, reusable descriptions of how to create instances.
  - name: network-interfaces
    description: Network interfaces, addresses and attachments.
  - name: operation-logs
    description: Historical records of Compute operations.
  - name: private-images
    description: Images this project captured from its own instances, and their billed storage.
  - name: public-images
    description: Platform images offered to every project.
  - name: quotas
    description: Effective per-project resource and capacity limits.
  - name: regions
    description: Compute regions.
  - name: security-group-rules
    description: Security group rules.
  - name: security-groups
    description: Security groups, their rules and attachments.
  - name: virtual-private-cloud-peerings
    description: Virtual private cloud peerings.
  - name: virtual-private-cloud-routes
    description: Virtual private cloud routes.
  - name: virtual-private-cloud-subnets
    description: Virtual private cloud subnets.
  - name: virtual-private-clouds
    description: Virtual private clouds and regional connectivity.
  - name: volume-backups
    description:
      Independent copies of volumes that outlive their source volume and restore into another availability
      zone.
  - name: volume-snapshots
    description: Volume snapshots.
  - name: volume-types
    description: Volume types and performance specifications.
  - name: volumes
    description: Volumes and attachments.
