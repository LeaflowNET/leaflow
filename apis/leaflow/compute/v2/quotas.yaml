paths:
  /api/v2/regions/{regionId}/quotas:
    parameters:
    - name: regionId
      in: path
      required: true
      schema:
        $ref: ./identifiers.yaml#/components/schemas/RegionID
    get:
      summary: List project quotas in a region
      description: Reads only the IAM project authorized by the scoped token; callers cannot select another project.
        Returns every resource's limit for the project in the region through shared pagination, the platform default
        included where no limit was set. A quota is per region, since each region has its own capacity; what the
        project holds in one region never counts against another. An unknown region is refused with 404. No usage is
        returned.
      operationId: list-quotas
      tags:
      - quotas
      parameters:
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
      - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        '200':
          description: The project's limits in the region.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectQuotaListResponseBody'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
  /api/v2/regions/{regionId}/quotas/{resource}:
    parameters:
    - name: regionId
      in: path
      required: true
      schema:
        $ref: ./identifiers.yaml#/components/schemas/RegionID
    - name: resource
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/QuotaResourceType'
    get:
      summary: Get a project quota in a region
      description: Reads only the IAM project authorized by the scoped token; callers cannot select another project.
        Returns the limit in force, the platform default when no limit was set. Unknown resource values are rejected;
        an unknown region is refused with 404.
      operationId: get-quota
      tags:
      - quotas
      responses:
        '200':
          description: The project's limit on the resource in the region.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectQuota'
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
components:
  schemas:
    QuotaResourceType:
      description: 'The resource or capacity constrained by a project quota in a region. Platform defaults: instances=5;
        vcpus=16; memory_mib=32768; volumes=20; volume_gib=500; virtual_private_clouds=3; virtual_private_cloud_subnets=20; network_interfaces=20;
        elastic_ips=3; security_groups=10; security_group_rules=100; volume_snapshots=20; volume_backups=20; private_images=20.
        memory_mib is measured in MiB and volume_gib in GiB. A zero limit permits no additional capacity; it is not
        unlimited.'
      type: string
      enum:
      - instances
      - vcpus
      - memory_mib
      - volumes
      - volume_gib
      - virtual_private_clouds
      - virtual_private_cloud_subnets
      - network_interfaces
      - elastic_ips
      - security_groups
      - security_group_rules
      - volume_snapshots
      - volume_backups
      - private_images
    QuotaSource:
      description: Where a limit comes from. `default` is the platform default, which follows a change of the default;
        `override` is a limit the platform set for this project in this region.
      type: string
      enum:
      - default
      - override
    ProjectQuota:
      description: The limit in force for one IAM platform project on one resource in one region. This representation
        contains no usage.
      type: object
      properties:
        project_id:
          type: string
          format: uuid
          readOnly: true
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionID
          readOnly: true
        resource:
          $ref: '#/components/schemas/QuotaResourceType'
          readOnly: true
        limit:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
        source:
          $ref: '#/components/schemas/QuotaSource'
          readOnly: true
      required:
      - project_id
      - region_id
      - resource
      - limit
      - source
      additionalProperties: false
    ProjectQuotaListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectQuota'
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
      - items
      - pagination
      additionalProperties: false
