paths:
  /api/v2/internet-gateways:
    get:
      operationId: list-internet-gateways
      summary: List internet gateways
      tags:
        - internet-gateways
      parameters:
        - name: virtual_private_cloud_id
          in: query
          schema:
            $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudId
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternetGatewayListResponseBody"
        default: &id001
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../type/v1/error.yaml#/components/schemas/Error
    post:
      operationId: create-internet-gateway
      summary: Create an internet gateway
      tags:
        - internet-gateways
      description: Creates an unbilled, detached gateway in the selected region. Attach it to a VPC before opening public services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInternetGatewayRequestBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternetGateway"
        default: *id001
  /api/v2/internet-gateways/{internetGatewayId}:
    get:
      operationId: get-internet-gateway
      summary: Get an internet gateway
      tags:
        - internet-gateways
      parameters: &id002
        - name: internetGatewayId
          in: path
          required: true
          schema:
            $ref: ./identifiers.yaml#/components/schemas/InternetGatewayId
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternetGateway"
        default: *id001
    patch:
      operationId: update-internet-gateway
      summary: Update an internet gateway
      tags:
        - internet-gateways
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInternetGatewayRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternetGateway"
        default: *id001
    delete:
      operationId: delete-internet-gateway
      summary: Delete a detached internet gateway
      description: Refused while attached to a VPC. Detach the gateway before deleting it.
      tags:
        - internet-gateways
      parameters: *id002
      responses:
        "204":
          description: Deleted
        default: *id001
  /api/v2/internet-gateways/{internetGatewayId}:attach:
    post:
      operationId: attach-internet-gateway
      summary: Attach an internet gateway
      description: Attaches a detached gateway to a VPC in the same project and region. A VPC can have only one attached gateway.
      tags: [internet-gateways]
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachInternetGatewayRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternetGateway"
        default: *id001
  /api/v2/internet-gateways/{internetGatewayId}:detach:
    post:
      operationId: detach-internet-gateway
      summary: Detach an internet gateway
      description: Detaches the gateway from the specified VPC. Refused while an EIP association or unreleased IPv6 bandwidth service uses the connection.
      tags: [internet-gateways]
      parameters: *id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetachInternetGatewayRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternetGateway"
        default: *id001
components:
  schemas:
    InternetGateway:
      type: object
      description: An unbilled dual-stack VPC connection. Addresses and bandwidth
        retain separate lifecycles.
      properties:
        id:
          $ref: ./identifiers.yaml#/components/schemas/InternetGatewayId
        project_id:
          type: string
          format: uuid
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionId
        virtual_private_cloud_id: &id003
          oneOf:
            - $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudId
            - type: "null"
        name: &id005
          type: string
          minLength: 1
          maxLength: 128
        description: &id006
          type: string
          maxLength: 255
        status:
          type: string
          enum:
            - pending
            - available
            - deleted
            - detached
            - attached
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - region_id
        - virtual_private_cloud_id
        - name
        - description
        - status
        - created_at
      additionalProperties: false
    CreateInternetGatewayRequestBody:
      type: object
      properties:
        region_id:
          $ref: ./identifiers.yaml#/components/schemas/RegionId
        name: *id005
        description: *id006
      required:
        - region_id
        - name
      additionalProperties: false
    UpdateInternetGatewayRequestBody:
      type: object
      properties:
        name: *id005
        description: *id006
      minProperties: 1
      additionalProperties: false
    InternetGatewayListResponseBody:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InternetGateway"
        pagination:
          $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
      required:
        - items
        - pagination
      additionalProperties: false
    AttachInternetGatewayRequestBody:
      type: object
      properties:
        virtual_private_cloud_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudId
      required: [virtual_private_cloud_id]
      additionalProperties: false
    DetachInternetGatewayRequestBody:
      type: object
      properties:
        virtual_private_cloud_id:
          $ref: ./identifiers.yaml#/components/schemas/VirtualPrivateCloudId
      required: [virtual_private_cloud_id]
      additionalProperties: false
