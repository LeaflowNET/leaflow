    InstanceVolumeID:
      type: string
      minLength: 33
      maxLength: 33
      pattern: ^insvol_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute InstanceVolume TypeID. UUID text is not accepted.
    NetworkInterfaceAddressID:
      type: string
      minLength: 37
      maxLength: 37
      pattern: ^eniaddress_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute NetworkInterfaceAddress TypeID. UUID text is not accepted.
    ElasticIPAssociationID:
      type: string
      minLength: 41
      maxLength: 41
      pattern: ^eipassociation_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
