components:
  schemas:
    InstanceId:
      description:
        The public ins resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^ins_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    NetworkInterfaceId:
      description:
        The public eni resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^eni_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    LaunchTemplateId:
      description:
        The public lt resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not an
        alternative representation.
      type: string
      minLength: 29
      maxLength: 29
      pattern: ^lt_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    VirtualPrivateCloudId:
      description:
        The public vpc resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^vpc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    VirtualPrivateCloudIdOrWildcard:
      description:
        A virtual private cloud identifier, or `-` to read across every virtual private cloud of the
        project (AIP-159).
      type: string
      pattern: ^(?:-|vpc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25})$
      example: "-"
    ElasticIpId:
      description:
        The public eip resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 34
      pattern: ^eip_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    ElasticIpLineId:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^eipline_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute ElasticIpLine TypeID. UUID text is not accepted.
    RegionId:
      type: string
      minLength: 33
      maxLength: 33
      pattern: ^region_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Region TypeID. UUID text is not accepted.
    InstanceTypeId:
