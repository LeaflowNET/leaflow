components:
  schemas:
    InstanceID:
      description: The public ins resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^ins_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    NetworkInterfaceID:
      description: The public eni resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^eni_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    LaunchTemplateID:
      description: The public lt resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not an
        alternative representation.
      type: string
      minLength: 29
      maxLength: 29
      pattern: ^lt_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    VirtualPrivateCloudID:
      description: The public vpc resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^vpc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    VirtualPrivateCloudIDOrWildcard:
      description: A virtual private cloud identifier, or `-` to read across every virtual private cloud of the
        project (AIP-159).
      type: string
      pattern: ^(?:-|vpc_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25})$
      example: '-'
    ElasticIPID:
      description: The public eip resource identifier. Only this fixed TypeID prefix is accepted; UUID text is not
        an alternative representation.
      type: string
      minLength: 30
      maxLength: 34
      pattern: ^eip_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
    ElasticIPLineID:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^eipline_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute ElasticIPLine TypeID. UUID text is not accepted.
    RegionID:
      type: string
      minLength: 33
      maxLength: 33
      pattern: ^region_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Region TypeID. UUID text is not accepted.
    InstanceTypeID:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^instype_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute InstanceType TypeID. UUID text is not accepted.
    InstanceFamilyID:
      type: string
      minLength: 36
      maxLength: 36
      pattern: ^insfamily_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute InstanceFamily TypeID. UUID text is not accepted.
    AvailabilityZoneID:
      type: string
      minLength: 31
      maxLength: 31
      pattern: ^zone_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute AvailabilityZone TypeID. UUID text is not accepted.
    VolumeID:
      type: string
      minLength: 30
      maxLength: 30
      pattern: ^vol_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute Volume TypeID. UUID text is not accepted.
    VolumeBackupID:
      type: string
      minLength: 36
      maxLength: 36
      pattern: ^volbackup_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute VolumeBackup TypeID. UUID text is not accepted.
    VolumeTypeID:
      type: string
      minLength: 34
      maxLength: 34
      pattern: ^voltype_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
      description: Compute VolumeType TypeID. UUID text is not accepted.
    VolumeSnapshotID:
      type: string
      minLength: 38
      maxLength: 38
      pattern: ^volsnapshot_[0-7][0123456789abcdefghjkmnpqrstvwxyz]{25}$
