openapi: 3.2.1
info:
  title: Leaflow Event Bus API
  version: 1.0.0
  description: |-
    Event definitions, versions, publishing, and realtime access.

    ## Definitions and messages

    An event is a definition: a name, a description, and one or more versions. A version carries a
    JSON Schema that every published payload must satisfy. Messages are not stored here and are
    not part of the event definition.

    Every event belongs to a namespace, and its name is the namespace's name, a dot, and at least a
    resource and an action, such as `acme.order.created`. A project creates its own namespaces and
    defines events in them. Platform namespaces, such as `leaflow.notification`, are maintained by
    platform services: their events are listed alongside the project's own and can be subscribed
    to, but cannot be changed or published here, and the namespaces cannot be changed or deleted.
    Events in a platform namespace are called platform events below.

    A version number never changes meaning. Adding optional properties is allowed within a version;
    a breaking change creates a new version. Publishing without a version uses the highest active
    version.

    ## Publishing

    Messages are published in batches of up to 64. A batch is validated as a whole: if any message
    is rejected, none is published. Publishing returns the identity of each message and does not
    wait for consumers. Messages are not stored and are not replayed: a consumer that connects
    later does not receive earlier messages.

    Messages published through this API are sent to the current project. A message may name a
    `recipient`, a member of the project; it is then sent to that member only. Without a recipient
    it is sent to every member of the project.

    Every message names its `sender`: an `id` and the `name` the publisher had when the message was
    accepted. A publication may also carry a `client_id`, any label the client chooses, such as one
    per browser tab. Receivers get it unchanged, so a client can recognise its own messages by
    `sender` and `client_id`. A client ID need not be unique; a realtime connection is identified
    by its `connection_id`.

    ## Realtime

    Every message has a topic `{event}/{recipient project_id|-}/{recipient id|-}/{key levels}`, where
    `-` stands for a missing recipient and the key, split at `/`, supplies the remaining levels. A topic filter
    uses `+` to match exactly one level and `#`, only as the last level, to match that level and
    every level below it, including none. For example, `{event}/{project_id}/-/#` matches every
    message sent to the members of a project, and `{event}/-/{user_id}/#` every message sent to one
    person outside any project.

    1. Create a ticket with `POST /api/v1/realtime/tickets`, naming the events to receive. The
       response lists the topic filters the ticket covers. For a platform event they cover messages sent to the caller, messages sent to no recipient and,
       where the caller's permissions allow, messages sent within the project; for a project event
       they cover messages sent within the project. Without a selected project, use
       `POST /api/v1/account/realtime/tickets`; such a ticket covers only messages sent to the
       caller or to no recipient, and cannot publish.
    2. Open a WebSocket to `wss://eventbus.leaflow.cloud/realtime` and send, within 15 seconds:
       `{"type":"authenticate","ticket":"…","client_id":"…"}`, where `client_id` is optional. The
       reply is `{"type":"authenticated","client_id":"…","connection_id":"…","expires_at":"…"}`.
       `connection_id` identifies this connection; it is assigned by EventBus and changes on
       every reconnection.
    3. Only after `authenticated`, send `{"type":"subscribe","id":"…","topics":[…]}`; a
       subscription sent before is rejected. Each topic must be one of the returned
       `topics` or lie within one of them, for example by naming a key level where the ticket has
       `#`; a batch with any other topic is rejected as a whole. The reply is `subscribed`.
       `unsubscribe` takes the same form and replies `unsubscribed`.
    4. Messages arrive as `{"type":"messages","messages":[…]}`, each element an `EventMessage`. A
       message matching several subscriptions on one connection arrives once for each of them.
    5. A connection may switch to another ticket of the same user at any time by sending
       `authenticate` again: to renew before `expires_at`, to move from an account ticket to a
       project ticket, or to move to another project. Wait for its `authenticated` reply before
       changing subscriptions; if it is rejected, the previous ticket stays in effect. `client_id`
       may be omitted to keep the current one. Subscriptions the new ticket does not cover are removed at once and reported in a
       `{"type":"revoked","topics":[…]}` frame. A ticket for another user closes the connection
       with code 4401, as does letting the ticket expire.

    A connection holding a project ticket may publish the project's own events with
    `{"type":"publish","id":"…","messages":[{"event":"…","key":"…","recipient":{"id":"…"},"data":{…}}]}`;
    the reply is `published` with the identity of each message. `ping` is answered with `pong`.
    A rejected request is answered with `{"type":"error","id":"…","code":"…","message":"…"}`.
    Every reply carries the `id` of the request it answers.
servers:
  - url: https://eventbus.leaflow.cloud
    description: Event definitions, publishing, and realtime tickets
security:
  - bearerAuth: []
paths:
  /api/v1/namespaces:
    get:
      summary: List namespaces
      description: |-
        Returns the platform namespaces followed by the project's own, each group ordered by name.
        Archived namespaces are omitted unless `include_archived` is true.
      operationId: list-namespaces
      tags:
        - Namespace
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - name: keyword
          in: query
          description: Match the namespace name or description, case-insensitively
          explode: false
          schema:
            type: string
            maxLength: 128
        - name: include_archived
          in: query
          description: Include archived namespaces; defaults to false
          explode: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceList"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a namespace
      description: |-
        Creates a namespace in the current project. Its name is a single segment, unique within the
        project; names reserved for the platform are rejected.
      operationId: create-namespace
      tags:
        - Namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The name is reserved for the platform
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A namespace with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/namespaces/{namespaceName}:
    get:
      summary: Get a namespace
      description: Returns a platform namespace or one of the project's own.
      operationId: get-namespace
      tags:
        - Namespace
      parameters:
        - $ref: "#/components/parameters/NamespaceName"
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResource"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Namespace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a namespace
      description: |-
        Changes the description or status of one of the project's namespaces. Only the fields
        present in the request are changed. While a namespace is archived, its events cannot be
        created, published or subscribed to; restoring it lifts that. Platform namespaces cannot be
        changed.
      operationId: update-namespace
      tags:
        - Namespace
      parameters:
        - $ref: "#/components/parameters/NamespaceName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNamespaceRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The namespace is a platform namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Namespace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a namespace
      description: |-
        Deletes one of the project's namespaces together with every event and version in it.
        Publishing or subscribing to those events fails from then on. Platform namespaces cannot be
        deleted.
      operationId: delete-namespace
      tags:
        - Namespace
      parameters:
        - $ref: "#/components/parameters/NamespaceName"
      responses:
        "204":
          description: Deleted
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The namespace is a platform namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Namespace not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An event was created in the namespace while it was being deleted; retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events:
    get:
      summary: List event definitions
      description: |-
        Returns the platform events and the project's own events. Ordered by name.
      operationId: list-events
      tags:
        - Event
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - name: namespace
          in: query
          description: Return only events in this namespace; omit for all namespaces
          explode: false
          schema:
            type: string
            maxLength: 64
          example: acme
        - name: keyword
          in: query
          description: Match the event name or description, case-insensitively
          explode: false
          schema:
            type: string
            maxLength: 128
        - name: include_archived
          in: query
          description: Include archived events; defaults to false
          explode: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an event definition
      description: |-
        Creates an event with its first version in one of the project's namespaces. The first
        segment of the name is that namespace, followed by at least a resource and an action.
      operationId: create-event
      tags:
        - Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The project has no namespace named by the first segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An event with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}:
    get:
      summary: Get an event definition
      description: Returns the event and every version, newest first.
      operationId: get-event
      tags:
        - Event
      parameters:
        - $ref: "#/components/parameters/EventName"
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update an event definition
      description: |-
        Changes the description, tags, or status. Only the fields present in the request are
        changed. An archived event stops accepting new messages; existing versions remain readable.
      operationId: update-event
      tags:
        - Event
      parameters:
        - $ref: "#/components/parameters/EventName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}/versions:
    post:
      summary: Add an event version
      description: |-
        Adds a version to an existing event. The version number must be greater than every existing
        version. A version number's schema may gain optional properties, but it may not remove or
        change existing ones; use a new version for a breaking change.
      operationId: create-event-version
      tags:
        - Version
      parameters:
        - $ref: "#/components/parameters/EventName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventVersion"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The version already exists or conflicts with an earlier version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}/versions/{version}:
    get:
      summary: Get an event version
      description: Returns one version of an event.
      operationId: get-event-version
      tags:
        - Version
      parameters:
        - $ref: "#/components/parameters/EventName"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventVersion"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events:publish:
    post:
      summary: Publish event messages
      description: |-
        Validates every message against its selected version and publishes the batch. If any message
        is rejected, none is published. The response carries the identity of each message in request
        order; it does not mean a consumer received it. Only events defined by the current project can
        be published here.
      operationId: publish-events
      tags:
        - Message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "202":
          description: Accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          description: A payload does not match its version's schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied, or the event is in a platform namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The event or version is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/realtime/tickets:
    post:
      summary: Create a realtime ticket
      description: |-
        Issues a short-lived ticket for the named events in the current project. For an event defined
        by the project, the ticket covers messages sent to the members of the project and messages
        sent to the caller within it. For a platform event, it also covers messages sent to the caller
        outside any project and messages sent to no recipient; messages sent within the project are
        covered as far as the caller's current permissions allow, which may be limited to some
        resources or to none. The caller must still be a member of the project. The ticket lives no
        longer than the scoped token it was created with. It is not a bearer token for other APIs.
      operationId: create-realtime-ticket
      tags:
        - Realtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeTicketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "400":
          description: The request names no events, too many events, or the same event twice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is no longer a member of the project, or an event cannot be subscribed to from a browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: An event was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/account/realtime/tickets:
    post:
      summary: Create an account realtime ticket
      description: |-
        Issues a short-lived ticket for a caller who has not selected a project, or belongs to none. Only
        platform events are accepted, and the ticket covers only messages sent to the caller outside
        any project or to no recipient. The ticket cannot publish. The ticket lives no longer than the token it was created with.
      operationId: create-account-realtime-ticket
      tags:
        - Realtime
      security:
        - accessTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealtimeTicketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "400":
          description: The request names no events, too many events, or the same event twice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The caller is no longer a member of the project, or an event cannot be subscribed to from a browser without a project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: An event was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
    accessTokenAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/AccessToken
  parameters:
    EventName:
      name: eventName
      in: path
      required: true
      description: The event's full name, such as `acme.order.created`
      schema:
        type: string
        maxLength: 128
        pattern: "^[a-z](?:[a-z0-9_]*[a-z0-9])?(?:\\.[a-z](?:[a-z0-9_]*[a-z0-9])?){2,}$"
    NamespaceName:
      name: namespaceName
      in: path
      required: true
      description: The namespace's name, such as `acme`
      schema:
        type: string
        maxLength: 64
        pattern: "^[a-z](?:[a-z0-9_]*[a-z0-9])?(?:\\.[a-z](?:[a-z0-9_]*[a-z0-9])?)*$"
    Version:
      name: version
      in: path
      required: true
      description: The version number, starting at 1
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    EventStatus:
      description: |-
        `active` accepts new messages. `archived` keeps existing versions readable but rejects new
        messages.
      type: string
      enum:
        - active
        - archived
    NamespaceStatus:
      description: |-
        `active` admits its events. `archived` keeps them readable but rejects new events, messages
        and subscriptions.
      type: string
      enum:
        - active
        - archived
    NamespaceResource:
      type: object
      required:
        - name
        - description
        - status
        - created_at
        - updated_at
      properties:
        name:
          description: The namespace's name; every event in it is named with this prefix and a dot
          type: string
          maxLength: 64
        project_id:
          description: The owning project; absent for a platform namespace, which is maintained by a platform service and is read-only
          type: string
          format: uuid
        description:
          type: string
          maxLength: 1024
        status:
          $ref: "#/components/schemas/NamespaceStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    NamespaceList:
      type: object
      required:
        - items
        - total_count
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NamespaceResource"
        total_count:
          description: The number of namespaces matching the filters
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    CreateNamespaceRequest:
      type: object
      required:
        - name
      properties:
        name:
          description: A single segment of lowercase letters, digits and underscores, starting with a letter
          type: string
          maxLength: 64
          pattern: "^[a-z](?:[a-z0-9_]*[a-z0-9])?$"
        description:
          type: string
          maxLength: 1024
          default: ""
      additionalProperties: false
    UpdateNamespaceRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 1024
        status:
          $ref: "#/components/schemas/NamespaceStatus"
      additionalProperties: false
    EventResource:
      type: object
      required:
        - name
        - namespace
        - description
        - status
      properties:
        name:
          description: The full event name
          type: string
          maxLength: 128
        namespace:
          description: The namespace the event belongs to; the name starts with it and a dot
          type: string
          maxLength: 64
        project_id:
          description: The owning project; absent for an event in a platform namespace
          type:
            - string
            - "null"
          format: uuid
        description:
          description: What the event means, for developers
          type: string
          maxLength: 1024
        status:
          $ref: "#/components/schemas/EventStatus"
        tags:
          description: Free-form labels for grouping
          type: array
          items:
            type: string
            maxLength: 64
        latest_version:
          description: The highest active version; absent when the event has none
          type: integer
          format: int64
      additionalProperties: false
    EventDetail:
      type: object
      required:
        - name
        - namespace
        - description
        - status
        - versions
      properties:
        name:
          description: The full event name
          type: string
          maxLength: 128
        namespace:
          description: The namespace the event belongs to; the name starts with it and a dot
          type: string
          maxLength: 64
        project_id:
          description: The owning project; absent for an event in a platform namespace
          type:
            - string
            - "null"
          format: uuid
        description:
          description: What the event means, for developers
          type: string
          maxLength: 1024
        status:
          $ref: "#/components/schemas/EventStatus"
        tags:
          description: Free-form labels for grouping
          type: array
          items:
            type: string
            maxLength: 64
        latest_version:
          description: The highest active version; absent when the event has none
          type: integer
          format: int64
        versions:
          description: Every version, newest first
          type: array
          items:
            $ref: "#/components/schemas/EventVersion"
      additionalProperties: false
    EventVersion:
      type: object
      required:
        - version
        - schema
        - status
        - schema_hash
      properties:
        version:
          description: The version number, starting at 1
          type: integer
          format: int64
          minimum: 1
        schema:
          description: The JSON Schema every payload of this version must satisfy
          type: object
          additionalProperties: true
        data_example:
          description: An example payload that satisfies the schema
          type: object
          additionalProperties: true
        status:
          description: |-
            `active` versions accept new messages. `archived` versions stay readable but reject new
            messages.
          type: string
          enum:
            - active
            - archived
        schema_hash:
          description: A stable hash of the schema's shape
          type: string
      additionalProperties: false
    EventList:
      type: object
      required:
        - items
        - total_count
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventResource"
        total_count:
          description: The number of events matching the filters
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    CreateEventRequest:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          description: The full event name; its first segment is the namespace
          type: string
          maxLength: 128
          pattern: "^[a-z](?:[a-z0-9_]*[a-z0-9])?(?:\\.[a-z](?:[a-z0-9_]*[a-z0-9])?){2,}$"
        description:
          description: What the event means, for developers
          type: string
          maxLength: 1024
        schema:
          description: The JSON Schema for version 1
          type: object
          additionalProperties: true
        data_example:
          description: An example payload that satisfies the schema
          type: object
          additionalProperties: true
      additionalProperties: false
    CreateVersionRequest:
      type: object
      required:
        - version
        - schema
      properties:
        version:
          description: The new version number, greater than every existing version
          type: integer
          format: int64
          minimum: 1
        schema:
          description: The JSON Schema for this version
          type: object
          additionalProperties: true
        data_example:
          description: An example payload that satisfies the schema
          type: object
          additionalProperties: true
      additionalProperties: false
    UpdateEventRequest:
      type: object
      properties:
        description:
          description: The new description
          type: string
          maxLength: 1024
        tags:
          description: The complete new tag list; an empty list removes every tag
          type: array
          items:
            type: string
            maxLength: 64
        status:
          $ref: "#/components/schemas/EventStatus"
      additionalProperties: false
    PublishRequest:
      type: object
      required:
        - messages
      properties:
        client_id:
          description: Any label for the publishing client, such as one per browser tab; it need not be unique
          type: string
          maxLength: 128
        messages:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/Publication"
      additionalProperties: false
    Publication:
      type: object
      required:
        - event
        - data
      properties:
        event:
          description: The name of an event defined by the current project
          type: string
          maxLength: 128
        version:
          description: The version to validate against; zero selects the highest active version
          type: integer
          format: int64
          minimum: 0
          default: 0
        key:
          description: |-
            The last levels of the message's topic, separated by `/`. Subscribers select messages by
            level. No level may be empty, and neither `+` nor `#` may appear.
          type: string
          maxLength: 256
        recipient:
          $ref: "#/components/schemas/PublicationRecipient"
        data:
          description: The message payload
          type: object
          additionalProperties: true
      additionalProperties: false
    PublishResponse:
      type: object
      required:
        - messages
      properties:
        messages:
          description: One entry per published message, in request order
          type: array
          items:
            $ref: "#/components/schemas/PublishedMessage"
      additionalProperties: false
    PublishedMessage:
      type: object
      required:
        - id
        - event
        - version
        - created_at
      properties:
        id:
          description: The message identity; consumers use it to discard duplicates
          type: string
          format: uuid
        event:
          description: The event name
          type: string
        version:
          description: The version the payload was validated against
          type: integer
          format: int64
          minimum: 1
        created_at:
          description: When the message was accepted, in UTC RFC 3339
          type: string
          format: date-time
      additionalProperties: false
    RealtimeTicketRequest:
      type: object
      required:
        - events
      properties:
        events:
          description: The events to receive, each named once
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            maxLength: 128
      additionalProperties: false
    RealtimeTicket:
      type: object
      required:
        - ticket
        - expires_at
        - topics
      properties:
        ticket:
          description: The ticket to present in the first frame of a realtime connection
          type: string
        expires_at:
          description: When the ticket expires, in UTC RFC 3339; renew the connection before then
          type: string
          format: date-time
        topics:
          description: The topic filters the ticket covers; subscribe to these or to filters within them
          type: array
          items:
            type: string
      additionalProperties: false
    EventMessage:
      description: A message as delivered over a realtime connection
      type: object
      required:
        - id
        - event
        - version
        - sender
        - created_at
        - data
      properties:
        id:
          type: string
          format: uuid
        event:
          type: string
        version:
          type: integer
          format: int64
          minimum: 1
        key:
          type: string
        sender:
          $ref: "#/components/schemas/Sender"
        recipient:
          $ref: "#/components/schemas/Recipient"
        client_id:
          description: The label the publishing client gave, exactly as given; absent when it gave none
          type: string
        connection_id:
          description: The realtime connection the message was published on; absent for messages published over HTTP or by platform services
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
      additionalProperties: false
    Sender:
      description: Who published a message, as established when it was accepted
      type: object
      required:
        - id
      properties:
        id:
          description: The publisher's identity
          type: string
        name:
          description: The publisher's display name when the message was accepted; absent when none is known
          type: string
      additionalProperties: false
    Recipient:
      description: |-
        Who a message is sent to; absent for a message sent to no recipient. With only `project_id` the
        message goes to the members of the project; with only `id` it goes to that person outside any
        project; with both it goes to that person as a member of the project.
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        id:
          type: string
      additionalProperties: false
    PublicationRecipient:
      description: A member of the current project; when set, only that member receives the message
      type: object
      required:
        - id
      properties:
        id:
          type: string
          maxLength: 128
      additionalProperties: false
