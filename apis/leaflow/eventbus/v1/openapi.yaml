openapi: 3.2.1
info:
  title: Leaflow Event Bus API
  version: 1.0.0
  description: |-
    Event definitions, versions, publishing, and realtime access.

    ## Authentication

    Every request carries a scoped token; see the `bearerAuth` security scheme. Neither the path
    nor the headers carry a `project_id`: the current project is determined by the token.

    ## Definitions and messages

    An event is a definition: a name, a description, and one or more versions. A version carries a
    JSON Schema that every published payload must satisfy. Messages are not stored here and are
    not part of the event definition.

    A project event belongs to the current project. A global event has no `project_id`; it is
    defined by a platform service and is read-only in this API. Global events are listed alongside
    the project's own events.

    A version number never changes meaning. Adding optional properties is allowed within a version;
    a breaking change creates a new version. Publishing without a version uses the highest active
    version.

    ## Publishing

    Publishing returns the identity of the message and does not wait for consumers. Messages are
    not stored and are not replayed: a consumer that connects later does not receive earlier
    messages. Consumers receive messages through the realtime API or the platform's service API.

    ## Realtime

    Create a ticket, connect to the returned URL with the ticket, and authenticate the connection
    with a scoped token. A ticket is single-use and short-lived. The connection ends when the
    token expires unless it is refreshed with a new scoped token for the same user and project.
servers:
  - url: https://eventbus.leaflow.cloud
    description: Event definitions, publishing, and realtime tickets
security:
  - bearerAuth: []
paths:
  /api/v1/events:
    get:
      summary: List event definitions
      description: |-
        Returns the global events visible to the project and the project's own events. Ordered by
        name.
      operationId: list-events
      tags:
        - Event
      parameters:
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/Page
        - $ref: ../../type/v1/pagination.yaml#/components/parameters/PageSize
        - name: namespace
          in: query
          description: Return only events in this namespace; omit for all namespaces
          explode: false
          schema:
            type: string
            maxLength: 64
          example: acme
        - name: keyword
          in: query
          description: Match the event name or description, case-insensitively
          explode: false
          schema:
            type: string
            maxLength: 128
        - name: include_archived
          in: query
          description: Include archived events; defaults to false
          explode: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create an event definition
      description: |-
        Creates a project event with its first version. The name is unique within the project. The
        first segment of the name is the event's namespace and must not be a platform namespace.
      operationId: create-event
      tags:
        - Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: An event with this name already exists in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}:
    get:
      summary: Get an event definition
      description: Returns the event and every version, newest first.
      operationId: get-event
      tags:
        - Event
      parameters:
        - $ref: "#/components/parameters/EventName"
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update an event definition
      description: |-
        Changes the description, tags, or status. Only the fields present in the request are
        changed. An archived event stops accepting new messages; existing versions remain readable.
      operationId: update-event
      tags:
        - Event
      parameters:
        - $ref: "#/components/parameters/EventName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResource"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Conflicting state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}/versions:
    post:
      summary: Add an event version
      description: |-
        Adds a version to an existing event. The version number must be greater than every existing
        version. A version number's schema may gain optional properties, but it may not remove or
        change existing ones; use a new version for a breaking change.
      operationId: create-event-version
      tags:
        - Version
      parameters:
        - $ref: "#/components/parameters/EventName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVersionRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventVersion"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The version already exists or conflicts with an earlier version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}/versions/{version}:
    get:
      summary: Get an event version
      description: Returns one version of an event.
      operationId: get-event-version
      tags:
        - Version
      parameters:
        - $ref: "#/components/parameters/EventName"
        - $ref: "#/components/parameters/Version"
      responses:
        "200":
          description: Successful read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventVersion"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/events/{eventName}:publish:
    post:
      summary: Publish an event message
      description: |-
        Validates the payload against the selected version and publishes the message. The response
        carries the message identity; it does not mean a consumer received it. A version of zero
        selects the highest active version.
      operationId: publish-event
      tags:
        - Message
      parameters:
        - $ref: "#/components/parameters/EventName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "202":
          description: Accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponse"
        "400":
          description: The payload does not match the version's schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Event or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The event or version is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/realtime/tickets:
    post:
      summary: Create a realtime ticket
      description: |-
        Issues a short-lived ticket for a realtime connection. Connect to `url`, pass the ticket,
        then authenticate the connection with a scoped token. A ticket is not a bearer token for
        other APIs.
      operationId: create-realtime-ticket
      tags:
        - Realtime
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeTicket"
        "401":
          description: Missing or invalid scoped token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Current permission denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  parameters:
    EventName:
      name: eventName
      in: path
      required: true
      description: The event's full name, such as `acme.order.created`
      schema:
        type: string
        maxLength: 128
        pattern: "^[a-z](?:[a-z0-9_]*[a-z0-9])?(?:\\.[a-z](?:[a-z0-9_]*[a-z0-9])?){2,}$"
    Version:
      name: version
      in: path
      required: true
      description: The version number, starting at 1
      schema:
        type: integer
        format: int64
        minimum: 1
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    EventStatus:
      description: |-
        `active` accepts new messages. `archived` keeps existing versions readable but rejects new
        messages.
      type: string
      enum:
        - active
        - archived
    EventResource:
      type: object
      required:
        - name
        - description
        - status
      properties:
        name:
          description: The full event name
          type: string
          maxLength: 128
        project_id:
          description: The owning project; absent for a global event
          type:
            - string
            - "null"
          format: uuid
        description:
          description: What the event means, for developers
          type: string
          maxLength: 1024
        status:
          $ref: "#/components/schemas/EventStatus"
        tags:
          description: Free-form labels for grouping
          type: array
          items:
            type: string
            maxLength: 64
        latest_version:
          description: The highest active version; absent when the event has none
          type: integer
          format: int64
      additionalProperties: false
    EventDetail:
      type: object
      required:
        - name
        - description
        - status
        - versions
      properties:
        name:
          description: The full event name
          type: string
          maxLength: 128
        project_id:
          description: The owning project; absent for a global event
          type:
            - string
            - "null"
          format: uuid
        description:
          description: What the event means, for developers
          type: string
          maxLength: 1024
        status:
          $ref: "#/components/schemas/EventStatus"
        tags:
          description: Free-form labels for grouping
          type: array
          items:
            type: string
            maxLength: 64
        latest_version:
          description: The highest active version; absent when the event has none
          type: integer
          format: int64
        versions:
          description: Every version, newest first
          type: array
          items:
            $ref: "#/components/schemas/EventVersion"
      additionalProperties: false
    EventVersion:
      type: object
      required:
        - version
        - schema
        - status
        - schema_hash
      properties:
        version:
          description: The version number, starting at 1
          type: integer
          format: int64
          minimum: 1
        schema:
          description: The JSON Schema every payload of this version must satisfy
          type: object
          additionalProperties: true
        data_example:
          description: An example payload that satisfies the schema
          type: object
          additionalProperties: true
        status:
          description: |-
            `active` versions accept new messages. `archived` versions stay readable but reject new
            messages.
          type: string
          enum:
            - active
            - archived
        schema_hash:
          description: A stable hash of the schema's shape
          type: string
      additionalProperties: false
    EventList:
      type: object
      required:
        - items
        - total_count
        - page
        - page_size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventResource"
        total_count:
          description: The number of events matching the filters
          type: integer
          format: int64
          minimum: 0
        page:
          type: integer
          format: int64
          minimum: 1
        page_size:
          type: integer
          format: int64
          minimum: 1
      additionalProperties: false
    CreateEventRequest:
      type: object
      required:
        - name
        - schema
      properties:
        name:
          description: The full event name; its first segment is the namespace
          type: string
          maxLength: 128
          pattern: "^[a-z](?:[a-z0-9_]*[a-z0-9])?(?:\\.[a-z](?:[a-z0-9_]*[a-z0-9])?){2,}$"
        description:
          description: What the event means, for developers
          type: string
          maxLength: 1024
        schema:
          description: The JSON Schema for version 1
          type: object
          additionalProperties: true
        data_example:
          description: An example payload that satisfies the schema
          type: object
          additionalProperties: true
      additionalProperties: false
    CreateVersionRequest:
      type: object
      required:
        - version
        - schema
      properties:
        version:
          description: The new version number, greater than every existing version
          type: integer
          format: int64
          minimum: 1
        schema:
          description: The JSON Schema for this version
          type: object
          additionalProperties: true
        data_example:
          description: An example payload that satisfies the schema
          type: object
          additionalProperties: true
      additionalProperties: false
    UpdateEventRequest:
      type: object
      properties:
        description:
          description: The new description
          type: string
          maxLength: 1024
        tags:
          description: The complete new tag list; an empty list removes every tag
          type: array
          items:
            type: string
            maxLength: 64
        status:
          $ref: "#/components/schemas/EventStatus"
      additionalProperties: false
    PublishRequest:
      type: object
      required:
        - data
      properties:
        version:
          description: The version to validate against; zero selects the highest active version
          type: integer
          format: int64
          minimum: 0
          default: 0
        key:
          description: |-
            The ordering key. Messages with the same key reach an individual consumer in publication
            order. Defaults to the project id when absent.
          type: string
          maxLength: 256
        data:
          description: The message payload
          type: object
          additionalProperties: true
      additionalProperties: false
    PublishResponse:
      type: object
      required:
        - id
        - event
        - version
        - created_at
      properties:
        id:
          description: The message identity; consumers use it to discard duplicates
          type: string
          format: uuid
        event:
          description: The event name
          type: string
        version:
          description: The version the payload was validated against
          type: integer
          format: int64
          minimum: 1
        created_at:
          description: When the message was accepted, in UTC RFC 3339
          type: string
          format: date-time
      additionalProperties: false
    RealtimeTicket:
      type: object
      required:
        - url
        - ticket
        - expires_at
      properties:
        url:
          description: The WebSocket URL to connect to
          type: string
          format: uri
        ticket:
          description: The ticket to present when connecting
          type: string
        expires_at:
          description: When the ticket expires, in UTC RFC 3339
          type: string
          format: date-time
      additionalProperties: false
