paths:
  /v1/chat/completions:
    post:
      operationId: create-chat-completion
      summary: Create a chat completion
      description: Authenticated project inference. Billing ownership comes only from the verified project
        token; no Canopy API key or project header is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Model response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletion'
            text/event-stream:
              schema:
                type: string
                format: binary
                description: 'OpenAI chat.completion.chunk SSE frames, ending with data: [DONE].'
        default: &id001_1
          description: OpenAI error object. Billing refusals occur before inference starts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InferenceError'
      tags:
      - Inference
  /v1/embeddings:
    post:
      operationId: create-embeddings
      summary: Create embeddings
      description: Authenticated project inference. Billing ownership comes only from the verified project
        token; no Canopy API key or project header is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Model response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        default: *id001_1
      tags:
      - Inference
  /v1/models:
    get:
      operationId: list-inference-models
      summary: List callable models with capabilities and parameter limits
      responses:
        '200':
          description: OpenAI model list with Canopy capability fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        default: *id001_1
      tags:
      - Inference
  /v1/models/{model}:
    get:
      operationId: get-inference-model
      summary: Get a callable model with capabilities and parameter limits
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OpenAI model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        default: *id001_1
      tags:
      - Inference
components:
  schemas:
    ChatCompletionRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
        max_tokens:
          type: integer
          minimum: 1
        max_completion_tokens:
          type: integer
          minimum: 1
        reasoning_effort:
          type: string
      required:
      - model
      - messages
      additionalProperties: true
    ChatCompletion:
      type: object
      additionalProperties: true
    EmbeddingRequest:
      type: object
      properties:
        model:
          type: string
          minLength: 1
        input:
          description: A nonempty string, string array, token integer array, or array of token integer
            arrays.
          oneOf:
          - type: string
            minLength: 1
          - type: array
            minItems: 1
            items: {}
        encoding_format:
          type: string
          enum:
          - float
          - base64
        dimensions:
          type: integer
          minimum: 1
        user:
          type: string
      required:
      - model
      - input
      additionalProperties: true
    EmbeddingResponse:
      type: object
      additionalProperties: true
    Model:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          const: model
        created:
          type: integer
          format: int64
        owned_by:
          type: string
        display_name:
          type: string
        context_length:
          type: integer
          format: int64
        max_output_tokens:
          type: integer
          format: int64
        developer:
          type: string
          description: The model developer; not the upstream provider or model family.
        description:
          type: string
        input_modalities:
          type:
          - array
          - 'null'
          items:
            $ref: './capabilities.yaml#/components/schemas/Modality'
          description: Accepted input modalities. Null means unknown.
        output_modalities:
          type:
          - array
          - 'null'
          items:
            $ref: './capabilities.yaml#/components/schemas/Modality'
          description: Produced output modalities. Image input does not imply image generation.
        capabilities:
          $ref: './capabilities.yaml#/components/schemas/ModelCapabilities'
        supported_endpoints:
          type: array
          items:
            $ref: './capabilities.yaml#/components/schemas/ModelEndpoint'
          uniqueItems: true
          description: Explicitly supported API endpoints. Requests to any other endpoint are rejected before upstream
            admission.
      required:
      - id
      - object
      - created
      - owned_by
      - display_name
      - context_length
      - max_output_tokens
      - developer
      - description
      - input_modalities
      - output_modalities
      - capabilities
      - supported_endpoints
      additionalProperties: false
    ModelList:
      type: object
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Model'
      required:
      - object
      - data
      additionalProperties: false
    InferenceError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type:
              - string
              - 'null'
            code:
              type:
              - string
              - 'null'
          required:
          - message
          - type
          additionalProperties: true
      required:
      - error
      additionalProperties: false
