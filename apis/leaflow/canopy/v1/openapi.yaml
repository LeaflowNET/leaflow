openapi: 3.1.0
info:
  description: |-
    管理 API Key、查看模型与用量。

    **这套接口不是推理接口。** 发起对话请用转发地址，它兼容 OpenAI、Anthropic、Gemini 三种调用格式：

    ```
    POST /v1/chat/completions                    OpenAI
    POST /v1/messages                            Anthropic
    POST /v1beta/models/{model}:generateContent  Gemini
    ```

    ## 身份与鉴权

    每个请求需携带 `Authorization: Bearer <项目令牌>`。先在 auth.leaflow.net 登录获取账号令牌，再用它向 IAM 换取项目令牌。一张项目令牌同时说明当前用户和当前项目。

    **路径和请求头上都没有 `project_id`**：当前项目由令牌决定。

    **这套接口不接受 API Key。** 一把泄露的 key 如果还能拿去建新的 key、看别人的用量，那它就撤不干净了。反过来，转发接口也不接受项目令牌。

    ## 通用约定

    - **API Key 的明文只出现一次。** 签发时的响应里有 `secret`，之后任何接口都不会再返回它——服务端只存哈希。丢了只能撤销重建。
    - **停用和撤销是两件事。** 停用随时能开回来；撤销不可逆，用于 key 泄露的情况。两者都不删除记录，那把 key 此前的用量仍然查得到。
    - **用量查询必须带时间范围**，跨度不超过 31 天。`from` / `to` 带时区偏移，服务端不猜时区。
    - **流水里没有请求体和响应体。** canopy 一张表都不存它们。排障请提供响应里的 `upstream_request_id`。
    - **用量可能是估算的。** 上游不是每次都报用量（流式响应要显式开启，有些入口不透传，连接中断时最后一帧可能没到）。这种情况下 `usage_source` 为 `estimated`，那几个数是按字符类估的，误差在百分之十几。
  title: Leaflow 大模型平台用户 API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /api/v1/keys:
    get:
      summary: 列出 API Key
      operationId: list-api-keys
      tags:
        - APIKey
      parameters:
        - description: 这一页最多返回多少条
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: 这一页最多返回多少条
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: 跳过多少条。要翻得更深请改用游标翻页的接口
          explode: false
          in: query
          name: offset
          schema:
            description: 跳过多少条。要翻得更深请改用游标翻页的接口
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
        - description: 只看这个状态的；不传表示全部
          explode: false
          in: query
          name: status
          schema:
            description: 只看这个状态的；不传表示全部
            enum:
              - active
              - disabled
              - revoked
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LengthAwarePageAPIKeyResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: 签发一把 API Key
      description: |-
        响应里的 `secret` 是完整的 key，**只在这一次出现**——服务端只存它的哈希，之后任何接口都不会再返回它。丢了只能撤销重建。

        把它填进 `OPENAI_API_KEY` 一类的地方即可，转发接口同时接受 OpenAI、Anthropic、Gemini 三种调用格式。
      operationId: create-api-key
      tags:
        - APIKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedAPIKeyResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/keys/{keyId}:
    get:
      summary: 查看 API Key
      operationId: get-api-key
      tags:
        - APIKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: 修改 API Key
      description: |-
        只改属性，不改状态——启用、停用、撤销各有自己的接口。

        没提到的字段保持不变。要把到期时间改成「永不过期」请传 `clear_expiry: true`，而不是把 `expires_at` 传成 null。

        已撤销的 key 不接受任何修改。
      operationId: update-api-key
      tags:
        - APIKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAPIKeyRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/keys/{keyId}/disable:
    post:
      summary: 停用 API Key
      description: 临时停用，随时可以启用回来。要永久失效请用撤销。
      operationId: disable-api-key
      tags:
        - APIKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/keys/{keyId}/enable:
    post:
      summary: 启用 API Key
      description: 两种情况开不回来：已撤销的（`API_KEY_REVOKED`），以及因项目停服被停的（`API_KEY_PROJECT_SUSPENDED`，响应里 `suspended` 为 true）。后者要等项目恢复。
      operationId: enable-api-key
      tags:
        - APIKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/keys/{keyId}/revoke:
    post:
      summary: 撤销 API Key
      description: |-
        **不可逆。** 用于这把 key 泄露了的情况——比如被提交进了仓库。

        记录不删除：这把 key 在被撤销前打了多少请求仍然查得到，那正是出事之后要看的。

        只是想临时停一下请用停用。
      operationId: revoke-api-key
      tags:
        - APIKey
      parameters:
        - in: path
          name: keyId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/models:
    get:
      summary: 列出可用模型
      description: |-
        已下架（`retired`）的模型不出现在这里，但仍然查得到——见查看单个模型。

        `context_length` 和 `max_output_tokens` 仅供客户端提示：服务端不据此截断，请求体原样转给上游。
      operationId: list-models
      tags:
        - Model
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/models/{modelId}:
    get:
      summary: 查看模型
      description: 已下架的模型在这里查得到，但转发时会被拒（`MODEL_RETIRED`）——这和「这个模型不存在」是两件事，前者说明它曾经有过。
      operationId: get-model
      tags:
        - Model
      parameters:
        - in: path
          name: modelId
          required: true
          schema:
            maxLength: 128
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/requests:
    get:
      summary: 列出请求流水
      description: |-
        游标翻页，按时间倒序。`next_cursor` 为空表示已经到底。

        **不返回请求体和响应体**——canopy 一张表都不存它们。排障请提供 `upstream_request_id`。

        `usage_source` 为 `estimated` 表示上游这次没给用量，那几个数是我们按字符类估的。
      operationId: list-requests
      tags:
        - Usage
      parameters:
        - description: 起点，含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: 起点，含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 终点，不含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: 终点，不含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 只看这个模型
          explode: false
          in: query
          name: model_id
          schema:
            description: 只看这个模型
            maxLength: 128
            type: string
        - description: 只看这把 key
          explode: false
          in: query
          name: api_key_id
          schema:
            description: 只看这把 key
            type: string
        - description: 只看这个状态的
          explode: false
          in: query
          name: status
          schema:
            description: 只看这个状态的
            enum:
              - in_flight
              - succeeded
              - refused
              - upstream_failed
              - client_aborted
            type: string
        - description: 这一页最多返回多少条
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: 这一页最多返回多少条
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: 上一页返回的 next_cursor；首页不填
          explode: false
          in: query
          name: cursor
          schema:
            description: 上一页返回的 next_cursor；首页不填
            maxLength: 512
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPageRequestResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/requests/{requestId}:
    get:
      summary: 查看单条流水
      operationId: get-request
      tags:
        - Usage
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/usage/by-api-key:
    get:
      summary: 按 API Key 看用量
      description: 用来回答「哪把 key 在烧钱」。已撤销的 key 仍然出现在这里——它在被撤销前的用量正是要看的东西。
      operationId: list-usage-by-api-key
      tags:
        - Usage
      parameters:
        - description: 起点，含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: 起点，含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 终点，不含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: 终点，不含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 只看这个模型
          explode: false
          in: query
          name: model_id
          schema:
            description: 只看这个模型
            maxLength: 128
            type: string
        - description: 只看这把 key
          explode: false
          in: query
          name: api_key_id
          schema:
            description: 只看这把 key
            type: string
        - description: 只看这个状态的
          explode: false
          in: query
          name: status
          schema:
            description: 只看这个状态的
            enum:
              - in_flight
              - succeeded
              - refused
              - upstream_failed
              - client_aborted
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyUsageListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/usage/by-model:
    get:
      summary: 按模型看用量
      operationId: list-usage-by-model
      tags:
        - Usage
      parameters:
        - description: 起点，含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: 起点，含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 终点，不含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: 终点，不含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 只看这个模型
          explode: false
          in: query
          name: model_id
          schema:
            description: 只看这个模型
            maxLength: 128
            type: string
        - description: 只看这把 key
          explode: false
          in: query
          name: api_key_id
          schema:
            description: 只看这把 key
            type: string
        - description: 只看这个状态的
          explode: false
          in: query
          name: status
          schema:
            description: 只看这个状态的
            enum:
              - in_flight
              - succeeded
              - refused
              - upstream_failed
              - client_aborted
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelUsageListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/usage/summary:
    get:
      summary: 用量合计
      description: |-
        `from` / `to` 必填，跨度不超过 31 天。两者带时区偏移，传 `2026-08-01T00:00:00+08:00` 得到的就是东八区那一刻起算。

        五档 token 分开给：缓存命中的读取比普通输入便宜一个数量级，合成一个总数就再也拆不开了。
      operationId: get-usage-summary
      tags:
        - Usage
      parameters:
        - description: 起点，含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: 起点，含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 终点，不含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: 终点，不含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 只看这个模型
          explode: false
          in: query
          name: model_id
          schema:
            description: 只看这个模型
            maxLength: 128
            type: string
        - description: 只看这把 key
          explode: false
          in: query
          name: api_key_id
          schema:
            description: 只看这把 key
            type: string
        - description: 只看这个状态的
          explode: false
          in: query
          name: status
          schema:
            description: 只看这个状态的
            enum:
              - in_flight
              - succeeded
              - refused
              - upstream_failed
              - client_aborted
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalsResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/usage/timeline:
    get:
      summary: 用量曲线
      description: |-
        从 `from` 起按 `bucket` 切段，最后一段可能不满。段数上限 100。

        要按本地日切分就把 `from` 传成本地时间的零点（带偏移）、`bucket` 传 `24h`——服务端不猜时区。
      operationId: get-usage-timeline
      tags:
        - Usage
      parameters:
        - description: 起点，含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: from
          required: true
          schema:
            description: 起点，含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 终点，不含。RFC 3339，带时区偏移
          explode: false
          in: query
          name: to
          required: true
          schema:
            description: 终点，不含。RFC 3339，带时区偏移
            format: date-time
            type: string
        - description: 只看这个模型
          explode: false
          in: query
          name: model_id
          schema:
            description: 只看这个模型
            maxLength: 128
            type: string
        - description: 只看这把 key
          explode: false
          in: query
          name: api_key_id
          schema:
            description: 只看这把 key
            type: string
        - description: 只看这个状态的
          explode: false
          in: query
          name: status
          schema:
            description: 只看这个状态的
            enum:
              - in_flight
              - succeeded
              - refused
              - upstream_failed
              - client_aborted
            type: string
        - description: 每段多长，Go 的时长写法，如 1h、24h。段数上限 100
          explode: false
          in: query
          name: bucket
          schema:
            default: 1h
            description: 每段多长，Go 的时长写法，如 1h、24h。段数上限 100
            maxLength: 16
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageTimelineResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: 项目令牌。先在 auth.leaflow.net 登录拿到账号令牌，再用它向 IAM 换取项目令牌（POST /account/v1/projects/{projectId}/token）——一张项目令牌同时说明当前用户和当前项目。
      scheme: bearer
      type: http
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    APIKeyResource:
      additionalProperties: false
      properties:
        allowed_models:
          description: restrict_models 为 false 时无意义
          items:
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        created_by:
          description: 建这把 key 的人
          format: uuid
          type: string
        expires_at:
          description: 到期时间；null 表示永不过期
          format: date-time
          type:
            - string
            - 'null'
        id:
          format: uuid
          type: string
        last_four:
          description: 明文的后四位
          type: string
        last_used_at:
          description: 最后一次成功用它转发的时刻，精度约一分钟
          format: date-time
          type:
            - string
            - 'null'
        name:
          type: string
        prefix:
          description: 明文的前几位，用来在列表里辨认
          type: string
        restrict_models:
          description: true 时只允许 allowed_models 里的模型
          type: boolean
        status:
          enum:
            - active
            - disabled
            - revoked
          type: string
        suspended:
          description: true 表示这把 key 因项目停服被停，需要项目恢复后才能再用
          type: boolean
      required:
        - id
        - name
        - prefix
        - last_four
        - status
        - suspended
        - restrict_models
        - allowed_models
        - expires_at
        - last_used_at
        - created_by
        - created_at
      type: object
    LengthAwarePageAPIKeyResource:
      additionalProperties: false
      properties:
        items:
          description: 这一页的内容
          items:
            $ref: '#/components/schemas/APIKeyResource'
          type: array
        limit:
          description: 这一页最多几条，回显请求里的值
          format: int64
          type: integer
        offset:
          description: 跳过了多少条，回显请求里的值
          format: int64
          type: integer
        total:
          description: 命中的总条数，不只是这一页
          format: int64
          type: integer
      required:
        - items
        - total
        - limit
        - offset
      type: object
    CreateAPIKeyRequestBody:
      additionalProperties: false
      properties:
        allowed_models:
          description: restrict_models 为 false 时忽略
          items:
            type: string
