components:
  securitySchemes:
    bearerAuth:
      $ref: ../../type/v1/security.yaml#/components/securitySchemes/ScopedToken
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The request conflicts with the current state of the service. The codes are described where they apply.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ChatCompletionRequest:
      $ref: ./inference.yaml#/components/schemas/ChatCompletionRequest
    ChatCompletion:
      $ref: ./inference.yaml#/components/schemas/ChatCompletion
    EmbeddingRequest:
      $ref: ./inference.yaml#/components/schemas/EmbeddingRequest
    EmbeddingResponse:
      $ref: ./inference.yaml#/components/schemas/EmbeddingResponse
    Model:
      $ref: ./inference.yaml#/components/schemas/Model
    ModelList:
      $ref: ./inference.yaml#/components/schemas/ModelList
    InferenceError:
      $ref: ./inference.yaml#/components/schemas/InferenceError
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    OffsetPagination:
      $ref: ../../type/v1/pagination.yaml#/components/schemas/OffsetPagination
    CursorPagination:
      $ref: ../../type/v1/pagination.yaml#/components/schemas/CursorPagination
    RateLimitResource:
      $ref: ./api-keys.yaml#/components/schemas/RateLimitResource
    APIKeyResource:
      $ref: ./api-keys.yaml#/components/schemas/APIKeyResource
    ModelAliases:
      $ref: ./api-keys.yaml#/components/schemas/ModelAliases
    APIKeyList:
      $ref: ./api-keys.yaml#/components/schemas/APIKeyList
    CreateAPIKeyRequestBody:
      $ref: ./api-keys.yaml#/components/schemas/CreateAPIKeyRequestBody
    IssuedAPIKeyResource:
      $ref: ./api-keys.yaml#/components/schemas/IssuedAPIKeyResource
    UpdateAPIKeyRequestBody:
      $ref: ./api-keys.yaml#/components/schemas/UpdateAPIKeyRequestBody
    ModelCategory:
      $ref: ./models.yaml#/components/schemas/ModelCategory
    ModelFreeAccess:
      $ref: ./models.yaml#/components/schemas/ModelFreeAccess
    ModelResource:
      $ref: ./models.yaml#/components/schemas/ModelResource
    ModelBilling:
      $ref: ./models.yaml#/components/schemas/ModelBilling
    ModelMeter:
      $ref: ./models.yaml#/components/schemas/ModelMeter
    ModelListResponseBody:
      $ref: ./models.yaml#/components/schemas/ModelListResponseBody
    EnablementResource:
      $ref: ./enablement.yaml#/components/schemas/EnablementResource
    CreateEnablementRequestBody:
      $ref: ./enablement.yaml#/components/schemas/CreateEnablementRequestBody
    CreateEnablementResponseBody:
      $ref: ./enablement.yaml#/components/schemas/CreateEnablementResponseBody
    CheckoutOptions:
      $ref: ./enablement.yaml#/components/schemas/CheckoutOptions
    ReasoningDiagnostics:
      $ref: ./requests.yaml#/components/schemas/ReasoningDiagnostics
    MediaUsage:
      $ref: ./usage.yaml#/components/schemas/MediaUsage
    MediaUsageDetails:
      $ref: ./requests.yaml#/components/schemas/MediaUsageDetails
    RequestResource:
      $ref: ./requests.yaml#/components/schemas/RequestResource
    RequestTaskResource:
      $ref: ./requests.yaml#/components/schemas/RequestTaskResource
    RequestList:
      $ref: ./requests.yaml#/components/schemas/RequestList
    APIKeyUsageResource:
      $ref: ./usage.yaml#/components/schemas/APIKeyUsageResource
    APIKeyUsageListResponseBody:
      $ref: ./usage.yaml#/components/schemas/APIKeyUsageListResponseBody
    APIKeyUsageBucketResource:
      $ref: ./usage.yaml#/components/schemas/APIKeyUsageBucketResource
    APIKeyUsageTimelineResponseBody:
      $ref: ./usage.yaml#/components/schemas/APIKeyUsageTimelineResponseBody
    ModelUsageResource:
