    UsageTimelineResponseBody:
      $ref: ./usage.yaml#/components/schemas/UsageTimelineResponseBody
  parameters:
    FromRequired:
      name: from
      in: query
      required: true
      description: Start of the range, inclusive. RFC 3339, carrying a timezone offset.
      explode: false
      schema:
        type: string
        format: date-time
    ToRequired:
      name: to
      in: query
      required: true
      description: End of the range, exclusive. RFC 3339, carrying a timezone offset.
      explode: false
      schema:
        type: string
        format: date-time
    ModelIdQuery:
      name: model_id
      in: query
      description: Restricts the result to the specified model.
      explode: false
      schema:
        type: string
        maxLength: 128
    ApiKeyIdQuery:
      name: api_key_id
      in: query
      description: Restricts the result to the specified API key.
      explode: false
      schema:
        type: string
        format: uuid
    RequestStatusQuery:
      name: status
      in: query
      description: Restricts the result to requests in the specified status.
      explode: false
      schema:
        type: string
        enum:
          - in_flight
          - succeeded
          - refused
          - upstream_failed
          - client_aborted
    RequestSourceQuery:
      name: source
      in: query
      description: Restricts the result to requests from the specified source (`api_key`, `project_token`, or an internal service name such as `assistant` or `fleet`).
      explode: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ObjectIdQuery:
      name: object_id
      in: query
      description: Restricts the result to requests associated with a managed task or object, such as `video_01j...`, `batch_01j...` or `ftjob_01j...`; a bare UUID is also accepted.
      explode: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BucketQuery:
      name: bucket
      in: query
      description: Length of each bucket (`1h`, `1d` / `24h`, `1M` calendar month in `from`'s timezone offset, or any Go duration). At most 400 buckets.
      explode: false
      schema:
        type: string
        default: 1h
        maxLength: 16
