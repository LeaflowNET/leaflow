openapi: 3.2.1
info:
  title: Leaflow Canopy API
  version: 1.0.0
  description: |-
    Canopy model inference, API keys, model catalogue, service enablement and recorded usage.

    Project inference is served on this host at each protocol's own endpoints:

    - OpenAI: `/v1/chat/completions`, `/v1/responses`, `/v1/decisions` and `/v1/embeddings`; use
      `https://canopy.leaflow.cloud/v1` as the OpenAI SDK base URL.
    - Anthropic: `/v1/messages`; use `https://canopy.leaflow.cloud` as the Anthropic SDK base URL.
    - Gemini: `/v1beta/models/{model}:generateContent` and `:streamGenerateContent`.
    - TypeSafe System One: `/v1/systemone`; use `https://canopy.leaflow.cloud` as the TypeSafe SDK base URL.

    Every chat model accepts all four chat protocols: Chat Completions, Responses, Messages and Gemini
    generateContent. A request is forwarded unchanged, apart from the model name and the credentials, when a
    provider of the model speaks the protocol it was sent in; otherwise it is translated into a protocol a
    provider speaks, and the response is translated back. Content that cannot be translated, such as a tool
    that runs on another provider's servers or a reference to a file stored with another provider, is refused
    with 400 rather than dropped. Reasoning settings such as `reasoning_effort` are passed through as written;
    a model's `capabilities` lists the values it accepts.

    Responses is stateless: `store` must be false, and a response cannot be retrieved after it is returned.
    Send the output items of a response back unchanged, in their order, as input to the next request.

    Every decision model accepts both decision protocols (`/v1/decisions` and `/v1/systemone`), isolated from
    chat protocols, translating between them when no native route is available.

    What a model does follows from its `input_modalities`, `output_modalities` and the media blocks of its
    `capabilities`. Embeddings, images, audio and videos are accepted for a model whose providers serve them.

    Management operations use `/api/v1`. The management model catalogue names how each model is billed in Billing;
    `/v1/models` returns the OpenAI model format with Canopy capabilities and parameter limits.

    ## Authentication

    Most requests carry a scoped token; see the `bearerAuth` security scheme. Model catalogue endpoints (`/api/v1/models`, `/api/v1/models/{modelId}`, `/api/v1/models:lookup`, `/v1/models`, `/v1/models/{model}`) accept optional authentication so public sites can list available models without signing in.

    Management and project inference accept the same verified IAM scoped token. The token is the
    sole billing project authority; `OpenAI-Project` and historical identity headers cannot
    override it. These endpoints do not accept a Canopy API key. The separate API-key gateway
    accepts Canopy API keys and serves the same endpoints (as well as keyless free inference for
    public models where free access is enabled).

    ## Conventions

    - **The plaintext of an API key is returned once.** The `secret` appears in the response that issues it and is returned by no other endpoint. A key that has been lost has to be revoked and reissued.
    - **Disabling and revoking are distinct.** A disabled key may be enabled again at any time, while a revocation is irreversible and is intended for a key that has been exposed. Neither removes the record, and the usage the key accrued remains readable.
    - **A usage query must carry a time range**, spanning no more than 31 days for individual request records (which are retained for 90 days), or 400 days for aggregated usage endpoints (which are retained for 400 days). `from` and `to` carry a timezone offset, which the server does not infer.
    - **The request and response bodies do not appear in the ledger.** They are not recorded. Quote the request `id` when reporting a problem.
    - **Usage may be estimated.** The upstream provider does not report usage on every request. Where it does not, `usage_source` is `estimated` and the figures are derived from the character classes of the payload, to within roughly fifteen per cent.
    - **The service is enabled before use.** A project enables the model platform once, through `create-enablement`; the forwarding endpoints refuse its requests until the enablement is `active`. Requests are then billed under the enablement's subscription by the tokens they use, at the rates Billing holds for each model's `billing`.
servers:
  - url: https://canopy.leaflow.cloud
    description: Canopy management and project inference
security:
  - bearerAuth: []
tags:
  - name: Inference
    description: Model inference and media generation endpoints.
  - name: APIKey
    description: Project API keys.
  - name: Model
    description: Callable model catalogue and billing metadata.
  - name: Enable
    description: Project service enablement.
  - name: Usage
    description: Recorded requests and token or media usage.
