openapi: 3.1.0
info:
  description: |-
    Monitoring for your own project: enroll machines, read metrics, work through incidents, schedule maintenance windows, and set availability targets.

    ## Authentication

    Every request must carry `Authorization: Bearer <project token>`. Sign in at auth.leaflow.net to obtain an account token, then exchange it for a project token (`POST /api/v1/projects/{projectId}/token`). A project token identifies both the current user and the current project.

    **There is no `projectId` in any path**: the current project is determined by the token.

    Distinguish the failure modes by error code: `TOKEN_MISSING` means no token was supplied; `TOKEN_EXPIRED` means the token has expired and can be re-issued from the account token without signing in again; `TOKEN_INVALID` means the token failed validation; `NOT_A_MEMBER` means the account is not a member of the project; `USER_SUSPENDED` and `USER_BANNED` mean the account itself is barred from operating.

    ## Two distinctions worth keeping straight

    - **Disabling is not deleting.** `POST /servers/{id}/disable` is reversible and preserves all history. `DELETE /servers/{id}` also removes the monitored host, its history and every incident recorded against it, and cannot be undone.
    - **Recovery is not closure.** `incident_status` reports whether monitoring considers the problem recovered; `closed_at` reports whether someone has finished handling it. An incident that has not recovered may still be closed as an accepted risk.

    ## The PSK is returned once

    Enrollment and rotation responses include `tls_psk`. No other endpoint will return it again, so store it immediately. If it is lost, rotate once more — at the cost of updating the agent configuration on the monitored machine.
  title: Leaflow Monitoring API
  version: 1.0.0
servers:
  - url: https://monitoring.leaflow.cloud
    description: Host monitoring, incidents, web checks and SLOs
security:
  - bearerAuth: []
paths:
  /api/v1/incidents:
    get:
      summary: List incidents
      description: '`incident_status` reports whether monitoring considers the problem recovered; `closed` reports whether someone has finished handling it. The two are independent and can be filtered separately.'
      operationId: list-incidents
      tags:
        - Incident
      parameters:
        - description: Maximum number of records in this page
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of records in this page
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Number of records to skip. For deeper paging, use the cursor-paged endpoint instead
          explode: false
          in: query
          name: offset
          schema:
            description: Number of records to skip. For deeper paging, use the cursor-paged endpoint instead
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
        - description: Restrict to a single machine
          explode: false
          in: query
          name: server_id
          schema:
            description: Restrict to a single machine
            type: string
        - explode: false
          in: query
          name: incident_status
          schema:
            enum:
              - PROBLEM
              - RESOLVED
            type: string
        - description: Matches at or above this severity, not exactly this severity
          explode: false
          in: query
          name: min_severity
          schema:
            description: Matches at or above this severity, not exactly this severity
            enum:
              - NOT_CLASSIFIED
              - INFORMATION
              - WARNING
              - AVERAGE
              - HIGH
              - DISASTER
            type: string
        - explode: false
          in: query
          name: started_after
          schema:
            format: date-time
            type: string
        - explode: false
          in: query
          name: started_before
          schema:
            format: date-time
            type: string
        - description: Incidents that **overlap** [active_from, active_to]. This is what you want when overlaying incident bands on a metric chart
          explode: false
          in: query
          name: active_from
          schema:
            description: Incidents that **overlap** [active_from, active_to]. This is what you want when overlaying incident bands on a metric chart
            format: date-time
            type: string
        - explode: false
          in: query
          name: active_to
          schema:
            format: date-time
            type: string
        - description: Given as `key` or `key=value`, repeatable. Multiple tags are combined with AND
          explode: false
          in: query
          name: tag
          schema:
            description: Given as `key` or `key=value`, repeatable. Multiple tags are combined with AND
            items:
              type: string
            type:
              - array
              - 'null'
        - explode: false
          in: query
          name: assignee_user_id
          schema:
            type: string
        - description: Whether someone has finished handling it here. Independent of `incident_status`
          explode: false
          in: query
          name: closed
          schema:
            description: Whether someone has finished handling it here. Independent of `incident_status`
            enum:
              - 'true'
              - 'false'
            type: string
        - explode: false
          in: query
          name: acknowledged
          schema:
            enum:
              - 'true'
              - 'false'
            type: string
        - explode: false
          in: query
          name: unassigned
          schema:
            enum:
              - 'true'
              - 'false'
            type: string
        - explode: false
          in: query
          name: keyword
          schema:
            maxLength: 255
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LengthAwarePageIncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}:
    get:
      summary: Get an incident
      operationId: get-incident
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/acknowledge:
    post:
      summary: Acknowledge an incident
      description: The incident is also marked as acknowledged in the monitoring system, so that other channels can see it already has an owner.
      operationId: acknowledge-incident
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeIncidentRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/assignee:
    put:
      summary: Assign an incident, or clear its assignee
      description: |-
        Leave `assignee_user_id` empty to clear the assignment.

        **Project membership of the assignee is not verified.** Any user identifier is accepted and recorded as given.
      operationId: assign-incident
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignIncidentRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/close:
    post:
      summary: Close an incident
      description: Closing records **that the handling process is finished on this platform**; it does not change the state of the incident itself. An incident that has not recovered may still be closed as an accepted risk, and remains unrecovered in the monitoring system.
      operationId: close-incident
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseIncidentRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/comments:
    post:
      summary: Add a note to the timeline
      operationId: add-incident-comment
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCommentRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentActivityResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/following:
    put:
      summary: Follow an incident, or stop following it
      description: 'You follow **yourself**: the caller is the user added to or removed from the follower list.'
      operationId: set-incident-following
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetFollowingRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/reopen:
    post:
      summary: Reopen a closed incident
      operationId: reopen-incident
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/incidents/{incidentId}/timeline:
    get:
      summary: List the timeline of an incident
      description: 'Cursor paging rather than offset paging: the timeline is append-only, and offset paging would skip or repeat entries whenever a new one is written.'
      operationId: list-incident-timeline
      tags:
        - Incident
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 500
            minimum: 0
            type: integer
        - description: The `next_cursor` returned by the previous page. Empty starts from the beginning
          explode: false
          in: query
          name: cursor
          schema:
            description: The `next_cursor` returned by the previous page. Empty starts from the beginning
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPageIncidentActivityResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/maintenance-windows:
    get:
      summary: List maintenance windows
      operationId: list-maintenance-windows
      tags:
        - MaintenanceWindow
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/maintenance-windows/{windowId}:
    delete:
      summary: Cancel a maintenance window
      description: Alerting resumes immediately, even if the window has not yet expired.
      operationId: delete-maintenance-window
      tags:
        - MaintenanceWindow
      parameters:
        - in: path
          name: windowId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Get a maintenance window
      operationId: get-maintenance-window
      tags:
        - MaintenanceWindow
      parameters:
        - in: path
          name: windowId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Create a maintenance window, or replace it by the same id
      description: |-
        **Create or replace**: extending a window that is already running means calling this endpoint again with the same id.

        While the window is open, problems on these machines do not alert and do not count against SLA availability. Leave `server_ids` empty to cover the entire project, including machines enrolled after the window opens.
      operationId: put-maintenance-window
      tags:
        - MaintenanceWindow
      parameters:
        - in: path
          name: windowId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMaintenanceWindowRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceWindowResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/overview:
    get:
      summary: Project overview
      description: A project with no machines yet returns an overview with every figure at zero rather than a 404 — an empty project is a normal state.
      operationId: get-project-overview
      tags:
        - Observability
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectOverviewResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/items:
    get:
      summary: List the monitoring items of a machine
      description: Items are returned exactly as collected, without filtering or renaming. Which of them count as important is for the caller to decide from the tags carried by each item.
      operationId: list-server-items
      tags:
        - Observability
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
        - description: Fuzzy match on key or name
          explode: false
          in: query
          name: keyword
          schema:
            description: Fuzzy match on key or name
            maxLength: 255
            type: string
        - description: Given as `key` or `key=value`, repeatable. The `component` tags applied by the official templates (cpu, memory, filesystem and so on) are filtered through this
          explode: false
          in: query
          name: tag
          schema:
            description: Given as `key` or `key=value`, repeatable. The `component` tags applied by the official templates (cpu, memory, filesystem and so on) are filtered through this
            items:
              type: string
            type:
              - array
              - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/metrics:
    get:
      summary: Get the time series of a monitoring item
      description: '`item_key` is matched **by prefix**. Keys discovered per partition or per interface carry parameters (`vfs.fs.size[/var,pused]`), so a single request for `vfs.fs.size` returns one series per mount point.'
      operationId: get-server-metric
      tags:
        - Observability
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
        - description: '**Prefix match**: `vfs.fs.size` returns one series per mount point. Supply this or `item_id`'
          explode: false
          in: query
          name: item_key
          schema:
            description: '**Prefix match**: `vfs.fs.size` returns one series per mount point. Supply this or `item_id`'
            type: string
        - explode: false
          in: query
          name: item_id
          schema:
            type: string
        - description: Defaults to one hour ago
          explode: false
          in: query
          name: from
          schema:
            description: Defaults to one hour ago
            format: date-time
            type: string
        - explode: false
          in: query
          name: to
          schema:
            format: date-time
            type: string
        - description: Number of downsampling buckets. 0 returns the collected data points unchanged
          explode: false
          in: query
          name: max_points
          schema:
            description: Number of downsampling buckets. 0 returns the collected data points unchanged
            format: int64
            minimum: 0
            type: integer
        - description: Also return the thresholds currently in effect for these items
          explode: false
          in: query
          name: include_thresholds
          schema:
            description: Also return the thresholds currently in effect for these items
            type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/resources:
    get:
      summary: Hardware and interfaces of a machine
      operationId: get-server-resources
      tags:
        - Observability
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResourcesResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/snapshot:
    get:
      summary: Current state of a machine
      operationId: get-server-snapshot
      tags:
        - Observability
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/top-items:
    get:
      summary: Machines ranked highest by a given metric
      operationId: list-project-top-items
      tags:
        - Observability
      parameters:
        - explode: false
          in: query
          name: kind
          required: true
          schema:
            enum:
              - CPU_UTILIZATION
              - MEMORY_UTILIZATION
              - ROOT_FILESYSTEM_USED
            type: string
        - description: 0 uses the default
          explode: false
          in: query
          name: limit
          schema:
            description: 0 uses the default
            format: int64
            maximum: 100
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopItemListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers:
    get:
      summary: List the machines in the project
      operationId: list-servers
      tags:
        - Onboarding
      parameters:
        - description: Maximum number of records in this page
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            description: Maximum number of records in this page
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: Number of records to skip. For deeper paging, use the cursor-paged endpoint instead
          explode: false
          in: query
          name: offset
          schema:
            description: Number of records to skip. For deeper paging, use the cursor-paged endpoint instead
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
        - description: Fuzzy match on name or address
          explode: false
          in: query
          name: keyword
          schema:
            description: Fuzzy match on name or address
            maxLength: 255
            type: string
        - explode: false
          in: query
          name: monitoring_status
          schema:
            enum:
              - PENDING
              - ACTIVE
              - DISABLED
              - FAILED
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LengthAwarePageServerResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}:
    delete:
      summary: Delete a machine
      description: '**Irreversible**: the monitored host, its history and every incident recorded against this machine are removed together. To stop collection temporarily, use `/disable` instead.'
      operationId: delete-server
      tags:
        - Onboarding
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Get the enrollment state of a machine
      operationId: get-server
      tags:
        - Onboarding
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    patch:
      summary: Update the enrollment settings of a machine
      description: 'Only the fields present in the request body are updated. `address` and `address_kind` must be supplied together: changing one without the other produces a contradictory configuration that is not reported as an error and shows up only as an agent that cannot connect.'
      operationId: update-server
      tags:
        - Onboarding
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServerRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Enroll a machine into monitoring
      description: |-
        **Repeated calls with the same server id are idempotent**: given identical parameters, the already-enrolled machine is returned and no duplicate host is created, so a failed enrollment is safe to retry.

        To change enrollment settings, use PATCH. This endpoint returns an error when the parameters differ, and does not update an existing configuration.

        The `tls_psk` in the response is **returned only this once**; store it immediately. If it is lost, it must be rotated.
      operationId: enable-server-monitoring
      tags:
        - Onboarding
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableMonitoringRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerEnrollmentResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/disable:
    post:
      summary: Stop monitoring a machine
      description: 'Reversible: the monitored host is retained, only collection stops, and history is unaffected. Enrolling again resumes collection. To remove the history as well, use DELETE.'
      operationId: disable-server-monitoring
      tags:
        - Onboarding
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/psk:
    post:
      summary: Rotate the agent PSK
      description: The agent configuration must be updated to match, otherwise the machine loses contact immediately. The new key is likewise **returned in clear text only in this response**.
      operationId: rotate-agent-psk
      tags:
        - Onboarding
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/servers/{serverId}/web-checks/{checkId}:
    delete:
      summary: Delete a web check
      description: The corresponding check task and trigger are removed from the monitoring system as well, so no permanently unrecoverable alert is left behind.
      operationId: delete-web-check
      tags:
        - WebCheck
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: checkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Get a web check
      operationId: get-web-check
      tags:
        - WebCheck
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: checkId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebCheckResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Create a web check, or replace it by the same id
      description: '**Create or replace**: to modify a check, call this endpoint again with the same id. There is no need to determine first whether it already exists.'
      operationId: put-web-check
      tags:
        - WebCheck
      parameters:
        - in: path
          name: serverId
          required: true
          schema:
            format: uuid
            type: string
        - in: path
          name: checkId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutWebCheckRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebCheckResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/web-checks:
    get:
      summary: List web checks
      operationId: list-web-checks
      tags:
        - WebCheck
      parameters:
        - description: Restrict to the checks of a single machine. Omit for the whole project
          explode: false
          in: query
          name: server_id
          schema:
            description: Restrict to the checks of a single machine. Omit for the whole project
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebCheckListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/sli-report:
    get:
      summary: Get measured availability
      description: |-
        SLI is what was measured; SLO is what was promised — this endpoint returns the former.

        The row with an empty `server_id` covers the project as a whole.
      operationId: get-sli-report
      tags:
        - SLA
      parameters:
        - explode: false
          in: query
          name: from
          schema:
            format: date-time
            type: string
        - explode: false
          in: query
          name: to
          schema:
            format: date-time
            type: string
        - description: Return the most recent N complete periods. Use this or from/to, not both
          explode: false
          in: query
          name: periods
          schema:
            description: Return the most recent N complete periods. Use this or from/to, not both
            format: int64
            maximum: 100
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLIReportResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/slo:
    delete:
      summary: Remove the availability target of this project
      description: Availability is no longer tracked from this point on.
      operationId: delete-slo
      tags:
        - SLA
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    get:
      summary: Get the availability target of this project
      description: 'A project that has never set one returns 404 rather than a default target: making no promise and promising 99.9% are different things.'
      operationId: get-slo
      tags:
        - SLA
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLOResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Set the availability target of this project, or change it
      description: |-
        One SLO per project, **create or replace**.

        `min_severity` must be chosen explicitly: it defines what counts as unavailable, which is half of what the target means.
      operationId: put-slo
      tags:
        - SLA
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSLORequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLOResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page:
    get:
      summary: Get the status page of this project
      description: A project has at most one status page. A project that has never created one returns 404.
      operationId: get-status-page
      tags:
        - StatusPage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Create the status page, or replace its configuration
      description: |-
        **Create or replace**: changing the title, switching the domain, publishing and unpublishing are all done by sending the complete configuration again.

        While `published` is false the public address returns 404, including any custom domain already bound. A newly created page is unpublished by default, so that a page still being configured has no address that opens.

        `slug` and `custom_domain` are **globally unique**; a value already taken returns 409.
      operationId: put-status-page
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    delete:
      summary: Delete the status page
      description: Its groups, components, availability history, incident notices and scheduled maintenance are removed together, and cannot be recovered. The slug and custom domain are released.
      operationId: delete-status-page
      tags:
        - StatusPage
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/order:
    put:
      summary: Set the order of the top level of the page
      description: |-
        Submits the **entire** top-level order in one call rather than moving a single entry to a given position.

        The top level interleaves groups and ungrouped components, so the order is expressed as one list covering both.

        Each entry carries either `group_id` or `component_id`. Entries not listed are placed after those that are.
      operationId: put-status-page-order
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageOrderRequestBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/groups:
    get:
      summary: List groups
      operationId: list-status-page-groups
      tags:
        - StatusPage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageGroupListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a group
      description: A group is one level of collapsing applied to components on the page. There is exactly one level; groups cannot be nested.
      operationId: create-status-page-group
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageGroupRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageGroupResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/groups/{groupId}:
    parameters:
      - in: path
        name: groupId
        required: true
        schema:
          format: uuid
          type: string
    put:
      summary: Update a group
      operationId: update-status-page-group
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageGroupRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageGroupResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    delete:
      summary: Delete a group
      description: The components in it are **not deleted**. They return to the top level as ungrouped components, keeping their availability history and the incident notices that reference them.
      operationId: delete-status-page-group
      tags:
        - StatusPage
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/groups/{groupId}/order:
    put:
      summary: Set the order of components within a group
      operationId: put-status-page-group-order
      tags:
        - StatusPage
      parameters:
        - in: path
          name: groupId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageGroupOrderRequestBody'
        required: true
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/components:
    get:
      summary: List components
      description: 'A component is one row on the status page: an externally promised capability. It is not a machine — a single component may be backed by several machines and several web checks.'
      operationId: list-status-page-components
      tags:
        - StatusPage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageComponentListResponseBody'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Create a component
      description: |-
        `name` is **customer-facing copy** and appears verbatim on the public page; do not use machine names.

        `auto_status_min_severity` sets how severe an alert must be before it changes the status of this row; anything below it has no effect. The default is AVERAGE. Lower settings tend to keep the page permanently off-green, at which point people stop reading it.
      operationId: create-status-page-component
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageComponentRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageComponentResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/components/{componentId}:
    parameters:
      - in: path
        name: componentId
        required: true
        schema:
          format: uuid
          type: string
    get:
      summary: Get a component
      operationId: get-status-page-component
      tags:
        - StatusPage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageComponentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Update a component
      description: '`started_on` cannot be changed: it determines where the availability bar stops showing as unmeasured, and changing it would rewrite history that has already been published.'
      operationId: update-status-page-component
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageComponentRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageComponentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    delete:
      summary: Delete a component
      description: Its availability history is removed along with it. Passages in already-published notices that refer to it are retained, since customers may already have read them.
      operationId: delete-status-page-component
      tags:
        - StatusPage
      responses:
        '204':
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/components/{componentId}/sources:
    parameters:
      - in: path
        name: componentId
        required: true
        schema:
          format: uuid
          type: string
    get:
      summary: List the monitored sources bound to a component
      description: Monitored sources are internal information and **never appear on the public page**.
      operationId: list-status-page-component-sources
      tags:
        - StatusPage
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageComponentSourcesResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    put:
      summary: Set the complete list of monitored sources for a component
      description: |-
        Submits the **complete** set of sources; anything not listed is unbound.

        Once bound, alerts on these machines and web checks drive the status of the component automatically: DISASTER and HIGH are reported as a major outage, AVERAGE as a partial outage, and WARNING as degraded performance. Alerts below `auto_status_min_severity` have no effect.

        `show_url` controls whether the checked address is shown on the public page. It is off by default.
      operationId: put-status-page-component-sources
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusPageComponentSourcesRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageComponentSourcesResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/incidents:
    get:
      summary: List the incident notices on the status page
      description: These are **customer-facing notices**, distinct from the monitoring incidents under `/incidents`. Nothing from the latter is carried over; the text here is written by your team.
      operationId: list-status-page-incidents
      tags:
        - StatusPage
      parameters:
        - description: Maximum number of records in this page
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LengthAwarePageStatusPageIncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Publish an incident notice
      description: |-
        Publishing a notice and writing its first update are a single operation: a notice with no updates would appear as a bare title on a page that has already been delivered to readers.

        `started_at` is when the **incident began**, not when the notice was published. The two are usually minutes to hours apart, and using the publication time would understate the impact window that customers can compare against their own logs. Backfilling a past incident relies on the same field.

        The statuses given in `components` take effect on the public page immediately and count towards availability.
      operationId: publish-status-page-incident
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishStatusPageIncidentRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageIncidentResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/incidents/{incidentId}:
    get:
      summary: Get an incident notice
      operationId: get-status-page-incident
      tags:
        - StatusPage
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageIncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/incidents/{incidentId}/updates:
    post:
      summary: Append an update to an incident notice
      description: |-
        Published updates are never modified; a correction is issued as a new update. Customers may already have forwarded the original, and a silent rewrite would leave the two sides with different histories.

        `components` lists only the components **being changed** by this update; those not listed keep their current status. Setting `status` to `RESOLVED` returns every component this notice has affected to operational and closes the notice. A closed notice accepts no further updates.
      operationId: post-status-page-incident-update
      tags:
        - StatusPage
      parameters:
        - in: path
          name: incidentId
          required: true
          schema:
            format: uuid
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostStatusPageIncidentUpdateRequestBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageIncidentResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/maintenances:
    get:
      summary: List scheduled maintenance
      operationId: list-status-page-maintenances
      tags:
        - StatusPage
      parameters:
        - description: Maximum number of records in this page
          explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            format: int64
            maximum: 10000
            minimum: 0
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LengthAwarePageStatusPageMaintenanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
    post:
      summary: Schedule maintenance
      description: |-
        Maintenance starts and finishes automatically at the scheduled times; nobody needs to be present. While it runs, the affected components are shown as under maintenance and **availability is not reduced** — planned work should not consume the availability you promise to customers, which is the point of announcing it in advance.

        This is separate from `/maintenance-windows`, which suppresses alerting for a period. This endpoint announces the work to your customers. The two are usually created together: without suppression, restarts during the maintenance raise alerts and mark the components unavailable.
      operationId: schedule-status-page-maintenance
      tags:
        - StatusPage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleStatusPageMaintenanceRequestBody'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageMaintenanceResource'
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/maintenances/{maintenanceId}:
    get:
      summary: Get a scheduled maintenance
      operationId: get-status-page-maintenance
      tags:
        - StatusPage
      parameters:
        - in: path
          name: maintenanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageMaintenanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/maintenances/{maintenanceId}/cancel:
    post:
      summary: Cancel a maintenance that has not started
      description: Cancelled rather than deleted, so that readers who saw the announcement have an explanation. Maintenance that has already started cannot be cancelled; finish it early instead.
      operationId: cancel-status-page-maintenance
      tags:
        - StatusPage
      parameters:
        - in: path
          name: maintenanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageMaintenanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
  /api/v1/status-page/maintenances/{maintenanceId}/complete:
    post:
      summary: Finish a running maintenance early
      description: 'Optional: maintenance finishes on its own at the scheduled end time. Use this endpoint when the work is done ahead of schedule; the affected components return to operational immediately.'
      operationId: complete-status-page-maintenance
      tags:
        - StatusPage
      parameters:
        - in: path
          name: maintenanceId
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPageMaintenanceResource'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Error
components:
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Project token. Sign in at auth.leaflow.net to obtain an account token, then exchange it for a project token (POST /account/v1/projects/{projectId}/token). A project token identifies both the current user and the current project.
      scheme: bearer
      type: http
  schemas:
    Error:
      $ref: ../../type/v1/error.yaml#/components/schemas/Error
    IncidentFollowerResource:
      additionalProperties: false
      properties:
        display_name:
          type: string
        followed_at:
          format: date-time
          type: string
        user_id:
          type: string
      required:
        - user_id
        - display_name
        - followed_at
      type: object
    MonitoringItemResource:
      additionalProperties: false
      properties:
        aggregation_function:
          description: Such as last, avg, min or max
          type: string
        evaluation_window_seconds:
          format: int64
          type: integer
        item_id:
          type: string
