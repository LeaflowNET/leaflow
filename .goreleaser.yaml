version: 2

project_name: leaflow

before:
  hooks:
    - go mod tidy
    # The release must not ship a CLI whose hand-written assumptions no longer
    # match the contracts it embeds.
    - go run ./cmd/leaflow-doctor

builds:
  # leaflow-doctor is deliberately absent: it is a development check, and
  # shipping it would put a command in users' hands that only makes sense
  # against a source tree.
  - id: leaflow
    main: ./cmd/leaflow
    binary: leaflow
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/LeaflowNET/leaflow/internal/cli.version={{ .Version }}
      - -X github.com/LeaflowNET/leaflow/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/LeaflowNET/leaflow/internal/cli.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore: sync API contracts"

release:
  prerelease: auto

# Winget submits a manifest to microsoft/winget-pkgs by pull request, which
# needs a fork and a token with rights to it. Enabled once WINGET_TOKEN exists;
# until then goreleaser skips it rather than failing the release.
#
# Homebrew is deliberately absent: a tap is another repository to keep, and
# install.sh already covers macOS without one.
winget:
  - name: leaflow
    publisher: Leaflow
    short_description: Command line interface for the Leaflow platform
    license: MIT
    homepage: https://github.com/LeaflowNET/leaflow
    publisher_support_url: https://github.com/LeaflowNET/leaflow/issues
    skip_upload: auto
    repository:
      owner: LeaflowNET
      name: winget-pkgs
      branch: "leaflow-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
