name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # Verifies what cannot be derived from a contract: the account-token table
      # in internal/spec, command name collisions, and operations with no
      # operationId. This is what turns a contract change that breaks an
      # assumption into a red build instead of a 401 in someone's terminal.
      - name: doctor
        run: go run ./cmd/leaflow-doctor

      # check validates the config's structure, which is not the same as the
      # release working: a template function that does not exist passes check
      # and fails at publish time, after the release has already been created.
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: goreleaser build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --snapshot --clean --single-target

      # A wrong ldflags path does not fail the build — it silently leaves the
      # version at "dev", and the first person to notice is whoever asks a
      # released binary what it is.
      - name: version is stamped
        run: |
          binary=$(find dist -name leaflow -type f | head -1)
          version=$("$binary" --version)
          echo "$version"
          case "$version" in
            *dev*) echo "version was not stamped; check the ldflags paths in .goreleaser.yaml" >&2; exit 1 ;;
          esac

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
