name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # Verifies what cannot be derived from a contract: the account-token table
      # in internal/spec, command name collisions, and operations with no
      # operationId. This is what turns a contract change that breaks an
      # assumption into a red build instead of a 401 in someone's terminal.
      - name: doctor
        run: go run ./cmd/leaflow-doctor

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi
