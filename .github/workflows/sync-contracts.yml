# Bring current contracts into apis/ and open a pull request.
#
# Two ways in, and the design does not depend on which one works:
#
#   push to contracts/sync   the contracts repository pushed a branch here
#   schedule                 reconciliation, once a day
#
# The contracts repository pushes with a deploy key: a credential scoped to this
# one repository, holding no API rights, belonging to no person, and revocable
# without touching anyone's account. What is genuinely unclear is whether a
# deploy-key push starts a workflow — GitHub documents that GITHUB_TOKEN pushes
# do not, and says nothing either way about deploy keys.
#
# So this does not rely on the answer. If the push does start this workflow, the
# pull request appears immediately. If it does not, the scheduled run finds the
# branch within a day and opens the same one. Either way the result is identical
# and nothing silently does not happen.
#
# The outcome is a commit on main. This used to open a pull request, on the
# argument that a contract can remove an operation, which removes a command,
# which breaks whatever was scripted against it — so a person should look.
#
# That gate was never real. GitHub Actions is not permitted to create pull
# requests in this repository, so every run ended by pushing contracts/pr and
# then failing; the "review" was somebody noticing the red run and merging the
# branch by hand. A gate that nobody passes through is not a gate, it is a step
# that has to be worked around.
#
# What the pull request body was for is kept: the list of commands that appear
# and disappear is now the commit message, so `git log` answers the same question
# the review was supposed to. And `verify` below still runs before anything is
# pushed — a contract that does not build or does not parse never reaches main.
#
# What is given up, stated plainly: a contract that removes a command now lands
# without anyone deciding it should. The place to catch that is upstream, in the
# contracts repository, where the removal is written — not here, where it has
# already happened.
#
# One consequence of pushing with GITHUB_TOKEN: it does not start other
# workflows, so ci.yml will not run on these commits. That is why verify is here
# rather than left to CI.

name: sync-contracts

on:
  push:
    branches: [contracts/sync]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Contracts ref to sync from
        required: false
        default: main

permissions:
  contents: write

env:
  CONTRACTS_REPO: leaflowapis/leaflowapis

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Always builds the surface from main, so the diff describes what merging
      # would change rather than what the branch changed against itself.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: record the current command surface
        run: go run ./cmd/leaflow-doctor -commands > /tmp/before.txt

      - name: take contracts from the pushed branch
        if: github.event_name == 'push'
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git checkout "origin/${GITHUB_REF_NAME}" -- apis/

      - name: take contracts from the source repository
        if: github.event_name != 'push'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CONTRACTS_REPO }}
          ref: ${{ inputs.ref || 'main' }}
          path: .contracts
          token: ${{ secrets.CONTRACTS_TOKEN || github.token }}

      - name: copy contracts
        if: github.event_name != 'push'
        run: ./scripts/sync-contracts.sh .contracts

      # Stage first, then ask the index. The two ways in leave the change in
      # different places, and a plain `git diff` can only see one of them.
      #
      # This was `git diff --quiet -- apis/`, which is empty by construction on
      # the push path: `git checkout <ref> -- apis/` writes the working tree *and*
      # the index, so that comparison holds two copies of the same thing. Every
      # push-triggered run since said "Contracts already up to date" and opened
      # nothing — no pull request has ever come out of this workflow.
      #
      # It was not visible because the fallback carried it: the scheduled run does
      # not read the branch at all, so it kept reporting correctly and a person
      # syncing by hand kept getting there first. A design that survives one of its
      # halves being dead is the reason this took a contract change to notice.
      #
      # `--cached` alone would only move the blindness — the scheduled path copies
      # with `cp` and stages nothing. `git add -A` puts both paths in the same
      # place, and picks up an added contract as well, which no form of `git diff`
      # reports on its own.
      - name: stop if nothing changed
        id: changed
        run: |
          git add -A apis/
          if git diff --cached --quiet -- apis/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Contracts already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs before the summary so a contract that does not even parse fails
      # here, rather than producing a pull request whose body is an error.
      - name: verify
        if: steps.changed.outputs.changed == 'true'
        run: |
          go build ./...
          go test ./...
          go run ./cmd/leaflow-doctor

      # The summary is the commit message, not a pull request body. It is the
      # only place that says which commands this change adds and removes, and
      # `git log` is where somebody looks for that after the fact.
      - name: summarise the change
        if: steps.changed.outputs.changed == 'true'
        run: |
          go run ./cmd/leaflow-doctor -commands > /tmp/after.txt
          ./scripts/contract-changes.sh /tmp/before.txt /tmp/after.txt > /tmp/changes.md
          cat /tmp/changes.md

          {
            echo "chore: sync API contracts"
            echo
            cat /tmp/changes.md
            echo
            echo "Contracts are embedded at build time, so these reach users with the"
            echo "next release rather than with this commit."
          } > /tmp/message.txt

      # Rebase before pushing, and retry: main moves on its own (releases, other
      # merges), and a rejected push here would leave the sync silently undone
      # until tomorrow's scheduled run.
      - name: commit to main
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -F /tmp/message.txt

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing and retrying $attempt/5"
            git pull --rebase origin main
            sleep "$attempt"
          done
          echo "five attempts and main still would not take it" >&2
          exit 1
